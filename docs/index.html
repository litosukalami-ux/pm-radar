Astra 和 Sol 发布后，公开榜单给出了一个很漂亮的结果：Astra 的智能指数从 57 分升到 62 分，超过 Gemini 4 Carbon 和 Claude Opus 5.5；Sol 从 55 分升到 57 分，单任务评测成本约为", "ts": "2026-11-20T03:25:18+00:00", "published": "11-20", "starred": false, "importance": 4, "topic": "AI 产品", "one_line": "GPT-6.2 正式发布，跑分暴涨，价格大降，却遭开发者差评", "why": "了解AI产品行业动态，可能影响产品决策", "inline_text": "GPT-6.2 Astra 和 Sol 发布后，公开榜单给出了一个很漂亮的结果，但开发者却给出差评", "full_text": "", "thumb": "", "images": [], "tags": ["AI 产品"], "seen": false, "new": false, "daily": false}, {"guid": "2a54830deebf0da079f362e36189ce8c", "title": "美丽聪明温柔强大的Ai宝贝在努力干活呢！", "link": "https://forum.trae.cn/t/topic/604774", "source": "TRAE 官方社区", "category": "contest", "summary": "老程序员之所以还没有失业，全靠Ai了。代表我的家人，爸爸，妈妈，宝宝，老婆，女朋友（排名不分先后）表示感谢 5 个帖子 - 5 位参与者 阅读完整话题", "ts": "2026-11-20T03:24:00+00:00", "published": "11-20", "starred": false, "importance": 3, "topic": "竞赛", "one_line": "程序员感谢AI宝贝的话题", "why": "", "inline_text": "程序员感谢AI宝贝的话题，5个帖子，5位参与者", "full_text": "", "thumb": "", "images": [], "tags": ["竞赛"], "seen": false, "new": false, "daily": false}, {"guid": "7cf91f8a829550f2a4a1cc87cf082bf3", "title": "DeepSeek限额：免费用户成了AGI的“拦路虎”？", "link": "https://www.woshipm.com/ai/6497117.html", "source": "人人都是产品经理", "category": "pm", "summary": "当DeepSeek主动给免费用户限额，一个反直觉的信号浮出水面：在算力经济时代，海量C端免费用户不再是护城河，而是持续失血的伤口。本文从成本结构、商业重心迁移与算力约束三重维度，拆解AI企业为何集体转向付费API与生产力场景，重新定义AGI竞赛的胜负手。 “去别的地方玩，不要耽误AGI训练。” 这句针对DeepSeek的调侃，如今正变成现实。 近日，DeepSeek收紧了网页版和App免费用户的使用额度，超过7天不活跃的长对话无法继续使", "ts": "2026-11-20T03:20:04+00:00", "published": "11-20", "starred": false, "importance": 4, "topic": "AI 产品", "one_line": "", "why": "了解AI产品行业动态，可能影响产品决策", "inline_text": "DeepSeek主动给免费用户限额，AI企业为何集体转向付费API与生产力场景", "full_text": "当DeepSeek主动给免费用户限额，一个反直觉的信号浮出水面：在算力经济时代，海量C端免费用户不再是护城河，而是持续失血的伤口。本文从成本结构、商业重心迁移与算力约束三重维度，拆解AI企业为何集体转向付费API与生产力场景，重新定义AGI竞赛的胜负手。\n“去别的地方玩，不要耽误AGI训练。” 这句针对DeepSeek的调侃，如今正变成现实。\n近日，DeepSeek收紧了网页版和App免费用户的使用额度，超过7天不活跃的长对话无法继续使用，新对话单次输入的文字上限被压缩到4万字左右，连续使用约两小时，会触发“服务器繁忙，使用额度已达上限”提示。\n一直以来，互联网产品的核心战略诉求就是事无巨细地满足用户的需求，借此俘获更多流量。DeepSeek的限额策略，背离了上述趋势，昭示出AI产品面临截然不同的挑战。\n据《南方都市报》报道，2026年7月，在投资人闭门会上，DeepSeek创始人梁文锋曾表示，“我们没有在C端上花很多力气，甚至一度我们都不想维护那些用户了，但是用户赶都赶不走。”近期的限额策略，延续了DeepSeek面对免费用户的冷淡态度。\n当一家坐拥过亿月活的明星AI公司开始主动给C端用户限额，一个极具反差感的问题浮出水面——在AI逐渐普及的2026年，曾被奉为圭臬的海量C端免费用户，为何会成为大模型公司奔向AGI路上率先舍弃的包袱？\n规模效应失灵，免费用户越多亏得越惨\n移动互联网时代，社交、游戏、娱乐等产品的功能虽然有所区别，但底层战略导向高度趋同，均致力于通过免费策略俘获更多流量，实现赢家通吃。\n究其原因，移动互联网产品极易实现规模效应，用户量增多后，研发与运营成本可以被摊薄。并且更高的流量规模也可以反过来构筑数据飞轮与多边市场效应，建立更强的竞争壁垒。\n图源：腾讯\n沿袭移动互联网时代的经验，AI时代来临后，一众互联网巨头纷纷祭出大手笔营销策略，面向普通用户推广自家免费的AI产品。比如，2026年春节，腾讯元宝发放10亿元现金红包、阿里千问推出30亿元“春节请客计划”、百度文心上线5亿元春节红包活动。\n巨额补贴之下，诸多AI产品确实俘获海量用户，问题在于，互联网巨头并未借此博取亮眼的业绩，用户规模领先的豆包就是一例。\n图源：QuestMobile\nQuestMobile披露的数据显示，2026年6月，豆包月活3.82亿，同比增长172.1%，位列AI原生App第一。然而，《晚点LatePost》结合火山引擎公开API价格测算，2026年5月，豆包每天消耗的算力成本达数千万元，上半年，该产品平均单日收入不足百万元，主要来自电商佣金。\n互联网行业的规模效应之所以在AI时代失灵，主要是因为AI产品的推理成本随Token调用量线性甚至超线性增长。用户量越多、需求越大、上下文越长，企业背负的算力账单就越沉重。\n对此，2026年3月，360集团创始人周鸿祎表示，AI时代互联网产品的商业模式会迎来质变。“互联网流量是信息搬运，边际成本趋近于零，能做免费；但Token是智力产出，靠算力、芯片、电力支撑，用户越多、消耗越大、成本越高，边际成本递增，免费模式根本走不通。”\n由此来看，DeepSeek对免费用户限额有很强的必然性。与传统互联网公司不同，DeepSeek对掌握用户入口并无执念，其长期目标是实现AGI，自然需要压缩非核心投入。\nAI商业重心迁徙，押注生产力付费\n给免费用户限额后，DeepSeek并未彻底封死用户的对话框，而是发布了全家桶应用API。开发者在原有API中开启对应参数，并进行付费，即可获得深度思考搜索、文件输入等对话功能，甚至可以1:1复刻DeepSeek App。\n图源：DeepSeek\n此前，DeepSeek已推出模型付费API。无论是全家桶应用API，还是模型API，都遵循同一套逻辑：按调用量计费，用多少付多少。\n需要注意的是，虽然在收紧免费入口的同时，放开了付费通道，但DeepSeek并未“逼氪”C端用户。因为付费API面向的并非在对话框里闲聊的普通用户，而是愿意为调用量买单的开发者或企业客户。\n事实上，不只DeepSeek，今年以来，全球头部AI企业的重心正发生转移，从依靠免费策略吸引C端流量，转向深耕Agent与B端API，争夺生产力场景的高净值客户。\n典型如Anthropic，已凭借在编程与企业级市场的优势捷足先登，交出亮眼的业绩成绩单。\n招股书显示，2026年前三季度，Anthropic营收332.42亿美元，同比增长1206%。其中消费及按使用量计费收入263.06亿美元，占总营收的79.1%。\n截至2026年9月末，Anthropic过去12个月贡献收入达10万美元及以上的客户约1.19万家，一年前仅950余家。前三季度，这批客户贡献收入约245亿美元，占总营收约74%。\nOpenAI也在收紧补贴。10月末，OpenAI宣布ChatGPT与Codex额度互通、统一按Token计量。与此同时，因频频按下重置按钮而被称为“赛博义父”的Codex负责人“Tibo”已被调离岗位，Codex的额度重置频率随之骤降。\n在中国市场，字节跳动的“双面账本”更具反差感。前文提到，2026年上半年，豆包单日收入不足百万元。而据《晚点LatePost》披露，同期字节跳动旗下云服务平台火山引擎的MaaS业务收入达48亿元，毛利率超55%，远优于C端业务。\nAnthropic、OpenAI、字节跳动等企业布局AI业务虽然有不同的侧重，但都看到了一个趋势，在AI时代，真正可以覆盖算力成本的，并非用户规模，而是客户是否愿意为每一次调用付费。\n当免费对话与付费调用争夺同一批算力，企业自然需要把资源投向后者。\n算力约束下的取舍，先保付费与模型迭代\n与海外同行相比，中国AI企业不光需要解决商业化难题，受地缘政治博弈影响，还需面对高端算力供给紧张的挑战。\n图源：DeepSeek\n算力消耗更高的Agent逐渐普及，正显著放大这一缺口。以DeepSeek旗下的AI智能体平台DeepSeek Harness为例，官方数据显示，以使用官方API的用户为统计范围，平台日活从9月30日当周的日均27.1万增长至11月4日的154万，日消耗Token从约24万亿增长至约92万亿。\n随着API调用量激增，DeepSeek愈发难以保证服务稳定性。据不完全统计，2026年10月以来，DeepSeek已发生8起服务中断，涉及免费对话服务以及付费API。其中10月15日持续故障近五个小时。事后，DeepSeek针对API用户推出赠金补偿方案，并表示“坚决杜绝同类问题再次发生”。\n推理端算力捉襟见肘，训练端同样如此。梁文锋在前述闭门会上表示，今天AI最大的问题是算力。“很多时候，我们知道方向，也知道应该怎么训练。真正限制我们的，就是资源，尤其是算力资源。很多技术路线是因为资源才暂时放下。”\n作为创业公司，DeepSeek的算力储备不及腾讯、阿里巴巴、字节跳动等行业巨头，却要同时应对免费对话、付费API调用以及下一代模型训练三类需求。第一类是成本包袱，后两者分别对应当期收入与长期竞争力。\n目前没有明确的证据显示，DeepSeek是因为故障频发才限制C端用户的使用额度。但在算力总量有限的前提下，取舍昭然若揭，付费服务的稳定性要", "thumb": "https://static.woshipm.com/tag/1101_1@2x.png ", "images": ["https://static.woshipm.com/tag/1101_1@2x.png ", "https://image.woshipm.com/2024/07/24/41acd216-499e-11ef-a43d-00163e142b65.png", "https://image.woshipm.com/wp-files/2026/11/kaIPKYkNdkPAl2ja2cVY.png", "https://image.woshipm.com/wp-files/2026/11/d7GpAxsb0wuy0odiBLvi.jpeg", "https://image.woshipm.com/wp-files/2026/11/15Ro0s7lAkQN0kj9c2Ng.png", "https://image.woshipm.com/wp-files/2026/11/Q7awEB8Zpt9YKMVTkDmd.jpeg"], "tags": ["AI 产品"], "seen": false, "new": false, "daily": false}, {"guid": "26d7f4eb435b66008463ec6a05477bdd", "title": "以活动业务为例，从系统设计到数据的对比分析（一）", "link": "https://www.woshipm.com/share/6497129.html", "source": "人人都是产品经理", "category": "pm", "summary": "面对普通活动与集市活动的系统设计，是统一建模还是分线开发？本文深入对比“主活动-子活动”与“两条业务线”两种思路，从抽象建模、状态机、字段交互到数据迁移，多维度剖析优劣，并附数据表设计细节，助你做出更贴合业务本质的架构决策。 业务背景 业务方展开活动，活动有两种形式： 普通活动：一个活动，由主办方主持，仅开展一次。 集市活动：一个活动，由主办方招收活动中的多个摊主。 系统设计 思路1：两形式下，都是一个活动。采用“一个主活动，多个子活动", "ts": "2026-11-20T03:19:47+00:00", "published": "11-20", "starred": false, "importance": 4, "topic": "产品经理", "one_line": "", "why": "了解产品经理方法论，可能影响产品决策", "inline_text": "对比分析“主活动-子活动”与“两条业务线”两种思路，从抽象建模、状态机、字段交互到数据迁移", "full_text": "", "thumb": "", "images": [], "tags": ["产品经理"], "seen": false, "new": false, "daily" 金融科技公司自称准备好部署Agentic AI，真正上生产的只有11%。Airwallex在新加坡金融科技节发布白皮书，同时推出内置AI金融伙伴Kai的智能全球企业账户，把这道差距落到产品上。 最近，在新加坡金融科技节（Singapore FinTech Festival）上。 Airwallex空中云汇联合Kapronasia、新加坡金融科技协会（SFA），发布了一份白皮书 《AI发展的关键转折点：重塑金融科技》 《The A", "ts": "2026-11-20T02:48:55+00:00", "published": "11-20", "starred": false, "importance": 4, "topic": "AI 产品", "one_line": "金融 Agent 的发展关键信号", "why": "了解金融 Agent 的发展趋势和关键信号", "inline_text": "42% 金融科技公司准备部署 Agentic AI，Airwallex 推出内置 AI 金融伙伴 Kai", "full_text": "", "thumb": "", "images": [], "tags": ["AI 产品"], "seen": false, "new": false, "daily": false}, {"guid": "d5660d538450b697568a0433add6bd4c", "title": "AI的发展，有人喜有人忧", "link": "https://www.woshipm.com/ai/6497085.html", "source": "人人都是产品经理", "category": "pm", "summary": "一家代账公司上AI后，一人可代账从两三百家提到七百家；一个电商客服中心从十来个人减到两个。产能和利润确实都上去了，被减掉的岗位却没人接住，这道题靠单个企业解不了。 在今天一场AI闭门分享会上，讲了两个已经跑起来的AI应用案例。一个是代账公司，一个在电商平台的客服中心。 先说代账公司，当过去一人可代账两百到三百家，今年下半年上了AI后，提升到6~700家。 虽然代账的活比较简单，收票据，对银行流水，做凭证，出报表，按月报税，按月循环。小微", "ts": "2026-11-20T02:48:26+00:00", "published": "11-20", "starred": false, "importance": 3, "topic": "AI 影响", "one_line": "AI 发展带来的喜与忧", "why": "", "inline_text": "AI 提高产能和利润，但减少岗位，单个企业难以解决", "full_text": "", "thumb": "", "images": [], "tags": ["AI 产品"], "seen": false, "new": false, "daily": false}, {"guid": "62cfc066bec308d5b97b8c1d6fab4956", "title": "浮屏：截图即可「上岛」，还能帮你记录生活", "link": "https://sspai.com/post/118879", "source": "少数派", "category": "vibe", "summary": "浮屏是我一个人开发的应用。它最初只是为了解决一杯柠檬水的取餐码问题，后来慢慢长成了一个记录生活小片段的工具。 查看全文", "ts": "2026-11-20T02:47:52+00:00", "published": "11-20", "starred": false, "importance": 3, "topic": "vibe coding", "one_line": "浮屏应用开发过程分享", "why": "", "inline_text": "个人开发记录生活小片段的工具，解决取餐码问题", "full_text": "Matrix 首页推荐\nMatrix 是少数派的写作社区，我们主张分享真实的产品体验，有实用价值的经验与思考。我们会不定期挑选 Matrix 最优质的文章，展示来自用户的最真实的体验和观点。\n文章代表作者个人观点，少数派仅对标题和排版略作修改。\n浮屏（Floato）是一款 iOS 应用，它用 AI 分析你的截图，再把截图整理成对应场景的精美卡片，显示在锁屏、灵动岛和桌面小组件上。取餐码、取件码、电影票、火车票、登机牌、团购兑换券、App 订阅……这些平时散落在各个小程序和 app 里的信息，截一张图，就能在需要的时候出现在手边。\n为什么要做浮屏\n今年夏天我经常夜跑。跑完给自己买一杯蜜雪冰城的柠檬水，算是一个小小的奖励。但买这杯柠檬水的过程并不轻松：先在小程序里找到门店下单，等餐的时候又要一遍遍切回小程序看取餐码。人在路上、手里拿着手机，这种反复切换很烦人。\n作为一个 iOS 用户，我很自然地想到，这正是灵动岛和实时活动（Live Activities）最擅长的场景：一个需要持续关注、但不值得一直打开 app 的临时信息。于是我开始了浮屏的探索。\n在做浮屏之前我也试过不少办法。最常见的是用快捷指令把取件码存进提醒事项，或者干脆截图之后在相册里翻。一些 app 也开始逐步支持自己的实时活动，但每家只管自己那一种订单，这些方案各自都能用，问题在于它们是分散的：取件码一套流程，电影票一套流程，火车票又是另一套。\n我想要的是一个统一的入口：不管截图来自哪个小程序、哪个 app，都用同一个动作交给浮屏，剩下的识别、分类和排版都由它完成。\n识别：截一张图就够了\n浮屏不需要你手动填写任何表单。你只需要把截图交给它，AI 会识别出场景类型和关键信息，比如取件码、座位号、车次、检票口、有效期等，并生成一张对应风格的卡片。\n导入截图有三种方式：\n在浮屏里直接选择截图；\n在任意 app 的分享菜单中选择浮屏；\n通过快捷指令自动处理，适合想把流程做得更「无感」的用户。\napp 内识别（录屏中的交互提审中，和正式版可能有些不同）\n在 AI 识别上我也碰过壁。一开始我选用的模型不稳定，它的识别时间存在很大的不确定性，快的时候只需要六七秒，慢的时候需要 30 秒甚至更久，导致超时。中途我尝试过很多的解决办法：\n优化提示词，提升缓存的命中率\n做更多的路由拆分，而不是把所有的场景都放在一个大的 prompt 下面\n尝试集成流式解析的方式，让用户在查看时不会只能看到一个 loading，而是可以渐进式地一点一点看到卡片的解析过程\n决策模型，先让小而快的决策模型来判断应该走哪个分类\n好在最终在识别速度和识别正确率中找到了一个不错的平衡。就我自己的使用体验来说，大部分场景的识别准确度都很高。\n更多场景\n取餐码只是一个起点。有了识别能力之后，增加新的类型其实并不难，真正花时间的是想清楚这类卡片最该突出哪些信息，以及它在锁屏上应该长成什么样子。\n浮屏现在也支持取件码、团购券、App 订阅、火车票、飞机票和电影票。下面是一些实际使用里的截图。\n订阅和前面这些一次性的凭证不太一样。它会按月或按年回来。把扣款记录交给浮屏，它会按周期记下金额，再推算出每项服务一共付了多少，整理成一张清单。\n一个简单的订阅管理\n两个核心页面\n浮屏的结构很简单，前台主要是两个页面。第一个是卡片列表，所有识别好的卡片都会收在这里，正在使用的卡片可以显示在锁屏和灵动岛上，用完之后标记为「完成」即可。\n第二个是「回顾」页面。它以日历的形式展示你过去完成的卡片：哪天喝了什么、看了哪部电影、坐了哪趟车去了哪里。原本用完即弃的截图，在这里变成了一份自动生成的生活记录。这也是我自己最常打开的页面。\n回顾页并不是一开始就计划好的。用了一段时间以后，我发现标记为「完成」的卡片其实很有意思：翻一翻就能看到自己哪天看了什么电影、喝了什么、去了哪里。这些截图原本会被删掉或者淹没在相册里，但整理成卡片以后，它们自然就成了一份不需要刻意去写的生活记录。\n刚好我最近在出差，不能在家做饭，通过这种方式我可以记录我每餐吃了什么、点了什么，最终回味起来也还挺不错的。这也让我意识到，光是这周就吃了 3 次麦当劳。\n后来我发现，身边不少朋友其实有一个更朴素的需求：收藏。有人会把每一张电影票根夹进本子，有人会留着每一趟车票、每一次看展的门票，还有人喜欢记下自己喝过的每一杯奶茶。只是现在大部分票都变成了电子的，想留也无从留起，最后都散落在相册和各个 app 的订单页里。\n浮屏刚好适合做这件事。每一张标记为「完成」的卡片都会留在回顾页里，取件码、火车票、电影票、团购券都在同一本日历上，品牌、时间和地点也都整理好了。用的场景越多，这份收藏就越完整。我自己现在会特意把看过的电影和去过的展都丢进浮屏，就算当时不需要提醒，也想让它们在回顾页里留一页。\n关于隐私与价格\n浮屏依赖 AI 识别截图，所以你的截图会被上传给模型服务商处理。如果你对隐私非常在意，浮屏可能不是最适合你的工具。同样，因为 AI 还是存在延迟，如果你对速度要求很高，目前的 app 的体验也还需要优化。\n浮屏尽力保证图片解析可以在 10 秒内完成。换个角度看，不依赖离线模型也有好处：识别效果可以随时优化，不必等 app 发布新版本。\n浮屏目前已在美区等 App Store 上架，国区正在备案中，预计一周内过审。所有新用户都会获得免费的十个识别点数。而会员可以获得合理范围内不受限制的识别，价格为：\n月度会员 1.99 美元（合人民币约 14 元）；\n季度会员 3.99 美元（合人民币约 27 元）；\n年度会员 7.99 美元（合人民币约 54 元）。\n写在最后\n浮屏是我一个人开发的应用。它最初只是为了解决一杯柠檬水的取餐码问题，后来慢慢长成了一个记录生活小片段的工具。\n如果你也常常在小程序之间来回切换找取件码，或者希望给日常留下一点痕迹，欢迎试试浮屏，也欢迎在评论区告诉我你希望它还能识别什么场景。最后感谢你读到这里，我为少数派读者准备了两个兑换码，有效期至 2026 年 11 月 30 日。\n兑换码\nSSPAI\n：免费体验一个月会员；\n兑换码\nSSPAIYEAR\n：首年以 5.99 美元（约合人民币 40 元）开通年度会员，次年起按原价续费。\n兑换方式：在 app 的购买页面输入兑换码，或直接打开兑换链接（\nSSPAI\n、\nSSPAIYEAR\n）。兑换码仅限新用户和已过期的订阅用户使用，且需要使用非中国大陆地区的 Apple ID。\n> 关注\n少数派小红书\n，感受精彩数字生活 🍃\n> 实用、好用的\n正版软件\n，少数派为你呈现 🚀", "thumb": "https://cdnfile.sspai.com/2026/11/19/c3ab76874f5615e04b1ab77d291ce66c.png?imageMogr2/auto-orient/thumbnail/!1374x/gravity/center/crop/1374x/format/webp/ignore-error/1", "images": ["https://cdnfile.sspai.com/2026/11/19/c3ab76874f5615e04b1ab77d291ce66c.png?imageMogr2/auto-orient/thumbnail/!1374x/gravity/center/crop/1374x/format/webp/ignore-error/1", "https://cdnfile.sspai.com/2026/11/10/e91ebdd92dae346537a06005d552c825.jpg?imageView2/2/w/1120/q/90/interlace/1/ignore-error/1/format/webp", "https://cdnfile.sspai.com/2026/11/10/ffa17615f0721e955b14fdcb53fa07f2.png?imageView2/2/w/1120/q/90/interlace/1/ignore-error/1/format/webp", "https://cdnfile.sspai.com/2026/11/10/8fcef9eaa0a296a3c8aa57db7c13ade0.png?imageView2/2/w/1120/q/90/interlace/1/ignore-error/1/format/webp", "https://cdnfile.sspai.com/2026/11/10/633ab29d5d94076e3e638c1332e867d7.png?imageView2/2/w/1120/q/90/interlace/1/ignore-error/1/format/webp", "https://cdnfile.sspai.com/2026/11/19/89d7991585a2af6d3130d62569ee391b.jpeg?imageView2/2/w/1120/q/90/interlace/1/ignore-error/1/format/webp"], "tags": ["vibe coding"], "seen": false, "new": false, "daily": false}, {"guid": "a55f308e915b5cb292402413a02baf4e", "title": "画中画调试小游戏开发过程：边看地图跑测试边改 Bug，终于不用反复切窗了", "link": "https://forum.trae.cn/t/topic/604764", "source": "TRAE 官方社区", "category": "contest", "summary": "体验方向： 边看产物，边修改 / 边操作页面，边修 bug 真实任务： 最近在做复古俯视角游戏项目 GTA1RetroCity ，正在调试 Police AI &amp; Wanted System （警车追捕与通缉系统） 。每次修改完 Police.ts 并通过 TypeScript 类型检查后，都需要让 Ag aily": false}, {"guid": "2a19089eb77c89f722c98aff7928873b", "title": "AI基建大潮方兴未艾，联想集团最佳财季诞生！", "link": "https://www.qbitai.com/2026/11/511088.html", "source": "量子位", "category": "ai_product", "summary": "全球AI生态链领先企业联想集团今日公布截至2026/27财年第二季度业绩", "ts": "2026-11-19T04:51:31+00:00", "published": "11-19", "starred": false, "importance": 3, "topic": "AI 产品", "one_line": "联想集团发布 AI 生态链业绩", "why": "", "inline_text": "联想集团\nAI 生态链\n业绩", "full_text": "< img id=\"wx_img\" src=\"https://www.qbitai.com/wp-content/uploads/imgs/qbitai-logo-1.png\" width=\"400\" height=\"400\">\nAI基建大潮方兴未艾，联想集团最佳财季诞生！\n量子位的朋友们\n2026-11-19\n12:51:31\n来源：\n量子位\n全球AI生态链领先企业联想集团今日公布截至2026/27财年第二季度业绩\n2026年11月19日——全球AI生态链领先企业联想集团（HKSE：992）（ADR：LNVGY）今日公布截至2026年9月30日的2026/27财年第二季度业绩：集团季度营收首次突破2000亿元人民币，同比快速增长近50%，创历史新高的同时大超市场预期；调整后净利润同比增长166%，创历史新高并远超市场预期；调整后净利润率同比提升2个百分点至4.5%，刷新自收购摩托罗拉移动和IBM x86服务器业务以来的历史纪录。\n尽管市场对AI投资回报及云厂商资本开支的可持续性存在疑虑，但从产业发展阶段看，AI基建大潮才刚刚开始，算力需求的长期增长潜力尚未充分释放。随着AI从训练为主走向训练与推理并重，应用场景持续拓展，全球Token消耗量快速增长，AI应用广度与深度的提升将持续打开基础设施市场空间。这一趋势正得到云服务厂商与企业客户的共同验证：前者持续推进AI基建，后者逐步从试点探索走向规模化应用。\n“AI在企业现在还只是引入和尝试阶段。”联想集团董事长兼CEO杨元庆称，“我们对AI算力需求的长期增长充满信心。”\n面对这一方兴未艾的产业机遇，联想集团已进行十余年的战略布局，并正迎来转型成果的集中兑现。本季度，联想集团在快速扩大业务规模的同时，营收与利润结构实现里程碑式重塑。其中，ISG基础设施方案业务集团与SSG方案服务业务集团合计贡献三大业务集团运营利润总额的61%，较去年同期大幅提升28个百分点。随着ISG与SSG业务利润贡献占比持续提升，联想集团正逐步形成智能设备、基础设施与方案服务共同驱动利润增长的新格局，盈利能力与业务发展韧性进一步增强。\n具体而言，第二财季，ISG基础设施方案业务集团营收约761亿元人民币，同比增长177.6%，运营利润首次突破70亿元人民币，运营利润率升至创纪录的9.6%；同时联想跃居全球x86服务器出货量第一、全球服务器整体出货量第二。IDG智能设备业务集团营收约1165亿元人民币，同比增长14.9%，在终端市场出货量承压的情况下保持稳健增长；联想PC市场份额达到23.8%，继续稳居全球第一，与第二名厂商的市场份额差距扩大至创纪录的7.2个百分点。SSG方案服务业务集团营收超过200亿元人民币，同比增长20.4%，运营利润率达到26%的历史新高。\n在这一轮由AI驱动的产业变革中，覆盖“端-边-云”的完整算力布局正成为重要竞争优势，也为联想混合式AI战略的持续落地打开了更广阔的增长空间。第二财季中，集团三大业务集团均实现双位数及以上营收增长，并创下各自同期营收新高。随着基础设施业务规模和盈利能力同步跃升，联想正在从全球智能设备领导者，加速成长为覆盖终端、边缘与云端的全球AI基建领域领先企业。\n第二财季，集团AI相关业务营收同比增长近80%，突破700亿元人民币，占集团整体营收近四成。其中，AI服务器营收同比增长超过300%，储备订单进一步扩大至5300亿元人民币；AI服务营收实现三位数同比增长。从AI PC、AI手机，到AI服务器、混合式AI基础设施与行业解决方案，AI正在多个业务层面形成增长共振。\n伴随业务增长，联想继续加大创新投入。第二财季，集团研发投入同比增长36.8%，持续加强在个人智能、企业智能及下一代AI基础设施领域的布局。在个人智能领域，联想围绕“一体多端”战略，持续提升天禧与Lenovo Qira的跨设备协同和任务执行能力的超级智能体演进；在企业智能领域，则依托混合式人工智能优势集（Hybrid AI Advantage），持续完善AI基础设施、Token管理平台及行业AI解决方案，加快推动企业AI从技术试验走向规模化部署。\n更值得关注的是，联想的增长正建立在更为稳健的财务基础之上。通过持续提升盈利能力、加强营运资金管理，并严格管控资本开支，联想第二财季自由现金流稳健增长，为持续创新与战略业务扩张提供了支持。在基础设施业务快速增长的同时，联想继续强化客户信用风险管理与资本使用纪律，以推动业务规模与盈利质量同步提升。\n“上季度，联想再次交出极为出色的成绩单，我们持续高速增长，优化盈利，业务基本面实现结构性提升，展现了从PC领导者到全栈型算力领导者的转型成果。”杨元庆表示，“当前AI实际应用方兴未艾，不仅将带动基础设施需求的持续上升，也将激发终端设备市场的巨大增长潜力，凭借混合式人工智能战略、‘端-边-云’架构的全栈型产品组合，以及财务上的高度自律和韧性，我们有信心继续保持这一强劲势头，并在本财年内提前实现1000亿美元的营收目标。”\n业绩亮点：\n营收首次突破2000亿元人民币，同比增长近50%，创历史新高；\n调整后净利润同比增长166%，调整后净利润率升至4.5%，双双创历史新高；\n三大业务集团均实现第二财季营收历史新高，ISG与SSG合计贡献业务集团运营利润总额的61%，营收与利润结构实现里程碑式重塑；\nISG基础设施方案业务集团营收同比增长177.6%至761亿元人民币，运营利润率达9.6%；\nIDG智能设备业务集团实现营收1165亿元人民币，PC市场份额领先第二名厂商7.2个百分点；\nSSG方案服务业务集团营收超过200亿元人民币，同比增20.4%，运营利润率达26%创历史新高；\nAI相关业务营收同比增长近80%，占集团整体营收近四成；\nAI服务器营收同比增长超300%，储备订单达到5300亿元人民币；\n研发投入同比增长超36%，进一步推动个人智能与企业智能创新。\nISG：营收与盈利能力大幅提升，AI服务器营收同比增超3倍\n一个显见的趋势是，AI基础设施市场的增长远未到达终点。随着AI从大模型训练向推理演进，规模化应用场景持续拓展，全球词元消耗量快速攀升，持续增长的算力需求正推动AI基础设施进入新一轮扩张周期。IDC数据显示，全球服务器市场规模在2026年第二季度达到1663亿美元，同比增长52%，环比增长35.7%，创下历史新高。\n在这一产业趋势下，联想ISG迎来历史性突破。第二财季，ISG营收达到761.18亿元人民币，同比增长177.6%，创历史新高；运营利润首次突破70亿元人民币，运营利润率达到9.6%，同比提升10.4个百分点，同样刷新历史纪录。这也是ISG连续第三个季度实现盈利，显示其在高速增长的同时，正逐步建立起可持续的盈利能力。\n这一表现源于联想长期坚持的面向云服务提供商（CSP）与企业及中小企业（ESMB）客户的双轮驱动战略。本季度，ISG的CSP业务营收同比增长近170%，创下历史最佳季度表现，ESMB业务营收增速更快，同比增长约200%。值得关注的是，本季度企业AI基础设施市场规模同比增长114%，推动整体ESMB基础设施市场增长48%，而联想ESMB业务同比两倍的增速，显著跑赢市场。\n在AI基础设施领域，联想正", "thumb": "http://www.qbitai.com/wp-content/uploads/2019/06/200.jpg", "images": ["http://www.qbitai.com/wp-content/uploads/2019/06/200.jpg", "https://i.qbitai.com/wp-content/uploads/replace/7a9a5338c45bd896dd376465eb74cd8e-e1737597655481-300x175.png", "https://i.qbitai.com/wp-content/uploads/replace/318ae204e81f92f648bd00faf5a08d33-e1719716374836-300x175.png", "https://i.qbitai.com/wp-content/uploads/2022/09/640-4-e1662786806610.png", "https://i.qbitai.com/wp-content/uploads/2022/09/WX20220928-180736@2x.png", 毕竟人、财都是在落实公司的管理要求，而公司的管理落脚点就是人事的组织架构。\n管理层要求财务管理报告也按照人事组织架构来出具，利出一孔，提升准确性、降低沟通和解释成本。\n2）管理工作细化、管理效率要求高，系统线上化的程度升级\n公司完成了HCM系统建设，人力预算线上化了，并要求人力预算推送到BMS系统\n人力的老大晋升了，除了负责人力资源，也可以管到财务，人财从管理上走得更近了\n准确和效率的要求，管理层希望可以更快、更准的拿到管理报表，要求逐步线上化，减少人工的干预\n1.5 难度和挑战\n1）宏观层面\n影响范围广：产品的部门组织架构是地基，BMS中所有应用都以其为基础，涉及近1000个页面\n价值难量化：毫无疑问，这件事是基建性质的工作。凡是基建性质的，注定短期收益不高，长期见效\n行业的案例少：直接做一体化的少，行业很多互联网公司，都是通过在财务侧配置部门映射解决\n沟通成本高：下游（财务）的需求，传递到上游，往往不被理解，会被认为是可以“线下”解决的问题\n长期难执行：下游（财务）灵活管理的需求、各层管理者特异性的需求层出不穷，一体化很难保持\n2）微观层面\n财务部门规则\n①财务只对四级以上部门创建费用部门\n财务管理颗粒度比人力要粗，仅对四级以上部门才创建费用部门\n②非末级部门不能承载预算数据\n财务系统中，如果三级部门不是末级部门，那么不允许承载费用\n③非末级部门如果没有费用发生，不创建费用部门\n三级部门无人不创建费用部门\n财务数据的连贯性要求\n①年度内预算分析需求\n②年度内预算管控要求\n③多年数据对比分析需求\n二、策略\n2.1 第一阶段：业务梳理\n项目难点是业务问题而非产品问题\n，是推动人财一体管理理念深化到业务管理的过程。\n需要明确管理规则，统一当前部门架构，建立部门创建人力、财务相关岗位协同工作的SOP。\n业务梳理还包括：\n①对失效部门的处理规范\n②对剪切部门的使用规范\n2.2 第二阶段：产品落地\n分阶段落地原则\n1）步骤一：费用部门自动同步\n没有人，但有HC也创建费用部门，解决HCM人力预算同步BMS的问题\n2）步骤二：建立人财部门的映射关系\n不重建，BMS的扩展字段指向HCM编码，解决全面预算审批的问题\n3）步骤三：实现部门完整自动同步\n支持全部业务场景，包括：\n①新增、变更、失效、拟失效\n②创建“本部”\n③剪切\n2.3 第三阶段：全面推广\n半年过渡期，SOP机制执行顺畅，系统进行全面切换，下一年预算全流程采用新架构。\n三、业务梳理\n3.1 人财部门盘点，解决现存部门不一致问题\n对现状的梳理以及处理对策，是本文最有挑战的事情。因为产品均上线多年，BMS中历史部门很多和HCM不一致，有失效多年的部门、也有名称发生变化的情况，而财务系统中的部门也无法简单地做失效处理，需要逐一部门去评估；当发生不一致时，还需要和业务侧确认需求场景，判断应该以哪一方为准。\n3.2 引入“拟失效”能力，解决人财对于失效处理的差异\n“拟失效”状态顾名思义，是一个过渡态。为了配合财务管理，人财约定，年度内，财务相关的部门，不做失效处理，打“拟失效”标签。\n新业务不允许发生在“拟失效”部门上。\n所有拟失效部门在新一年财报之后，全部做失效处理。\n3.3 明确部门“剪切”的业务意义，规范部门剪切的使用\n“剪切”，即把一个部门X从部门A，移动到部门B。\n同样是因为财务需要关注当年的发生数、甚至是历史年份的发生数。所以，人财约定，不论在年内什么时间执行部门剪切，均代表从当年1月1日开始，部门即所属于新部门；\n如果人财希望从某个特定时间点开始，部门属于新部门，比如10月1日，那么不能使用剪切，需要新建一个部门，把旧部门的人员调动到新部门，并对旧部门做失效/拟失效处理。\n3.4 建立协同SOP\n（本文略）\n四、产品方案\n产品方案并不复杂，这里简要介绍下：\n4.1 建立人财部门映射\nBMS中启用部门的扩展字段，设置为HCM对应的部门编码，通过该字段把人财的部门联系起来，避免部门重构对BMS的影响。\n4.2 人财一体业务处理\n建立部门同步任务，当识别部门发生变化，在财务中台（会计平台）展现给财管，财管确认后同步在BMS进行部门变更处理\n部门变化业务场景\n支持全部业务场景，包括：\n①新增、变更\n②失效、拟失效\n③剪切\n流程图\n4.3 财务部门个性化规则\n财务侧并未把人力的全部部门都同步到财务系统，而是规定：\n1）仅同步四级以上部门\n只同步四级部门、以及有人或有HC的三级部门\n四级部门变五级部门的处理（同失效）\n2）创建“本部”的部门\n条件：三级部门，如果不是末级部门，且其有人或有HC\n结果：在该三级部门下，创建一个“本部”部门，承载该部门费用\n五、全面推广\nBMS的组织架构，在财务相关产品中推广：\n①EMS中，预算控制\n②管报中，报告呈现\n本文由 @regon 原创发布于人人都是产品经理。未经作者许可，禁止转载\n题图来自Unsplash，基于CC0协议\n该文观点仅代表作者本人，人", "thumb": "https://static.woshipm.com/tag/1101_1@2x.png ", "images": ["https://static.woshipm.com/tag/1101_1@2x.png ", "https://image.woshipm.com/2023/04/13/d34ae8a8-d9e1-11ed-9d7a-00163e0b5ff3.jpg", "https://image.woshipm.com/2026/11/18/3cfffe2c-e344-11f1-a1a1-00163e4b86a1.png", "https://image.woshipm.com/2026/11/18/69fdc260-e344-11f1-8645-00163e4b86a1.png", "https://image.woshipm.com/2026/11/18/cab4fcae-e344-11f1-a1a1-00163e4b86a1.png", "https://static.woshipm.com/tag/1601_1@2x.png "], "tags": [], "seen": false, "new": false, "daily": false}, {"guid": "177580828024f12e7431a78dcc4fe22f", "title": "AI Coding 之后，通用模型开始走进硬件研发", "link": "https://www.woshipm.com/ai/6495931.html", "source": "人人都是产品经理", "category": "pm", "summary": "AI Coding之后，通用模型开始走进硬件研发。OpenAI的GPT-6 Astra参与设计了一款能与Codex对话的设备，从外壳、电路板到固件，两名员工不到一周完成设计；Anthropic的Fable 5.2则做出三款电路无须修正的样机。 “科学家发现已有的世界，工程师创造尚不存在的世界。”——西奥多·冯·卡门 11 月初，OpenAI 公开展示了通用模型参与硬件研发的进展。在 11 月 3 日公布的项目中，GPT-6 Astra ", "ts": "2026-11-19T02:18:16+00:00", "published": "11-19", "starred": false, "importance": 2, "topic": "产品经理", "one_line": "", "why": "", "inline_text": "", "full_text": "", "thumb": "", "images": [], "tags": [], "seen": false, "new": false, "daily": false}, {"guid": "0b421bfe3286023a66a8a7b410f78c49", "title": "WorkBuddy自动操作PhotoShop软件设计电商详情页", "link": "https://www.woshipm.com/ai/6496051.html", "source": "人人都是产品经理", "category": "pm", "summary": "Agent能替人操作软件到什么程度？作者用刚上线Computer use的WorkBuddy实测：从授权录屏到兜圈子试错，最后靠脚本驱动Photoshop建图层、画元素，导出了带分层的PSD。步骤单一重复的活，交出去的路子跑通了。 今天要给大家演示的案例，很早之前老马就用Codex的Computer use能力实操过了。而最近WorkBuddy的5.11.3版本，也算是正式上线了Computer use能力，刚好就拿它来试试。 Code", "ts": "2026-11-19T02:17:13+00:00", "published": "11-19", "starred": false, "importance": 2, "topic": "产品经理", "one_line": "", "why": "", "inline_text": "", "full_text": "", "thumb": "", "images": [], "tags": [], "seen": false, "new": false, "daily": false}, {"guid": "2f0993eedfd0ae9f61dcbba378af7026", "title": "产品经理有没有最适合的MBTI？内向的人是不是真的吃亏？", "link": "https://www.woshipm.com/pmd/6496215.html", "source": "人人都是产品经理", "category": "pm", "summary": "当50岁的新势力领导在饭桌上问出“你的MBTI是啥”，MBTI已从社交暗号升级为职场通用协议。本文从产品经理视角，用JTBD框架拆解MBTI为何能解决破冰、贴标签、降低沟通成本等真实需求，并深挖其准确性争议与招聘伦理，最后探讨是否存在“最适合产品经理的MBTI”。 最近换了新工作，刚入职第一天，刚好碰到团队内部聚餐。你可能想不到，50岁的老领导问我的第一个问题居然是：你们的MBTI是啥？他不是什么HR，他是真正在一家新势力里做领导的人。", "ts": "2026-11-19T01:43:31+00:00", "published": "11-19", "starred": true, "importance": 3, "topic": "产品经理", "one_line": "", "why": "", "inline_text": "", "full_text": "当50岁的新势力领导在饭桌上问出“你的MBTI是啥”，MBTI已从社交暗号升级为职场通用协议。本文从产品经理视角，用JTBD框架拆解MBTI为何能解决破冰、贴标签、降低沟通成本等真实需求，并深挖其准确性争议与招聘伦理，最后探讨是否存在“最适合产品经理的MBTI”。\n最近换了新工作，刚入职第一天，刚好碰到团队内部聚餐。你可能想不到，50岁的老领导问我的第一个问题居然是：你们的MBTI是啥？他不是什么HR，他是真正在一家新势力里做领导的人。第一次听到他问我这个问题，其实我是目瞪口呆的。\n从那一刻起，我突然意识到，MBTI已经不是年轻人的社交暗号了，它在某种程度上已经成了中国职场的通用协议。上到开了20年会的领导，下到刚毕业的实习生，四个字母一报，就仿佛对上了暗号一般，也帮助我们在酒桌上的话匣子也就从此打开。\n但我这个产品经理的职业病又犯了，忍不住想：一个工具，为什么能被用得这么广？它到底解决了什么问题？它靠谱吗？以及最关键的甚至是，在职场上面，有没有一种最好的MBTI？\n所以我切入这个角度给大家讲讲。今天不讲什么新技术，不讲最近的什么模型，怎么去追逐AI的浪潮，今天就给大家讲讲我对于MBTI的一个见闻。\n一、来历\n先说说它是哪来的。MBTI最早是1940年代做出来的，那会儿还在打二战，做这套东西的是一对母女，妈妈叫凯瑟琳·布里格斯，女儿叫伊莎贝尔·迈尔斯。这两位其实都没受过心理学的专业训练，她们当时想解决的事情也很具体，就是很多女性第一次进工厂上班，怎么帮她们挑到一个干着舒服、效率又高的岗位。从发源这个角度看的话，它一开始就是给职场用的。\n再说它是怎么到国内的。2000年的时候，就已经有一家拿到官方授权的培训机构在华南做MBTI的认证培训了，到2020年9月，这家机构的授权范围扩大到了整个大陆。2022年有媒体转述过这家机构官网上挂的客户名单，说有800多家公司，里面有华为、阿里、万科，也有蔚来汽车和一汽大众。这个名单是机构自己说的，大家看个大概就行。\n它在年轻人里火起来是2022年的事。那年4月1日，“谷爱凌的MBTI是INTJ”上了微博热搜，后来有分析文章把这一天当成它走红的起点。也就是说，它在企业培训里出现，比在年轻人里火起来早了二十多年。\n企业家里也有人公开聊过。2023年8月，雷军在年度演讲之前发了一个预告，说自己的MBTI是ENFJ，还说“其实我有点社恐”，每次上台都要练习很久。那年他五十多岁。\n我自己测出来是ENTJ，前前后后测过四五次，每次都是ENTJ。紫色大姐头万岁，哈哈哈！\n二、饭桌\n说回那顿饭。我们这个团队是刚刚组建起来的，有从手机厂来的，有从互联网大厂来的，更多的是从别的新势力车企过来的，大家互相都还陌生。这顿饭本身也是为了让之后业务上要对接的人先熟悉一下。\n因为我是新来的，大家会比较好奇，所以这个问题自然而然先问到了我。接着桌上的人就轮流报各自的MBTI，报完一圈之后大家才开始聊谁是E人、谁是I人。\n领导聊着聊着是往深里走的，他主动去分析，交流过程中能听出来他对这套理论是做过一些了解的，也知道它在职场上是怎么用的。有趣的是领导说他自己其实是个I人。同时他也有一个看法，就是E人是不是会更适合职场，或者说更适合做产品经理。接着大家就顺着这个话题一直聊了下去。\n回来之后我就一直在想开头的那个问题，MBTI到底帮大家解决了什么。产品圈有一个框架叫JTBD（Jobs to be Done），意思是用户是为了办成某件事，才去“雇”一个产品的。这里便可以拿它来看一下MBTI，问题就变成了，在那张饭桌上大家雇它来办什么事。\n一桌人互相都不熟，报一下字母马上就有话说了。领导那边，十几个人的脾气本来要靠半年的会和饭局才摸得清，问一圈能先有个粗略的印象，而且这是年轻人熟的话题，好开口。内向一点的同事也用得上，不太想去团建的时候，“我是I人”是一个现成的说法，不用再说自己忙。还有就是聊到别人脾气的时候，说“你J人”要比说“你太固执”好开口得多。\n至于它为什么比别的性格测试传得开，北师大心理学教授王芳有过一个分析。她说人脑本来就习惯用分类来简化复杂的世界，分了类就能很快认识一个人，而学术界更认可的大五人格虽然更科学，但是不好懂。\n组织心理学家Adam Grant还提过一点。他2013年写过一篇批评MBTI的文章，里面说大五人格有一条叫“情绪稳定性”，MBTI的四条轴里没有，他把这个算作它的缺陷。可少了这一条，再加上16种类型的名字都起得挺好听，建筑师、指挥官、调停者，测出来的结果就没有一个是让人难堪的，在饭桌上报出来不会冷场。\nAdam Grant那篇文章里还引了两个数，说每年有250多万人做这个测试，财富100强里有89家公司在用。另外舆情分析机构清博在分析它走红的时候提到过一个细节，结果页上会告诉你，你这个类型在人群里只占百分之几。\n国外的公司用得更早。桥水基金从2008年开始给管理层做MBTI，创始人达利欧一开始是不信的，后来和别的测评搭着一起用，主要用在招聘上。招聘这块埋下伏笔，后面会提及。\n三、准不准\n先说我自己，前面讲了，我测过四五次，每次都是ENTJ，一个字母都没变过。\n再看官网自己是怎么说的。MBTI的出版方在官网上有一个常见问题页，里面有三句话：\n第一句是关于重测的：“About 50 percent of people get the same four-letter or whole type on retest.”意思是再测一次，四个字母全都不变的人大约只有一半。同一页上也写了，九成的人至少有三个字母是不变的，单看每一条轴的分数，15周以内重测的相关系数在0.80以上。\n批评它的人给的数其实和官网差不多。有一位叫Pittenger的学者在1993年写过一篇综述，说隔5周再测，最多有50%的人会被分到另一个类型里去。他的解释是每条轴上大部分人的分数都靠近中间，分数稍微动一点，字母就换了。打个比方，一条轴上一个人49分，一个人51分，两个人其实差不多，拿到的却是两个不同的字母。\n第二句是：“Preferences do not indicate skill or ability.”偏好不代表技能或者能力。它测的是你更愿意怎么做事，做得好不好它测不出来。\n第三句是关于招聘的，官网写得很直接，说这个测评不用于挑选求职者，也不用于把人分到某个团队、岗位或者职能里去。如果要求求职者做这个测试，再拿结果把人筛掉，官网用的词是unethical，不道德。官网还说这套东西是为个人发展设计的，也没有什么有意义的研究评估过它能不能预测工作表现。前面说的桥水拿它做招聘，和官网的这个态度其实是对不上的。\n那什么东西能预测工作表现呢，这方面有两篇论文可以看。性格这一类里最稳的是大五人格里的“尽责性”，1991年有一篇元分析（就是把很多研究合起来再算一遍），发现它是唯一一个在所有职业、所有绩效指标上都成立的特质，不过修正之后的相关系数也就0.22左右，并不高。选人的办法里，2022年的一篇研究排下来，效度最高的是结构化面试，大约0.42。\n最后讲一个老实验。1949年有位心理学家叫福勒，他从报摊上卖的星座书里抄了一段性格描述，发给39个学生，告诉每个人这是专门为你写的，请大家给准确度打分，满分5分", "thumb": "https://static.woshipm.com/tag/1101_1@2x.png ", "images": ["https://static.woshipm.com/tag/1101_1@2x.png ", "https://image.woshipm.com/wp-files/2026/11/IDMHVoNGs9n5c0UGibXd.jpeg", "https://image.woshipm.com/wp-files/2026/11/9NpQa5khaS3P5I6ljeRv.jpeg", "https://image.woshipm.com/wp-files/2026/11/6uCmXCfGdCXFsjWGsyxh.jpeg", "https://image.woshipm.com   checkTimer = setInterval(checkOnce, 20000);  // 20s 一次
}
function stopCheck() {
  checking = false; clearInterval(checkTimer); checkTimer = null;
  refreshBtn.classList.remove('busy');
  refreshBtn.querySelectorAll('span')[1].textContent = '手动刷新';
}
async function checkOnce() {
  try {
    const resp = await fetch(window.location.pathname + '?t=' + Date.now(),
      { cache: 'no-store' });
    if (!resp.ok) return;
    const text = await resp.text();
    const m = text.match(/更新于\s*(\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2})/);
    if (m && m[1] !== CURRENT_UPDATED) {
      stopCheck();
      refreshBtn.classList.add('done', 'pulse');
      refreshBtn.querySelectorAll('span')[1].textContent = '有新数据 · 点此刷新';
      refreshBtn.onclick = () => window.location.reload();
    }
  } catch (e) {}
}

/* 页面打开时，每 60s 自动检查一次，不打扰用户 */
setInterval(() => { if (!checking) checkOnce(); }, 60000);

const FAV_KEY = 'radar.favs.v2';
const READ_KEY = 'radar.read.v2';

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
function load(key, def) {
  try { return JSON.parse(localStorage.getItem(key)) || def; } catch (e) { return def; }
}
function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
}

let favs = load(FAV_KEY, []);      // [{title,link,...}]
let reads = load(READ_KEY, []);    // [link]
const favSet = new Set(favs.map(f => f.link));
const readSet = new Set(reads);

function snapshot(it) {
  return { title: it.title, link: it.link, source: it.source, category: it.category,
           published: it.published, one_line: it.one_line, why: it.why,
           topic: it.topic, tags: it.tags, importance: it.importance };
}

/* 收藏过的标签 = 兴趣信号，用来给新条目标注「为你」 */
function interest() {
  const count = {};
  favs.forEach(f => {
    (f.tags || []).concat(f.topic ? [f.topic] : []).forEach(t => {
      count[t] = (count[t] || 0) + 1;
    });
  });
  return count;
}
let INTEREST = interest();
function matched(it) {
  return (it.tags || []).concat(it.topic ? [it.topic] : [])
    .some(t => (INTEREST[t] || 0) > 0);
}

function starBar(n) {
  n = n || 0;
  if (!n) return '';
  return '★'.repeat(n) + '☆'.repeat(5 - n);
}

function cardHTML(it, lead) {
  const meta = CATS[it.category] || ['其他', '#6B7280', '#F3F4F6'];
  const cls = ['card'];
  if (it.daily) cls.push('pick');
  if (lead) cls.push('lead');
  if (readSet.has(it.link)) cls.push('read');
  const hasFav = favSet.has(it.link);

  // 站内阅读元素（今日必看 + 有正文才给）
  const hasBody = it.full_text || (it.inline_text && it.inline_text.includes('\n'));
  const hasContent = it.daily && (it.full_text || it.inline_text || it.thumb);

  let bodyHTML = '';
  if (hasContent) {
    let thumb = it.thumb ? `<img class="thumb" src="${esc(it.thumb)}" alt="" loading="lazy" onerror="this.style.display='none'">` : '';
    let bullets = '';
    if (it.inline_text) {
      const lines = it.inline_text.split(/[\n]/).map(s => s.trim()).filter(Boolean).slice(0, 5);
      if (lines.length) {
        bullets = `<ul class="inline-bullets">${lines.map(l => `<li>${esc(l)}</li>`).join('')}</ul>`;
      }
    }
    let fullText = '';
    if (it.full_text) {
      fullText = `<div class="body-text">${esc(it.full_text)}</div>`;
    }
    let imgs = '';
    if (it.images && it.images.length) {
      imgs = `<div class="imgs">${it.images.slice(0, 6).map(u =>
        `<img src="${esc(u)}" alt="" loading="lazy" onerror="this.style.display='none'">`).join('')}</div>`;
    }
    let expandBtn = it.full_text
      ? `<button class="expand-btn" type="button"><span>展开全文</span> ↓</button>` : '';

    bodyHTML = `
      ${thumb}
      ${bullets}
      ${expandBtn}
      <div class="full-body">
        ${fullText}
        ${imgs}
        <div style="margin-top:14px">
          <a href="${esc(it.link)}" target="_blank" rel="noopener"
             style="color:var(--muted);font-size:12.5px">查看原文 →</a>
        </div>
      </div>`;
  }

  return `<article class="${cls.join(' ')}" data-link="${esc(it.link)}">
    <div class="row">
      <span class="chip" style="color:${meta[1]};background:${meta[2]}">${esc(meta[0])}</span>
      <span>${esc(it.source)}</span>
      <span>${esc(it.published)}</span>
      ${it.new ? '<span class="new">新</span>' : ''}
      ${matched(it) && !it.daily ? '<span class="for-you">为你</span>' : ''}
      <span class="stars">${starBar(it.importance)}</span>
    </div>
    <h3><a href="${esc(it.link)}" target="_blank" rel="noopener" data-link="${esc(it.link)}">${esc(it.title)}</a></h3>
    ${it.one_line ? `<p class="line">${esc(it.one_line)}</p>` : ''}
    ${it.why ? `<p class="why">${esc(it.why)}</p>` : ''}
    ${!it.one_line && it.summary ? `<p class="raw">${esc(it.summary)}</p>` : ''}
    ${bodyHTML}
    ${(it.tags && it.tags.length) ? `<div class="tags">${it.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
    <button class="fav ${hasFav ? 'on' : ''}" data-link="${esc(it.link)}">${hasFav ? '已收藏' : '收藏'}</button>
  </article>`;
}

function renderContests() {
  const box = document.getElementById('contests');
  if (!CONTESTS.length) { box.innerHTML = '<div class="empty">暂无</div>'; return; }
  box.innerHTML = CONTESTS.map(c => {
    const label = c.expected_start ? '预计 ' + c.expected_start : '待公布';
    return `<div class="contest">
      <div class="top"><div class="name">${esc(c.name)}</div><span class="badge">${esc(label)}</span></div>
      <div class="org">${esc(c.org || '')}</div>
      <div class="note">${esc(c.note || '')}</div>
    </div>`;
  }).join('');
}

let cur = 'daily';
let kw = '';
let sortBy = 'importance';

function currentList() {
  if (cur === 'fav') {
    return favs.slice().reverse().map(f => ({ ...f, daily: false }));
  }
  if (cur === 'daily') return ITEMS.filter(i => i.daily);
  if (cur === 'all') return ITEMS.slice();
  return ITEMS.filter(i => i.category === cur);
}

function render() {
  const list = document.getElementById('list');
  let items = currentList();

  if (kw) {
    items = items.filter(it =>
      (it.title + ' ' + (it.summary || '') + ' ' + (it.one_line || '') + ' ' +
       (it.topic || '') + ' ' + (it.tags || []).join(' ') + ' ' + it.source)
        .toLowerCase().includes(kw));
  }

  if (sortBy === 'time') {
    items.sort((a, b) => (b.ts || b.published || '').localeCompare(a.ts || a.published || ''));
  } else if (cur !== 'daily') {
    items.sort((a, b) => (b.importance || 0) - (a.importance || 0) ||
      (b.ts || '').localeCompare(a.ts || ''));
  }

  if (!items.length) {
    list.innerHTML = `<div class="empty">${cur === 'fav' ? '还没收藏。看到有用的点右下角「收藏」，以后会优先推给你。' : '没有匹配的条目'}</div>`;
    return;
  }

  list.innerHTML = items.map((it, i) =>
    cardHTML(it, cur === 'daily' && i < 3)).join('');
}

function renderTabs() {
  const tabs = document.getElementById('tabs');
  const defs = [['daily', '今日必看'], ['all', '全部']]
    .concat(ORDER.map(k => [k, (CATS[k] || [k])[0]]))
    .concat([['fav', '我的收藏']]);
  tabs.innerHTML = defs.map(([k, n]) =>
    `<button class="tab ${k === cur ? 'on' : ''}" data-k="${k}">${n}</button>`).join('');
  tabs.querySelectorAll('.tab').forEach(b => {
    b.onclick = () => { cur = b.dataset.k; renderTabs(); render(); };
  });
}

document.getElementById('q').addEventListener('input', e => {
  kw = e.target.value.trim().toLowerCase();
  render();
});

document.getElementById('sort').addEventListener('click', e => {
  sortBy = sortBy === 'importance' ? 'time' : 'importance';
  e.target.textContent = sortBy === 'importance' ? '按重要度' : '按时间';
  render();
});

document.getElementById('list').addEventListener('click', e => {
  const expand = e.target.closest('.expand-btn');
  if (expand) {
    const card = expand.closest('.card');
    card.classList.toggle('body-open');
    // 展开即算已读
    const link = card.dataset.link;
    if (link && !readSet.has(link)) {
      readSet.add(link); reads.push(link);
      save(READ_KEY, reads);
      card.classList.add('read');
    }
    return;
  }
  const fav = e.target.closest('.fav');
  if (fav) {
    const link = fav.dataset.link;
    const hit = ITEMS.find(i => i.link === link) || favs.find(f => f.link === link);
    if (favSet.has(link)) {
      favSet.delete(link);
      favs = favs.filter(f => f.link !== link);
    } else if (hit) {
      favSet.add(link);
      favs.push(snapshot(hit));
    }
    save(FAV_KEY, favs);
    INTEREST = interest();
    renderTabs(); render();
    return;
  }
  const a = e.target.closest('h3 a');
  if (a) {
    const link = a.dataset.link;
    if (!readSet.has(link)) {
      readSet.add(link);
      reads.push(link);
      save(READ_KEY, reads);
      const el = a.closest('.card');
      if (el) el.classList.add('read');
    }
  }
});

renderContests();
renderTabs();
render();
</script>
</body>
</html>
