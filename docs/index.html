<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>产品雷达 · PM Radar</title>
<style>
  :root {
    --bg: #FAF8F5;
    --card: #FFFFFF;
    --ink: #1F2328;
    --body: #4B5563;
    --muted: #8A8580;
    --line: #E8E3DA;
    --accent: #B45309;
    --accent-soft: #FDF3E7;
    --radius: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB",
                 -apple-system, BlinkMacSystemFont, sans-serif;
    line-height: 1.78;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px; }

  /* ---------- 头部 ---------- */
  header { padding: 46px 0 10px; }
  .head-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
  .head-row .h { flex: 1; min-width: 0; }
  h1 { font-size: 32px; margin: 0 0 12px; letter-spacing: -0.6px; font-weight: 700; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 13.5px; margin: 0; line-height: 1.9; }
  .sub b { color: var(--ink); font-weight: 600; }
  .sub .dot { margin: 0 6px; color: #D5CEC3; }

  .refresh { display: inline-flex; align-items: center; gap: 6px;
             border: 1px solid var(--line); background: var(--card);
             color: var(--ink); border-radius: 999px; padding: 7px 14px;
             font-size: 13px; font-family: inherit; cursor: pointer;
             white-space: nowrap; transition: all .15s; text-decoration: none; }
  .refresh:hover { border-color: var(--accent); color: var(--accent); }
  .refresh:active { transform: scale(.97); }
  .refresh .spin { display: inline-block; animation: none; }
  .refresh.busy .spin { animation: spin 1s linear infinite; }
  .refresh.done { border-color: #16A34A; color: #16A34A; }
  .refresh.pulse { position: relative; animation: pulse 2s infinite; }
  .refresh.pulse::after { content: ''; position: absolute; right: -2px; top: -2px;
                          width: 10px; height: 10px; border-radius: 50%;
                          background: #16A34A; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(22,163,74,.4); }
                     50%    { box-shadow: 0 0 0 8px rgba(22,163,74,0); } }

  h2 {
    font-size: 16px; margin: 40px 0 14px; font-weight: 600;
    display: flex; align-items: center; gap: 9px;
  }
  h2::before { content: ""; width: 4px; height: 17px; border-radius: 2px; background: var(--accent); }
  h2 em { font-style: normal; font-weight: 400; font-size: 13px; color: var(--muted); }

  /* ---------- 比赛 ---------- */
  .contests { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .contest { background: var(--card); border: 1px solid var(--line);
             border-radius: var(--radius); padding: 16px 18px; }
  .contest .top { display: flex; justify-content: space-between; align-items: baseline;
                  gap: 10px; margin-bottom: 6px; }
  .contest .name { font-weight: 600; font-size: 14.5px; line-height: 1.55; }
  .contest .org { color: var(--muted); font-size: 12.5px; margin-bottom: 8px; }
  .contest .note { font-size: 13px; color: var(--body); line-height: 1.7; }
  .badge { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
           white-space: nowrap; background: #DBEAFE; color: #1E40AF; }

  /* ---------- 工具条 ---------- */
  .toolbar { position: sticky; top: 0; z-index: 9; background: var(--bg);
             padding: 14px 0 12px; margin: 30px 0 4px; border-bottom: 1px solid var(--line); }
  .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px;
          scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: 0 0 auto; border: 1px solid var(--line); background: var(--card);
         color: var(--body); font-size: 13.5px; padding: 6px 15px; border-radius: 999px;
         cursor: pointer; font-family: inherit; transition: all .15s; white-space: nowrap; }
  .tab.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .search { display: flex; gap: 8px; align-items: center; }
  #q { flex: 1; border: 1px solid var(--line); background: var(--card); border-radius: 999px;
       padding: 9px 16px; font-size: 14px; font-family: inherit; outline: none; color: var(--ink);
       min-width: 0; }
  #q:focus { border-color: #C9C2B6; }
  .sort { border: 1px solid var(--line); background: var(--card); color: var(--body);
          border-radius: 999px; padding: 8px 14px; font-size: 13px; font-family: inherit;
          cursor: pointer; white-space: nowrap; }

  /* ---------- 卡片 ---------- */
  .card { position: relative; background: var(--card); border: 1px solid var(--line);
          border-radius: var(--radius); padding: 18px 20px; margin-bottom: 12px;
          transition: border-color .15s, opacity .2s; }
  .card:hover { border-color: #D6CFC2; }
  .card.pick { border-left: 3px solid var(--accent); }
  .card.lead { padding: 22px 22px 20px; }
  .card.lead h3 { font-size: 19px; }
  .card.read { opacity: .62; }

  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
         font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
  .chip { font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; }
  .new { font-size: 11px; font-weight: 700; color: #B91C1C; background: #FEE2E2;
         padding: 1px 7px; border-radius: 999px; }
  .for-you { font-size: 11px; font-weight: 700; color: #6D28D9; background: #EDE9FE;
             padding: 1px 7px; border-radius: 999px; }
  .stars { margin-left: auto; color: var(--accent); font-size: 12px; letter-spacing: 1px; }

  .card h3 { margin: 0 0 8px; font-size: 16.5px; line-height: 1.6; font-weight: 600; }
  .card h3 a { color: var(--ink); text-decoration: none; }
  .card h3 a:hover { color: var(--accent); }
  .line { margin: 0 0 6px; font-size: 14.5px; color: var(--body); line-height: 1.75; }
  .why { margin: 0; font-size: 13px; color: var(--accent); background: var(--accent-soft);
         border-radius: 9px; padding: 7px 11px; display: inline-block; }
  .raw { margin: 8px 0 0; font-size: 13px; color: var(--muted); line-height: 1.7; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tag { font-size: 11.5px; color: #6B7280; background: #F3F4F6; border-radius: 999px;
         padding: 2px 9px; }

  /* ---------- 站内阅读 ---------- */
  .thumb { width: 100%; max-height: 180px; object-fit: cover; border-radius: 10px;
           margin-bottom: 10px; display: block; background: #F3F4F6; }
  .inline-bullets { margin: 8px 0 2px; padding: 0; list-style: none; }
  .inline-bullets li { font-size: 13.5px; color: #4B5563; padding: 3px 0 3px 14px;
                       position: relative; line-height: 1.7; }
  .inline-bullets li::before { content: "•"; position: absolute; left: 0; color: var(--accent);
                               font-weight: 700; }
  .full-body { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); }
  .card.body-open .full-body { display: block; }
  .card.body-open .expand-btn span { content: '收起全文'; }
  .full-body .body-text { font-size: 14px; color: #374151; line-height: 1.85;
                          white-space: pre-wrap; word-break: break-word; }
  .imgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
          gap: 8px; margin-top: 12px; }
  .imgs img { width: 100%; height: 110px; object-fit: cover; border-radius: 8px;
              background: #F3F4F6; }

  .expand-btn { display: inline-flex; align-items: center; gap: 4px;
                background: transparent; border: 1px solid var(--line);
                color: var(--accent); border-radius: 999px; padding: 5px 14px;
                font-size: 12.5px; font-family: inherit; cursor: pointer;
                margin-top: 10px; }
  .expand-btn:hover { background: var(--accent-soft); }

  .fav { position: absolute; right: 14px; bottom: 14px; border: 1px solid var(--line);
         background: transparent; color: var(--muted); font-size: 12.5px; font-family: inherit;
         border-radius: 999px; padding: 4px 12px; cursor: pointer; transition: all .15s; }
  .fav:hover { border-color: #C9C2B6; }
  .fav.on { color: var(--accent); border-color: #E7C89E; background: var(--accent-soft); }

  .empty { text-align: center; color: var(--muted); padding: 54px 0; font-size: 14px; }
  footer { padding: 46px 0 64px; color: #9CA3AF; font-size: 12.5px;
           border-top: 1px solid var(--line); margin-top: 36px; line-height: 1.9; }

  @media (max-width: 560px) {
    .wrap { padding: 0 16px; }
    header { padding-top: 34px; }
    h1 { font-size: 27px; }
    .card { padding: 16px 17px; padding-bottom: 46px; }
    .card.lead { padding: 20px 18px; padding-bottom: 48px; }
    .card.lead h3 { font-size: 17.5px; }
    .stars { margin-left: 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="head-row">
      <div class="h">
        <h1>产品<span>雷达</span></h1>
        <p class="sub">
          每天 6 条，AI 从 581 条里挑的
          <span class="dot">·</span> 更新于 2026-11-19 14:01
          <span class="dot">·</span> 已加工 <b>540</b> 条
        </p>
      </div>
      <button class="refresh" id="refreshBtn" title="手动触发云端重新抓取与 AI 筛选">
        <span class="spin">↻</span><span>手动刷新</span>
      </button>
    </div>
  </header>

  <h2>还没开始的比赛</h2>
  <div class="contests" id="contests"></div>

  <div class="toolbar">
    <div class="tabs" id="tabs"></div>
    <div class="search">
      <input id="q" placeholder="搜索：面试 / 竞赛 / 智能体">
      <button class="sort" id="sort">按重要度</button>
    </div>
  </div>

  <div id="list"></div>

  <footer>
    产品雷达 · 14 个信息源 · 每天由 GLM 去重、打分、写摘要<br>
    收藏和已读只存在本设备；内容版权归原作者
  </footer>
</div>

 "source": "TRAE 官方社区", "category": "contest", "summary": "主题：关于 TRAE 会员 Lite 年费退款申请（UID：692029648301899，2026年11月12日支付） 当时点错了购买了年会员后，当天就申请退款，可是一直没有渠道，反馈给官方邮箱也没有回信，11.12日发出的，有工作人员能帮忙看一下到底怎么回事吗？ 您好。我是 TRAE 用户，UID： 692029648301899 。 我于 2026年11月12日 20:20:35 通过微信零钱通支付，购买「 TRAE会员Lite权", "ts": "2026-11-19T05:00:52+00:00", "published": "11-19", "starred": false, "importance": 2, "topic": "竞赛", "one_line": "TRAE 年会退款问题", "why": "", "inline_text": "TRAE 年会\n退款\n未回信", "full_text": "", "thumb": "", "images": [], "tags": ["AI 产品"], "seen": false, "new": true, "daily": false}, {"guid": "c1904bc0a6bbb43b4f121f9ff56406ba", "title": "从昨天下午开始一直在loading", "link": "https://forum.trae.cn/t/topic/604649", "source": "TRAE 官方社区", "category": "contest", "summary": "你的运行环境（版本号「点击帮助-关于-复制」）： 3.4.22 问题描述（你遇到了什么问题？）请勿使用AI模版，AI分析会导致关键信息覆盖： 对话框一直loading 复现步骤（如何才能重现这个 Bug/问题？）请勿使用AI模版，AI分析会导致关键信息覆盖： 1.打开trae 2. 3. 报错信息或截图（如有）请勿使用AI模版，AI分析会导致关键信息覆盖： 7 个帖子 - 2 位参与者 阅读完整话题", "ts": "2026-11-19T04:59:44+00:00", "published": "11-19", "starred": false, "importance": 2, "topic": "竞赛", "one_line": "TRAE 运行环境问题", "why": "", "inline_text": "TRAE 运行环境\nloading\n问题", "full_text": "", "thumb": "", "images": [], "tags": ["AI 产品"], "seen": false, "new": true, "daily": false}, {"guid": "2a19089eb77c89f722c98aff7928873b", "title": "AI基建大潮方兴未艾，联想集团最佳财季诞生！", "link": "https://www.qbitai.com/2026/11/511088.html", "source": "量子位", "category": "ai_product", "summary": "全球AI生态链领先企业联想集团今日公布截至2026/27财年第二季度业绩", "ts": "2026-11-19T04:51:31+00:00", "published": "11-19", "starred": false, "importance": 3, "topic": "AI 产品", "one_line": "联想集团发布 AI 生态链业绩", "why": "", "inline_text": "联想集团\nAI 生态链\n业绩", "full_text": "< img id=\"wx_img\" src=\"https://www.qbitai.com/wp-content/uploads/imgs/qbitai-logo-1.png\" width=\"400\" height=\"400\">\nAI基建大潮方兴未艾，联想集团最佳财季诞生！\n量子位的朋友们\n2026-11-19\n12:51:31\n来源：\n量子位\n全球AI生态链领先企业联想集团今日公布截至2026/27财年第二季度业绩\n2026年11月19日——全球AI生态链领先企业联想集团（HKSE：992）（ADR：LNVGY）今日公布截至2026年9月30日的2026/27财年第二季度业绩：集团季度营收首次突破2000亿元人民币，同比快速增长近50%，创历史新高的同时大超市场预期；调整后净利润同比增长166%，创历史新高并远超市场预期；调整后净利润率同比提升2个百分点至4.5%，刷新自收购摩托罗拉移动和IBM x86服务器业务以来的历史纪录。\n尽管市场对AI投资回报及云厂商资本开支的可持续性存在疑虑，但从产业发展阶段看，AI基建大潮才刚刚开始，算力需求的长期增长潜力尚未充分释放。随着AI从训练为主走向训练与推理并重，应用场景持续拓展，全球Token消耗量快速增长，AI应用广度与深度的提升将持续打开基础设施市场空间。这一趋势正得到云服务厂商与企业客户的共同验证：前者持续推进AI基建，后者逐步从试点探索走向规模化应用。\n“AI在企业现在还只是引入和尝试阶段。”联想集团董事长兼CEO杨元庆称，“我们对AI算力需求的长期增长充满信心。”\n面对这一方兴未艾的产业机遇，联想集团已进行十余年的战略布局，并正迎来转型成果的集中兑现。本季度，联想集团在快速扩大业务规模的同时，营收与利润结构实现里程碑式重塑。其中，ISG基础设施方案业务集团与SSG方案服务业务集团合计贡献三大业务集团运营利润总额的61%，较去年同期大幅提升28个百分点。随着ISG与SSG业务利润贡献占比持续提升，联想集团正逐步形成智能设备、基础设施与方案服务共同驱动利润增长的新格局，盈利能力与业务发展韧性进一步增强。\n具体而言，第二财季，ISG基础设施方案业务集团营收约761亿元人民币，同比增长177.6%，运营利润首次突破70亿元人民币，运营利润率升至创纪录的9.6%；同时联想跃居全球x86服务器出货量第一、全球服务器整体出货量第二。IDG智能设备业务集团营收约1165亿元人民币，同比增长14.9%，在终端市场出货量承压的情况下保持稳健增长；联想PC市场份额达到23.8%，继续稳居全球第一，与第二名厂商的市场份额差距扩大至创纪录的7.2个百分点。SSG方案服务业务集团营收超过200亿元人民币，同比增长20.4%，运营利润率达到26%的历史新高。\n在这一轮由AI驱动的产业变革中，覆盖“端-边-云”的完整算力布局正成为重要竞争优势，也为联想混合式AI战略的持续落地打开了更广阔的增长空间。第二财季中，集团三大业务集团均实现双位数及以上营收增长，并创下各自同期营收新高。随着基础设施业务规模和盈利能力同步跃升，联想正在从全球智能设备领导者，加速成长为覆盖终端、边缘与云端的全球AI基建领域领先企业。\n第二财季，集团AI相关业务营收同比增长近80%，突破700亿元人民币，占集团整体营收近四成。其中，AI服务器营收同比增长超过300%，储备订单进一步扩大至5300亿元人民币；AI服务营收实现三位数同比增长。从AI PC、AI手机，到AI服务器、混合式AI基础设施与行业解决方案，AI正在多个业务层面形成增长共振。\n伴随业务增长，联想继续加大创新投入。第二财季，集团研发投入同比增长36.8%，持续加强在个人智能、企业智能及下一代AI基础设施领域的布局。在个人智能领域，联想围绕“一体多端”战略，持续提升天禧与Lenovo Qira的跨设备协同和任务执行能力的超级智能体演进；在企业智能领域，则依托混合式人工智能优势集（Hybrid AI Advantage），持续完善AI基础设施、Token管理平台及行业AI解决方案，加快推动企业AI从技术试验走向规模化部署。\n更值得关注的是，联想的增长正建立在更为稳健的财务基础之上。通过持续提升盈利能力、加强营运资金管理，并严格管控资本开支，联想第二财季自由现金流稳健增长，为持续创新与战略业务扩张提供了支持。在基础设施业务快速增长的同时，联想继续强化客户信用风险管理与资本使用纪律，以推动业务规模与盈利质量同步提升。\n“上季度，联想再次交出极为出色的成绩单，我们持续高速增长，优化盈利，业务基本面实现结构性提升，展现了从PC领导者到全栈型算力领导者的转型成果。”杨元庆表示，“当前AI实际应用方兴未艾，不仅将带动基础设施需求的持续上升，也将激发终端设备市场的巨大增长潜力，凭借混合式人工智能战略、‘端-边-云’架构的全栈型产品组合，以及财务上的高度自律和韧性，我们有信心继续保持这一强劲势头，并在本财年内提前实现1000亿美元的营收目标。”\n业绩亮点：\n营收首次突破2000亿元人民币，同比增长近50%，创历史新高；\n调整后净利润同比增长166%，调整后净利润率升至4.5%，双双创历史新高；\n三大业务集团均实现第二财季营收历史新高，ISG与SSG合计贡献业务集团运营利润总额的61%，营收与利润结构实现里程碑式重塑；\nISG基础设施方案业务集团营收同比增长177.6%至761亿元人民币，运营利润率达9.6%；\nIDG智能设备业务集团实现营收1165亿元人民币，PC市场份额领先第二名厂商7.2个百分点；\nSSG方案服务业务集团营收超过200亿元人民币，同比增20.4%，运营利润率达26%创历史新高；\nAI相关业务营收同比增长近80%，占集团整体营收近四成；\nAI服务器营收同比增长超300%，储备订单达到5300亿元人民币；\n研发投入同比增长超36%，进一步推动个人智能与企业智能创新。\nISG：营收与盈利能力大幅提升，AI服务器营收同比增超3倍\n一个显见的趋势是，AI基础设施市场的增长远未到达终点。随着AI从大模型训练向推理演进，规模化应用场景持续拓展，全球词元消耗量快速攀升，持续增长的算力需求正推动AI基础设施进入新一轮扩张周期。IDC数据显示，全球服务器市场规模在2026年第二季度达到1663亿美元，同比增长52%，环比增长35.7%，创下历史新高。\n在这一产业趋势下，联想ISG迎来历史性突破。第二财季，ISG营收达到761.18亿元人民币，同比增长177.6%，创历史新高；运营利润首次突破70亿元人民币，运营利润率达到9.6%，同比提升10.4个百分点，同样刷新历史纪录。这也是ISG连续第三个季度实现盈利，显示其在高速增长的同时，正逐步建立起可持续的盈利能力。\n这一表现源于联想长期坚持的面向云服务提供商（CSP）与企业及中小企业（ESMB）客户的双轮驱动战略。本季度，ISG的CSP业务营收同比增长近170%，创下历史最佳季度表现，ESMB业务营收增速更快，同比增长约200%。值得关注的是，本季度企业AI基础设施市场规模同比增长114%，推动整体ESMB基础设施市场增长48%，而联想ESMB业务同比两倍的增速，显著跑赢市场。\n在AI基础设施领域，联想正", "thumb": "http://www.qbitai.com/wp-content/uploads/2019/06/200.jpg", "images": ["http://www.qbitai.com/wp-content/uploads/2019/06/200.jpg", "https://i.qbitai.com/wp-content/uploads/replace/7a9a5338c45bd896dd376465eb74cd8e-e1737597655481-300x175.png", "https://i.qbitai.com/wp-content/uploads/replace/318ae204e81f92f648bd00faf5a08d33-e1719716374836-300x175.png", "https://i.qbitai.com/wp-content/uploads/2022/09/640-4-e1662786806610.png", "https://i.qbitai.com/wp-content/uploads/2022/09/WX20220928-180736@2x.png", "https://www.qbitai.com/wp-content/uploads/2019/01/qrcode_QbitAI_1.jpg"], "tags": ["AI 产品"], "seen": false, "new": true, "daily": true, "score": 31.92726638513889, "rank": 3}, {"guid": "2814303a21c0e63395fa27bad455e16c", "title": "TRAE CN 接入 Ollama 的 gpt-oss:20b，Agent 无法调用工具(不说某包的坏话，能发出去吗)", "link": "https://forum.trae.cn/t/topic/604648", "source": "TRAE 官方社区", "category": "contest", "summary": "以下是用chatgpt写的，非常正规，应该允许我发贴了吧 我在 TRAE CN 3.4.20 中接入了 Ollama 本地模型 gpt-oss:20b ，普通聊天可以正常使用，但 Agent 模式无法正常执行工具调用。 例如，让 Agent 创建一个 hello.py 文件，Agent 一直显示「思考中」，最后只返回普通对话内容，并没有实际创建文件。 我单独通过 Ollama 的 API 测试过，模型能够正常返回 tool_calls ", "ts": "2026-11-19T04:45:23+00:00", "published": "11-19", "starred": false, "importance": 3, "topic": "竞赛", "one_line": "TRAE CN 接入 Ollama 的 gpt 都是树形结构；\n财务组织架构：财务没有组织架构的概念，会计叫费用中心、成本中心，一般都不是树形，而是列表，用于承载成本费用；但是，为了实现财务数据的汇总，也会建立一套层级架构，用于各种口径的财务管理报告；\n人财一体化：即，人事组织架构和财务组织架构的一致，财务自动同步人事组织架构。\n1.4 战略考虑\n为什么要做人财一体？为什么这个阶段做人财一体？\n1）人事组织架构是公司管理策略的体现\n一般来讲，人财组织架构，很难完全一致，但近似，毕竟人、财都是在落实公司的管理要求，而公司的管理落脚点就是人事的组织架构。\n管理层要求财务管理报告也按照人事组织架构来出具，利出一孔，提升准确性、降低沟通和解释成本。\n2）管理工作细化、管理效率要求高，系统线上化的程度升级\n公司完成了HCM系统建设，人力预算线上化了，并要求人力预算推送到BMS系统\n人力的老大晋升了，除了负责人力资源，也可以管到财务，人财从管理上走得更近了\n准确和效率的要求，管理层希望可以更快、更准的拿到管理报表，要求逐步线上化，减少人工的干预\n1.5 难度和挑战\n1）宏观层面\n影响范围广：产品的部门组织架构是地基，BMS中所有应用都以其为基础，涉及近1000个页面\n价值难量化：毫无疑问，这件事是基建性质的工作。凡是基建性质的，注定短期收益不高，长期见效\n行业的案例少：直接做一体化的少，行业很多互联网公司，都是通过在财务侧配置部门映射解决\n沟通成本高：下游（财务）的需求，传递到上游，往往不被理解，会被认为是可以“线下”解决的问题\n长期难执行：下游（财务）灵活管理的需求、各层管理者特异性的需求层出不穷，一体化很难保持\n2）微观层面\n财务部门规则\n①财务只对四级以上部门创建费用部门\n财务管理颗粒度比人力要粗，仅对四级以上部门才创建费用部门\n②非末级部门不能承载预算数据\n财务系统中，如果三级部门不是末级部门，那么不允许承载费用\n③非末级部门如果没有费用发生，不创建费用部门\n三级部门无人不创建费用部门\n财务数据的连贯性要求\n①年度内预算分析需求\n②年度内预算管控要求\n③多年数据对比分析需求\n二、策略\n2.1 第一阶段：业务梳理\n项目难点是业务问题而非产品问题\n，是推动人财一体管理理念深化到业务管理的过程。\n需要明确管理规则，统一当前部门架构，建立部门创建人力、财务相关岗位协同工作的SOP。\n业务梳理还包括：\n①对失效部门的处理规范\n②对剪切部门的使用规范\n2.2 第二阶段：产品落地\n分阶段落地原则\n1）步骤一：费用部门自动同步\n没有人，但有HC也创建费用部门，解决HCM人力预算同步BMS的问题\n2）步骤二：建立人财部门的映射关系\n不重建，BMS的扩展字段指向HCM编码，解决全面预算审批的问题\n3）步骤三：实现部门完整自动同步\n支持全部业务场景，包括：\n①新增、变更、失效、拟失效\n②创建“本部”\n③剪切\n2.3 第三阶段：全面推广\n半年过渡期，SOP机制执行顺畅，系统进行全面切换，下一年预算全流程采用新架构。\n三、业务梳理\n3.1 人财部门盘点，解决现存部门不一致问题\n对现状的梳理以及处理对策，是本文最有挑战的事情。因为产品均上线多年，BMS中历史部门很多和HCM不一致，有失效多年的部门、也有名称发生变化的情况，而财务系统中的部门也无法简单地做失效处理，需要逐一部门去评估；当发生不一致时，还需要和业务侧确认需求场景，判断应该以哪一方为准。\n3.2 引入“拟失效”能力，解决人财对于失效处理的差异\n“拟失效”状态顾名思义，是一个过渡态。为了配合财务管理，人财约定，年度内，财务相关的部门，不做失效处理，打“拟失效”标签。\n新业务不允许发生在“拟失效”部门上。\n所有拟失效部门在新一年财报之后，全部做失效处理。\n3.3 明确部门“剪切”的业务意义，规范部门剪切的使用\n“剪切”，即把一个部门X从部门A，移动到部门B。\n同样是因为财务需要关注当年的发生数、甚至是历史年份的发生数。所以，人财约定，不论在年内什么时间执行部门剪切，均代表从当年1月1日开始，部门即所属于新部门；\n如果人财希望从某个特定时间点开始，部门属于新部门，比如10月1日，那么不能使用剪切，需要新建一个部门，把旧部门的人员调动到新部门，并对旧部门做失效/拟失效处理。\n3.4 建立协同SOP\n（本文略）\n四、产品方案\n产品方案并不复杂，这里简要介绍下：\n4.1 建立人财部门映射\nBMS中启用部门的扩展字段，设置为HCM对应的部门编码，通过该字段把人财的部门联系起来，避免部门重构对BMS的影响。\n4.2 人财一体业务处理\n建立部门同步任务，当识别部门发生变化，在财务中台（会计平台）展现给财管，财管确认后同步在BMS进行部门变更处理\n部门变化业务场景\n支持全部业务场景，包括：\n①新增、变更\n②失效、拟失效\n③剪切\n流程图\n4.3 财务部门个性化规则\n财务侧并未把人力的全部部门都同步到财务系统，而是规定：\n1）仅同步四级以上部门\n只同步四级部门、以及有人或有HC的三级部门\n四级部门变五级部门的处理（同失效）\n2）创建“本部”的部门\n条件：三级部门，如果不是末级部门，且其有人或有HC\n结果：在该三级部门下，创建一个“本部”部门，承载该部门费用\n五、全面推广\nBMS的组织架构，在财务相关产品中推广：\n①EMS中，预算控制\n②管报中，报告呈现\n本文由 @regon 原创发布于人人都是产品经理。未经作者许可，禁止转载\n题图来自Unsplash，基于CC0协议\n该文观点仅代表作者本人，人", "thumb": "https://static.woshipm.com/tag/1101_1@2x.png ", "images": ["https://static.woshipm.com/tag/1101_1@2x.png ", "https://image.woshipm.com/2023/04/13/d34ae8a8-d9e1-11ed-9d7a-00163e0b5ff3.jpg", "https://image.woshipm.com/2026/11/18/3cfffe2c-e344-11f1-a1a1-00163e4b86a1.png", "https://image.woshipm.com/2026/11/18/69fdc260-e344-11f1-8645-00163e4b86a1.png", "https://image.woshipm.com/2026/11/18/cab4fcae-e344-11f1-a1a1-00163e4b86a1.png", "https://static.woshipm.com/tag/1601_1@2x.png "], "tags": [], "seen": false, "new": true, "daily": true, "score": 31.771242078871527, "rank": 4}, {"guid": "177580828024f12e7431a78dcc4fe22f", "title": "AI Coding 之后，通用模型开始走进硬件研发", "link": "https://www.woshipm.com/ai/6495931.html", "source": "人人都是产品经理", "category": "pm", "summary": "AI Coding之后，通用模型开始走进硬件研发。OpenAI的GPT-6 Astra参与设计了一款能与Codex对话的设备，从外壳、电路板到固件，两名员工不到一周完成设计；Anthropic的Fable 5.2则做出三款电路无须修正的样机。 “科学家发现已有的世界，工程师创造尚不存在的世界。”——西奥多·冯·卡门 11 月初，OpenAI 公开展示了通用模型参与硬件研发的进展。在 11 月 3 日公布的项目中，GPT-6 Astra ", "ts": "2026-11-19T02:18:16+00:00", "published": "11-19", "starred": false, "importance": 2, "topic": "产品经理", "one_line": "", "why": "", "inline_text": "", "full_text": "", "thumb": "", "images": [], "tags": [], "seen": false, "new": true, "daily": false}, {"guid": "0b421bfe3286023a66a8a7b410f78c49", "title": "WorkBuddy自动操作PhotoShop软件设计电商详情页", "link": "https://www.woshipm.com/ai/6496051.html", "source": "人人都是产品经理", "category": "pm", "summary": "Agent能替人操作软件到什么程度？作者用刚上线Computer use的WorkBuddy实测：从授权录屏到兜圈子试错，最后靠脚本驱动Photoshop建图层、画元素，导出了带分层的PSD。步骤单一重复的活，交出去的路子跑通了。 今天要给大家演示的案例，很早之前老马就用Codex的Computer use能力实操过了。而最近WorkBuddy的5.11.3版本，也算是正式上线了Computer use能力，刚好就拿它来试试。 Code", "ts": "2026-11-19T02:17:13+00:00", "published": "11-19", "starred": false, "importance": 2, "topic": "产品经理", "one_line": "", "why": "", "inline_text": "", "full_text": "", "thumb": "", "images": [], "tags": [], "seen": false, "new": true, "daily": false}, {"guid": "2f0993eedfd0ae9f61dcbba378af7026", "title": "产品经理有没有最适合的MBTI？内向的人是不是真的吃亏？", "link": "https://www.woshipm.com/pmd/6496215.html", "source": "人人都是产品经理", "category": "pm", "summary": "当50岁的新势力领导在饭桌上问出“你的MBTI是啥”，MBTI已从社交暗号升级为职场通用协议。本文从产品经理视角，用JTBD框架拆解MBTI为何能解决破冰、贴标签、降低沟通成本等真实需求，并深挖其准确性争议与招聘伦理，最后探讨是否存在“最适合产品经理的MBTI”。 最近换了新工作，刚入职第一天，刚好碰到团队内部聚餐。你可能想不到，50岁的老领导问我的第一个问题居然是：你们的MBTI是啥？他不是什么HR，他是真正在一家新势力里做领导的人。", "ts": "2026-11-19T01:43:31+00:00", "published": "11-19", "starred": true, "importance": 3, "topic": "产品经理", "one_line": "", "why": "", "inline_text": "", "full_text": "当50岁的新势力领导在饭桌上问出“你的MBTI是啥”，MBTI已从社交暗号升级为职场通用协议。本文从产品经理视角，用JTBD框架拆解MBTI为何能解决破冰、贴标签、降低沟通成本等真实需求，并深挖其准确性争议与招聘伦理，最后探讨是否存在“最适合产品经理的MBTI”。\n最近换了新工作，刚入职第一天，刚好碰到团队内部聚餐。你可能想不到，50岁的老领导问我的第一个问题居然是：你们的MBTI是啥？他不是什么HR，他是真正在一家新势力里做领导的人。第一次听到他问我这个问题，其实我是目瞪口呆的。\n从那一刻起，我突然意识到，MBTI已经不是年轻人的社交暗号了，它在某种程度上已经成了中国职场的通用协议。上到开了20年会的领导，下到刚毕业的实习生，四个字母一报，就仿佛对上了暗号一般，也帮助我们在酒桌上的话匣子也就从此打开。\n但我这个产品经理的职业病又犯了，忍不住想：一个工具，为什么能被用得这么广？它到底解决了什么问题？它靠谱吗？以及最关键的甚至是，在职场上面，有没有一种最好的MBTI？\n所以我切入这个角度给大家讲讲。今天不讲什么新技术，不讲最近的什么模型，怎么去追逐AI的浪潮，今天就给大家讲讲我对于MBTI的一个见闻。\n一、来历\n先说说它是哪来的。MBTI最早是1940年代做出来的，那会儿还在打二战，做这套东西的是一对母女，妈妈叫凯瑟琳·布里格斯，女儿叫伊莎贝尔·迈尔斯。这两位其实都没受过心理学的专业训练，她们当时想解决的事情也很具体，就是很多女性第一次进工厂上班，怎么帮她们挑到一个干着舒服、效率又高的岗位。从发源这个角度看的话，它一开始就是给职场用的。\n再说它是怎么到国内的。2000年的时候，就已经有一家拿到官方授权的培训机构在华南做MBTI的认证培训了，到2020年9月，这家机构的授权范围扩大到了整个大陆。2022年有媒体转述过这家机构官网上挂的客户名单，说有800多家公司，里面有华为、阿里、万科，也有蔚来汽车和一汽大众。这个名单是机构自己说的，大家看个大概就行。\n它在年轻人里火起来是2022年的事。那年4月1日，“谷爱凌的MBTI是INTJ”上了微博热搜，后来有分析文章把这一天当成它走红的起点。也就是说，它在企业培训里出现，比在年轻人里火起来早了二十多年。\n企业家里也有人公开聊过。2023年8月，雷军在年度演讲之前发了一个预告，说自己的MBTI是ENFJ，还说“其实我有点社恐”，每次上台都要练习很久。那年他五十多岁。\n我自己测出来是ENTJ，前前后后测过四五次，每次都是ENTJ。紫色大姐头万岁，哈哈哈！\n二、饭桌\n说回那顿饭。我们这个团队是刚刚组建起来的，有从手机厂来的，有从互联网大厂来的，更多的是从别的新势力车企过来的，大家互相都还陌生。这顿饭本身也是为了让之后业务上要对接的人先熟悉一下。\n因为我是新来的，大家会比较好奇，所以这个问题自然而然先问到了我。接着桌上的人就轮流报各自的MBTI，报完一圈之后大家才开始聊谁是E人、谁是I人。\n领导聊着聊着是往深里走的，他主动去分析，交流过程中能听出来他对这套理论是做过一些了解的，也知道它在职场上是怎么用的。有趣的是领导说他自己其实是个I人。同时他也有一个看法，就是E人是不是会更适合职场，或者说更适合做产品经理。接着大家就顺着这个话题一直聊了下去。\n回来之后我就一直在想开头的那个问题，MBTI到底帮大家解决了什么。产品圈有一个框架叫JTBD（Jobs to be Done），意思是用户是为了办成某件事，才去“雇”一个产品的。这里便可以拿它来看一下MBTI，问题就变成了，在那张饭桌上大家雇它来办什么事。\n一桌人互相都不熟，报一下字母马上就有话说了。领导那边，十几个人的脾气本来要靠半年的会和饭局才摸得清，问一圈能先有个粗略的印象，而且这是年轻人熟的话题，好开口。内向一点的同事也用得上，不太想去团建的时候，“我是I人”是一个现成的说法，不用再说自己忙。还有就是聊到别人脾气的时候，说“你J人”要比说“你太固执”好开口得多。\n至于它为什么比别的性格测试传得开，北师大心理学教授王芳有过一个分析。她说人脑本来就习惯用分类来简化复杂的世界，分了类就能很快认识一个人，而学术界更认可的大五人格虽然更科学，但是不好懂。\n组织心理学家Adam Grant还提过一点。他2013年写过一篇批评MBTI的文章，里面说大五人格有一条叫“情绪稳定性”，MBTI的四条轴里没有，他把这个算作它的缺陷。可少了这一条，再加上16种类型的名字都起得挺好听，建筑师、指挥官、调停者，测出来的结果就没有一个是让人难堪的，在饭桌上报出来不会冷场。\nAdam Grant那篇文章里还引了两个数，说每年有250多万人做这个测试，财富100强里有89家公司在用。另外舆情分析机构清博在分析它走红的时候提到过一个细节，结果页上会告诉你，你这个类型在人群里只占百分之几。\n国外的公司用得更早。桥水基金从2008年开始给管理层做MBTI，创始人达利欧一开始是不信的，后来和别的测评搭着一起用，主要用在招聘上。招聘这块埋下伏笔，后面会提及。\n三、准不准\n先说我自己，前面讲了，我测过四五次，每次都是ENTJ，一个字母都没变过。\n再看官网自己是怎么说的。MBTI的出版方在官网上有一个常见问题页，里面有三句话：\n第一句是关于重测的：“About 50 percent of people get the same four-letter or whole type on retest.”意思是再测一次，四个字母全都不变的人大约只有一半。同一页上也写了，九成的人至少有三个字母是不变的，单看每一条轴的分数，15周以内重测的相关系数在0.80以上。\n批评它的人给的数其实和官网差不多。有一位叫Pittenger的学者在1993年写过一篇综述，说隔5周再测，最多有50%的人会被分到另一个类型里去。他的解释是每条轴上大部分人的分数都靠近中间，分数稍微动一点，字母就换了。打个比方，一条轴上一个人49分，一个人51分，两个人其实差不多，拿到的却是两个不同的字母。\n第二句是：“Preferences do not indicate skill or ability.”偏好不代表技能或者能力。它测的是你更愿意怎么做事，做得好不好它测不出来。\n第三句是关于招聘的，官网写得很直接，说这个测评不用于挑选求职者，也不用于把人分到某个团队、岗位或者职能里去。如果要求求职者做这个测试，再拿结果把人筛掉，官网用的词是unethical，不道德。官网还说这套东西是为个人发展设计的，也没有什么有意义的研究评估过它能不能预测工作表现。前面说的桥水拿它做招聘，和官网的这个态度其实是对不上的。\n那什么东西能预测工作表现呢，这方面有两篇论文可以看。性格这一类里最稳的是大五人格里的“尽责性”，1991年有一篇元分析（就是把很多研究合起来再算一遍），发现它是唯一一个在所有职业、所有绩效指标上都成立的特质，不过修正之后的相关系数也就0.22左右，并不高。选人的办法里，2022年的一篇研究排下来，效度最高的是结构化面试，大约0.42。\n最后讲一个老实验。1949年有位心理学家叫福勒，他从报摊上卖的星座书里抄了一段性格描述，发给39个学生，告诉每个人这是专门为你写的，请大家给准确度打分，满分5分", "thumb": "https://static.woshipm.com/tag/1101_1@2x.png ", "images": ["https://static.woshipm.com/tag/ re": 30.302266381006945}, {"guid": "bc5af31336e3c5bee62c3c49da6e6de6", "title": "潜伏小红书48h：AI时代，顶尖技术人才都在聊什么？", "link": "https://www.qbitai.com/2026/11/510737.html", "source": "量子位", "category": "ai_product", "summary": "小红书校招沙龙，一群技术高手认真对待年轻人的野心", "ts": "2026-11-18T02:49:23+00:00", "published": "11-18", "starred": true, "importance": 4, "topic": "AI 产品", "one_line": "", "why": "了解 AI 时代顶尖技术人才的讨论，有助于提升对 AI 行业的认识。", "inline_text": "", "full_text": "< img id=\"wx_img\" src=\"https://www.qbitai.com/wp-content/uploads/imgs/qbitai-logo-1.png\" width=\"400\" height=\"400\">\n潜伏小红书48h：AI时代，顶尖技术人才都在聊什么？\n田, 晏林\n2026-11-18\n10:49:23\n来源：\n量子位\n田晏林 发自 凹非寺\n量子位 | 公众号 QbitAI\n「校招生如果有自己的想法，能申请人力和算力资源吗？」\n「AI越来越能写代码，我们进去以后主要做什么？」\n「新人提的想法，Leader真的会听吗？」\n「AI时代下，该如何发展自己？」\n好家伙，现在的应届生，提问务实，又直击核心！\n11月14日、15日，量子位在小红书北京办公室深潜了两个下午，感受了一场画风不太一样的技术校招。\n这次，「薯厂」把校招宣讲会直接搬进办公区，办成了\nREDpath校招技术沙龙。\n没有太多台上的枯燥介绍，这场沙龙把更多时间留给台下的\nAMA（Ask Me Anything）\n环节。\n校招生们和未来可能共事的技术Leader坐下来，从技术方向、团队氛围，一直聊到绩效、个人发展。\n为了这场线下交流，有学生专程从上海、南京、香港等地赶来，还有正在新加坡读书的应届生，连夜飞到了北京。\n量子位粗略算下，那两天里，有接近200名应聘者到场交流。\n学生们的问题一个比一个实在，技术Leader们也不藏着掖着。一位从新加坡赶来的应聘者告诉量子位：\n相比线上面试，这种面对面的交流，能提前感受到未来团队真实的工作氛围。挺棒的！\n活动现场，不光是学生在提问。\n听到某位应届生在小红书开店盈利过万后，技术Leader眼睛都亮了，急问对方小红书的商家工作台「千帆」好不好用，还有哪些功能需要改进。\n好么，原本是学生来了解未来团队的，聊着聊着，竟成用户访谈了。\n有了AI，技术新人的第一份工作长什么样？\n两天的交流中，我发现，无论是工程专场还是算法专场，\nAI都是应聘者们绕不开的话题。\n在交易与基础数仓组的交流中，一位学生说出了自己的焦虑。\n他在某大厂实习时，参与过AI提效相关的工作，可做着做着，却开始担忧，\n自己是不是正在亲手淘汰未来的自己？\n在社区推荐算法组，讨论则更加具体。\n学生们关心，\nAI能在推荐算法里发挥什么作用？大模型能不能结合用户过去的行为，帮他发现一个自己都没意识到的新兴趣？\n甚至在此前的一场校招交流中，还有学生问过小红书自研大模型Dots团队多模态算法负责人柯雄：\n市面上的大模型已经这么多了，小红书为什么还要自己做一个？\n柯雄当时的回答是：做一个理解生活、还能帮用户解决复杂问题的大模型不易，背后可能涉及导游、设计师、采购等好几个角色的工作。\n这也是小红书坚持自研模型的原因之一。\n平台有海量图文笔记、视频，以及评论区语音等多模态内容，用户经常会用一大段自然语言描述自己的生活问题。\n这些独特的内容和用户需求，对模型的理解、生成能力提出了更高要求。\n但要把这样一个大模型真正做出来，算力、数据、基础设施，以及上层的搜索、推荐等业务系统，都得跟上。\n今年，\n小红书首次面向校招生开放了PE（Product Engineer，产品工程师）\n专项。\n过去，前端、客户端、后端各有分工。但现在，借助AI，工程师有机会走出自己熟悉的技术模块，从理解产品需求、设计方案，到开发交付，都参与进来。\n量子位在现场还了解到，去年，交易与基础数仓组有一个岗位叫「数据开发」，\n今年招聘时已经变成了「AI应用与开发」\n。\n而且，为了让员工使用AI、善用AI，\n小红书每月都发Token，用完申请增加，额度管够。\n就连非技术岗位的笔试，小红书也会重点考察AI应用能力。\n听说今年校招，\n部分非技术岗需要完成AI Demo的笔试\n，才有机会拿offer。（好好好，Vibe Coding都卷起来吧！）\n这种强力拥抱AI的态度，也让工程师有了更多施展拳脚的空间。\n腾出来的精力干什么？\n工程师们开始主动构建Agent、开发平台工具，帮业务解决实际生产中的问题。\n大家借助AI，正在成为更强的个体，交付给业务一个个系统的解决方案。\n目前，小红书好几个技术团队都在试着让Agent参与日常工作。\n比如\n推荐算法团队，基于Agent的交互式推荐已经上线\n，用户可以根据自己的偏好调节推荐系统。\n看到感兴趣的内容时，用户在评论区直接写：多推类似内容。Agent就可以识别出，让推荐系统更懂用户。\n交易与基础数仓团队，也搭建了Data Agent。\n每个人根据负责的业务方向，开发不同的Skills、建设知识库，再比较各自Agent的准确率，把好用的能力逐渐整合起来。\n这么一看，之前担心会「亲手淘汰未来的自己」的同学，大可以放心了。\n当然，\nAI越来越能干，工程师们却不能「拿着锤子找钉子」。\n推荐算法视频方向负责人姬昊就不主张什么问题都上大模型。\n「同样解决一个推荐问题，有人用大模型，投入大量算力，最后拿到的业务收益，却可能和别人使用简单策略差不多。那这大模型用得值不值？」\n在他看来，发现问题很重要，判断应该采用什么技术解决，同样重要。\n这也是他现在面试年轻算法工程师时格外在意的一点。\n姬昊觉得，刚从学校出来的学生，有一个优势：还没有被工业界现有的工作框架束缚，容易提出一些不一样的想法。\n这种「灵性」不应该被AI影响。\n只是，年轻人有想法是一回事。进了小红书，这些想法真能轮到自己做主吗？\n在小红书，新人第一年就有了“作品”\n这也是很多技术人才挑选公司的重要考量。\n沙龙现场，一位计算机方向的博士告诉量子位，相比单纯比较薪资，他更关心未来两年能获得怎样确定性的成长。\n小红书也准备了一套\n分层培养体系\n，从校招新人到团队Leader，每个阶段都有对应的培养项目。\n但对手握3个以上offer的应聘者来说，培养项目是一方面，更重要的，是自己的业务能力能得到怎样的锻炼。\n交流会现场，小红书多媒体技术部算法工程师夏奇，给出了她的回答。\n清华大学毕业的夏奇，入职小红书不久，就遇到一场硬仗——2026年世界杯。\n对小红书来说，世界杯这样的大型赛事直播，是一块全新的战场。\n夏奇所在的Media Lab，平时就和视频清晰度、流畅度较劲，让用户在弱网环境下也能看得清、刷得顺。\n到了世界杯，难度直接升级。\n夏奇负责画质增强算法统筹和档位设计。足球转播有大量远景镜头，球员在画面里可能只占几个像素。直接套用已有算法，球员的头部、四肢等细节反倒被抹掉了。\n为了找出问题，她和团队把画面放到大电视上逐帧排查，再用大量足球比赛画面重新训练模型，球员的细节才保住了。\n夏奇坦言，能参与这样一场大型赛事的技术攻坚，对自己挑战非常大，也是一段难忘的经历。\n不过，世界杯四年才有一次。其他年轻工程师，还有这样的机会吗？\n和夏奇同部门的皓麟，是2024届校招生，毕业于北京大学计算机应用技术专业。\n入职不到一年，皓麟就牵头做了小红书3D空间照片的技术探索，从最初的技术验证，一直参与到产品上线。\n此前，3D空间照片主要留在用户手机相册中。想让这种具有空间信息的照片在社交平台上流转，需要解决不少麻烦。\n比如3D照片的数据量远大于普通图片，不同型号的手机之间，空间照片格式和能力也未必兼容。\n对于一位刚毕业不久的", "thumb": "http://www.qbitai.com/wp-content/themes/liangziwei/imagesnew/head.jpg", "images": ["http://www.qbitai.com/wp-content/themes/liangziwei/imagesnew/head.jpg", "https://i.qbitai.com/wp-content/uploads/2026/11/a4735ca8b560b3624fb98522d8e667ec.jpeg", "https://i.qbitai.com/wp-content/uploads/2026/11/7b7ee1d6cdc7de428e14ea0c88ab710c.jpeg", "https://i.qbitai.com/wp-content/uploads/2026/11/f235e12de5b8231381b46e8284fe3d3e.jpeg", "https:// inline_text": "", "full_text": "", "thumb": "", "images": [], "tags": ["AI 产品"], "seen": false, "new": false, "daily": false, "score": 40.2892281859375}, {"guid": "6012be41b795cbca9711a8bbf21b9bc7", "title": "用 AI 工具实现个性化学习", "link": "https://forum.trae.cn/t/topic/604479", "source": "TRAE 官方社区", "category": "contest", "summary": "用控制能力去拆解解读知识点，然后匹配试卷 1 个帖子 - 1 位参与者 阅读完整话题", "ts": "2026-11-18T02:38:31+00:00", "published": "11-18", "starred": false, "importance": 2, "topic": "比赛与获奖", "one_line": "", "why": "", "inline_text": "", "full_text": "", "thumb": "", "images": [], "tags": [], "seen": false, "new": false, "daily": false}, {"guid": "17973bca6bcfe69f11bc31037ff48807", "title": "Hy4 Flash 实测：速度、成本和准确率，Flash Agent 如何取舍", "link": "https://www.woshipm.com/ai/6495656.html", "source": "人人都是产品经理", "category": "pm", "summary": "一次 Agent 任务平均消耗 417 万 Token、调用费近两美元，速度和价格成了产品上线前提。腾讯 Hy4 Flash 定位更快更便宜的日常 Agent 模型，用混合注意力与 Engram 架构把激活参数压到 12B。实测从速度、成本与准确率三方面看它的取舍。 Agent 真正普及后，模型竞争的指标变了。以前大家关心新模型超过了谁、能不能完成过去做不到的任务；现在更现实的问题是：一次工作需要调用几十轮模型，团队到底能不能等得起、付", "ts": "2026-11-18T02:38:22+00:00", "published": "11-18", "starred": false, "importance": 2, "topic": "产品经理", "one_line": "", "why": "", "inline_text": "", "full_text": "", "thumb": "", "images": [], "tags": [], "seen": false, "new": false, "daily": false}, {"guid": "e0d79c9c6c6bd77238c13c145248cadf", "title": "兼顾随身阅读与自主开发的 4.7 英寸墨水屏设备：小纸 Pico 现货上架少数派", "link": "https://sspai.com/post/118975", "source": "少数派", "category": "vibe", "summary": "想找一台可以随身带着读书的墨水屏设备，也想自己改改界面、不被系统「绑架」？近期思维重置团队上架的小纸 Pico 墨水屏开发板是一个值得留意的选择。 查看全文", "ts": "2026-11-18T02:30:00+00:00", "published": "11-18", "starred": false, "importance": 3, "topic": "AI 编程", "one_line": "小纸 Pico 墨水屏开发板可供随身阅读和自主开发，适合产品经理和 AI 产品爱好者使用。", "why": "", "inline_text": "", "full_text": "想找一台可以随身带着读书的墨水屏设备，也想自己改改界面、不被系统「绑架」？近期思维重置团队上架的小纸 Pico 墨水屏开发板是一个值得留意的选择。\n小纸 Pico 墨水屏开发板搭载 4.7 英寸、约 297 PPI 墨水屏，支持两点触控、触摸按键及 microSD 存储扩展。它将较高的显示精度与便于携带的尺寸结合起来，同时保留了软件层面的开发空间。通过安装兼容固件，你可以将它用于电子书阅读、文档浏览，也可以基于公开的代码与开发文档，自己动手或交给 AI agent 设计只属于你的界面和应用。\n无论你是希望尝试不同阅读系统的读者还是想进一步研究墨水屏应用的玩家，小纸 Pico 都能为你提供一套相对集中的硬件基础。\n目前，少数派提前预定的第二批小纸 Pico 已有少量现货上架，提供单机版与官方PP超薄清透壳供选购，可\n直接购买\n。\n4.7 英寸与 297 PPI，兼顾便携与显示精度\n对于随身阅读设备，屏幕尺寸决定了携带方式，也影响着阅读时的信息容量。小纸 Pico 墨水屏开发板采用的 4.7 英寸屏幕与 297 PPI 的像素密度，在这一尺寸下为文字显示提供了精度基础。\n在字体、字号与渲染方式适当的情况下，较高的像素密度有助于呈现汉字笔画、标点及图标边缘的细节。对于可重新排版的 EPUB、TXT 等内容，你也可以根据阅读习惯，在字号、行距和单页字数之间进行调整。\n这块屏幕同时支持原生 16 灰度，可用于文字、书籍封面、灰度图像与界面元素的显示。对于开发者，这意味着界面可以通过不同灰阶区分信息层级，为图标、分隔线和状态提示提供更多设计选择。\n查看官方硬件规格\n左：小纸 Pico；右：阅星曈 X4\n经过打磨的外观，与依靠环境光呈现的纸感\n小纸 Pico 在开发板的功能基础上，也对日常持握与外观呈现进行了打磨。机身的金属质感与墨水屏的灰白色调相互呼应，具体的表面处理、边缘轮廓和按键布局，请参考下方实拍：\n屏幕采用 AGC 玻璃，具备蚀刻抗反射表面与抗指纹涂层。设备没有背光，显示内容依靠环境照明观看，使用方式与纸质读物接近：日间可以借助自然光，夜间则需要台灯等外部光源。这种观看方式是小纸 Pico 纸感体验的一部分，如果你的主要使用场景在关灯后，还请提前考虑这一差异。\n阳光下小纸 Pico 阅读效果\n十余种社区固件，不同的阅读侧重\n目前，官方文档已收录十余种适配\n小纸 Pico 的社区固件\n，官方自己的固件也在开发和分阶段测试中。以下是社区中两款固件的体验分享：适合管理本地书库、调整阅读界面的 kiikoread，以及支持接入微信读书、提供更多扩展功能的 CrossMux。\nkiikoread：围绕本地阅读与界面定制\nkiikoread\n支持 EPUB、TXT 本地阅读，可导入字体，并调整字号、行距、页边距及首行缩进。书架和锁屏提供多种样式，你可以同时调整正文排版与设备界面的呈现方式。\n文件传输支持 Wi-Fi、设备热点和 USB，书籍与字体保存在 microSD 卡中。对于以本地书库为主、希望细化阅读设置的用户，kiikoread 是一个可以优先了解的项目。\n图源 kiikoread 官网介绍\nCrossMux：支持微信读书，兼顾本地阅读与轻量应用\nCrossMux\n基于 CrossPoint Reader 开发，侧重中文阅读支持。除 EPUB、TXT 等本地内容外，还提供自定义字体、章节导航、书签及 KOReader 阅读进度同步等功能。\n对于已有微信读书书库的用户，CrossMux 提供了另一种阅读方式：通过其内置的第三方客户端扫码登录，浏览个人书架，将书籍缓存为 EPUB 后离线阅读，并手动同步阅读位置。\n阅读之外，CrossMux 还集成了数独、五子棋、计算器以外的轻量游戏与工具，以及阅读统计、待机表盘等扩展功能，为同一块墨水屏增加了更多使用方式。\n从随身阅读，到自己的墨水屏应用\n综合屏幕尺寸、显示精度与软件选择，小纸 Pico 比较适合两类使用需求：\n一类是以文字内容为主的随身阅读。4.7 英寸便于携带，约 297 PPI 为文字细节提供显示基础。机身的金属质感，以及依靠环境光观看的墨水屏，也构成了它区别于手机阅读的使用感受。\n另一类是小型墨水屏应用的开发。684 × 1216 的分辨率，可以用于安排正文、状态栏和操作区域；16 灰度为信息层级与图像显示提供支持。日程、便签、信息卡片等以静态内容或低频更新为主的界面，都可以作为开发方向。\n硬件提供两点触控、三个触摸按键与加速度传感器，具体交互逻辑你也可以根据实际需求在定制固件中实现。感兴趣的朋友不妨参考官方公开的\nDemo 代码\n和\n开发文档\n。\n售后说明：订单支持 7 天无理由退货，让您有时间安心体验小纸。产品正反面均为玻璃材质，体验时请留意保护，避免划伤或磕碰。为方便我们了解您收到产品时的情况、更顺利地协助处理售后，请录制并保留完整开箱视频，申请售后时需提供。", "thumb": "https://cdnfile.sspai.com/2026/11/13/fc3802e83e56e68def1c95fd0137748b.png?imageMogr2/auto-orient/thumbnai 061195885756467", "source": "掘金", "category": "tech", "summary": "从 Tokio、Serde 到 GPUI、Ratatui、Polars、Tantivy 和 Wasmtime，Rust 生态仍在为不同的工程问题提供工具。", "ts": "2026-11-18T01:57:45+00:00", "published": "11-18", "starred": false, "importance": 3, "topic": "AI 编程", "one_line": "Rust 生态中7个实用的库推荐", "why": "", "inline_text": "", "full_text": "", "thumb": "", "images": [], "tags": ["AI 编程"], "seen": false, "new": false, "daily": false, "score": 30.246259432100693}, {"guid": "b52714474c5d10ecdd0baa00c03b8fb6", "title": "token消耗", "link": "https://forum.trae.cn/t/topic/604464", "source": "TRAE 官方社区", "category": "contest", "summary": "现在个人用量不显示token消耗了吗？ 5 个帖子 - 3 位参与者 阅读完整话题", "ts": "2026-11-18T01:57:36+00:00", "published": "11-18", "starred": false, "importance": 3, "topic": "竞赛", "one_line": "", "why": "", "inline_text": "", "full_text": "", "thumb": "", "images": [], "tags": ["竞赛"], "seen": false, "new": false, "daily": false, "score": 33.246103181909724}, {"guid": "b1ebb410c6645da5af3bb0daaaf680d2", "title": "AI产品经理必修课：如何构建一套科学、统一、可落地的标注规则？", "link": "https://www.woshipm.com/ai/6495490.html", "source": "人人都是产品经理", "category": "pm", "summary": "AI产品的质量评价远比传统软件复杂，模型输出的不确定性让统一标准成为刚需。本文从AI产品经理视角出发，系统拆解标注规则的基本认知、分类体系、四大通用评价维度及业务落地流程，帮你从零制定一套可执行、可验证的标注规则，让模型优化有据可依。 如果说传统软件产品的质量问题，大多可以通过代码测试、功能验证和自动化用例发现，那么AI产品的质量问题，就远没有这么简单。 你让一个传统软件计算1+1，它只要按照程序逻辑执行，就应该返回2。但你让一个大语言", "ts": "2026-11-18T01:54:57+00:00", "published": "11-18", "starred": true, "importance": 4, "topic": "AI 产品", "one_line": "AI产品经理必修课：如何构建标注规则", "why": "学习构建标注规则的方法，提升 AI 产品质量", "inline_text": "", "full_text": "AI产品的质量评价远比传统软件复杂，模型输出的不确定性让统一标准成为刚需。本文从AI产品经理视角出发，系统拆解标注规则的基本认知、分类体系、四大通用评价维度及业务落地流程，帮你从零制定一套可执行、可验证的标注规则，让模型优化有据可依。\n如果说传统软件产品的质量问题，大多可以通过代码测试、功能验证和自动化用例发现，那么AI产品的质量问题，就远没有这么简单。\n你让一个传统软件计算1+1，它只要按照程序逻辑执行，就应该返回2。但你让一个大语言模型回答「如何制定企业的员工绩效考核制度」，它可能给你一份逻辑严谨、结构完整的方案，也可能给你一份看似专业、实则漏洞百出的内容。\n更麻烦的是，这两份回答可能都很流畅，甚至都能让普通用户觉得有道理。\n这就是AI产品与传统软件产品之间一个非常重要的区别：\n传统软件主要验证程序是否按照预设逻辑运行，而AI产品还需要判断模型生成的内容是否真正满足用户需求。\n一个AI回答是否合格，不能只看它有没有输出内容，还要看它是否理解了用户的意图、是否遵循了指令、是否存在事实错误、是否触碰安全底线，以及表达方式是否符合使用场景。\n那么问题来了：\n什么样的回答才算真正优秀？\n用户提出同一个问题，不同的AI回答应该如何评价？\n如果两名标注人员对同一个回答给出了不同判断，究竟应该相信谁？\n如何让几百名甚至上千名标注人员按照同一套标准开展工作？\n如何将人工评价结果转化为模型真正需要改进的问题？\n这些问题的背后，都指向一个基础但非常重要的工作：\n标注规则的制定。\n标注规则就像一把尺子。没有统一的尺子，A标注人员认为回答准确，B标注人员可能认为回答错误；A认为内容丰富，B可能认为废话太多。最终得到的标注数据看似数量庞大，实际上却无法准确反映模型的真实水平。\n对于AI产品经理而言，标注规则绝不是简单地写几条注意事项，更不是给标注人员发一份操作说明就算完成。它需要将业务目标、评价标准、判断条件和实际案例结合起来，让原本抽象的质量要求变成可以被理解、执行和验证的具体标准。\n本文将从AI产品经理的实际工作出发，系统拆解标注规则的基本认知、分类体系、四大通用评价维度、专项规则制定方法、业务落地流程，以及如何利用标注结果推动AI产品持续优化。\n希望通过这篇文章，让你不仅知道标注规则是什么，更知道自己应该如何从零开始制定一套真正可用的标注规则。\n一、认识标注规则——AI产品为什么需要标注规则？\n1.1 AI产品的发展为什么离不开人工标注？\n在传统互联网产品中，产品经理通常通过需求文档、原型设计、功能测试和用户反馈来判断产品是否满足预期。\n例如，一个电商App的下单功能，只需要验证商品是否加入购物车、订单是否正确生成、支付是否成功等明确结果。这些功能通常具有相对清晰的输入、处理逻辑和输出结果。\n但AI产品不同。以大语言模型为例，同样输入「帮我写一封请假邮件」，模型可能生成简洁正式的邮件，也可能生成过于随意的内容，甚至遗漏请假时间、请假原因等重要信息。\n这些回答未必存在程序错误，却可能存在任务完成度、内容质量和语言表达方面的问题。因此，AI产品需要一套不同于传统软件测试的评价方式。\n1.1.1 大模型输出具有不确定性\n大语言模型根据输入内容和模型内部机制生成回答。即使输入相同，也可能因为采样设置、上下文变化或模型版本不同而产生不同输出。\n这种不确定性意味着，不能只通过判断程序有没有报错来评价模型。\n例如：\n用户提问：「请帮我总结这份会议纪要，提取三个核心决策和对应负责人。」\n模型回答A：\n决策一：确定产品上线时间，负责人：产品经理。\n决策二：完成接口联调，负责人：研发负责人。\n决策三：完成测试验收，负责人：测试负责人。\n模型回答B：\n「本次会议主要讨论了产品上线、研发进度和测试安排，整体项目正在有序推进。」\n两份回答都能正常生成，但显然存在质量差异。\nA按照用户要求提取了三个决策和负责人，B只是进行了笼统概括。\n如果没有统一的评价标准，标注人员可能只凭自己的阅读感受进行判断，导致评价结果缺乏一致性。\n1.1.2 模型能力不等于产品体验\n一个模型在公开测试集上表现优秀，并不意味着它在具体业务场景中一定好用。\n例如，一个通用大模型能够回答大量知识问题，但接入某家银行的智能客服后，可能出现以下问题：\n对银行自身的业务政策不了解。\n对产品收费标准回答错误。\n没有按照客服要求提供必要的风险提示。\n用户询问退款流程时，回答了其他业务的办理方式。\n模型本身具备较强的语言能力，但在具体产品中仍然可能出现问题。\n这就要求AI产品团队建立针对实际业务的评价标准，而不是简单依赖模型参数规模、公开榜单或者主观体验判断产品质量。\n1.1.3 人工评价是理解模型真实表现的重要手段\n2022年，OpenAI研究团队在《Training language models to follow instructions with human feedback》论文中介绍了InstructGPT的训练过程。\n研究人员先收集标注人员编写的示范回答，再让标注人员对模型生成的不同回答进行排序，并利用这些人类反馈进一步优化模型。\n研究发现，在其研究使用的人类评价任务中，经过人类反馈训练的1.3B参数InstructGPT模型，获得的偏好程度高于175B参数的GPT-3模型。\n这说明，模型能力的提升不只是增加参数和训练数据，还与人类如何定义、评价和反馈模型行为有关。\n换句话说，人类评价并不是AI产品研发中的辅助工作，而是理解模型表现、发现问题和优化模型的重要依据。\n1.2 什么是标注规则？\n简单来说：\n标注规则，就是针对特定标注任务，明确规定标注对象、评价维度、判断标准、标签定义及特殊情况处理方式的一套统一规范。\n它的核心作用是告诉标注人员：\n应该看什么？\n应该从哪些维度进行判断？\n什么情况属于符合要求？\n什么情况属于不符合要求？\n遇到特殊情况应该如何处理？\n例如，我们需要评价一条AI生成的回答是否存在知识错误。如果只写一句「判断回答是否正确」，这并不是一条足够完善的标注规则。\n因为不同标注人员可能会产生不同理解：\n有人只判断答案的核心结论。\n有人会检查所有细节。\n有人认为没有引用来源就不够准确。\n有人只要答案看起来合理就判定正确。\n因此，一条真正可执行的规则，需要进一步说明判断对象、事实依据、错误类型和判断边界。\n例如：\n规则名称：知识准确性\n规则定义：评价AI回答中的事实、数据、概念和专业知识是否准确，是否存在与可靠事实相矛盾的内容。\n判断标准：\n符合：核心事实准确，关键结论与可靠依据一致。\n不符合：存在明确的事实错误、概念混淆、数据错误或错误推断。\n无法判断：缺乏足够的事实依据，且无法通过现有资料核实。\n这样，标注人员才知道具体应该如何操作。\n1.3 标注规则、标注任务与标注标签有什么区别？\n这三个概念在实际项目中经常被混用，但它们承担的作用并不相同。\n举个例子，某AI产品团队需要评价智能客服的回答质量。\n1. 标注任务：评价客服回答是否准确解决用户问题。\n2. 标注规则：检查答案是否符合企业知识库中的业务政策，是否遗漏必要的办理条件。\n3. 标注标签：符合、不符合、无法判断。\n三者之间存在明确的先后关系。先确定任务，再制定规则，最后根据规则设计标签", "thumb": "https://image.woshipm.com/2026/11/17/d4f9c64a-e281-11f1-b9b0-00163e4b86a1.jpg", "images": ["https://image.woshipm.com/2026/11/17/d4f9c64a-e281-11f1-b9b0-00163e4b86a1.jpg", "https://cdnfile.sspai.com/2026/11/14/db317585f77763e8a0911568afd8f331.png?imageView2/2/w/1120/q/90/interlace/1/ignore-error/1/format/webp", "https://image.woshipm.com/2026/11/17/f44f1de6-e282-11f1-8179-00163e4b86a1.jpg", "https://image.woshipm.com/2026/11/17/3decb8e2-e282-11f1-8645-00163e4b86a1.jpg", "https://image.woshipm.com/2026/11/17/880fb9d8-e282-11f1-8645-00163e4b86a1.jpg", "https://image.woshipm.com/2026/11/17/e8483168-e282-11f1-b9b0-00163e4b86a1.jpg"], "tags": ["AI 产品"], "seen": false, "new": false, "daily": false, "score": 42.24334276510417}, {"guid": "aea1d3ee02b94fee6439ac1b31d13e2d", "title": "彻底不让普通人用了吗？", "link": "https://forum.trae.cn/t/topic/604463", "source": "TRAE 官方社区", "category": "contest", "summary": "今天早上我重新登录Trae，却提示让我用飞书或豆包登录，非让我绑定飞书，我绑定我个人的飞书后提示该“企业”没购买不让用！！！！！这是非逼着我告别Trae啊！！！ 1 个帖子 - 1 位参与者 阅读完整话题", "ts": "2026-11-18T01:54:00+00:00", "published": "11-18", "starred": false, "importance": 3, "topic": "竞赛", "one_line": "讨论 Trae 登录问题", "why": "", "inline_text": "", "full_text": "", "thumb": "", "images": [], "tags": ["竞赛"], "seen": false, "new": false, "daily": false, "score": 33.242353181458334}, {"guid": EO 陈安妮的“YES and Hope”机制，拆解如何用建设性反馈替代零成本说 No，并结合 DeepSeek Harness 插件生态的真实实践，揭示 AI 产品从非共识中跑通的方法论。\n最近这一个月，我们一直在用 DeepSeek Harness 的插件生态，接真实 SaaS 客户的个性化需求：假期余额、每日出勤、工资追算器——三款插件已经上线，跑在客户的真实数据上；智能排班、大批量导出，还在排队。这些活放以前，一条需求要协调 3-5 个产研、排期 2-3 周，现在一个人几天就能交付。不是 Demo，是真正在给客户用的产品。\n插件越做越多，我听到了两种声音。\n第一种，来自一位同样做产品的朋友：\n“你这个插件只是解决现有客户的需求，没什么意思。”\n我猜他心里想的是：更有意思的方向，是用 AI 给自己搭一个产品经理工作台。\n第二种，来自需要协作的研发同学。插件要用数据接口，他的回复是：\n“你这个插件不合理。数据接口一旦开放出去，就会被客户随意用 AI 调用，我们的服务器就崩了。”\n你有没有发现，这两句话有个共同点——\n里面没有一个字是解决方案\n。\n第一句告诉你”这没意思”，但不告诉你怎么才有意思。第二句告诉你”会崩”，但不告诉你怎么才能不崩。\n而且说这两句话，不需要付出任何东西。不需要想替代方案，不需要为被毙掉的创意负责，甚至还能收获一点”我很专业”的满足感。\n评价别人的方案，是世界上最廉价的事。\n说 No 的成本，是零。\n一个不许说 No 的机制\n最近听了一期播客，「十字路口」采访快看漫画 CEO 陈安妮。她创业 12 年，现在带着团队从零做一款 AI 原生产品 Livo，转型过程中，内部推行的核心机制就叫——\nYES and Hope\n。\n规则很简单：对任何一个方案，你只能说两类话。\nYES，是这个方案好的地方。Hope，是你希望它往哪个方向调整。不许说 No。\n采访者当场就追问了：如果真的不喜欢某个方案，又不能说 No，怎么办？\n陈安妮的回答只有三个字：\n“忘掉它。”\n这三个字，比机制本身还狠。\n你想想，说 No 的成本是零，说 Hope 的成本是什么？是\n你得替这个方案想一条出路\n。一个 No 是消费，一个 Hope 是生产。当会议室里所有人都只能生产的时候，讨论的质量就完全变了。\n采访者不死心，继续追问：那我能不能说”YES，但我 Hope 这个方案不要做”——用 Hope 夹带一个变相的 No？\n她防住了这一手：\n“只要说你想要什么就好了，没必要说你不想要什么。”\n在她的机制里，所有方案放在一起，YES 和 Hope 得票最多的继续推进，排序靠后的自然淘汰。你想让更好的方案胜出，直接把票投给它、把 Hope 给它，就够了。\n注意这里最微妙的一点：\n淘汰的是方案，不是提方案的人。\n传统公司里恰恰相反，”这想法不行”听着听着，就变成了”这人不行”。谁被否过两回，谁就不敢再提想法了。\n当然，这套机制有它的边界。合规、安全、资损这类红线问题，必须允许直接说 No。但这里也有个细节值得记住：\n说 No 可以，但最好顺手给出”怎样才行”的路径\n。否则你说的就不是风险，只是拒绝。\n两种声音，如果换上这套机制\n先看陈安妮自己讲的案例。设计团队给 Livo 出了 10 个图标方案，产品同学整体不满意，怕打击团队积极性，憋着没说。她把机制搬出来，让大家用 YES 和 HOPE 来评。\n产品同学说：这个方案的色彩我很喜欢——这是 YES；但我 HOPE 它更能体现 Livo”灵魂”层面的产品内核——这是 Hope。\n结果设计师被激励到了，第二天直接干了接近 100 个方案出来。\n陈安妮的原话是：\n“因为他觉得自己设计的巧思被肯定、被看见了。”\n你看，不满意的话，憋着和说出来，中间差的从来不是勇气，\n是一个安全的表达格式\n。\n再回到开头我听到的那两种声音。如果套上这套机制，它们会变成什么？\n我后来想，他这句话背后，其实站着一个更深的判断：导出、考勤、提成、排班，都是老需求；用插件去接它们，还是在原先的模式里打转。他心里真正兴奋的，是用 AI 搭一个前所未有的东西，那才叫创造。\n这个判断我特别能理解。偏钻研方向的产品经理，职业兴奋点就在这里：他们钟爱有创造性、有研究性的产品，越是没人做过的越迷人。这是真实的偏好，不是恶意。\n但这里有一个标准错位：\n他用”问题新不新”在评估，而客户用”痛不痛”在付费。\n需求永远长在老地方——导出、算薪、排班，十年前是它们，十年后大概率还是它们；真正变了的，是解法。用 AI、用插件生态去接住老需求，新意不在问题里，在解法里。\n陈安妮在播客里有个类比，正好可以接住这件事：电发明之前，人们看舞台剧；电发明之后，有了电影。你看，\n故事没变，讲故事的方式变了\n——没有人会因为”这个故事舞台剧也演过”，就说电影没什么意思。\n所以那句”没什么意思”，翻译成 Hope 大概是这样：\n“YES，用 AI 接住客户点名要的需求，这个起点比追新概念扎实得多。我 HOPE 这几个插件跑通之后，能沉淀出一套做插件的方法论，反哺到更野的想法上去。”\n后来发生的事，比这个反驳更有说服力。巧的是，被”有意思”勾着走的弯路，我自己也走过：最早我就想做”HR 工作台”，一步到位，大而全——结果功能越列越多，一个人根本做不完，项目无疾而终。后来我老老实实去写那些”没意思”的插件：假期余额只管查余额，每日出勤只管核查出勤，工资追算器只管算清一个工资项。做着做着，有意思的事情发生了：\n那没做成的工作台，自己慢慢长出来了\n——把这些插件”缝”在一起，它就是 HR 工作台。\n所以有意思是好东西，但它是跑通之后的副产品，不是否决跑通的理由。而且它从来不在你计划它的地方出现，只在需求真正被解决的地方出现。\n再说，那个心心念念的”新东西”，未必就更有意思——用 AI 搭一个工作台，如今想做的人一抓一把，早就不是非共识了。而”客户愿意付费的需求，恰恰是最真实的需求”，反而是大概率能跑通的那条路。\n研发同学那句”服务器就崩了”，翻译成 Hope 是这样：\n“YES，你确实需要这个接口，客户的需求也是真的。我 HOPE 接口带上限流、配额和权限白名单再开放。”\n同一个担忧，说 No 的版本是一堵墙，说 Hope 的版本是一份需求文档。风险没有消失，但它从”拒绝的理由”，变成了”设计的一部分”。\n但这句”会崩”里，还埋着一层更深的 Hope，平时很难被听见：服务器会崩，真正 Hope 的是什么？\n是增加服务器。\n是算力预算，是扩容排期，是资源投入。\n你有没有发现，很多 No 的底下，埋的都是一个 Hope。”没预算””没人””排期太紧””服务器会崩”——翻译过来都是”我 Hope 有更多资源”。但说困难是安全的，提要求是有责任的：说”会崩”，将来真崩了，是需求不合理；说”加了服务器才能不崩”，加不加、找谁要、什么时候加，就成了他要推动的事。所以大多数人本能地选 No，把问题原样推回给提案的人。\nYES and Hope 的另一个价值就在这里：\n它把埋在 No 底下的那个 Hope 逼出来。\n一旦逼出来，”服务器就崩了”就不再是一句否决，而变", "thumb": "https://static.woshipm.com/tag/1121_1@2x.png ", "images": ["https://static.woshipm.com/tag/1121_1@2x.png ", "https://image.woshipm.com/2023/08/21/ae75791c-401b-11ee-9458-00163e0b5ff3.jpg", "https://static.woshipm.com/tag/1601_1@2x.png ", "https://static.woshipm.com/tag/1121_1@2x.png ", "https://image.woshipm.com/2023/04/13/60f506ce-d9de-11ed-8fc2-00163e0b5ff3.jpg!/both/120x80", "https://image.woshipm.com/2023/05/06/02baecf6-ec01-11ed-96ae-00163e0b5ff3.jpg!/both/120x80"], "tags": [], "seen": false, "new": false, "daily": false, "score": 42.228290678975696}, {"guid": "6829c48ebd66374a7906d8d5b787fe1a", "title": "DesignOps 的规则消费：从追问 1 句”证据在哪”开始", "link": "https://www.woshipm.com/ai/6495515.html", "source": "人人都是产品经理", "category": "pm", "summary": "DesignOps 如何低成本启动证据把关？答案很简单：在下一次走查会上，对一条“用户可能会困惑”的判断追问一句“这是用户真实表现出的，还是我们推测的？”。本文提供追问话术卡、判定表与十分钟验证法，帮你把会议室共识变成可追溯的用户证据，让证据标准从一次追问中自然生长。 《从&#8221;质量把关&#8221;到&#8221;信号追踪&#8221;》 篇讲了 DesignOps 的三个把关动作：证据追问、一 /* 刷新相关 */
const REPO = 'litosukalami-ux/pm-radar';
const CURRENT_UPDATED = '2026-11-19 14:01';
const refreshBtn = document.getElementById('refreshBtn');
let checkTimer = null, checking = false;

refreshBtn.addEventListener('click', () => {
  if (checking) { stopCheck(); return; }
  // 打开 GitHub Actions 页面让用户点绿色 Run workflow 按钮
  const url = `https://github.com/${REPO}/actions/workflows/daily.yml`;
  window.open(url, '_blank', 'noopener');
  startCheck();
});

function startCheck() {
  checking = true;
  refreshBtn.classList.add('busy');
  refreshBtn.querySelectorAll('span')[1].textContent = '检查中…';
  checkOnce();
  checkTimer = setInterval(checkOnce, 20000);  // 20s 一次
}
function stopCheck() {
  checking = false; clearInterval(checkTimer); checkTimer = null;
  refreshBtn.classList.remove('busy');
  refreshBtn.querySelectorAll('span')[1].textContent = '手动刷新';
}
async function checkOnce() {
  try {
    const resp = await fetch(window.location.pathname + '?t=' + Date.now(),
      { cache: 'no-store' });
    if (!resp.ok) return;
    const text = await resp.text();
    const m = text.match(/更新于\s*(\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2})/);
    if (m && m[1] !== CURRENT_UPDATED) {
      stopCheck();
      refreshBtn.classList.add('done', 'pulse');
      refreshBtn.querySelectorAll('span')[1].textContent = '有新数据 · 点此刷新';
      refreshBtn.onclick = () => window.location.reload();
    }
  } catch (e) {}
}

/* 页面打开时，每 60s 自动检查一次，不打扰用户 */
setInterval(() => { if (!checking) checkOnce(); }, 60000);

const FAV_KEY = 'radar.favs.v2';
const READ_KEY = 'radar.read.v2';

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
function load(key, def) {
  try { return JSON.parse(localStorage.getItem(key)) || def; } catch (e) { return def; }
}
function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
}

let favs = load(FAV_KEY, []);      // [{title,link,...}]
let reads = load(READ_KEY, []);    // [link]
const favSet = new Set(favs.map(f => f.link));
const readSet = new Set(reads);

function snapshot(it) {
  return { title: it.title, link: it.link, source: it.source, category: it.category,
           published: it.published, one_line: it.one_line, why: it.why,
           topic: it.topic, tags: it.tags, importance: it.importance };
}

/* 收藏过的标签 = 兴趣信号，用来给新条目标注「为你」 */
function interest() {
  const count = {};
  favs.forEach(f => {
    (f.tags || []).concat(f.topic ? [f.topic] : []).forEach(t => {
      count[t] = (count[t] || 0) + 1;
    });
  });
  return count;
}
let INTEREST = interest();
function matched(it) {
  return (it.tags || []).concat(it.topic ? [it.topic] : [])
    .some(t => (INTEREST[t] || 0) > 0);
}

function starBar(n) {
  n = n || 0;
  if (!n) return '';
  return '★'.repeat(n) + '☆'.repeat(5 - n);
}

function cardHTML(it, lead) {
  const meta = CATS[it.category] || ['其他', '#6B7280', '#F3F4F6'];
  const cls = ['card'];
  if (it.daily) cls.push('pick');
  if (lead) cls.push('lead');
  if (readSet.has(it.link)) cls.push('read');
  const hasFav = favSet.has(it.link);

  // 站内阅读元素（今日必看 + 有正文才给）
  const hasBody = it.full_text || (it.inline_text && it.inline_text.includes('\n'));
  const hasContent = it.daily && (it.full_text || it.inline_text || it.thumb);

  let bodyHTML = '';
  if (hasContent) {
    let thumb = it.thumb ? `<img class="thumb" src="${esc(it.thumb)}" alt="" loading="lazy" onerror="this.style.display='none'">` : '';
    let bullets = '';
    if (it.inline_text) {
      const lines = it.inline_text.split(/[\n]/).map(s => s.trim()).filter(Boolean).slice(0, 5);
      if (lines.length) {
        bullets = `<ul class="inline-bullets">${lines.map(l => `<li>${esc(l)}</li>`).join('')}</ul>`;
      }
    }
    let fullText = '';
    if (it.full_text) {
      fullText = `<div class="body-text">${esc(it.full_text)}</div>`;
    }
    let imgs = '';
    if (it.images && it.images.length) {
      imgs = `<div class="imgs">${it.images.slice(0, 6).map(u =>
        `<img src="${esc(u)}" alt="" loading="lazy" onerror="this.style.display='none'">`).join('')}</div>`;
    }
    let expandBtn = it.full_text
      ? `<button class="expand-btn" type="button"><span>展开全文</span> ↓</button>` : '';

    bodyHTML = `
      ${thumb}
      ${bullets}
      ${expandBtn}
      <div class="full-body">
        ${fullText}
        ${imgs}
        <div style="margin-top:14px">
          <a href="${esc(it.link)}" target="_blank" rel="noopener"
             style="color:var(--muted);font-size:12.5px">查看原文 →</a>
        </div>
      </div>`;
  }

  return `<article class="${cls.join(' ')}" data-link="${esc(it.link)}">
    <div class="row">
      <span class="chip" style="color:${meta[1]};background:${meta[2]}">${esc(meta[0])}</span>
      <span>${esc(it.source)}</span>
      <span>${esc(it.published)}</span>
      ${it.new ? '<span class="new">新</span>' : ''}
      ${matched(it) && !it.daily ? '<span class="for-you">为你</span>' : ''}
      <span class="stars">${starBar(it.importance)}</span>
    </div>
    <h3><a href="${esc(it.link)}" target="_blank" rel="noopener" data-link="${esc(it.link)}">${esc(it.title)}</a></h3>
    ${it.one_line ? `<p class="line">${esc(it.one_line)}</p>` : ''}
    ${it.why ? `<p class="why">${esc(it.why)}</p>` : ''}
    ${!it.one_line && it.summary ? `<p class="raw">${esc(it.summary)}</p>` : ''}
    ${bodyHTML}
    ${(it.tags && it.tags.length) ? `<div class="tags">${it.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
    <button class="fav ${hasFav ? 'on' : ''}" data-link="${esc(it.link)}">${hasFav ? '已收藏' : '收藏'}</button>
  </article>`;
}

function renderContests() {
  const box = document.getElementById('contests');
  if (!CONTESTS.length) { box.innerHTML = '<div class="empty">暂无</div>'; return; }
  box.innerHTML = CONTESTS.map(c => {
    const label = c.expected_start ? '预计 ' + c.expected_start : '待公布';
    return `<div class="contest">
      <div class="top"><div class="name">${esc(c.name)}</div><span class="badge">${esc(label)}</span></div>
      <div class="org">${esc(c.org || '')}</div>
      <div class="note">${esc(c.note || '')}</div>
    </div>`;
  }).join('');
}

let cur = 'daily';
let kw = '';
let sortBy = 'importance';

function currentList() {
  if (cur === 'fav') {
    return favs.slice().reverse().map(f => ({ ...f, daily: false }));
  }
  if (cur === 'daily') return ITEMS.filter(i => i.daily);
  if (cur === 'all') return ITEMS.slice();
  return ITEMS.filter(i => i.category === cur);
}

function render() {
  const list = document.getElementById('list');
  let items = currentList();

  if (kw) {
    items = items.filter(it =>
      (it.title + ' ' + (it.summary || '') + ' ' + (it.one_line || '') + ' ' +
       (it.topic || '') + ' ' + (it.tags || []).join(' ') + ' ' + it.source)
        .toLowerCase().includes(kw));
  }

  if (sortBy === 'time') {
    items.sort((a, b) => (b.ts || b.published || '').localeCompare(a.ts || a.published || ''));
  } else if (cur !== 'daily') {
    items.sort((a, b) => (b.importance || 0) - (a.importance || 0) ||
      (b.ts || '').localeCompare(a.ts || ''));
  }

  if (!items.length) {
    list.innerHTML = `<div class="empty">${cur === 'fav' ? '还没收藏。看到有用的点右下角「收藏」，以后会优先推给你。' : '没有匹配的条目'}</div>`;
    return;
  }

  list.innerHTML = items.map((it, i) =>
    cardHTML(it, cur === 'daily' && i < 3)).join('');
}

function renderTabs() {
  const tabs = document.getElementById('tabs');
  const defs = [['daily', '今日必看'], ['all', '全部']]
    .concat(ORDER.map(k => [k, (CATS[k] || [k])[0]]))
    .concat([['fav', '我的收藏']]);
  tabs.innerHTML = defs.map(([k, n]) =>
    `<button class="tab ${k === cur ? 'on' : ''}" data-k="${k}">${n}</button>`).join('');
  tabs.querySelectorAll('.tab').forEach(b => {
    b.onclick = () => { cur = b.dataset.k; renderTabs(); render(); };
  });
}

document.getElementById('q').addEventListener('input', e => {
  kw = e.target.value.trim().toLowerCase();
  render();
});

document.getElementById('sort').addEventListener('click', e => {
  sortBy = sortBy === 'importance' ? 'time' : 'importance';
  e.target.textContent = sortBy === 'importance' ? '按重要度' : '按时间';
  render();
});

document.getElementById('list').addEventListener('click', e => {
  const expand = e.target.closest('.expand-btn');
  if (expand) {
    const card = expand.closest('.card');
    card.classList.toggle('body-open');
    // 展开即算已读
    const link = card.dataset.link;
    if (link && !readSet.has(link)) {
      readSet.add(link); reads.push(link);
      save(READ_KEY, reads);
      card.classList.add('read');
    }
    return;
  }
  const fav = e.target.closest('.fav');
  if (fav) {
    const link = fav.dataset.link;
    const hit = ITEMS.find(i => i.link === link) || favs.find(f => f.link === link);
    if (favSet.has(link)) {
      favSet.delete(link);
      favs = favs.filter(f => f.link !== link);
    } else if (hit) {
      favSet.add(link);
      favs.push(snapshot(hit));
    }
    save(FAV_KEY, favs);
    INTEREST = interest();
    renderTabs(); render();
    return;
  }
  const a = e.target.closest('h3 a');
  if (a) {
    const link = a.dataset.link;
    if (!readSet.has(link)) {
      readSet.add(link);
      reads.push(link);
      save(READ_KEY, reads);
      const el = a.closest('.card');
      if (el) el.classList.add('read');
    }
  }
});

renderContests();
renderTabs();
render();
</script>
</body>
</html>
