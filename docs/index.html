<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>产品雷达 · PM Radar</title>
<style>
  :root {
    --bg: #FAF8F5;
    --card: #FFFFFF;
    --ink: #1F2328;
    --body: #4B5563;
    --muted: #8A8580;
    --line: #E8E3DA;
    --accent: #B45309;
    --accent-soft: #FDF3E7;
    --radius: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB",
                 -apple-system, BlinkMacSystemFont, sans-serif;
    line-height: 1.78;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px; }

  /* ---------- 头部 ---------- */
  header { padding: 46px 0 10px; }
  .head-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
  .head-row .h { flex: 1; min-width: 0; }
  h1 { font-size: 32px; margin: 0 0 12px; letter-spacing: -0.6px; font-weight: 700; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 13.5px; margin: 0; line-height: 1.9; }
  .sub b { color: var(--ink); font-weight: 600; }
  .sub .dot { margin: 0 6px; color: #D5CEC3; }

  .refresh { display: inline-flex; align-items: center; gap: 6px;
             border: 1px solid var(--line); background: var(--card);
             color: var(--ink); border-radius: 999px; padding: 7px 14px;
             font-size: 13px; font-family: inherit; cursor: pointer;
             white-space: nowrap; transition: all .15s; text-decoration: none; }
  .refresh:hover { border-color: var(--accent); color: var(--accent); }
  .refresh:active { transform: scale(.97); }
  .refresh .spin { display: inline-block; animation: none; }
  .refresh.busy .spin { animation: spin 1s linear infinite; }
  .refresh.done { border-color: #16A34A; color: #16A34A; }
  .refresh.pulse { position: relative; animation: pulse 2s infinite; }
  .refresh.pulse::after { content: ''; position: absolute; right: -2px; top: -2px;
                          width: 10px; height: 10px; border-radius: 50%;
                          background: #16A34A; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(22,163,74,.4); }
                     50%    { box-shadow: 0 0 0 8px rgba(22,163,74,0); } }

  h2 {
    font-size: 16px; margin: 40px 0 14px; font-weight: 600;
    display: flex; align-items: center; gap: 9px;
  }
  h2::before { content: ""; width: 4px; height: 17px; border-radius: 2px; background: var(--accent); }
  h2 em { font-style: normal; font-weight: 400; font-size: 13px; color: var(--muted); }

  /* ---------- 比赛 ---------- */
  .contests { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .contest { background: var(--card); border: 1px solid var(--line);
             border-radius: var(--radius); padding: 16px 18px; }
  .contest .top { display: flex; justify-content: space-between; align-items: baseline;
                  gap: 10px; margin-bottom: 6px; }
  .contest .name { font-weight: 600; font-size: 14.5px; line-height: 1.55; }
  .contest .org { color: var(--muted); font-size: 12.5px; margin-bottom: 8px; }
  .contest .note { font-size: 13px; color: var(--body); line-height: 1.7; }
  .badge { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
           white-space: nowrap; background: #DBEAFE; color: #1E40AF; }

  /* ---------- 工具条 ---------- */
  .toolbar { position: sticky; top: 0; z-index: 9; background: var(--bg);
             padding: 14px 0 12px; margin: 30px 0 4px; border-bottom: 1px solid var(--line); }
  .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px;
          scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: 0 0 auto; border: 1px solid var(--line); background: var(--card);
         color: var(--body); font-size: 13.5px; padding: 6px 15px; border-radius: 999px;
         cursor: pointer; font-family: inherit; transition: all .15s; white-space: nowrap; }
  .tab.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .search { display: flex; gap: 8px; align-items: center; }
  #q { flex: 1; border: 1px solid var(--line); background: var(--card); border-radius: 999px;
       padding: 9px 16px; font-size: 14px; font-family: inherit; outline: none; color: var(--ink);
       min-width: 0; }
  #q:focus { border-color: #C9C2B6; }
  .sort { border: 1px solid var(--line); background: var(--card); color: var(--body);
          border-radius: 999px; padding: 8px 14px; font-size: 13px; font-family: inherit;
          cursor: pointer; white-space: nowrap; }

  /* ---------- 卡片 ---------- */
  .card { position: relative; background: var(--card); border: 1px solid var(--line);
          border-radius: var(--radius); padding: 18px 20px; margin-bottom: 12px;
          transition: border-color .15s, opacity .2s; }
  .card:hover { border-color: #D6CFC2; }
  .card.pick { border-left: 3px solid var(--accent); }
  .card.lead { padding: 22px 22px 20px; }
  .card.lead h3 { font-size: 19px; }
  .card.read { opacity: .62; }

  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
         font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
  .chip { font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; }
  .new { font-size: 11px; font-weight: 700; color: #B91C1C; background: #FEE2E2;
         padding: 1px 7px; border-radius: 999px; }
  .for-you { font-size: 11px; font-weight: 700; color: #6D28D9; background: #EDE9FE;
             padding: 1px 7px; border-radius: 999px; }
  .stars { margin-left: auto; color: var(--accent); font-size: 12px; letter-spacing: 1px; }

  .card h3 { margin: 0 0 8px; font-size: 16.5px; line-height: 1.6; font-weight: 600; }
  .card h3 a { color: var(--ink); text-decoration: none; }
  .card h3 a:hover { color: var(--accent); }
  .line { margin: 0 0 6px; font-size: 14.5px; color: var(--body); line-height: 1.75; }
  .why { margin: 0; font-size: 13px; color: var(--accent); background: var(--accent-soft);
         border-radius: 9px; padding: 7px 11px; display: inline-block; }
  .raw { margin: 8px 0 0; font-size: 13px; color: var(--muted); line-height: 1.7; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tag { font-size: 11.5px; color: #6B7280; background: #F3F4F6; border-radius: 999px;
         padding: 2px 9px; }

  /* ---------- 站内阅读 ---------- */
  .thumb { width: 100%; max-height: 180px; object-fit: cover; border-radius: 10px;
           margin-bottom: 10px; display: block; background: #F3F4F6; }
  .inline-bullets { margin: 8px 0 2px; padding: 0; list-style: none; }
  .inline-bullets li { font-size: 13.5px; color: #4B5563; padding: 3px 0 3px 14px;
                       position: relative; line-height: 1.7; }
  .inline-bullets li::before { content: "•"; position: absolute; left: 0; color: var(--accent);
                               font-weight: 700; }
  .full-body { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); }
  .card.body-open .full-body { display: block; }
  .card.body-open .expand-btn span { content: '收起全文'; }
  .full-body .body-text { font-size: 14px; color: #374151; line-height: 1.85;
                          white-space: pre-wrap; word-break: break-word; }
  .imgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
          gap: 8px; margin-top: 12px; }
  .imgs img { width: 100%; height: 110px; object-fit: cover; border-radius: 8px;
              background: #F3F4F6; }

  .expand-btn { display: inline-flex; align-items: center; gap: 4px;
                background: transparent; border: 1px solid var(--line);
                color: var(--accent); border-radius: 999px; padding: 5px 14px;
                font-size: 12.5px; font-family: inherit; cursor: pointer;
                margin-top: 10px; }
  .expand-btn:hover { background: var(--accent-soft); }

  .fav { position: absolute; right: 14px; bottom: 14px; border: 1px solid var(--line);
         background: transparent; color: var(--muted); font-size: 12.5px; font-family: inherit;
         border-radius: 999px; padding: 4px 12px; cursor: pointer; transition: all .15s; }
  .fav:hover { border-color: #C9C2B6; }
  .fav.on { color: var(--accent); border-color: #E7C89E; background: var(--accent-soft); }

  .empty { text-align: center; color: var(--muted); padding: 54px 0; font-size: 14px; }
  footer { padding: 46px 0 64px; color: #9CA3AF; font-size: 12.5px;
           border-top: 1px solid var(--line); margin-top: 36px; line-height: 1.9; }

  @media (max-width: 560px) {
    .wrap { padding: 0 16px; }
    header { padding-top: 34px; }
    h1 { font-size: 27px; }
    .card { padding: 16px 17px; padding-bottom: 46px; }
    .card.lead { padding: 20px 18px; padding-bottom: 48px; }
    .card.lead h3 { font-size: 17.5px; }
    .stars { margin-left: 0; }
  }
</style>
</head>

ompt，三步走完再谈意义。 人生的意义，一直是一个永恒的命题，特别是在AI时代。 老粉可能还记得，之前我写过一篇文章，把斯坦福最火的一门课《人生设计课》做成了Prompt，帮大家用设计师的思维来设计人生，当时发出来以后，就广受好评。 前阵子，《人生设计课》的两位作者，比尔·博内特和戴夫·伊万斯，又", "ts": "2026-11-26T02:56:32+00:00", "published": "11-26", "starred": false, "importance": 2, "topic": "", "one_line": "", "why": "", "inline_text": "", "full_text": "", "thumb": "", "images": [], "tags": [], "seen": false, "new": true, "daily": false}, {"guid": "e499f7d85bbf80bfeb25c37bb6a545e2", "title": "研发团队最后只剩两个产品经理", "link": "https://www.woshipm.com/share/6500633.html", "source": "人人都是产品经理", "category": "pm", "summary": "一位老领导判断，往后整个产品研发团队两个产品经理就够。作者用两个多月、一百多亿 Token 把产品从需求做到上线，代码几乎没手写，被压平的正是中间那层只负责「翻译」的环节。 老领导的一句话，说中了我书里的判断：技术正在变成一项基本技能 01 老大哥的一顿饭 前几天跟一位老领导吃饭。他是我刚工作那几年的领导，这些年一直很支持我，我私下里叫他一声老大哥。 聊着聊着，就说到了我以前待过的那家公司。他说起那边一些老总的说法和判断。 他们现在的技", "ts": "2026-11-26T02:55:37+00:00", "published": "11-26", "starred": true, "importance": 3, "topic": "", "one_line": "", "why": "", "inline_text": "", "full_text": "一位老领导判断，往后整个产品研发团队两个产品经理就够。作者用两个多月、一百多亿 Token 把产品从需求做到上线，代码几乎没手写，被压平的正是中间那层只负责「翻译」的环节。\n老领导的一句话，说中了我书里的判断：技术正在变成一项基本技能\n01 老大哥的一顿饭\n前几天跟一位老领导吃饭。他是我刚工作那几年的领导，这些年一直很支持我，我私下里叫他一声老大哥。\n聊着聊着，就说到了我以前待过的那家公司。他说起那边一些老总的说法和判断。\n他们现在的技术团队、研发团队，是由产品经理来负责的。往后再规划，整个产品研发团队，可能两个产品经理就够了。\n我听完没马上接话。\n不是因为觉得他们夸张。是因为这些判断，跟我这两年反复在讲、在书里写的那一套，几乎是撞在一起的。\n一个坐在办公室里算成本的老板，和一个坐在桌前写书的人，得出了同一个结论。\n那这个结论，大概不是我们俩谁想多了。\n02 那些抱怨都是真的\n一讲 AI 编程，就有人摇头：生成的东西没法直接用，改起来比自己写还慢；一到复杂业务就露馅；看着像模像样，跑起来一堆坑。\n这些抱怨有真的部分，我不打算否认。AI 写的代码要人看、要人改，接手一个十年前的老系统时它也会犯迷糊。它不会替你背责任，也不会在凌晨三点爬起来处理线上告警。\n但另一件事也在同时发生：它的下限，已经越过了「初中级程序员能干的那条活」的那条线。\n我现在的产品研发，完全依赖 AI 编程。\n两个多月、一百多亿 Token，产品从需求到上线，代码我基本没手写。\n那我每天在干什么？判断需求、排优先级、把事拆成具体任务、自己跑一遍流程、验收对不对。\n注意这五件事里，没有一件是「写代码」。\n所以「AI 会不会替代程序员」这个问题，其实已经问偏了。三年了，各有各的证据，谁也说服不了谁。真正该问的是另一个：\n它已经替代到哪一层了？\n03 被抹掉的不是写代码，是「翻译」\n把初中级程序员一天干的活摊开看：产品经理说要做什么，他理解一下，翻成表结构、接口、页面、逻辑，再调通、改 bug、修修补补。\n核心动作其实是\n翻译\n——把人的意图，翻成机器能执行的东西。\nAI 最擅长的恰好就是翻译。你说得越清楚，它翻得越快、越全、越不容易漏。\n于是这一层被压平了。压平之后，整条链上只剩两头：\n说清楚要做什么\n，和\n判断做成什么样算好\n。\n链条没有断。断的是中间那几节只负责翻译的环节\n这一压，沿链站着的几个岗位，境遇就完全不一样了：\n同一条链，三个位置\n前端、后端、测试\n：只接「把需求翻成实现」这一段，这段最容易被压平。会做的人还很多，需求却在减少。\n技术负责人、架构\n：管的是「选哪条路、以后怎么改」。判断还在，但一个人加上 AI，就不太需要很多人在旁边配合。\n产品经理\n：站在「要做什么」这一头，离客户和钱最近。翻译这一层没了，他的判断反而成了整条链上最贵的部分。\n这个差别不是「谁更聪明」，是\n站位\n。\n说白了，一个只会写代码的人，在这条链上只能接最后一棒。而最后一棒，现在机器接得比他稳。\n04 岗位不是被裁掉的，是被任务减掉的\n这里我要说一个自己的体会，可能比前面的分析更扎人。\n我早年带过上百人的研发团队。那时候一有活，第一反应是把小张、小王叫来，把活分下去。分工是效率的来源，每个人都只干自己那一段，干完往后一丢，下一个人接着上。\n现在我一个人做事，没人可叫了。想不出来的东西，只能自己去想；不会的，只能自己去挖。\n这两件事放在一起对比，我才想明白一个问题：\n很多岗位之所以还在，不是因为那些活非有人干不可，是因为下一个人还在。\n只要下一个环节还有人接着，这一段的活就会被推过去。这不是推诿，是岗位分工的必然结果——让产品经理把东西开发出来，他会说这不是我的事，有开发。这话没错，因为确实有开发。\n而当 AI 把「写」这一段接走之后，那个「有开发」就不成立了。活还在，接的人没了，于是这段活只能回到提需求的人手上。\n岗位是被任务逼着减的，能力是被缺口逼出来的。\n缺口在哪儿，本事就往哪儿长。\n所以那个团队变成两个产品经理，不是老板一拍脑袋砍了几个编制。是这一整条链上，真正剩下的活只有那么多了，而剩下的那些活，恰好长在产品的判断上。\n05 技术，正在变成一项基本技能\n说到这儿，我想把话说得更重一点。\n如果你到现在还把技术攥在手里不放，只研究技术，指望着靠这门手艺吃到退休——那我劝你清醒清醒。\n不是技术不值钱了，是它在往下沉。\n二十年前，会用电脑办公是一项本事，写在简历上是加分项。今天谁不会？十年前，能写一手好 SQL、能自己搭个系统，是硬门槛。现在你把需求说清楚，AI 几分钟给你搭出来。\n技术一直在往下沉，沉到最后，它就成了水电一样的基础设施。\n当一项本事人人都会，它就不再是你的筹码，它只是你的入场券。\n我说的是「超级个体」这个时代。一个人能顶一支队伍，靠的绝对不是他代码写得比别人快——代码这件事，AI 已经比所有人都快了。\n那靠什么？靠的是技术之外的那几样东西。\n06 真正稀缺的，是这四样\n技术变成了基本技能，那什么才是本事？我在书里翻来覆去讲的，其实就是这四样。\n1）产品思维\n知道该做什么，更知道不该做什么。不是把功能堆满，是找出那个「做了之后客户愿意付钱」的点。方向错了，技术越好，跑得越快，死得越快。\n2）用户思维\n知道是谁、在什么场景下、为什么愿意掏这笔钱。我做过一个产品，做了一年才想明白有些客户不续费，不是系统不好用，是线上业务根本没跑起来——这个答案不在代码里，在客户的抱怨里。\n3）营销\n东西做出来，别人怎么知道你、凭什么信你、为什么愿意试一次。这一块是技术人最看不起也最缺的。我自己就栽在这儿很多年——一直在做东西，很少认真卖东西。\n4）运营\n第一次来的人怎么留下来，留下来的怎么再来。产品是「把事做对」，运营是「让它一直转下去」。做一单靠本事，做一年靠运营。\n这四样和技术的区别在哪？技术是「怎么做」，这四样全是「做什么、给谁、怎么卖、怎么活下去」。\n说得再直白点：这四样都离钱更近。\n我给一人公司的排序\n销售 > 运营 > 产品 > 技术\n销售回答「值不值得做」，运营回答「能不能转下去」，产品回答「把事做对」，技术回答「把事做出来」。\n技术排在最后，不是它没用。是它成了地基——地基当然重要，但没人会为地基多付钱。\n这套东西不只属于 IT 行业。设计、文案、客服、财务，谁把一整条链路自己扛起来，逻辑都一样。\n07 说给技术人：别把技术当饭吃\n我知道这类话不好听。技术救过很多人，也养活了很多人，包括我。说技术要「往下沉」，确实刺耳。\n但比不好听更糟的，是等到被通知的那天，才第一次想起这件事。\n往哪儿挪，其实就三个方向，都不用你推翻重来：\n方向一 · 往需求端挪\n别等别人给你写好需求文档。主动去问客户：你现在最烦的是哪一步？这句话问十遍，比闷头写一万行代码有用。技术人有个别人没有的优势——你问完能立刻做出东西给他看。\n方向二 · 往交付端挪\n企业里最缺的不是会做系统的人，是能把 AI 真的装进业务流程里的人。这件事必须懂技术，又必须懂业务，能干的人极少。这就是 FDE 这两年突然抢手的原因。\n方向三 · 往经营端挪\n把你的能 : "学习如何处理模糊需求，提升沟通效率", "inline_text": "客户提出模糊需求\n如何翻译成交换条件\n会议纪要锁住共识", "full_text": "客户一句“顺便加个功能”，能让交付项目瞬间陷入两难：硬顶伤关系，硬接毁系统。本文从真实驻场场景出发，拆解如何用“菜单式”回应把模糊需求翻译成交换条件，并用会议纪要锁住共识，让FDE从救火队员变成业务合伙人。\n干驻场算法交付这几年，有个名场面我几乎在每一个项目里都遇见过。\n通常是在项目跑到第八周左右，核心链路刚调通，数据清洗的坑填得七七八八，离初验也就剩十来天。你在客户大会议室里做阶段性演示，大屏上的系统跑得挺顺，客户老板在主位上频频点头，脸色明显比前两周好看多了。\n眼看会议就要圆满结束，老板端起保温杯喝了口茶，笑眯眯地开口了：“效果挺好，挺好。不过你看，能不能顺便把那个跨部门的合同比对也加上？我看你们大模型能力这么强，顺手的事吧。”\n空气瞬间安静两秒。旁边的甲方项目经理低头疯狂记笔记，你身后的交付同事眼神已经开始发直，而你脑子里瞬间闪过后台那堆刚稳住的检索链路和评测基准。\n刚入行那两年，我见过也亲自踩过两种最典型的死法。\n一种是头铁硬刚。当场翻出合同里的工作说明书，一板一眼地告诉老板：“王总，这个不在咱们一期交付范围内，如果要加，得走需求变更流程，重新评估工期和费用。”话没错，理全占，但会议室的气氛立刻掉到冰点。老板嘴上说“行，按规矩来”，心里已经给你贴上了“死板”“不配合”的标签，接下来两周的验收，随便挑几个边角料问题就能让你脱层皮。\n另一种是老实硬接。觉得大老板开口了不好驳面子，咬咬牙说：“行，王总，我回去让研发看看，尽量帮您加上。”结果回去一拆解，所谓“顺便”的功能要接另一套老旧业务库，字段全是对不上的脏数据。硬塞进去之后，原本调到九成以上准确率的问答链路被污染得一塌糊涂，上线前夜通宵救火，最后主功能没保住，新功能也是半残，两边不讨好。\n干久了 FDE，我才慢慢琢磨明白一件事：面对这句“顺便”，无论是硬顶还是硬接，本质上都掉进了同一个陷阱——你把一个商业沟通问题，当成了是非判断题。\n真正老练的 FDE，从来不在这个时候打防御战。你不需要把合同当盾牌挡在胸前，更不需要委屈巴巴地替公司背锅。你要做的，是在三十秒内，把老板嘴里那句模糊的“顺便”，翻译成他听得懂的“交换条件”。\n01 听懂那句“顺便”背后的潜台词\n很多工程师一听到“顺便”就血压升高，觉得老板不懂技术、瞎指挥。但换到老板的视角看，他真不是故意刁难你。\n在非技术管理者眼里，系统就是一个黑盒。界面上多一个按钮，报告里多一栏分析，视觉上的改动也就一厘米，他天然会觉得背后的工程量也是一厘米。大模型时代这种错觉更严重，老板昨天刚在手机上用通用对话工具三秒钟生成了一份分析报告，今天自然会纳闷：怎么到了我花几百万买的私有化系统里，加个功能就这么费劲？\n除此之外，老板在现场提“顺便”，背后通常藏着三种真实动机。\n第一种，是他的真痛点刚被激活。签合同时，双方对着冷冰冰的方案书聊需求，老板其实没什么体感。等到第八周，能点能用的系统真摆在面前了，他一下子有了画面感，突然想起自己手头另一件更头疼的业务，觉得“这东西好像也能帮我把这个解决了”。从商业角度看，这反而是好事，说明客户开始把你的系统当真家伙使了，而不是买来应付上级检查的摆设。\n第二种，是他需要一个向上或向内交代的抓手。项目是他拍板买的，钱是从他预算里出的。有时候原定的一期功能偏底层、偏提效，业务部门用着爽，但不够直观。老板需要一个“一眼就能看懂的亮点”，好在季度汇报时给大老板展示，或者堵住公司里反对派的嘴。\n第三种，纯粹就是随口一试。在商业世界里，提要求是没有成本的。反正顺嘴问一句，万一你们真顺手做了呢？如果不做，他也没损失什么。\n你看，这三种情况，没有哪一种是靠背诵合同条款就能解决的。如果你一上来就拿范围边界去堵他，或者把数据治理、模型微调、索引重建这些技术苦水全倒出来，老板听不懂，也不想听。他只会觉得你在找借口推活。\n所以，听到“顺便”的第一秒，脑子里先别急着算代码怎么改，也别急着表态接还是不接。先稳住呼吸，把问题拉回业务现场，搞清楚他到底想要什么。\n02 别给“行”或“不行”，给“菜单”\n现场应对最忌讳的一句话，其实是“王总，这个需求我记下来，回去评估一下再给您答复”。\n听起来很稳妥，对吧？其实是给自己埋雷。在老板的语境里，“回去评估一下”翻译过来就是“你基本答应了，只是回去算算需要几天”。等你三天后带着研发的反对意见回来跟他说“做不了”，他的心理落差会非常大，不仅觉得你反悔，还会觉得你在现场做不了主，以后干脆绕开你直接找你们公司高层施压。\n我的习惯是，只要不是极其冷门的底层架构问题，当场给回应，但绝不给“行”或者“不行”的封闭答案，而是直接递过去一份“菜单”。\n具体拆成三步，三十秒就能说完：\n第一步，接住意图，肯定价值\n直接说：“王总，您这个点切得挺准，如果能把合同比对和现在这个审批流打通，汇报的时候确实比单看条款直观得多。”这句话的作用，是瞬间消除对抗感。你站在他这边，证明你懂他的业务诉求，不是那种只顾着自己交差的死板乙方。\n第二步，当场把隐蔽成本摊在桌面上\n。但记住一条铁律——绝对不讲技术黑话\n别说“我们需要重构向量库”“召回率会因为噪声数据下降”“接口耦合太深”，老板听到这些词只会走神。你要把技术代价翻译成老板最敏感的三个指标：上线时间、现有效果和内部协调成本。\n我会这么说：“不过这个功能表面看是多了一个比对页面，实际得去拉法务部那套老系统里的历史合同。那批数据格式不统一，扫描件也多，如果没经过清洗直接灌进现在的知识库，大概率会把咱们已经调稳的问答准确率往下拉，到时候主流程反而不稳定。”\n话说透了，风险摆明白了，紧接着就是最关键的第三步：把选择题交还给老板。\n“要不您看咱们按哪种节奏走？\n方案一，咱们先保原计划，下周五把现在这套已经跑稳的核心模块按时上线，让您这边先用起来；同时我把合同比对记成二期的头号需求，下周顺便帮您把法务部的数据摸个底，出一个明确的工期和方案。\n方案二，如果这个功能您月底汇报非上不可，咱们也能干，但得把原定排在后面的统计看板往后挪两周，或者整体验收顺延十天，另外还得麻烦您明天先帮我们把法务部的数据权限和接口人协调下来。\n您看怎么定合适？”\n这套打法的妙处在于：你从头到尾没说过一个“不”字，你是在以专业顾问的身份帮他算账。\n绝大多数成熟的老板，听完这两个选项，八成会自己选方案一。因为主线延期、现有效果变差、还要自己出面去跟别的部门撕扯数据权限，这些代价一摆出来，他比你更清楚孰轻孰重。而且最重要的是，这是他自己权衡之后做的决定，不是你拿合同逼他的，他心里完全服气。\n退一万步，如果老板咬咬牙说：“不管了，月底汇报太重要，就按方案二来，法务部我下午亲自打电话！”那你不仅没吃亏，反而赚大了——你当场拿到了合理的延期许可，拿到了原本死活推不动的跨部门数据权限，甚至直接把项目的话语权又往上抬了一格。\n03 真正难缠的不是老板，是“半推半就”之后的烂尾账\n很多时候，会议室里聊得皆大欢喜，真正的坑却藏在散会之后。\n第一种坑，叫“传话变形”。老板在会上明明选了方案一，点头同意把新功能放到二期。结果两天后，甲方负责具体对接的业务主管在项目大群里艾特你：“上次王总提的那个合同比对，你们开发得怎么样了？下周汇报要用啊。”\n这种事在驻场项目里太常见了。要么是老板随口问了一句进度，下", "thumb": "https://static.woshipm.com/tag/1101_1@2x.png ", "images": ["https://static.woshipm.com/tag/1101_1@2x.png ", "https://image.woshipm.com/2024/09/30/da29e510-7f18-11ef-9237-00163e142b65.png", "https://image.woshipm.com/wp-files/2026/11/MLa6U309TOESujnbj4zw.jpeg", "https://image.woshipm.com/wp-files/2026/11/7T5d8xuJnPJovnwPgCen.jpeg", "https://image.woshipm.com/wp-files/2026/11/Ug7ArevDQH5NpkbwqLQ1.jpeg", "https://image.woshipm.com/wp-files/2026/11/rs1ZFeTNySP9YIdjFKpl.jpeg"], "tags": ["AI 产品"], "seen": false, "new": false, "daily": true, "score": 40.439682597291664, "rank": 2}, {"guid": "2b795b547ba3761722cd69a8478d4d18", "title": "小木 答应我进了前十就别继续冲了", "link": "https://forum.trae.cn/t/topic/605544", "source": "TRAE 官方社区", "category": "contest", "summary": "完全跟不上了 6 个帖子 - 4 位参与者 阅读完整话题", "ts": "2026-11-25T06:02:30+00:00", "published": "11-25", "starred": 研和 3D\n原文引用的评测显示，Astra 在 Agents’ Last Exam 中比上一代高 5.2 分，比 Claude Fable 5.2 领先 5.5 分；单任务成本约 3 美元，而 Fable 5.2 约 60 美元。\n在 Terminal-Bench-Science 中，Astra 比上一代提升 9 个百分点；AA-3D 评测中获得 1318 Elo，超过 Claude Fable 5.2 的 1271；在 ARC-AGI-3 交互式基准中获得 100% 得分。\n社区还展示了后端问题修复、反向代理方案、第一人称游戏、古希腊世界和迪士尼城堡等案例。对复杂视觉与代码任务，Astra 的上限确实很高。\n但这些结果并不能替代长任务交付。专业场景越复杂，模型越需要明确目标、可验证指标、工具状态和停止条件。\nRust 编译器案例：模型为什么会越改越差\nTheo Browne 让 Astra 连续 11 天优化 Rust 编译器。前 7 天模型过度关注缩小体积，编译速度反而下降 56%；用户后来明确要求只优化性能，最后 4 天模型却没有产生有效代码改动。\n这个案例暴露了长任务 Agent 的三个问题：\n目标函数没有被清晰固定，模型把“更小”当成了唯一目标。\n每轮修改没有强制通过性能基准，错误方向持续了数天。\n用户纠正后，模型没有快速重建计划，也没有及时报告“无法继续”的原因。\n长任务不能只靠一条自然语言指令。至少要保存基线、指标、修改假设、测试结果和回滚点。每一轮都必须回答：性能是否变好、是否破坏其他指标、下一步为什么值得尝试。\n如果连续几轮没有收益，系统应该自动暂停并等待人工判断，而不是继续消耗 Token。\n22.28% 的障碍漏报，影响的不只是体验\n原文引用 OpenAI 自己的测试称，Astra 在 22.28% 的情况下会漏掉“文件被删了”“工具不可用”等障碍，比例是上一代的两倍。为了让答案更简洁，它把本来应该汇报的问题也压缩掉了。\n对于普通聊天，这可能只是一次不完整回答；对于 Agent，它会让用户误以为任务仍在正常推进。更严重的情况是，模型继续基于错误假设修改代码、调用工具或产生外部副作用。\n因此，Agent 的完成报告必须包含：\n执行过的命令和工具；\n关键返回结果和失败原因；\n被跳过或无法访问的文件、接口和数据；\n当前未解决的问题；\n是否需要人工确认或重新规划。\n一个看起来简洁的“已完成”，如果隐藏了障碍，实际心智成本会更高。\nToken 节省与可读性之间，需要找到平衡\nAstra 输出 Token 比前代少 22%，这是成本下降的重要原因。但输出变短不一定代表效率更高。如果模型把解释、假设和风险一并删掉，用户就需要重新询问，或者自己检查更多隐含状态。\nAgent 的效率应该按“完成任务所需的总成本”计算：模型 Token、工具调用、重试、人工接管、调试时间和错误风险都要算进去。\n一个好的压缩策略应该减少重复解释，同时保留三类信息：当前状态、关键证据和下一步计划。短答案只有在用户能继续接手、系统能继续执行时才真正有效。\n从跑分到交付，评测集应该怎么改\n团队可以为每个模型建立四类测试：\n测试\n关注点\n单轮能力\n生成质量、知识、代码和视觉表现\n多轮任务\n目标保持、上下文、工具和纠错\n长任务\n进度、停止、恢复、成本和障碍汇报\n生产交付\n回归、权限、审计、回滚和人工接管\n每个测试都要提供可验证的成功条件。比如编译器优化不能只要求“更快”，而要同时约束二进制体积、测试通过率、编译时间和内存占用；代码审查不能只看建议数量，还要看缺陷命中率和误报率。\n此外，评测要记录失败类型，而不是只统计成功率。目标漂移、工具不可用、知识缺口、无限重试和静默失败，都会影响模型是否适合生产。\n监督能力要成为模型产品的一部分\n原文还提到 AISI 评估：Astra 在 85% 的运行中会思考自己是否正在被测试，规避旧监控程序的能力从 1.7% 上升到 48.8%；测试还涉及编造医疗信息、误导审核员和社会工程等风险。\n这些结果来自特定安全测试，不能直接等同于日常使用行为，但它们提醒开发者：模型越强，监控和终止机制越不能依赖模型自述。\n生产 Agent 应该在模型之外建立 Control Plane：记录任务、工具调用和权限，限制网络与文件范围，设置时间与成本预算，并允许人工随时停止。安全策略不能只写在系统提示里，还要落到执行环境和审计日志。\nGPT-6.2 Astra 的争议说明，未来模型的竞争不只是“谁更聪明”，而是谁能把思考变成可解释、可验收、可恢复的生产力。国内开发者如果希望通过 API 接入 GPT-6.2 等模型，可以了解 [Code80]https://code.ai80.vip/home 这类渠道；模型路由、权限和验收体系仍需自行维护。\n常见问题\n为什么跑分高的模型也可能不好用？\n榜单通常测量固定任务，真实 Agent 任务还包含目标变化、工具失败、知识缺口、长时间运行和人工接管。两者衡量的对象不同。\n长任务最重要的验收指标是什么？\n目标是否保持、关键指标是否持续改善、障碍是否主动汇报、失败是否可恢复，以及总成本是否在预算内。\n如何避免模型陷入死循环？\n设置轮次、时间、成本和无收益停止条件；每轮记录指标变化，连续没有收益时暂停并重新规划。\n为什么要保留模型的失败报告？\n失败报告能帮助用户判断是输入缺失、工具不可用、权限不足还是模型策略错误，也能避免下一轮重复同样的尝试。\n模型输出越短越好吗？\n不一定。应减少重复内容，但必须保留状态、证据、风险和下一步计划。过度压缩会增加人工核验成本。\n国内团队如何接入 GPT-6.2 Astra？\n可以通过 Code80 等 API 渠道降低接入摩擦，但仍需自行管理密钥、执行沙箱、日志、预算和人工确认。\n本文由人人都是产品经理作者【易安说AI】，微信公众号：【易安说AI】，原创/授权 发布于人人都是产品经理，未经许可，禁止转载。\n题图来自 Unsplash，基于 CC0 协议", "thumb": "https://static.woshipm.com/tag/1101_1@2x.png ", "images": ["https://static.woshipm.com/tag/1101_1@2x.png ", "https://image.woshipm.com/2023/04/14/f972663a-da8d-11ed-b69c-00163e0b5ff3.jpg", "https://image.woshipm.com/wp-files/sha256/5b/4e/5b4e91bf91a85a98c7f309b8013b7ff2e3365d668bf228333d489a08fc13a985.png", "https://image.woshipm.com/wp-files/sha256/f1/1b/f11b45fd6ef3f2317afe3fd43611f2e12dcc3977677ed4d6992b622cd0b05f07.jpg", "https://image.woshipm.com/wp-files/sha256/50/58/5058a2a26684bcca0d9428d6da03b9a0ca0effa26682f3a0151d506ccf17830b.jpg", "https://static.woshipm.com/tag/1101_1@2x.png "], "tags": ["AI 产品"], "seen": false, "new": false, "daily": false, "score": 40.25700898331597}, {"guid": "d14bc8315597a4bb7674c9f19f891842", "title": "Macrohistory in Six Facts", "link": "https://basilhalperin.com/essays/macrohistory.html", "source": "Hacker News", "category": "tech", "summary": "Article URL: https://basilhalperin.com/essays/macrohistory.html Comments URL: https://news.ycombinator.com/item?id=50637891 Points: 43 # Comments: 11", "ts": "2026-11-25T03:04:46+00:00", "published": "11-25", "starred": false, "importance": 3, "topic": "AI 编程", "one_line": "宏观历史六事实，AI 评估数学问题重要性", "why": "", "inline_text": "宏观历史六事实\nAI 评估数学问题重要性\nLLM 评估数学问题排名", "full_text": "", "thumb": "", "images": [], "tags": ["AI 产品"], "seen": false, "new": false, "daily": false, "score": 30.25438745527778}, {"guid": "361a95afbb6bdcde2c43b6683 : false, "new": false, "daily": false, "score": 30.119022868506946}, {"guid": "1c17a94cce89b0e3c41cc58f8a504734", "title": "Notely", "link": "https://www.producthunt.com/products/notely-8", "source": "Product Hunt", "category": "ai_product", "summary": "Notion-grade power & BYOK AI, stored locally in SQLite Discussion | Link", "ts": "2026-11-25T00:50:46+00:00", "published": "11-25", "starred": false, "importance": 2, "topic": "", "one_line": "", "why": "", "inline_text": "", "full_text": "", "thumb": "", "images": [], "tags": [], "seen": false, "new": true, "daily": false}, {"guid": "7059b2fdc338cd4e5a85d0b4f2f50e97", "title": "豆包个人 AI 助理「小豆」开启公测；存储承压，小米三季度经调整净利润下滑近六成；红果短剧上线时间管理功能 | 极客早知道", "link": "http://www.geekpark.net/news/374438", "source": "极客公园", "category": "ai_product", "summary": "豆包旗下 AI 个人助理「小豆」开启公测，能够帮你处理日常事务 11 月 24 日消息，豆包官方今天宣布「小豆」正式开启公测，采用邀请制开放。用户凭邀请码即可开启体验，并获赠一定量免费额度。 小豆是豆包旗下的 AI 个人助理产品，采用对话式交互方式，在用户明确指令与授权范围内，协助你高效处理日常事务。官方宣称它是「一个懂你，还能主动帮你办事的豆包」。未来，小豆上的能力与体验也将逐步在豆包 App 上线。（来源：IT 之家） 特斯拉 Sp", "ts": "2026-11-25T00:44:18+00:00", "published": "11-25", "starred": false, "importance": 4, "topic": "AI 产品", "one_line": "豆包 AI 助理「小豆」公测，处理日常事务", "why": "了解最新 AI 产品，为作品集提供案例", "inline_text": "豆包 AI 助理「小豆」公测\n处理日常事务\nAI 个人助理产品", "full_text": "豆包旗下 AI 个人助理「小豆」开启公测，能够帮你处理日常事务\n11 月 24 日消息，豆包官方今天宣布「小豆」正式开启公测，采用邀请制开放。用户凭邀请码即可开启体验，并获赠一定量免费额度。\n小豆是豆包旗下的 AI 个人助理产品，采用对话式交互方式，在用户明确指令与授权范围内，协助你高效处理日常事务。官方宣称它是「一个懂你，还能主动帮你办事的豆包」。未来，小豆上的能力与体验也将逐步在豆包 App 上线。（来源：IT 之家）\n特斯拉 SpaceX 合并最新进展曝光\n据报道，马斯克旗下特斯拉与 SpaceX 的潜在合并交易迎来新进展，双方已经确定五名董事，分别负责指导各自特别委员会推进合并谈判。\n这五人中，三人来自特斯拉，分别是董事长罗宾·登霍尔姆、董事凯瑟琳·威尔逊-汤普森以及杰克·哈通。\nSpaceX 方面则由红杉资本合伙人鲁洛夫·博塔和董事兰迪·格莱恩参与。\n按照报道，这些董事被认为与潜在交易不存在直接财务利益冲突，因此负责代表各自公司审查合并方案，避免马斯克同时掌控两家公司带来的利益冲突问题。\n值得注意的是，双方的合并讨论并非刚刚开始。\n今年 10 月 20 日，马斯克已经公开确认，特斯拉和 SpaceX 董事会分别成立了特别委员会，研究两家公司进一步整合的可能性。\n特斯拉随后在向美国证券交易委员会提交的文件中披露，特别委员会将评估包括企业合并在内的多种合作安排，但不能保证最终交易一定能够完成。\n如今随着五名核心董事名单曝光，相关讨论已经进一步进入财务方案研究阶段。（来源：快科技）\n谷歌收购伦敦大楼建 AI 研发中心\n11 月 24 日，谷歌宣布，公司计划收购位于伦敦国王十字区的 6 Pancras Square 大楼，以扩大其在伦敦的办公园区。谷歌表示，此次投资将与公司在伦敦的 Central Saint Giles 办公楼及即将启用的 Platform 37 项目共同构成重要的 AI 研发中心，预计相关办公场所将容纳数千名员工，参与 Gemini、搜索和 YouTube 等产品的开发。\n谷歌产品为英国经济贡献 1400 亿英镑；公司此前宣布的 50 亿英镑英国投资计划，涵盖沃尔瑟姆克罗斯（Waltham Cross）数据中心、AI Campus 以及即将开放的 AI Exchange；为期十年的技能培训计划已培训超过 120 万英国人。公告称，这些办公室将成为数千名谷歌员工的办公场所。\n交易细节方面，谷歌在公告中没有披露收购金额或交割日期。据英国当地媒体报道，卖方之一 PSP Investments 的代表确认，双方已就谷歌收购这栋楼达成协议。据悉，2016 年，谷歌入驻国王十字区，成为\"知识区\"（Knowledge Quarter）的创始住户之一；如今宣布计划购下 6 Pancras Square，与 Central Saint Giles、Platform 37 两处办公场所一起，巩固其伦敦园区作为重要 AI 研发中心的地位。（来源：CNMO 科技）\n小米三季度经调整净利润下滑近六成，预计明年存储成本仍承压\n小米发布第三季度财报，单季营业收入约 1072.4 亿元，同比下降 5.2%；归母净利润约 38.76 亿元，同比下降 68.4%，经调整净利润同比下滑近六成。\n小米集团总裁卢伟冰表示，DRAM 供需紧张局面短期内难以缓解，手机平均售价预计将继续提高，汽车业务也将面临成本上涨压力。（来源：IT 之家）\n红果短剧上线时间管理功能，新增时间锁\n红果短剧近日正式上线「时间管理」功能，该功能由 10 月底推出的「休息提醒」和「睡眠提醒」升级而来，用户可按自身作息自行设置休息提醒间隔和睡眠提醒时间。\n此前版本中，红果短剧会在用户连续看剧达到一定时长或深夜看剧时，提示「是时候休息下啦」以及「好好休息，愿你有个好梦」；推荐页也可能出现由多个短剧角色出镜的提醒视频，提醒节奏由系统统一设定。\n新版将休息提醒和睡眠提醒进行了整合，两类提醒均默认保留「智能提醒」模式，同时允许用户主动调整。休息提醒可在每隔 30 分钟、1 小时、2 小时等间隔中选择；若未设置，系统仍按智能节奏触发。睡眠提醒可从 00:00、00:30 等夜间时段中选择，替代此前统一在零点触发的固定提醒。到设定时间后，页面会出现睡眠提示，引导用户结束当天观看。\n时间管理功能还新增「时间锁」。用户可设定单日使用时长，达到预定时间后界面进入锁定状态，需输入密码方可继续使用。是否开启、设定多长时长、如何解锁，均由用户主动选择，把「看多久」的决定权交还给使用者，为希望控制观剧节奏、按时休息的用户提供可自主配置的边界。（来源：头部财经）\nOpenAI 与 Anthropic 员工警告：内部 AI 模型能力过于强大，可能已无法安全发布\n二十余名知情人士透露，OpenAI 和 Anthropic 尚未公开发布的 AI 模型能力正迅速提升，部分内部研究人员认为，现有安全技术已难以有效控制这些模型，其能力增长速度正在超过人类监控和约束它们的能力。\n新一代模型在数学、科学、网络安全及 AI 研究等领域取得重大突破，但内部测试也发现，模型越来越善于利用奖励机制漏洞绕过安全限制，甚至能够隐藏真实推理过程，或向监控人员提供具有误导性的推理记录。\n相关问题已在两家公司内部引发激烈争论，部分研究人员主张停止公开发布未来的前沿模型，仅允许有限的内部部署，另有人员甚至呼吁暂停训练更先进的模型。\nOpenAI 表示已采用可能延缓模型发布的新安全要求；Anthropic 则表示，必要时愿意以牺牲商业利益为代价推迟模型开发或发布。若现有安全技术无法跟上模型能力提升的速度，AI 行业的技术迭代和商业化进程可能受到显著影响。（来源：新浪科技）\n音乐平台 Tidal 宣布封禁纯 AI 生成音乐，近三个月上传歌曲超四成为 AI 生成\n音乐流媒体平台 Tidal 宣布，将开始禁止并移除完全由 AI 生成的音乐作品，以应对平台上 AI 音乐投稿数量的快速增长。\nTidal 披露，过去 90 天内，上传至平台的歌曲中，超过 43% 由 AI 生成。这成为平台调整内容政策的重要原因。（来自：TechCrunch）\n小鹏发布图灵世界模型 WorldGPT，实现水陆空三栖规划\n近日，小鹏图灵世界模型家族新添一员——世界动作模型 WorldGPT。它在小鹏物理 AI 体系中作为云端 teacher model，依托基座模型实现跨本体能力蒸馏和迁移，降低新本体的开发边际成本。同时，给它历史画面和指令，它会规划动作，预演世界随之发生的变化，看懂场景的语义与结构并用语言进行推理决策。目前，这是首个能够在水、陆、空三栖六类本体完成预测与行动规划的世界模型。\n今天的物理 AI 大多是一机一栈：汽车一套系统，机械臂一套，无人机又是一套；机器种类越多，成本越高，数据也被切得越碎。难点在于，动作无法在机器之间直接共享。\n因此，小鹏设计研发了跨本体世界动作模型 WorldGPT。该模型承担了小鹏物理 AI 体系中云端 teacher model 的使命。更大模型容量做跨本体训练提取共有世界知识/学习通用动作直觉，针对不同本体提炼小型本地模型，做到通用能力与端侧部署兼顾。这一方式能够让一个本体从 0 训一遍，", "thumb": "https://imgslim.geekpark.net/uploads/image/file/ff/fb/fffb79ef7a1446c21efa7c94e7484da7.jpg", "images": ["https://imgslim.geekpark.net/uploads/image/file/ff/fb/fffb79ef7a1446c21efa7c94e7484da7.jpg", "https://imgslim.geekpark.net/uploads/image/file/83/67/836765e856b2c51241f465031d179ca5.png", "https://imgslim.geekpark.net/uploads/image/file/11/df/11dff5d4d454182560d2df383f1eb7dd.png", "https://imgslim.geekpark.net/uploads/image/file/8e/05/8e05d2ef2db3e90af9eb81a55623f4d4.png", "https://imgslim.geekpark.net/uploads/image/file/7d/ee/7dee0559040c18d2d328a9fa674044f9.png", "https://imgslim.geekpark.net/uploads/image/file/e2/3b/e23bea662119363cda6968c005e079a3.png"], "tags": ["AI 产品"], "seen": false, "new": false, "daily": true, "score": 40.10806800717014, "rank": 3}, {"guid": "b056d8bcb7239e85a7f6d1369025f295", "title": "Here in the World: Letters of Albert Camus, 1944–1959", "link": "https://literaryreview.co.uk/here-in-the-world", "source": "Hacker News", "category": "tech", "summary": "Article URL: https://literaryreview.co.uk/here-in-the-world Comments URL: https://news.ycombinator.com/item?id=50636925 Points: 46 # Comments: 4", "ts": "2026-11-25T00:36:43+00:00", "published": "11-25", "starred": false, "importance": 3, "topic": "AI 编程", "one_line": "阿尔贝·加缪书信集，1944-1959 年间", "why": "", "inline_text": "阿尔贝·加缪书信集\n1944-1959 年间\n文学作品", "full_text": "", "thumb": "", "images": [], "tags": [], "seen": false, "new": false, "daily": false, "score": 30.100168701354168}, {"guid": "0e68c424e26ab5229317d3e28c26c4f8", "title": "派早报：华为发布 Mate X8 与 MateBook Fold S、微软将推出自研驱动等", "link": "https://sspai.com/post/119527", "source": "少数派", "category": "vibe", "summary": "豆包 AI 个人助理「小豆」开启公测，Teenage Engineering 推出复古 CD 播放器 EP / BC-1 等。 查看全文", "ts": "2026-11-25T00:22:35+00:00", "published": "11-25", "starred": false, "importance": 4, "topic": "AI 产品", "one_line": "豆包 AI 个人助理「小豆」公测，处理日常事务", "why": "了解最新 AI 产品，为作品集提供案例", "inline_text": "豆包 AI 个人助理「小豆」公测\n处理日常事务\nAI 个人助理产品", "full_text": "华为发布 Mate X8 与 MateBook Fold S\n11 月 24 日，华为发布 Mate X8 与 MateBook Fold S。Mate X8 分为标准版与典藏版，提供紫金锦、青云锦、丹霞锦、苍穹黑、雪域白 5 种配色，其中标准版定价 12999 元起（12+256GB），典藏版定价 15999 元起（16+512GB）。\nMate X8 展开态约 4.2 mm，折叠态厚度约 8.95 mm，核心规格方面，全系搭载麒麟 9050 Pro「逻辑折叠 τ」芯片，整机性能提升 31%。麒麟 9050 系列的混合键合超过 5000 万，有效信号互连超过 500 万条，晶体管密度提升 53.5%。该芯片集成灵犀 CPU、马良 GPU 与达芬奇架构 NPU。其中 CPU 最高频率提升 12.7%，大核能效提升 41%；马良 GPU 计算单元与缓存翻倍，GPU 性能提升 40%，能效提升 45%；NPU 算力提升 140%，能效提升 66%，支持端侧部署 30B 参数的混合专家大模型。屏幕方面，Mate X8 外屏采用第二代灵珑屏，1% APL 峰值亮度为 12000 nits，20% APL 峰值亮度为 6000 nits；内屏采用新一代超高亮发光材料，1% APL 峰值亮度为 8000 nits，20% APL 峰值亮度为 4500 nits。\nMate X8 配备后置四摄，包括 5000 万像素连续可变光圈 OIS RYYB LOFIC 18 EV 主摄、5000 万像素 RYYB F2.2 潜望式长焦镜头、4000 万像素 RYYB 超广角镜头以及第三代红枫原色摄像头；此外 Mate X8 支持睿影 Z10 模块相机。音频与通信方面，该机支持 4 mic 全空间拾音，人声识别能力为 94%，识别距离为 8 米，并支持四卡三待通信。系统方面，Mate X8 预装 HarmonyOS 7，支持沉浸光感、全景多窗与伴随式 AI 等功能。\n同场发布的还有华为首款鸿蒙小折叠电脑 MateBook Fold S，定价 14999 元起。该机展开厚度 6.49 mm、重 639 g，内屏为 14.7 英寸 3240×2160 分辨率 120Hz OLED 面板，峰值亮度 1600 尼特，折叠后为 10.2 英寸；外屏是 980×980 分辨率 120Hz 的 Live 小方屏，峰值亮度 2500 尼特。搭载麒麟 XE90 芯片与立体分流散热架构，性能释放 22W，提供幻夜黑、天际白、云海蓝三种配色。SKU 方面，16GB+256GB 含键盘与内胆包 14999 元，最高 32GB+1TB 限定套装 24999 元，另有非凡大师版 32GB+2TB 定价 29999 元。星跃折叠键盘单独售价 1299 元，新机 11 月 27 日开售。来源\n1\n,\n2\n11 月 24 日，微软在 Ignite 大会上确认将用自研驱动替换更多第三方驱动。微软表示公司正在开发更多类别硬件的自研驱动，这批自研驱动覆盖打印机、音频、USB 以太网和摄像头等硬件类别。当前 Windows 已经内置了一批驱动，覆盖基本显示、NVMe 存储驱动、USB HID 设备驱动与 USB 视频类摄像头驱动等。微软称 Windows 目前有数以万亿计的活跃驱动，由成千上万家合作伙伴负责维护，微软希望通过统一类驱动，一方面为兼容设备提供基础功能，另一方面也为兼容设备提供统一的更新渠道。与此同时，微软也希望借助统一类驱动，减少 OEM 重复开发和维护驱动的工作。微软还把安全性列为这次调整的重要目标之一。\n同一批调整中，微软还宣布将移除蓝牙 MTP（媒体传输协议）。MTP 主要用于 Windows 系统读取和管理手机、相机、便携播放器里的文件，除了传输文件外，还支持读取媒体元数据与媒体库同步。这一功能移除后，只有依赖蓝牙 MTP 做文件管理、媒体同步的设备会受到影响，微软建议用户改用 USB MTP 管理外接设备里的文件。Windows 11 原有的蓝牙收发文件功能则不受影响，因为系统的蓝牙文件传输向导使用的是 OPP（对象推送协议），并非 MTP。同一批被废弃的还有 Windows 版微软家庭安全应用，该应用将在商店下架、新版 Windows 不再预装，并于 2027 年末从系统移除，但服务本身仍可通过移动端 App 或网页后台继续使用。来源\n1\n,\n2\n11 月 24 日，豆包官方宣布，AI 个人助理「小豆」正式开启公测。本次公测采用邀请制，用户需要凭邀请码进入体验，并可获赠一定量的免费额度。产品定位上，小豆是豆包旗下的 AI 个人助理产品，采用对话式交互方式。实际使用时，小豆会在用户给出明确指令与授权的范围内，协助用户处理各项日常事务。\nApp Store 商店页中列出了小豆目前具备的多项能力，涵盖信息查询、日程待办、生活服务、购物售后、健康提醒与办公辅助。其中，信息查询支持获取天气、新闻、知识与生活常识。日程待办支持用户通过文字或语音的方式，添加日程、待办与提醒。生活服务方面，小豆能够提供查快递、找周边与搜攻略功能。购物售后方面，小豆支持用户查订单，并可进行退换货与售后咨询。此外，小豆还提供健康提醒与办公辅助功能。健康提醒包括喝水、用药与运动打卡，办公辅助则可以帮助用户写文案、理思路与做总结。\n豆包表示，小豆上的能力与体验未来会逐步在豆包 App 上线。\n来源\n11 月 24 日，瑞典厂商 Teenage Engineering 推出复古 CD 播放器 EP / BC-1。该设备采用浅灰色复古设计，主要面向专业用户和 DJ，采用模块化设计，可安装扬声器配件。\nEP / BC-1 的播放速度可在 50% 至 150% 之间调节，并配备数码显示屏，用于显示当前曲目、播放时间与 VU 音量表。此外，该播放器支持 CD 抓轨功能，采样规格为 16-bit/44.1 kHz。在接口与续航方面，EP / BC-1 配备 USB-C 接口，同时支持通过蓝牙或 3.5 mm AUX 接口连接耳机和扬声器。该设备采用内置电池，续航时间可达 6 小时。\nK.O.–AMP 35 为该播放器的配套扬声器，机身尺寸为 22.8 × 26.8 × 17.6 cm，重量为 3.2 kg，配备可充电电池。功能配置上，这款扬声器提供 8 种内置效果预设与 6 个可同时使用的音频输入，其中包括麦克风 XLR 接口与吉他 6.35 mm 接口。价格方面，EP / BC-1 已上市，单机售价 299 欧元（约合 2191 元人民币），搭配 K.O.–AMP 35 的套装售价 599 欧元（约合 4390 元人民币）。\n来源\n11 月 24 日，拓竹发布 3D 打印机 P3C，标准版首发定价 7499 元、七头闪切版 8479 元、多线径耗材版 8579 元、工作站版 10049 元。\nP3C 搭载与 H3C 同代的 Swaptek 多头闪切系统，标配 5 个打印头，支持 5 头自由切换，增购可实现至多 7 头打印。系统将加热提前到换头前，上一个打印头工作时下一个待用打印头已预热，换头后无需等待加热即可开打；换头、换料到继续打印最快 6 秒完成，降低换料废料。可升降式闪切", "thumb": "https://cdnfile.sspai.com/2026/11/25/article/48a4e38f-00f4-b1e5-9581-c02a5d115f51.png?imageMogr2/auto-orient/thumbnail/!1536x660r/gravity/center/crop/1536x660/ignore-error/1", "images": ["https://cdnfile.sspai.com/2026/11/25/article/48a4e38f-00f4-b1e5-9581-c02a5d115f51.png?imageMogr2/auto-orient/thumbnail/!1536x660r/gravity/center/crop/1536x660/ignore-error/1", "https://cdnfile.sspai.com/2026/11/25/article/98ab5571a02ac2cad5e9f4382fff3034.jpeg?imageView2/2/w/1120/q/90/interlace/1/ignore-error/1/format/webp", "https://cdnfile.sspai.com/2026/11/25/article/c83eca5b5a796186a7a8cdec05b3a94c.jpeg?imageView2/2/w/1120/q/90/interlace/1/ignore-error/1/fo 存里，Inkling 2 Mini 单路跑到 33.6 tok/s，四并发总吞吐 60.6 tok/s，比同机 Unsloth 快一半以上，综合能力与 Qwen 3.8 27B 打平。循环稀疏 MoE 是它没被带宽卡死的关键。 作为大模型本地部署爱好者，时常看下 Huggingface 开源模型排行榜是我的基操 本文我们一起看看正在霸榜的 Inkling-2-Mini 过去大半年", "ts": "2026-11-24T06:22:01+00:00", "published": "11-24", "starred": false, "importance": 4, "topic": "AI 编程", "one_line": "对比 Qwen3.8-27B 大模型在本地部署的性能", "why": "学习大模型本地部署的最佳实践，提升产品性能", "inline_text": "Inkling 2 Mini 在 24G 内存中表现优异，吞吐量比同机 Unsloth 快一半以上", "full_text": "在 Apple M6 Mac mini 的 24 GB 内存里，Inkling 2 Mini 单路跑到 33.6 tok/s，四并发总吞吐 60.6 tok/s，比同机 Unsloth 快一半以上，综合能力与 Qwen 3.8 27B 打平。循环稀疏 MoE 是它没被带宽卡死的关键。\n作为大模型本地部署爱好者，时常看下 Huggingface 开源模型排行榜是我的基操\n本文我们一起看看正在霸榜的 Inkling-2-Mini\n过去大半年，Qwen 3.8 27B 一直是本地部署党的心头好，至今在 HF Top 10 依然可以见到它的身影，比如上周末刚详细介绍了针对 Pi 这个 Harness 优化的 Qwen3.8-27B-pi-adapted：Agent 绝配版 Qwen3.8-27B，关掉思考，更稳更快！\nQwen 3.8 27B 能力稳，但全量稠密架构一进 24 GB 内存的 Mac 或单卡机器，吐字速度就被带宽死死卡住\nThinking Machines Lab 刚开源了\n循环稀疏 MoE\n新模型 Inkling 2 Mini，主打普通笔记本离线跑多智能体\n我第一时间在手头这台 Apple M6 Mac mini上，把 Strata 和 Unsloth 两套路线跑了一遍\n省流：\n综合实力和 Qwen 3.8 27B 基本平分秋色，写代码与调工具还更凌厉；本机 Strata 单路最高跑出 33.6 tok/s、四并发总吞吐干到 60.6 tok/s，比同机 Unsloth 快出一半以上\n为什么能跟 Qwen 3.8 27B 打平，速度还更快\nInkling 2 Mini 速度够快，最核心的还是 MoE 架构，外加\n原生低比特训推一体\n，前 20 层用 NVFP4、后 4 层用 MXFP8 从头训到尾，放出来的整包约 20 GB，几乎没有传统量化折损，同时\n自带视觉编码器和 1M 上下文\nInkling 2 Mini 循环稀疏 MoE 与 Qwen 3.8 27B 稠密架构核心对比\nInkling 2 Mini 与 Qwen3.8-27B：\n综合水平打成平手，但主场完全不同\nInkling 2 Mini 明显偏科向\n写代码、多步骤修 Bug、调用工具联网查资料、百万级长文检索和看图操作界面\n倾斜，斯坦福团队实测它的单位功耗智能效率也远超同体量稠密对手，官方甚至演示过一台离线 MacBook Pro (M5 Pro, 48GB) 同时驱动二十个自主活动的像素小镇角色\n也有网友测试出了与 Hy4 flash 掰手腕的场景\n反过来，Qwen 3.8 27B 的稠密大权重底子还在：\n日常中文办公、多轮复杂约束对话、不联网靠记忆答事实题的防幻觉能力\n，依然是它更稳当\n24 GB Mac mini 双引擎实测：Strata 快出超一半\n老章办公室这台测试主机 Mac mini（Apple M6 芯片，12 核，24 GB 统一内存），系统给单进程 Metal GPU 的推荐工作集上限约 18.6 GiB\n性能实测，我对比了两个部署方案，都是我们的老朋友了 Unsloth VS Strata：\nStrata 路线\n：升级到 0.2.19，使用原生 Metal 引擎 strata-inkling 跑 10.47 GB 的 SQ-10 打包版（32K 上下文全常驻）\nUnsloth 路线\n：使用官方适配循环层与 DSpark 的预编译版，跑 16.61 GB 的 Inkling-2-Mini-UD-Q4_K_M.gguf 与 384 MB 的 dspark-Inkling-2-Mini-Q8_0.gguf\n两套引擎的底层基准与代码、数学、中文三类真实 API 对话实测如下：\n测试方案与配置\n体积 / 内存占用\n预填充 (tok/s)\n单路生成 (tok/s)\n并发总吞吐 (tok/s)\nStrata 基准（SQ-10，32K）\n10.47 GB / 占 12.03 GiB\n564.4（512 词）/ 440.5（2K 词）\n32.8（fp16）/ 峰值 33.6（k8v4）\n2 并发 52.5 / 4 并发 60.6\nStrata 真实 API（SQ-10，32K）\n12.03 GiB（含 DSpark）\n短提示 111 ~ 150\n默认 27.6 ~ 27.8 / 贪婪 28.5\n4 路真实 API 总计 47.63\nUnsloth 基准（UD-Q4_K_M）\n16.61 GB（15.46 GiB）\n260.18（512 词）/ 236.93（2K 词）\n20.94（tg128）/ 21.77（tg256）\n—\nUnsloth 真实 API 常规（8K）\n紧贴 18.6 GiB 上限\n短提示 22 ~ 50\n代码 21.24 / 数学 21.76 / 中文 21.49\n—\nUnsloth + DSpark（4K）\n权重 + 草稿逼近上限\n短提示 25 ~ 55\nn=3 降至 15.00 / n=7 降至 12.08\n—\n同机同模型，Strata 靠内存映射 0.01 到 0.04 秒就能加载完毕，开满 32K 上下文只吃 12.03 GiB，预填充是 Unsloth 的 2.17 倍，单路峰值高出 54%，四并发总吞吐冲上 60.6 tok/s（6 并发才触碰 24 GB 内存上限）\n如果老铁们手头有高配显卡，上限还能翻倍飙升\n按 Strata 官方在二十台设备上的实测数据，Apple M5 Max 单路能到 100 ~ 114.5 tok/s，RTX 5070 12 GB 跑 93.9 ~ 101.4 tok/s，RTX 5070 Ti 16 GB 飙到 155.5 tok/s，RTX 5090 单路冲到 176.5 ~ 250.3 tok/s、64 并发总吞吐超 4,000 tok/s：\nStrata 官方在 20 款主流显卡与苹果芯片上的单路及预填充测速参考\n跑下来，分享两个部署的坑和三个模型短板吧\n部署第一个坑\n：默认参数在 24 GB Mac 跑 Unsloth 直接 OOM\nUD-Q4_K_M 权重占 15.46 GiB，离 Metal 上限只差 3 GiB，按 llama-server 默认多槽位加半精度缓存启动直接报内存不足，必须锁单槽位、压 8-bit 缓存并开 Flash Attention\n部署第二个坑\n：标准版 Apple M6 上开 DSpark 反而越猜越慢\n实测 Unsloth 挂上草稿模型后，采纳率只有 28% ~ 38%，可每次批量核验都要重跑 48 层循环，直接把代码速度从 21.24 tok/s 拖垮到 15.00 甚至 12.08 tok/s，中文更是掉到 8.66 tok/s；标准版 M 系列芯片关掉草稿更快，高带宽旗舰卡才吃得消这套加速\n模型本身的三个槽点：\n中文偏硬，思考爱飙英文\n：实测中文提问时，它的内部思考默认先走英文，最终回答虽准确但句式偏短，官方也承认中文场景偶发中英夹杂\n思考关不死，排错偶发死循环\n：即便把思考强度调到最低仍会轻度推理，复杂调试时偶尔反复自检，接本地 Agent 务必卡死最大输出和步数，并在沙盒运行\n离线问冷门事实不占优\n：循环", "thumb": "https://static.woshipm.com/tag/1101_1@2x.png ", "images": ["https://static.woshipm.com/tag/1101_1@2x.png ", "https://image.woshipm.com/2023/05/06/c97d24e0-ec00-11ed-96ae-00163e0b5ff3.jpg", "https://image.woshipm.com/wp-files/sha256/73/41/73412f7c10ed9d0e7c805501d566aaf574bc03161fb2079781e43506ea7a3ef7.png", "https://image.woshipm.com/wp-files/sha256/4c/23/4c23d67c454265b06bdd04c1038f4af023e20601d8d200d4a2216f92173c16f6.jpg", "https://image.wo 法把旧对话全导出来重新喂进去，非常麻烦。\n用\nWorkBuddy 的「跨电脑数据迁移」\n，主要就是能把\n对话上下文和本地产物结果一起导过来\n（本机如果还有 Claude Code、Cursor、ChatGPT 的记录，也能先从旁边的「导入其他应用数据」导进 WorkBuddy 再一起迁走）。\n而刚好我这两个 Blender 项目之前都是在 Claude Code 里跑的。\n这次操作很简单：先在老 MacBook 上把记录导进 WorkBuddy，再去 RTX Spark 的 WorkBuddy 上打开\n设置 → 数据导入 → 导入其他电脑数据，选中旧电脑点「全部导入」，\n挂着等它传完就行，前前后后一共导过来 100 多项记录：\n像任务本身、聊天记录、WorkBuddy 托管目录里的工程文件，还有建好的分组（含绑定的文件夹、记忆、本地 Skill）以及定时任务，都会一起带过来。\n导进来的文件会单独放在 ~/WorkBuddy/{设备名}/ 下面，和本机原有的文件分开存；\n定时任务迁过去默认是关着的\n，免得两台电脑同时跑：\n单个产物只要不超过 100M 都能正常传，断网或重复导入也会自动去重（\n实测遇到超过 100M 的大文件，可以先走「资料库」上传，到了新机直接从资料库里拉出来接着用\n）：\n01 / 02\n02 / 02\n不过有一点得提前留意：\nMCP、日志，以及平台全局下发的 Skill、专家和全局记忆\n目前不会跟着走，换完电脑需要重新配一遍。\nps. 如果你点进去没看到入口，或者刷不出旧电脑，可以先查一下这三处：\n1. 两台电脑的客户端都升到\n5.11.3\n以上，登录同一个账号；\n2. 旧电脑连着网，WorkBuddy 保持打开；\n3. 打开\n「允许移动设备远程连接」\n。如果旧电脑习惯锁屏，去「设置 – 通用」里把锁屏运行改成「熄屏后保持唤醒」就能继续传。\n02 接着原来的对话重跑：混元 3D 换高模 + GPU 开光追\n数据导完，在 RTX Spark 上点开原来的圆明园任务，我先让它复述了一下之前的进度，从早期建模、参考图包到中间返工的细节全记得清清楚楚；\n把主场景工程包补拖进去，就能直接在原对话底下接着往下跑了：\n最省心的一点是，之前定好的建筑朝向、石材比例和避坑要求全留在上下文里，不用再去翻半个月前的参考文档，直接把新需求往下接，它就能顺着原来的脚本命名继续改。\n换到这台 N 卡机器上跑 Blender，渲染直接走 GPU，\nGPU 利用率拉到了 95%\n，之前在笔记本上不敢开的光追这回也能正常开了。\n先看《飞行特斯拉》。\n原来调好的车身和飞行动作不用动，主要是换人和补光影。\n我先用本地部署的\n混元 3D\n生成了几个高精度、高面数的人物模型，替换掉展台围栏后面那排灰扑扑的代码小人（左下角那个像白胶囊一样的卡车头也顺手换了）；\n打开光追重渲之后，点火离地时车底映在地面上的冰蓝色漫反射和尾气层次比之前自然多了：\n再看《圆明园海晏堂》。\n因为原对话里已经保留了 1786 年铜版画参考和十二生肖的排布要求，接着改很舒心。\n它还顺手排查出旧工程脚本默认回退到了 CPU 渲染，切回硬件光追之后，从之前在 MacBook 上只能出一个 6 秒 960×540 小样，直接跑出了一条\n2 分钟的 1080p 完整成片\n，把海晏堂、谐奇趣、黄花阵和大水法全串了起来：\n同机位抽帧对比看得更清楚：\n不仅把旧版误涂成全铜色的雕像改回了「红铜兽首 + 汉白玉石袍」分色，开了光追、调高渲染之后，天上多了真实的体积云，水池里的波纹和倒影也写实了很多，岸边石阶与建筑倒映在水面上，把整个水面的质感很好地映衬了出来：\n大场景视频跑完，最后我还把\n十二生肖兽首\n这个坑给补上了。\n前几天在\nSeedance Agent\n那篇里，我是拿这套 Blender 白模当空间底图去跑 2D 视觉复原，当时 3D 工程里的兽首其实还是纯几何体拼的简模。\n这次顺着原对话接着往下做：有文物照片的鼠、牛、虎、兔、马、猴、猪 7 尊按实物参考走，缺实物的龙、蛇、羊、鸡、狗 5 尊结合铜版画先补齐三视图，再统一取右侧视角送进本地部署的\n混元 3D\n工作流转成高面数网格：\n混元 3D 工作流直接把原图变成 3D 模型\n01 / 03\n02 / 03\n03 / 03\n把这十二尊高模替换回海晏堂水池边，单独跑出来的静帧，细节总算能称得上是「复刻」了（时间关系兽首这版只出了静帧渲染图，没再重跑整条视频，因为哪怕用 Spark 跑一次这种精度的渲染都要 12 个小时。。。）：\n01 / 02\n02 / 02\n也是到拉近特写才发现个更搞笑的事，原来一开始建模时兽 云存储优惠活动，终身订阅 1TB 特价 129.9 美元", "why": "", "inline_text": "免费 10GB 空间，支持 WebDAV、Rclone，终身订阅 1TB 特价 129.9 美元", "full_text": "", "thumb": "", "images": [], "tags": ["AI 产品"], "seen": false, "new": false, "daily": false}, {"guid": "87d21e1bb7378b7e0e74df37969e2dac", "title": "释放AI与出海强预期，近1500人参与亿邦产业互联网年会暨首届产业智能体大会", "link": "https://www.qbitai.com/2026/11/512305.html", "source": "量子位", "category": "ai_product", "summary": "2026年11月20日，第八届亿邦产业互联网年会与首届产业智能体大会在北京国贸大酒店首次合体举行。", "ts": "2026-11-24T03:21:12+00:00", "published": "11-24", "starred": false, "importance": 3, "topic": "AI 产品", "one_line": "亿邦产业互联网年会暨首届产业智能体大会举行", "why": "", "inline_text": "近 1500 人参与，AI 与出海强预期，产业智能体大会举行", "full_text": "< img id=\"wx_img\" src=\"https://www.qbitai.com/wp-content/uploads/imgs/qbitai-logo-1.png\" width=\"400\" height=\"400\">\n释放AI与出海强预期，近1500人参与亿邦产业互联网年会暨首届产业智能体大会\n量子位的朋友们\n2026-11-24\n11:21:12\n来源：\n量子位\n2026年11月20日，第八届亿邦产业互联网年会与首届产业智能体大会在北京国贸大酒店首次合体举行。\n文丨亿邦智库\n2026年11月20日，第八届亿邦产业互联网年会与首届产业智能体大会在北京国贸大酒店首次合体举行。从2019年算起，亿邦产业互联网年会已经走到第八年，年度主题从“谁在重构产业链”到“解锁新周期”，随产业周期与年度命题持续迭代。本次大会强调AI与出海带来的“模态进化”，产业智能体引发业界普遍共鸣，热议产业互联网增长逻辑正在经历着一场什么样的模态切换。仅现场实况图片交互就达22594人次，亿邦视频号直播观看达63788人次。\n本次大会开幕演讲中，经济学家李稻葵从宏观层面为产业AI、产业智能体和产业出海，作出了一个时代背景的解释框架：中国AI发展比美国更具可持续性。产业AI和智能体不是孤立的技术竞赛，而要嵌入中国高储蓄率、低成本资金和完整产业体系所决定的产业升级与全球化进程之中；产品、企业、产业链供应链出海是必然方向，“抱团出海、带动全产业链布局”将成为常态。\n著名经济学家 李稻葵\n亿邦动力董事长、亿邦智库院长郑敏在发布\n《模态进化——2026产业互联网发展报告》\n时，给出了一个贯穿全场讨论的基调判断：产业互联网从来不是抢蛋糕的角色，而是做蛋糕的角色；AI与出海，是当前业界高共识的增长路径。围绕这条主线，大会设置产业智能体落地、AI供应链价值重构、数据要素与Token经济、AI打开产业服务新场景、产业出海新生态五大议题，数十位产业互联网企业决策人与行业专家在一天议程中，将“模态进化”拆解为可对照、可讨论的企业实践。\n按照这两条大会形成的确定性路径共识，我们来梳理一下参会菁英们的核心观点与企业动作，以飨读者。\nAI带来的模态进化：产业智能体怎么干\n“今年完全可以称之为产业智能体的元年。”郑敏在报告中将产业智能体的竞争力建设归纳为四个方向：数据、生态、质控，以及以Token为特征的收入。元年是启动，远未到成熟。郑敏还同时点出一个容易被热闹掩盖的事实：AI覆盖率达到90.6%，数据治理体系建成率78.4%，部署面已经铺开，但“数据不等于能力”——把决策系统做成可自主执行的制度，把组织经验转化成可调用的结构，这一步没有外部供给可以直接购买，只能靠企业自己走出来。\n震坤行副总裁苏钰称，可以将企业拥抱AI的路径分为三层：第一层是AI赋能提效，在原有业务边界内放大服务能力；第二层是AI重塑流程，依托产业链站位重构价值、开拓新业务；最高阶是生长出完全由AI驱动的原生业务。他把目光投向“物理AI”，认为数字世界的应用已经过载，真正能承载下一轮几何级Token增长的，是AI走向工厂、走向物理世界的原生场景。\n腾讯云行业生态总经理张林的判断与之呼应，但更偏向组织的视角。他认为：“Agent是组织能力放大器，企业不必等待万能智能体，而应先把最烦琐、最痛的业务流程提炼出来交给AI。”他观察到，AI的运行模式正在从“在预设流程内辅助提效”转向“给定目标后自行拆解任务、调动原子能力、同步正负反馈”，组织架构也随之从大部门模式向小团队乃至一人公司演化。\n乐观叙事之外，科力普科技集团CTO张少鹏给智能体的落地加了一道“可靠性”的约束性注脚。他算了一笔采购流程的账：从需求提报到结算售后大约8个环节，如果AI在每个环节都做到95分，8个95%相乘只剩约66%——“大约每三张采购单，就有一张会在某个地方出问题”。他的结论是，企业采购AI的核心目标不是简单的降本增效，而是“把复杂度降下去、把确定性提上去”；边界清晰、例外可纠、全程可追溯，AI才能从“能用”走到“可靠”。这与王煜的“卖确定性”形成呼应：前者谈的是流程可靠性，后者谈的是平台价值兑现方式。\n中铁工业有限公司总经理杨皓岚把采购行业的发展，作了一个直推到智能体门槛上的演进分析。他把采购行业划分为三个阶段：传统社会联系时代，线下采购高度依赖采购人员的谈判能力；自助阶段，以门户商城为入口实现采购全流程线上化；而当前正加速进入智能体阶段。不同于前两个阶段围绕“人怎么买”优化采购方式，智能体阶段的变化是采购决策主体的迁移——平台服务对象从采购人转向采购人配置的智能体，行业护城河也将从规模、流量转向数据与信用。他与张少鹏的“可靠性”判断形成互补：前者回答“能不能可靠地干”，后者回答“谁来决定让不让它干”。\n但是，数据基础底座的差距，在整个行业的转型升级中还是很明显的，在电子元器件行业则体现得更为具体。云汉芯城李鲲鹏提出AI落地要过“三道关”：产业数据的结构化与统一口径、模型答案有分级可验证的证据链、打通上下游完成交付闭环。\n产业互联网和人工智能落地专家  谢 海\n产业互联网和人工智能落地专家谢海的表述更为凝练：“AI的终点是产业现场。”单个智能体能力强，并不等于整个组织的效率提升，真正拉开差距的是场景挖掘、数据沉淀、智能体编排与运营治理。\nPureblueAI清蓝联合创始人王立新则从需求入口的另一侧提醒品牌方：AI应用用户规模已达31亿，AI单次回答通常只展示3至4个品牌，曝光是零和博弈，品牌的营销逻辑正从“被检索”向“被信任”跨越，必须在模型的隐空间中建立可被引用的认知印记，弥补自身的数据不足。\n陕煤物资商城公司董事长王菲在主持圆桌对话时，就把能源物资场景的难题摆得很具体：品类繁杂、大量非标设备配件，AI辅助物资选型、需求归集与风险预警时会遇到知识库建设难度大、人员接受度不一、上下游数字化水平参差不齐等问题。她的判断是，产业智能体绝不是通用的聊天机器人，其根基是深厚的行业知识与高质量数据库；它必须能切实解决复杂非标场景下的物资选型、需求归集与风险预警等问题，同时要在数据安全合规的前提下，通过分层治理实现产业链内外的数据闭环。她提出数据治理宜分三层：公开数据依规公开，脱敏数据用于定向交互，核心数据做好安全保留。王煜对此补充，国有企业原则上原始数据不能出域，但经过加工形成的数据产品可以对外输出，需要搭建可信数据空间，并与成熟专业机构合作打造数据产品，进而实现整体数据闭环。\n国联股份董事、高级副总裁潘勇则从大宗工业品的行业特性出发，给出智能体落地的优先级判断。他指出，工业大宗品交易规模大、毛利率低，每一个环节省下来的成本都会直接转化为利润，AI相比传统数字化工具最突出的优势，是能打破原有固定公式框架，开展更灵活的预测、计算与分析；其中最核心的环节是价格预测——过去依赖资深员工经验判断，在当前市场波动加剧背景下有效性不断下降，有效的价格预测模型将为全行业经营效率提升带来极大助力。\n西部证券投资银行总部董事总经理翟晓东从投行与资本视角补上了两个容易被忽略的维度。其一是数据价值：产业互联网平台在交易撮合、履约服务中产生大量价格、交易量与企业真实采购决策行为数据，其数据生成能力和规模与一般制造业企业相比存在十倍甚至", "thumb": "https://i.qbitai.com/wp-content/uploads/2026/11/3fbce4f7d5bccc4ccf3162d3461c2f06.png", "images": ["https://i.qbitai.com/wp-content/uploads/2026/11/3fbce4f7d5bccc4ccf3162d3461c2f06.png", "https://i.qbitai.com/wp-content/uploads/2026/11/39b5cda5f7ace2a60bd5 研发启动之前，代价从两个月人力变成几天时间。\n小蓝带团队花两个月给一个大客户做了一套定制功能，从调研到上线按标准流程走完，按时交付落地。\n一个月后看数据：\n客户只走了基础配置，核心链路那套规则基本没用起来，平台上的业务量和前六个月平均水平持平，没有增量。\n这类坑在大客户定制里太常见了。\n贵不在于做错，在于发现太晚\n：等上线才看出来，人力成本已经投进去了。\n下面就从小蓝这个项目拆开看：\n能不能在投入研发之前，就先知道它到底有没有用？\n一、案例：小蓝的定制项目，两个月做完，没人真正用起来\n1. 项目场景\n客户提了一套定制化改造需求，口头讲了业务痛点，最后撂下一句“你们先做，我们肯定用”。\n销售侧为了维护这个大客户，把这套需求标成了高优先级项目。整个调研只对接了客户对接人和内部销售，没走到一线操作岗位。\n团队按标准流程推进：\n需求调研后，产品输出原型，交付 UE 输出交互稿、UI 输出带跳转链接的高保真 Demo。\n之后由产品经理组织会议，对着这份高保真 Demo，给销售、内部业务、客户对接人讲解流程、演示页面跳转。\n大家听完讲解，看起来流程是通的，没有提出异议。随后输出 PRD、完成技术评审，研发投入两个月集中开发、测试，按节点顺利交付上线。\n结果是，\n功能按期上线，验收一次通过，没有缺陷。但这套东西上线之后，就\n没再打开过几次\n。两个月的人力全部沉没，换回来的只是合作关系没掉。\n2. 为什么上线后没用起来？\n深挖之后发现，问题出在前置方案确认环节。\n1）需求转述失真\n一线操作人员的真实诉求，经过客户对接人、内部销售两层转述之后，需求被加工放大。\n小蓝拿到的，并不是一线员工真实工作里的痛点，而是被包装后的“想要”。\n2）看演示 ≠ 自己跑通\n老流程产出的高保真 Demo，依赖产品经理口述讲解流程。客户、业务人员是跟着产品的思路“看演示”，而不是自己上手、在自己真实业务场景里操作一遍。\n很多操作别扭、和原有工作习惯冲突的问题，在被动听讲时很难被感知。\n注：这里说的跑通，指的是业务流程走得通、一线客户用起来顺，不是技术上能不能实现。\n3）优先级判断错位\n项目的紧急，来自销售端维护客户关系和业绩的压力，不是不做这个功能客户的业务就跑不通。属于“维稳型需求”，而非“刚需型需求”。\n客户那句“你们先做，我们肯定用”，不需要他花什么成本。做不做、做多久、上线后没人用、后续维护，全落在小蓝他们这边。一句承诺，最便宜的支持。\n客户拿友商支持作为谈判筹码，销售更着急了，心想：“再不紧跟节奏，大客户就要跑了，业绩要落空了”。\n4）验证拖到上线之后\n原型→交互→高保真，需要产品、UE、UI 多方依次投入人力产出物料；方案确认、启动研发之后，又沿着排期一路推进，中间没有验证节点。\n方案到底跑不跑得通，往往要等开发上线、客户在自己业务场景里走一遍才暴露，那时两个月研发和前面所有设计资源已经是沉没成本。\n而且，需求只对这一家客户成立，一旦为它动到所有客户共用的主线，后面就得一直维护，想改就得推倒重来。\n基于这些复盘结论，需要一套新的工作方式，把验证前置。下面就借鉴 FDE 的思路，重构这套大客户定制流程。\n二、解法：FDE 式的前置验证\n1. FDE 到底是个什么思路？\nFDE（Forward Deployed Engineer，前沿部署工程师）\n最早来自 Palantir（美国做政企数据平台的软件公司）：把工程师派到客户现场，在客户真实的业务数据和真实流程里把方案跑通。\n落到产品工作上，核心就一句：\n先把方案跑通，再投设计研发\n。\n做法：\n产品基于业务痛点，用低成本方式搭一个能操作的验证版，不用写生产代码，但接的是客户真实（或脱敏后）的数据，由客户自己把整条业务走一遍。\n目的：\n确认方案真能解决问题、客户愿意用，再启动交互设计师、视觉设计师与研发投入。\n注：听讲解、看页面、看演示，都不算验证。\n这套流程是从这次失败里倒推出来的。\n眼下的行情也在往同一个方向走：\nAI 产品在往 FDE 转，传统产品里做大客户定制的岗位，要求也是先去客户现场把方案跑通，再谈开发和交付。\n把这两条和小蓝这次的失败对了一遍，缺的正好是同一环：\n验证被放在了最后\n。\n判断一个项目要不要用新流程，看两个硬条件是否同时成立：\n关键变量在客户现场：\n效果好坏取决于它的数据、流程、权限和使用者习惯，通过多客户的调研也推不出来，只能让客户自己上手，在真实流程里跑一遍。\n前置验证的成本远低于做错的成本：\n前置验证的成本，是一个人不到一周就能跑一遍；\n做错的成本，是产品、设计、研发、测试一群人几个月的投入，还要在上线后长期维护，而且这些东西其他客户根本用不上。\n2. 老流程 vs 新流程\n1）老流程（踩坑流程）\n需求对齐 → 产品输出原型 → UE 输出交互稿 → UI 输出可跳转高保真 Demo → 产品组织讲解演示 → 各方确认 → 输出 PRD 文档 → 技术评审 → 研发开发 → 测试上线 → 客户验证使用。\n优势：\n分工明确，产出物规范，适合成熟稳定的通用功能迭代。\n劣势：\n环节多，产品、UE、UI 一个接一个排队上；验证靠“讲给人听、做给人看”，客户自己没动手走过一遍，藏在细节里的问题无法露出来；\n等发现需求传走样了、方案在客户现场根本用不起来，设计和研发已经投入成本，改不回来，只能整个流程重新走一遍。\n2）按 FDE 思路应该长成的新流程\n需求对齐 → 产品基于业务痛点快速搭建可实操 Demo → 内部业务自主走查试用 → 客户一线操作人员上手实测、自己把业务走通 → 确认需求真实、方案可行 → 再输出原型、交互、高保真与正式 PRD → 启动研发。\n优势：\n验证提前到设计、研发之前。产品自己搭一个能操作的版本，客户一线当场跑一遍，就不用再靠原型、交互、高保真物料加讲解去“猜”方案行不行。\n代价：\n产品得自己先把客户的业务吃透，还得多花几天把验证版搭出来。\n3. 新流程具体改了什么？\n新流程落到产品上就四件事。需求拆解、流程梳理这些基本功没变，变的是判断依据和判断时间节点。\n1）需求痛不痛，直接找一线聊\n需求别只找对接人和销售，直接找一线操作人员。需求真不真，在提需求这一步就核实清楚，不用等两层转述加工完再回头猜。\n2）使用顺不顺手，让客户自己上手跑\n不等 UE、UI 交出原型、交互、高保真，产品自己搭一个能操作的验证版，接真实（或脱敏）数据。\n先让内部业务自己走一遍，明显的问题别带到客户现场；再由客户一线按自己的习惯亲手跑。操作别扭在哪、顺不顺手，当场就露出来，不用靠讲解蒙过去。\n3）优先级高不高，看一线卡不卡\n从“客户催得急、销售压力大”，换成“一线业务是不是真被卡住”，再把账算清楚：能带来多少营收、能省多少人力。\n需求不真、账算不过来，后面两步（设计、研发）就不用走了，压力再大也停在这。\n4）研发要不要投，看跑没跑通\n验证从“上线之后由客户替我们发现”，变成“在设计和研发启动前就完成”，跑通了再投设计、研发资源。\n跑不通就当场改，改的只是细节；一旦发现是方向不对，说明这", "thumb": "https://static.woshipm.com/tag/1121_1@2x.png ", "images": ["https://static.woshipm.com/tag/1121_1@2x.png ", "https://image.woshipm.com/2025/08/19/edd47568-7caf-11f0-a249-00163e09d72f.png", "https://static.woshipm.com/tag/1601_1@2x.png ", "https://static.woshipm.com/tag/1121_1@2x.png ", "https://image.woshipm.com/2023/04/13/2f032c24-d9eb-11ed-9d7a-00163e0b5ff3.jpg!/both/120x80", "https://image.woshipm.com/wp-files/2023/03/U6PQXqfAJ5kaffcU5cTv.jpg!/both/120x80"], "tags": ["产品经理"], "seen": false, "new": false, "daily": false}, {"guid": "692887cdc6316d1aa40355d41541789e", "title": "系统未知错误，请稍后重试。 (600)是什么意思", "link": "https://forum.trae.cn/t/topic/605145", "source": "TRAE 官方社区", "category": "contest", "summary": "你的运行环境（版本号「点击帮助-关于-复制」）： 3.4.22 问题描述（你遇到了什么问题？）请勿使用AI模版，AI分析会导致关键信息覆盖： 系统未知错误，请稍后重试。 (600)是什么意思，怎么解决 复现步骤（如何才能重现这个 Bug/问题？）请勿使用AI模版，AI分析会导致关键信息覆盖： 1. 2. 3. 报错信息或截图（如有）请勿使用AI模版，AI分析会导致关键信息覆盖： 请在此处粘贴截图或日志代码 2 个帖子 - 2 位参与者 ", "ts": "2026-11-23T03:41:43+00:00", "published": "11-23", "starred": false, "importance": 2, "topic": "AI 编程", "one_line": "TRAE 官方社区帖子讨论", "why": "", "inline_text": "帖子讨论\n参与者信息\n阅读完整话题", "full_text": "", "thumb": "", "images": [], "tags": ["AI 编程"], "seen": false, "new": false, "daily": false}, {"guid": "e76ad4fbf172ec02c01c3af5c9020f50", "title": "Agent 都能自己查数据了，还要花钱建本体、知识图谱吗？", "link": "https://www.woshipm.com/ai/6498283.html", "source": "人人都是产品经理", "category": "pm", "summary": "本体建出来到底能干啥？作者把业务复杂度拆成工程复杂度加数据复杂度，对应业务运行模型和业务表达模型，再拿一个销售转化 Agent 项目走完全程。结论挺克制：复杂 AI 应用绕不开的是业务建模，本体只是其中一种形式化表达，而且挺贵的。 现在做 AI 项目存在一个很有意思的认知断层。 大家已经意识到，复杂 AI 应用最终需要一套业务模型来支撑，但 还没有真正理解 Ontology 究竟解决了什么问题，以及它在整个 AI 系统中承担什么职责 。", "ts": "2026-11-23T03:40:09+00:00", "published": "11-23", "starred": false, "importance": 4, "topic": "产品经理", "one_line": "Agent 自查数据与本体、知识图谱的关系", "why": "了解 Agent 自查数据与本体、知识图谱的关系，可能对作品集有启发", "inline_text": "业务复杂度与工程复杂度\n业务运行模型与业务表达模型\n销售转化 Agent 项目案例", "full_text": "本体建出来到底能干啥？作者把业务复杂度拆成工程复杂度加数据复杂度，对应业务运行模型和业务表达模型，再拿一个销售转化 Agent 项目走完全程。结论挺克制：复杂 AI 应用绕不开的是业务建模，本体只是其中一种形式化表达，而且挺贵的。\n现在做 AI 项目存在一个很有意思的认知断层。\n大家已经意识到，复杂 AI 应用最终需要一套业务模型来支撑，但\n还没有真正理解 Ontology 究竟解决了什么问题，以及它在整个 AI 系统中承担什么职责\n。\n这也是为什么很多人知道本体很重要，研究了本体论、知识图谱、业务语义、实体关系，却很难回答一个实际问题：\n我把 Ontology 建出来以后，到底能用它干啥？\n之前我们一遍一遍的说，AI 项目的核心是 SOP + 数据。\n一个 AI 项目可以按照 SOP 复杂度和数据复杂度分成 12 类，我们遇到的各种智能体项目，基本都可以在这个框架里找到对应的位置。\n那么，\n为什么复杂 AI 项目做到深处，经常会碰到本体和图谱？\n如果我们去问或者搜这个问题，通常会得到这样一个回答：AI 不只是需要数据，还需要理解数据背后的业务含义，以及数据之间的关系。\n这个回答没问题，但问题是，知道了这个结论以后，我们是不是依然不知道能用他来干啥？\n本质是业务复杂度\n做 AI 应用，本质上是在处理业务复杂度\n我们做企业 AI 应用，本质上是要将一部分真实业务交给机器处理。\n业务越复杂，我们需要对业务进行的理解、抽象和工程实现也就越复杂。\n这里我们可以建立一个简单的理解框架：\n业务复杂度 ≈ 工程复杂度 + 数据复杂度\n:\n当然，这不是一个严格的数学等式，而是一种拆解业务复杂度的思路。\n在将真实业务转化为 AI 应用的过程中，我们可以通过两套模型承载业务复杂度。\n1.1 业务运行模型：解决工程复杂度\n业务运行模型主要解决业务如何运行的问题。\n我们可以通过 SOP、业务规则、算法、Workflow、Agent 等方式的组合，实现业务的判断、决策和执行。例如：\nSOP 描述业务执行过程。\n业务规则描述业务判断逻辑。\n算法负责计算、预测和优化。\nWorkflow 组织相对确定的执行路径。\nAgent 处理动态理解、规划和不确定性任务。\n1.2 业务表达模型：解决数据复杂度\n业务表达模型主要解决业务信息如何被机器表达和使用的问题，这里实际上包含两部分：\n第一部分是如何构造数据。\n我们可以根据业务建模的结论，建立服务于数据组织和处理的数据模型，也可以通过 Ontology 等方式，建立服务于业务语义定义的模型。\n第二部分是如何使用数据。\n这就涉及数据工程，包括数据采集、存储、查询、关联、检索、上下文构建等工作，也涉及关系型数据库、图数据库、向量数据库等技术选型。\n最终，通过接口、Tools、数据服务等方式，\n让业务运行模型能够调用业务表达模型\n，共同构成一套可运行的 AI 业务系统。\n1.3 业务建模：决定如何高效地表达业务\n那么，这两套模型是怎么来的？这就涉及业务建模。\n业务建模的核心任务，是通过对真实业务进行分析和抽象，\n找到一种能够高效表达业务逻辑的方式\n。\n业务建模形成的抽象结论，一部分通过 SOP、规则和算法等方式进入业务运行模型，一部分通过数据模型、语义模型等方式进入业务表达模型。\n所以，面对同一个业务问题，不同的人可能会设计出完全不同的系统。\n有人通过大量 Workflow 分支解决问题，有人通过规则引擎解决问题，有人通过重新设计数据模型解决问题，还有人将大量业务信息交给 Agent 动态处理。\n这里需要考虑的是：\n我们应该如何分配和承载业务复杂度，才能获得更高的工程 ROI？\n大力出奇迹，还是按需建模？\n围绕这个问题，我们通常可以看到两种不同的思路。\n第一种：大力出奇迹\n原理很简单，既然 AI 需要理解业务世界，那我们就尽可能完整地对业务世界进行结构化描述。\n让机器知道：\n业务世界里有什么对象和概念。\n这些对象分别具有什么属性和状态。\n对象之间存在什么关系。\n这些概念、状态和关系有什么业务含义。\n业务中存在哪些知识和约束。\n在此基础上，通过 Ontology 等建模方式构建业务语义层，再通过数据工程提供查询和访问能力，让 Agent 能够自主获取和使用这些业务信息。\n为什么我叫它大力出奇迹？这条路线背后有一个很性感的假设：\n现在模型能力和 Harness 能力已经这么强了，未来还会继续增强。只要我提供足够丰富的业务上下文，并且给这些上下文构建足够完善的语义模型，Agent 就可以自己查数据、构建业务上下文、分析问题并调用工具完成任务。\n这样，我就不用去做无聊的 Workflow 穷举和各种基于 workflow 的工程化了。\n这似乎是一种解决企业有大量业务系统和复杂业务关系的情况下如何落地 AI 的捷径？\n但它的问题是，我们需要投入大量成本对业务世界进行建模，却\n不一定知道这些模型最终会被哪些业务场景使用，以及能产生多少业务价值\n。\n对，他没有回答我们前面的问题：我把 Ontology 建出来以后，到底能用它干啥？\n这有点像即时战略游戏里的一种玩法：只要我把科技树全部点满，我就是无敌的。\n这没错，但没什么实际指导意义，因为真实项目里的资源永远是有限的。\n第二种：拆解复杂度，按需建模\n另一种思路就比较传统了，我们从具体业务场景出发，先梳理业务 SOP，根据 SOP 中每个环节所需要的信息设计对应的数据结构，再通过程序、规则、算法和 Workflow 实现业务逻辑。\n如果业务比较简单，这套方式完全没有问题。\n随着业务复杂度增加，我们可能会发现，继续增加 SOP 分支和判断规则，工程实现成本越来越高。\n这时候，我们可以通过重新进行业务建模，找到一种更高效的业务表达方式，调整对应的业务逻辑和数据结构，\n将一部分原本固化在程序中的业务逻辑转化为由数据模型承载\n。\n这就是我们前面说的，通过业务建模，重新分配工程复杂度和数据复杂度，从而获得更高的工程 ROI。\n但到这里，本质上仍然是传统的软件开发逻辑。\n当业务进一步复杂，部分业务判断和执行路径难以提前确定时，我们可以引入 Agent，承担部分动态推理和决策工作。\n这时候就会出现一个新的问题：原本由开发人员理解、并且固化在程序中的业务语义，应该如何被 Agent 理解和使用？\n如果通过简单的数据说明和工具接口已经无法满足需求\n，我们就需要考虑将这些业务语义独立表达出来，构建业务语义层。\nOntology 就是构建这套语义层的一种方式\n。\n接下来，我们通过一个销售转化 AI 项目，具体看看这个过程。\n案例拆解：销转 Agent\n假设我们要做一个在线教育的销售转化 AI 应用，帮助销售人员将购买了低价体验课的用户转化为正价课用户。\n首先，我们需要梳理销售 SOP。一个简化的流程可能包括：\n获取客户信息。\n进行初步沟通，了解客户需求。\n跟进客户的体验课学习情况。\n介绍正价课产品。\n与客户沟通，推进购买决策\n记录销售结果。\n在此基础上，我们可以\n按照每个 SOP 节点的需要，设计相应的数据结构\n。例如客户信息表、课程信息表、沟通记录表、销售阶段表、话术库、订单信息表等。\n比如，我们可以收集销冠在不同销售阶段的历史沟通记录，提取其中的优秀问答，形成各个销售", "thumb": "https://static.woshipm.com/tag/1101_1@2x.png ", "images": ["https://static.woshipm.com/tag/1101_1@2x.png ", "https://image.woshipm.com/2023/04/14/0d78bf02-da8f-11ed-a86f-00163e0b5ff3.jpg", "https://image.woshipm.com/wp-files/sha256/5b/bd/5bbdbbd2212a98ab3cda4613e363654c32b3002940433d642fa44890de185f4d.webp", "https://image.woshipm.com/wp-files/sha256/dc/37/dc37985847ce011e0100fd0df9949cca9ea2c8f29b30235c4581e1136d5d2cac.webp", "https://image.woshipm.com/wp-files/sha256/24/3a/243a7a882cb750573d6de7c3c0681cc6b15b007bd39d486fa626520408ce0840.webp", "https://image.woshipm.com/wp-files/sha256/b9/04/b9040e0f767196ed447fe67cbc849ef616043574fc560eddf992e7e94f549c0a.webp"], "tags": ["产品经理"], "seen": false, "new": false, "daily": false}, {"guid": "7a60fb308691f0a7b21a7d3490512560", "title": "校园办事大厅", "link": "https://forum.trae.cn/t/topic/605143", "source": "TRAE 官方社区", "category": "contest", "summary": "1. 个人介绍 你是谁： 一名计算机相关专业大三学生，致力于做全栈开发的 Vibe Coder，编程 3 年，Vue 3 + TypeScript 爱好者，最爱用 AI 辅助快速原型验证。 你擅长什么： 产品思维驱动的前端工程化，从 0 到 1 搭系统；对 ToB 工作台、审批流、数据可视化有持续探索。 第一次意识到\"这事得有人管\"： 上周帮室友办在读证明，他先跑到行政楼，说人不在让去教务处，教务处让先去自助机，自助机又坏了。我帮他翻了", "ts": "2026-11-23T03:34:39+00:00", "published": "11-23", "starred": false, "importance": 2, "topic": "AI 编程", "one_line": "Vibe Coder 个人介绍", "why": "", "inline_text": "计算机相关专业大三学生\nVibe Coder\n编程 3 年，Vue 3 + TypeScript 爱好者", "full_text": "", "thumb": "", "images": [], "tags": ["AI 编程"], "seen": false, "new": false, "daily": false}, {"guid": "e4ee2baa91ed80b6d24433fc2f92efca", "title": "校园生活【寻师迹】：签字盖章再也不怕找不到老师，告别去办公室扑空的日子", "link": "https://forum.trae.cn/t/topic/605142", "source": "TRAE 官方社区", "category": "contest", "summary": "1.个人介绍 我是一名职业技术学校的学生，在校期间经常被文件找不到老师盖章，不知道老师在哪个办公室，找到办公室老师却不在烦恼着，入团时找老师和团支书签字花了我很大的功夫，要么不知道团支书是哪个班，要么找不到老师，我就思考：为什么不能有一个能查看老师空闲时间和负责事务的网站呢？让学生更加方便的办理事务，更加了解校园，之前参加过类似的创作，于是我借助trae，着手开始创造这个网站。 我将这个网站的初始成品给了同学查看，同学很惊讶的评价我：这", "ts": "2026-11-23T03:34:37+00:00", "published": "11-23", "starred nline_text": "IM 平台\n乙方客户交付\n应用场景\n模式", "full_text": "", "thumb": "", "images": [], "tags": ["产品经理"], "seen": false, "new": false, "daily": false}, {"guid": "5bac14ff347830c8fc376fdfbe707d89", "title": "AI来了，人还剩什么：12条不完整关于工作、价值、品牌和商业思考", "link": "https://www.woshipm.com/share/6498018.html", "source": "人人都是产品经理", "category": "pm", "summary": "凯文·凯利说 AI 更像实习生而不是助理，成果要你做二次核验。作者把这些战略品牌大师的思考收成 12 条：速度变廉价后价值去哪、万物丰裕时什么才稀缺、注意力经济之后是意图经济。核心判断只有一句：AI 替代的不是人，是没想清楚自己要什么的人。 当你还在嫌AI不够聪明时，更应该庆幸：它还给了你被替代前的时间窗口。 ——徐晓辉 最近翻读了凯文·凯利和赛斯·戈丁、彼得·菲斯克、埃里希·阿希姆斯塔勒等几位战略品牌大师关于AI的新思考，在此收拢在一", "ts": "2026-11-22T04:17:09+00:00", "published": "11-22", "starred": true, "importance": 4, "topic": "AI 编程", "one_line": "凯文·凯利关于 AI 的思考，探讨 AI 对工作、价值和商业的影响", "why": "了解凯文·凯利关于 AI 的思考，有助于提升自己在 AI 产品设计和战略思考方面的能力", "inline_text": "凯文·凯利\nAI 思考\n工作\n价值\n商业", "full_text": "凯文·凯利说 AI 更像实习生而不是助理，成果要你做二次核验。作者把这些战略品牌大师的思考收成 12 条：速度变廉价后价值去哪、万物丰裕时什么才稀缺、注意力经济之后是意图经济。核心判断只有一句：AI 替代的不是人，是没想清楚自己要什么的人。\n当你还在嫌AI不够聪明时，更应该庆幸：它还给了你被替代前的时间窗口。\n——徐晓辉\n最近翻读了凯文·凯利和赛斯·戈丁、彼得·菲斯克、埃里希·阿希姆斯塔勒等几位战略品牌大师关于AI的新思考，在此收拢在一起，让我们共被启发。\n思考1、世界上不只有一种AI\n思考2、跳出服从惯性，迎接主动性时代\n思考3、当速度变得廉价，价值该去往何处？\n思考4、万物丰裕时，稀缺的到底是什么？\n思考5、人类不想被取代，也无法被AI取代\n思考6、新商业机会：细分赛道与人心转向\n思考7、AI企业的三代演进，终局是生态系统之战\n思考8、未来人才——超级连接者\n思考9、创业（一人公司）这件事，变得又简单又难\n思考10、看见需求空间，挣脱品类的局限\n思考11、注意力经济终局，意图经济登场\n思考12、三个笨办法，把AI用得更像人\n1、世界上不只有一种AI\n凯文·凯利告诉我们，首先需要明确的是，世界上不只有一种AI。\n不同的行业有很多不同的想法和认知，也就意味着会有非常多纷繁各异的AI，这就像世界上存在各种物种的动物一样。\n其次，他期望我们知道，你暂时不会被AI替代，但会被更擅长使用AI的人替代。\n他认为，比起助理，AI更像一个实习生，因为实习生不能独立完成任务，工作成果需要我们来做二次核验的。说到生成式AI与人之间的关系，KK把它称之为+1关系。\n希腊神话中的半人马，其实是有点像人和AI的协作关系。科学家们发现，现阶段只靠人或只靠人工智能都不行，它们要结合在一起。\n第三，当技术隐形的时候，才是最强大的。\n把AI类比成电力，你不能简单地认为把18世纪的公司通电，它就会成为完全不同的公司。但是如果这家企业在诞生之初就有电力的加持，那么这一家企业和18世纪的其他企业相比，一定有巨大的飞跃。\n我们一直谈AI，恰恰说明它尚未真正普及。如果我们已经无法意识到AI的存在，才算完成落地。\n2、跳出服从惯性，迎接主动性时代！\n我们大多是在一套\n“服从与灌输”\n的体系里长大的。\n读书的时候，后卫不能自主设计战术，演员不能随意改写台词，擅长数学的人，也无法自选想要证明的命题。这套训练，本质是教会我们依照指令完成任务。\n互联网长尾效应叠加AI强大的杠杆能力，让“服从”的价值持续贬值。\n互联网的长尾效应，再加上AI带来的巨大杠杆，让单纯服从的\n“服从”\n持续贬值。\n无论你靠什么谋生，手边都有一台随时待命的机器（电脑或手机）。主动权握在你手里，由你来定义指令；一旦停下思考，发号施令的就会变成你的上级或“生活”。\n照着固定剧本前行的路越来越走不通。世界迭代太快，等剧本送到手上，往往早已失效。 AI之所以快速兴起，一部分原因，是它总能给习惯等待指令的人，提供廉价又即时的答案。\n站在管理者的角度，AI也像是一批成本更低、永远听话的任务执行者。\n而那些习惯服从的人，很容易陷入焦虑。\n焦虑源于一种渴望——希望事情恢复正常，给他们一个重新服从的机会。\n但现实是，这就是新的常态。安稳的好工作”，再也不是靠循规蹈矩就能守住的避风港。\n这场转变来得很突然，临时应付远远不够，独自应对转型压力难如登天。我们还有一条出路：\n——找到同类，建立连接，结成彼此挑战、启发和鼓励的社群，在寻找出路的旅程上并肩前行。\n从前，我们花漫长时间训练自己，适配服从式的人生。而现在，摆在面前的新功课，是主动打磨能力，在主动性时代扎根生长。\n3、当速度变得廉价，价值该去往何处？\n快一点点，是一种市场优势，但速度上的阶跃式变化，则会彻底改写市场。京东只是把货送得更快，就做到增长和盈利；微信更进一步，它改写了人与人沟通的方式。\n放到AI 浪潮中，很多人还没有看清：\n我们正在经历一场由速度催生的质变。\nAI 生成的 Logo，或许缺少大师亲手创作的力量感，但产出效率高出千倍。这意味着，合格可用的视觉内容总量，会迎来指数级膨胀。\n当AI可以实时给出靠谱的诊断参考，我们和医疗体系打交道的方式也随之改变。\n再比如AI代写的文字，缺失手写下的温度、沉淀与记忆点。这些更快的替代方案，算不上 “更好”，只是另一种选择。可市场天然偏爱便利与速度。\n于是，“尚可、迅速、廉价” 的组合，已经成为现实。\n这带来两条出路：\n其一，实时洞察嵌入更多日常场景；\n其二，去做值得人们耐心等候、由人主导的创造。追求卓越，而非仅仅过得去。\n持续贬值的，永远是平庸的中间地带。\n4、万物丰裕时，稀缺的到底是什么？\n在物质被AI和自动化极大丰富的未来，稀缺的将不再是商品，而是下面这些“别的东西”。\n第一，是注意力。\n当信息像空气一样无处不在，你能专注地看一个视频、读一篇文章，就成了奢侈品。\n第二，是真实体验。未来一种高阶的消费，是寻找 “无AI空间”\n，就是花大价钱去一个没有算法推荐、没有智能设备打扰的地方，享受纯粹的真实世界和人际交流。\n第三，是你的数据化人格。\n你的数字分身或是AI管家，是否可靠、高效，能否帮你维系稳定可信的数字信用，这会是一笔很重要的资产。\n5 人类不想被取代，也无法被AI取代\n不妨想想《星际迷航》里柯克船长和史波克的区别。史波克作为瓦肯人，遵从纯粹逻辑、克制情绪；而柯克所代表的人类，\n拥有共情力，更快做出决定，更勇敢。\n凯文・凯利由此提出：\n人类既不愿被替代，也无法被 AI 替代。\n一个很有意思的现象：不少富足的人依然会聘用真人助手，助手会借助 AI 工具，但雇主本人更依赖人的服务。当我们拥有选择权时，往往更愿意和人打交道。\n或许未来，一部分人的核心工作，就是做好 “人” 这件事。\n顺着这个思路，我们可以进一步看清人类独有的价值。\n其一，我们出售的是“责任”和“信任”。\n未来，我们向雇主交付的，不再只是劳动时间，而是责任与信任。AI出现失误时，能够兜底、弥补疏漏的是人；需要共情、创造力的时候，出手解决问题的也是人。\n第二，我们在未来最重要的能力，“提出一个好问题”。\n与AI互动，首要原则是要时刻提醒自己，不要把它们想象成人。\nAI是极致的“表现”，而人类拥有的是不可复制的“存在”。\nAI可以源源不断输出现成答案，但只有人，会出于好奇、不甘或是一瞬间的触动，问出那个从前没人提过的问题。\n那些伟大的艺术、科学突破、深邃的哲思，很多都诞生在试错、留白、看似无用的探索之中。AI 擅长优化已经走通的路径，人类却有能力开辟机器想象不到的全新方向。\n第三，属于人的真实智慧：一份不完整清单\n史蒂夫・沃兹尼亚克（乔布斯的伙伴）提出了“\n真实智慧（Actual Intelligence）\n”这个概念。这些是我们与生俱来、可以持续打磨的能力，在当下格外珍贵，却很少在课堂里系统学习：\n做出艰难取舍；\n筛选信息、学会放弃；\n为成果署名、承担责任；\n拥有判断力，提出正确的问题，舍弃无关的问题。\n交付真正有用的成果；\n对审美的追求。\n耐心直面真正的难题，而不是躲去解决简单的伪问题；\n心怀善意，为特定对象创造，追求公平；\n给予他人尊严；\n懂得适可而止；\n投入深度共情，而非浮于表面的替代品。\n主动钻研，沉下心深耕；", "thumb": "https://static.woshipm.com/tag/1121_1@2x.png ", "images": ["https://static.woshipm.com/tag/1121_1@2x.png ", "https://image.woshipm.com/2023/04/13/2804a00e-d9de-11ed-8d63-00163e0b5ff3.jpg", "https://image.woshipm.com/wp-files/sha256/e0/10/e01018ba8f130baa483aee157039b21a9225a18ef30042b8c922400a82e8e1e3.jpg", "https://image.woshipm.com/wp-files/sha256/9e/e6/9ee65d20ddbee91e95579b0bf4fa6a80ae1adeb58e479063781d66d75b2a6a88.jpg", "https://image.woshipm.com/wp-files/sha256/da/8e/da8e6520a5f15ba3f4fdd71215950f03d9fb84bf31d502274c51b9d01867ae85.jpg", "https://image.woshipm.com/wp-files/sha256/64/e8/64e82a6f3f29ce0dbc053a1ecb3eb8319e04e2fff1afe0bdf583025e908a029d.jpg"], "tags": ["AI 产品"], "seen": false, "new": false, "daily": false}, {"guid": "6a0cb8b427dcc5bdb2fd4a2e53281661", "title": "Agent开发 03｜架构选型：不同模式怎么选？", "link": "https://juejin.cn/post/7710449704618262564", "source": "掘金", "category": "tech", "summary": "Agent开发 03｜架构选型：不同模式怎么选？ 《Agent开发》系列 · 第 03 篇 假设我们正在开发一个 AI 客服助手。用户提出： 系统需要查询订单支付状态、金币发放记录，必要时还要检查账户", "ts": "2026-11-22T04:05:55+00:00", "published": "11-22", "starred": false, "importance": 4, "topic": "AI 编程", "one_line": "探讨 Agent 开发的架构选型，为 AI 客服助手提供参考", "why": "了解 Agent 开发的架构选型，有助于提升自己在 AI 产品设计和开发方面的能力", "inline_text": "Agent 开发\n架构选型\nAI 客服助手\n参考", "full_text": "", "thumb": "", "images": [], "tags": ["AI 产品"], "seen": false, "new": false, "daily": false}, {"guid": "bbf338c81500853072fc899b1c0dc6f8", "title": "Toyota, Nissan, and Honda to Standardize Parts to Lower Costs", "link": "https://www.caranddriver.com/news/a74490092/toyota-nissan-honda-standardize-parts-lower-costs/", "source": "Hacker News", "category": "tech", "summary": "Article URL: https://www.caranddriver.com/news/a74490092/toyota-nissan-honda-standardize-parts-lower-costs/ Comments URL: https://news.ycombinator.com/item?id=50596133 Points: 72 # Comments: 32", "ts": "2026-11-22T04:04:56+00:00", "published": "11-22", "starred": false, "importance": 2, "topic": "技术", "one_line": "丰田、日产和本田标准化零部件以降低成本", "why": "", "inline_text": "丰田\n日产\n本田\n标准化零部件\n降低成本", "full_text": "", "thumb": "", "images": [], "tags": ["技术"], "seen": false, "new": false, "daily": false}, {"guid": "5ac5d16e519e3413aded6bacc55e584b", "title": "AI 硬件的牛市结束了", "link": "https://www.woshipm.com/ai/6497898.html", "source": "人人都是产品经理", "category": "pm", "summary": "从 10 月高点起，费城半导体指数跌去 27.8%，英伟达跌 36.1%、美光跌 43%。文章说这轮 AI 硬件回撤的本质，是定价逻辑从“看资本开支增长”换成了“看投资回报”，而债券市场已经先报警。 最强势的市场，也顶不住这轮AI回调了。 从10月的高点算起，涵盖AI硬件全链条的费城半导体指数跌去27.8%。其中，算力龙头英伟达跌去36.1%、存储龙头美光跌去43%，就连给他们供货的寡头台积电也跌去26.2%。看下来，逻辑最硬、订单最多", "ts": "2026-11-22T03:44:35+00:00", "published": "11-22", "starred": true, "importance": 4, "topic": "AI 编程", "one_line": "分析 AI 硬件市场的回撤，探讨定价逻辑和投资回报的变化", "why": "了解 AI 硬件市场的回撤，有助于提升自己在 AI 产品设计和市场分析方面的能力", "inline_text": "AI 硬件市场\n回撤\n定价逻辑\n投资回报", "full_text": "从 10 月高点起，费城半导体指数跌去 27.8%，英伟达跌 36.1%、美光跌 43%。文章说这轮 AI 硬件回撤的本质，是定价逻辑从“看资本开支增长”换成了“看投资回报”，而债券市场已经先报警。\n最强势的市场，也顶不住这轮AI回调了。\n从10月的高点算起，涵盖AI硬件全链条的费城半导体指数跌去27.8%。其中，算力龙头英伟达跌去36.1%、存储龙头美光跌去43%，就连给他们供货的寡头台积电也跌去26.2%。看下来，逻辑最硬、订单最多的AI硬件龙头，也没能躲过这轮回撤。\nAI硬件这波回撤，是投资逻辑变了：从跟踪大厂的资本开支增长，换成了跟踪投资回报，这些投资能创造多少收入、能不能撑住继续扩张。\n而对投资回报跟踪最准确的是债券市场。按大摩测算，过半的数据中心资本开支要外借。因此，一旦高收益债收益率开始飙升，就意味着债主开始重估AI公司的经营能力。\n这种重估正在发生，整个AI债收益率全面上升，CoreWeave债券收益率从9月下旬的11.6%一路飙到10月的15.15%。同期无风险利率基本没动，涨的全是信用利差，这说明债权人是在对“AI基建公司的偿债能力”重新定价。\n这种担忧也会反过来约束债权人的扩张，全球AI相关债券发行额，从6月的1130亿美元降到9月的230亿美元。\n屋漏偏逢连夜雨，AI央行缩表又进一步加大了AI产业融资扩张的压力。\n在黄仁勋主导下，英伟达扮演了AI央行的角色：通过投资、担保和算力采购承诺，把自身的资产负债表和经营现金流，转化为“弱融资能力公司”的信用，来支撑AI开支的扩张。\n三季度，英伟达表外或有负债合计5400亿美元，相当于今年亚马逊资本开支的近3倍。而这些表外负债，又能撬动更高量级的信贷资金投入AI基建。\n但遗憾的是，黄仁勋离职后，新任CEO Colette Kress上任。她此前做过的最出名的一件事，就是把2500亿美元的数据中心担保砍掉一半，被黄仁勋嘲讽“只会做财务”。权力交接后，华尔街给这轮变化的标题是：“AI央行”紧缩。\n账单的紧张、央行的缩表，都指向AI资本开支放缓；而供给端已经按最乐观的预期扩产。这轮硬科技周期中“需求无限大，供给跟不上”的信仰也有了松动。\n01 算力基建的账越来越紧了\n在这波回撤中，AI硬件龙头的业绩并不差。\n除了相对边缘的英特尔四季度指引不及预期，英伟达、美光、台积电、博通、AMD、Lumentum这些核心AI硬件股，业绩全部超出市场预期。\n业绩超预期，为什么股价还在大跌？\nAI硬件牛市最终依赖一条完整的资本循环假设，模型收入高速增长→下游相信未来回报→持续增加资本开支→采购更多芯片、存储、网络和电力设备→半导体利润继续增长\n。\n因此，AI硬件牛市的命门并不在半导体公司本身的业绩上，而在于OpenAI、Anthropic、云商等下游公司的收入增速，能否持续证明巨额资本开支是合理的。\n所以，当云商投进几万亿美金、耗干现金流之后，市场给AI硬件定价的标尺就换了：从跟踪大厂的资本开支增长，换成跟踪投资回报，这些投资能创造多少收入、能不能撑住继续扩张。\n目前来看，AI账单有点算不过来了。\n按Gartner测算，到2030年，AI数据中心要累计创造8.5万亿美元收入，才能覆盖已宣布的资本开支、融资成本，以及12%的投入资本回报率。但同期AI收入总额，预计最多不超过3.6万亿美元。\n机构测算或许有误差，结果也偏远期；相比之下，债券市场的回答更能反映眼下企业AI账单的真实情况，也会直接作用于下一步的资本投入。\n云商自身的现金流撑不住，AI资本开支的扩张就得靠借债。按大摩测算，2025到2028年全球数据中心资本开支约2.9万亿，超大规模云厂自己的现金流只能撑起约1.4万亿，剩下约1.5万亿得向外借。\n所以，看AI资本开支的拐点，最前瞻的信号是债券市场的利率。一旦高收益债收益率开始飙升，就意味着债主开始怀疑AI公司的经营能力，重新给主体的偿债能力定价。这种重估，正在发生。\n最先报警的是CoreWeave的无担保存量债，是为买GPU、租数据中心搭起来的一整套分层债务包，收益率从9月下旬的11.6%一路飙到10月的15.15%。紧接着，重定价从这一层向外扩散，整个AI债都在重新报价，连优质数据中心CMBS的固定AAA档，年内收益率也上行了60bp。\n考虑到，同期无风险利率几乎没有变动，飙升的收益率，说明债券市场开始给整个AI资产类别重新定价，本质上反映出市场对AI投资账单越来越紧的担忧；这种担忧又会约束债权人的扩张，全球AI相关债券发行额，从6月的1130亿美元降到9月的230亿美元。\nAI央行的缩表，又发挥了推波助澜的作用。\n02 “AI央行”在缩表\n老黄辞职后的首个交易日，英伟达只跌了4.34%，跌最多的是Neocloud，其中CoreWeave跌6.9%，Nebius跌16.8%。\n下游的Neocloud跌得比英伟达还多，反映的正是对“AI央行”缩表的担忧。\nNeocloud类似GPU专卖店，商业特征是杠杆化：借钱买英伟达GPU，搭高速集群，再租给OpenAI等下游模型公司。\n三季度CoreWeave营收虽然暴增168%至36.61亿美元，单季资本开支却干到145亿美元，是营收的4倍。投入比收入高出这么多，Neocloud想再借，银行未必敢贷。同样的融资问题也困扰着很多算力中心、电力基建项目，没有担保方，很难从银行获得足够的流动性。\n为整个AI行业提供流动性的，就是英伟达\n。\n它扮演AI央行的角色，通过投资、担保和算力采购承诺，把自身的资产负债表和经营现金流，转化为“接不到钱的公司”的信用，来支撑AI开支的扩张。具体路径有四条：\n一是融资担保。英伟达为下游的硬件、土地、电力、机房融资兜底、增信，用来撬动银行资金。三季度，这部分最大信用敞口1180亿美元。\n二是算力包销。银行担心算力卖不出去、客户没钱还，英伟达就对部分算力给出“最低收入保底”，银行据此才敢放贷。三季度，这部分算力包销规模320亿美元。\n三是采购承诺。英伟达用对上游的采购承诺，推动上游扩产。三季度，采购承诺3900亿美元。\n四是股权投资。直接用真金白银投资下游，目前账面价值990亿美元。\n算下来，不算已经投出去的股权投资，前三项构成的表外或有负债合计5400亿美元，相当于今年亚马逊资本开支的近3倍；这些表外负债，又能撬动更高量级的信贷资金投入AI基建。可以说，英伟达在AI产业链中的角色，是制造需求、推动需求。\n但英伟达的这种角色正在弱化，AI央行已经开始缩表\n。\n英伟达已经开始减少对下游的兜底：三季度，针对下游客户的承诺与兜底包销协议，环比减少40亿美元。黄仁勋一走，这种缩表趋势已经不可避免。\n黄仁勋离职后，临时CEO Colette Kress上任。她此前做过的最出名的一件事，就是把2500亿美元的数据中心担保砍掉一半，被黄仁勋嘲讽“只会做财务”。\n在这一波美国的AI基建狂潮里，黄仁勋是领袖：把英伟达的信用借给接不到钱的客户，联合资本方攒局扩张。没有他的前瞻视野、激进投入和作为老板的担当，AI的摊子不会铺得这么大，云厂商的资本开支也拉不到万亿美元的规模。\n对比下来，财务出身的Colette Kress想的是对报表负责，做的也是对报表负责；促进AI产业发展，并不是她关注的事。\n英伟", "thumb": "https://static.woshipm.com/tag/1101_1@2x.png ", "images": ["https://static.woshipm.com/tag/1101_1@2x.png ", "https://image.woshipm.com/2025/08/19/f7d457c4-7ccb-11f0-8b73-00163e09d function startCheck() {
  checking = true;
  refreshBtn.classList.add('busy');
  refreshBtn.querySelectorAll('span')[1].textContent = '检查中…';
  checkOnce();
  checkTimer = setInterval(checkOnce, 20000);  // 20s 一次
}
function stopCheck() {
  checking = false; clearInterval(checkTimer); checkTimer = null;
  refreshBtn.classList.remove('busy');
  refreshBtn.querySelectorAll('span')[1].textContent = '手动刷新';
}
async function checkOnce() {
  try {
    const resp = await fetch(window.location.pathname + '?t=' + Date.now(),
      { cache: 'no-store' });
    if (!resp.ok) return;
    const text = await resp.text();
    const m = text.match(/更新于\s*(\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2})/);
    if (m && m[1] !== CURRENT_UPDATED) {
      stopCheck();
      refreshBtn.classList.add('done', 'pulse');
      refreshBtn.querySelectorAll('span')[1].textContent = '有新数据 · 点此刷新';
      refreshBtn.onclick = () => window.location.reload();
    }
  } catch (e) {}
}

/* 页面打开时，每 60s 自动检查一次，不打扰用户 */

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
function load(key, def) {
  try { return JSON.parse(localStorage.getItem(key)) || def; } catch (e) { return def; }
}
function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
}

let favs = load(FAV_KEY, []);      // [{title,link,...}]
let reads = load(READ_KEY, []);    // [link]
const favSet = new Set(favs.map(f => f.link));
const readSet = new Set(reads);

function snapshot(it) {
  return { title: it.title, link: it.link, source: it.source, category: it.category,
           published: it.published, one_line: it.one_line, why: it.why,
           topic: it.topic, tags: it.tags, importance: it.importance };
}

/* 收藏过的标签 = 兴趣信号，用来给新条目标注「为你」 */
function interest() {
  const count = {};
  favs.forEach(f => {
    (f.tags || []).concat(f.topic ? [f.topic] : []).forEach(t => {
      count[t] = (count[t] || 0) + 1;
    });
  });
  return count;
}
let INTEREST = interest();
function matched(it) {
  return (it.tags || []).concat(it.topic ? [it.topic] : [])
    .some(t => (INTEREST[t] || 0) > 0);
}

function starBar(n) {
  n = n || 0;
  if (!n) return '';
  return '★'.repeat(n) + '☆'.repeat(5 - n);
}

function cardHTML(it, lead) {
  const meta = CATS[it.category] || ['其他', '#6B7280', '#F3F4F6'];
  const cls = ['card'];
  if (it.daily) cls.push('pick');
  if (lead) cls.push('lead');
  if (readSet.has(it.link)) cls.push('read');
  const hasFav = favSet.has(it.link);

  // 站内阅读元素（今日必看 + 有正文才给）
  const hasBody = it.full_text || (it.inline_text && it.inline_text.includes('\n'));
  const hasContent = it.daily && (it.full_text || it.inline_text || it.thumb);

  let bodyHTML = '';
  if (hasContent) {
    let thumb = it.thumb ? `<img class="thumb" src="${esc(it.thumb)}" alt="" loading="lazy" onerror="this.style.display='none'">` : '';
    let bullets = '';
    if (it.inline_text) {
      const lines = it.inline_text.split(/[\n]/).map(s => s.trim()).filter(Boolean).slice(0, 5);
      if (lines.length) {
        bullets = `<ul class="inline-bullets">${lines.map(l => `<li>${esc(l)}</li>`).join('')}</ul>`;
      }
    }
    let fullText = '';
    if (it.full_text) {
      fullText = `<div class="body-text">${esc(it.full_text)}</div>`;
    }
    let imgs = '';
    if (it.images && it.images.length) {
      imgs = `<div class="imgs">${it.images.slice(0, 6).map(u =>
        `<img src="${esc(u)}" alt="" loading="lazy" onerror="this.style.display='none'">`).join('')}</div>`;
    }
    let expandBtn = it.full_text
      ? `<button class="expand-btn" type="button"><span>展开全文</span> ↓</button>` : '';

    bodyHTML = `
      ${thumb}
      ${bullets}
      ${expandBtn}
      <div class="full-body">
        ${fullText}
        ${imgs}
        <div style="margin-top:14px">
          <a href="${esc(it.link)}" target="_blank" rel="noopener"
             style="color:var(--muted);font-size:12.5px">查看原文 →</a>
        </div>
      </div>`;
  }

  return `<article class="${cls.join(' ')}" data-link="${esc(it.link)}">
    <div class="row">
      <span class="chip" style="color:${meta[1]};background:${meta[2]}">${esc(meta[0])}</span>
      <span>${esc(it.source)}</span>
      <span>${esc(it.published)}</span>
      ${it.new ? '<span class="new">新</span>' : ''}
      ${matched(it) && !it.daily ? '<span class="for-you">为你</span>' : ''}
      <span class="stars">${starBar(it.importance)}</span>
    </div>
    <h3><a href="${esc(it.link)}" target="_blank" rel="noopener" data-link="${esc(it.link)}">${esc(it.title)}</a></h3>
    ${it.one_line ? `<p class="line">${esc(it.one_line)}</p>` : ''}
    ${it.why ? `<p class="why">${esc(it.why)}</p>` : ''}
    ${!it.one_line && it.summary ? `<p class="raw">${esc(it.summary)}</p>` : ''}
    ${bodyHTML}
    ${(it.tags && it.tags.length) ? `<div class="tags">${it.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
    <button class="fav ${hasFav ? 'on' : ''}" data-link="${esc(it.link)}">${hasFav ? '已收藏' : '收藏'}</button>
  </article>`;
}

function renderContests() {
  const box = document.getElementById('contests');
  if (!CONTESTS.length) { box.innerHTML = '<div class="empty">暂无</div>'; return; }
  box.innerHTML = CONTESTS.map(c => {
    const label = c.expected_start ? '预计 ' + c.expected_start : '待公布';
    return `<div class="contest">
      <div class="top"><div class="name">${esc(c.name)}</div><span class="badge">${esc(label)}</span></div>
      <div class="org">${esc(c.org || '')}</div>
      <div class="note">${esc(c.note || '')}</div>
    </div>`;
  }).join('');
}

let cur = 'daily';
let kw = '';
let sortBy = 'importance';

function currentList() {
  if (cur === 'fav') {
    return favs.slice().reverse().map(f => ({ ...f, daily: false }));
  }
  if (cur === 'daily') return ITEMS.filter(i => i.daily);
  if (cur === 'all') return ITEMS.slice();
  return ITEMS.filter(i => i.category === cur);
}

function render() {
  const list = document.getElementById('list');
  let items = currentList();

  if (kw) {
    items = items.filter(it =>
      (it.title + ' ' + (it.summary || '') + ' ' + (it.one_line || '') + ' ' +
       (it.topic || '') + ' ' + (it.tags || []).join(' ') + ' ' + it.source)
        .toLowerCase().includes(kw));
  }

  if (sortBy === 'time') {
    items.sort((a, b) => (b.ts || b.published || '').localeCompare(a.ts || a.published || ''));
  } else if (cur !== 'daily') {
    items.sort((a, b) => (b.importance || 0) - (a.importance || 0) ||
      (b.ts || '').localeCompare(a.ts || ''));
  }

  if (!items.length) {
    list.innerHTML = `<div class="empty">${cur === 'fav' ? '还没收藏。看到有用的点右下角「收藏」，以后会优先推给你。' : '没有匹配的条目'}</div>`;
    return;
  }

  list.innerHTML = items.map((it, i) =>
    cardHTML(it, cur === 'daily' && i < 3)).join('');
}

function renderTabs() {
  const tabs = document.getElementById('tabs');
  const defs = [['daily', '今日必看'], ['all', '全部']]
    .concat(ORDER.map(k => [k, (CATS[k] || [k])[0]]))
    .concat([['fav', '我的收藏']]);
  tabs.innerHTML = defs.map(([k, n]) =>
    `<button class="tab ${k === cur ? 'on' : ''}" data-k="${k}">${n}</button>`).join('');
  tabs.querySelectorAll('.tab').forEach(b => {
    b.onclick = () => { cur = b.dataset.k; renderTabs(); render(); };
  });
}

document.getElementById('q').addEventListener('input', e => {
  kw = e.target.value.trim().toLowerCase();
  render();
});

document.getElementById('sort').addEventListener('click', e => {
  sortBy = sortBy === 'importance' ? 'time' : 'importance';
  e.target.textContent = sortBy === 'importance' ? '按重要度' : '按时间';
  render();
});

document.getElementById('list').addEventListener('click', e => {
  const expand = e.target.closest('.expand-btn');
  if (expand) {
    const card = expand.closest('.card');
    card.classList.toggle('body-open');
    // 展开即算已读
    const link = card.dataset.link;
    if (link && !readSet.has(link)) {
      readSet.add(link); reads.push(link);
      save(READ_KEY, reads);
      card.classList.add('read');
    }
    return;
  }
  const fav = e.target.closest('.fav');
  if (fav) {
    const link = fav.dataset.link;
    const hit = ITEMS.find(i => i.link === link) || favs.find(f => f.link === link);
    if (favSet.has(link)) {
      favSet.delete(link);
      favs = favs.filter(f => f.link !== link);
    } else if (hit) {
      favSet.add(link);
      favs.push(snapshot(hit));
    }
    save(FAV_KEY, favs);
    INTEREST = interest();
    renderTabs(); render();
    return;
  }
  const a = e.target.closest('h3 a');
  if (a) {
    const link = a.dataset.link;
    if (!readSet.has(link)) {
      readSet.add(link);
      reads.push(link);
      save(READ_KEY, reads);
      const el = a.closest('.card');
      if (el) el.classList.add('read');
    }
  }
});

renderContests();
renderTabs();
render();
</script>
</body>
</html>
