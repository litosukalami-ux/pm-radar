<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>产品雷达 · PM Radar</title>
<style>
  :root {
    --bg: #FAF8F5;
    --card: #FFFFFF;
    --ink: #1F2328;
    --body: #4B5563;
    --muted: #8A8580;
    --line: #E8E3DA;
    --accent: #B45309;
    --accent-soft: #FDF3E7;
    --radius: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB",
                 -apple-system, BlinkMacSystemFont, sans-serif;
    line-height: 1.78;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px; }

  /* ---------- 头部 ---------- */
  header { padding: 46px 0 10px; }
  .head-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
  .head-row .h { flex: 1; min-width: 0; }
  h1 { font-size: 32px; margin: 0 0 12px; letter-spacing: -0.6px; font-weight: 700; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 13.5px; margin: 0; line-height: 1.9; }
  .sub b { color: var(--ink); font-weight: 600; }
  .sub .dot { margin: 0 6px; color: #D5CEC3; }

  .refresh { display: inline-flex; align-items: center; gap: 6px;
             border: 1px solid var(--line); background: var(--card);
             color: var(--ink); border-radius: 999px; padding: 7px 14px;
             font-size: 13px; font-family: inherit; cursor: pointer;
             white-space: nowrap; transition: all .15s; text-decoration: none; }
  .refresh:hover { border-color: var(--accent); color: var(--accent); }
  .refresh:active { transform: scale(.97); }
  .refresh .spin { display: inline-block; animation: none; }
  .refresh.busy .spin { animation: spin 1s linear infinite; }
  .refresh.done { border-color: #16A34A; color: #16A34A; }
  .refresh.pulse { position: relative; animation: pulse 2s infinite; }
  .refresh.pulse::after { content: ''; position: absolute; right: -2px; top: -2px;
                          width: 10px; height: 10px; border-radius: 50%;
                          background: #16A34A; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(22,163,74,.4); }
                     50%    { box-shadow: 0 0 0 8px rgba(22,163,74,0); } }

  h2 {
    font-size: 16px; margin: 40px 0 14px; font-weight: 600;
    display: flex; align-items: center; gap: 9px;
  }
  h2::before { content: ""; width: 4px; height: 17px; border-radius: 2px; background: var(--accent); }
  h2 em { font-style: normal; font-weight: 400; font-size: 13px; color: var(--muted); }

  /* ---------- 比赛 ---------- */
  .contests { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .contest { background: var(--card); border: 1px solid var(--line);
             border-radius: var(--radius); padding: 16px 18px; }
  .contest .top { display: flex; justify-content: space-between; align-items: baseline;
                  gap: 10px; margin-bottom: 6px; }
  .contest .name { font-weight: 600; font-size: 14.5px; line-height: 1.55; }
  .contest .org { color: var(--muted); font-size: 12.5px; margin-bottom: 8px; }
  .contest .note { font-size: 13px; color: var(--body); line-height: 1.7; }
  .badge { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
           white-space: nowrap; background: #DBEAFE; color: #1E40AF; }

  /* ---------- 工具条 ---------- */
  .toolbar { position: sticky; top: 0; z-index: 9; background: var(--bg);
             padding: 14px 0 12px; margin: 30px 0 4px; border-bottom: 1px solid var(--line); }
  .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px;
          scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: 0 0 auto; border: 1px solid var(--line); background: var(--card);
         color: var(--body); font-size: 13.5px; padding: 6px 15px; border-radius: 999px;
         cursor: pointer; font-family: inherit; transition: all .15s; white-space: nowrap; }
  .tab.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .search { display: flex; gap: 8px; align-items: center; }
  #q { flex: 1; border: 1px solid var(--line); background: var(--card); border-radius: 999px;
       padding: 9px 16px; font-size: 14px; font-family: inherit; outline: none; color: var(--ink);
       min-width: 0; }
  #q:focus { border-color: #C9C2B6; }
  .sort { border: 1px solid var(--line); background: var(--card); color: var(--body);
          border-radius: 999px; padding: 8px 14px; font-size: 13px; font-family: inherit;
          cursor: pointer; white-space: nowrap; }

  /* ---------- 卡片 ---------- */
  .card { position: relative; background: var(--card); border: 1px solid var(--line);
          border-radius: var(--radius); padding: 18px 20px; margin-bottom: 12px;
          transition: border-color .15s, opacity .2s; }
  .card:hover { border-color: #D6CFC2; }
  .card.pick { border-left: 3px solid var(--accent); }
  .card.lead { padding: 22px 22px 20px; }
  .card.lead h3 { font-size: 19px; }
  .card.read { opacity: .62; }

  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
         font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
  .chip { font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; }
  .new { font-size: 11px; font-weight: 700; color: #B91C1C; background: #FEE2E2;
         padding: 1px 7px; border-radius: 999px; }
  .for-you { font-size: 11px; font-weight: 700; color: #6D28D9; background: #EDE9FE;
             padding: 1px 7px; border-radius: 999px; }
  .stars { margin-left: auto; color: var(--accent); font-size: 12px; letter-spacing: 1px; }

  .card h3 { margin: 0 0 8px; font-size: 16.5px; line-height: 1.6; font-weight: 600; }
  .card h3 a { color: var(--ink); text-decoration: none; }
  .card h3 a:hover { color: var(--accent); }
  .line { margin: 0 0 6px; font-size: 14.5px; color: var(--body); line-height: 1.75; }
  .why { margin: 0; font-size: 13px; color: var(--accent); background: var(--accent-soft);
         border-radius: 9px; padding: 7px 11px; display: inline-block; }
  .raw { margin: 8px 0 0; font-size: 13px; color: var(--muted); line-height: 1.7; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tag { font-size: 11.5px; color: #6B7280; background: #F3F4F6; border-radius: 999px;
         padding: 2px 9px; }

  /* ---------- 站内阅读 ---------- */
  .thumb { width: 100%; max-height: 180px; object-fit: cover; border-radius: 10px;
           margin-bottom: 10px; display: block; background: #F3F4F6; }
  .inline-bullets { margin: 8px 0 2px; padding: 0; list-style: none; }
  .inline-bullets li { font-size: 13.5px; color: #4B5563; padding: 3px 0 3px 14px;
                       position: relative; line-height: 1.7; }
  .inline-bullets li::before { content: "•"; position: absolute; left: 0; color: var(--accent);
                               font-weight: 700; }
  .full-body { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); }
  .card.body-open .full-body { display: block; }
  .card.body-open .expand-btn span { content: '收起全文'; }
  .full-body .body-text { font-size: 14px; color: #374151; line-height: 1.85;
                          white-space: pre-wrap; word-break: break-word; }
  .imgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
          gap: 8px; margin-top: 12px; }
  .imgs img { width: 100%; height: 110px; object-fit: cover; border-radius: 8px;
              background: #F3F4F6; }

  .expand-btn { display: inline-flex; align-items: center; gap: 4px;
                background: transparent; border: 1px solid var(--line);
                color: var(--accent); border-radius: 999px; padding: 5px 14px;
                font-size: 12.5px; font-family: inherit; cursor: pointer;
                margin-top: 10px; }
  .expand-btn:hover { background: var(--accent-soft); }

  .fav { position: absolute; right: 14px; bottom: 14px; border: 1px solid var(--line);
         background: transparent; color: var(--muted); font-size: 12.5px; font-family: inherit;
         border-radius: 999px; padding: 4px 12px; cursor: pointer; transition: all .15s; }
  .fav:hover { border-color: #C9C2B6; }
  .fav.on { color: var(--accent); border-color: #E7C89E; background: var(--accent-soft); }

  .empty { text-align: center; color: var(--muted); padding: 54px 0; font-size: 14px; }
  footer { padding: 46px 0 64px; color: #9CA3AF; font-size: 12.5px;
           border-top: 1px solid var(--line); margin-top: 36px; line-height: 1.9; }

  @media (max-width: 560px) {
    .wrap { padding: 0 16px; }
    header { padding-top: 34px; }
    h1 { font-size: 27px; }
    .card { padding: 16px 17px; padding-bottom: 46px; }
    .card.lead { padding: 20px 18px; padding-bottom: 48px; }
    .card.lead h3 { font-size: 17.5px; }
    .stars { margin-left: 0; }
  }
</style>
</head>

rae.cn/t/topic/605364", "source": "TRAE 官方社区", "category": "contest", "summary": "对于编程领域的IDE软件，结合Agent重新做一遍就有了我们现在熟知的AI编程工具 TRAE。 对于办公领域的软件（Word、Excel、PPT等），在Agent强大编程能力的基础上，结合Agent重新做一遍，就有了我们现在熟知的各种办公Agent。 最近个人助理（Personal Agent）很火，把个人的日程管理，待办管理等生活场景的个人任务用Agent的交互的逻辑重新做一遍，似乎就有了现在的各种个人助理Agent。 你的观点是什么", "ts": "2026-11-24T06:22:25+00:00", "published": "11-24", "starred": false, "importance": 4, "topic": "AI 编程", "one_line": "探讨使用 Agent 思路重构互联网软件的可能性", "why": "了解 AI 编程工具的发展趋势，为作品集提供灵感", "inline_text": "结合 Agent 重新做 IDE 软件，办公软件，个人助理等，Agent 编程能力强大", "full_text": "ä¼¼ä¹�å�¯ä»¥ç”¨Agentçš„æ€�è·¯æŠŠæ‰€æœ‰çš„äº’è�”ç½‘è½¯ä»¶é‡�æ–°å�šä¸€é��ï¼�å¤§å®¶æ€�ä¹ˆçœ‹ï¼Ÿ - äº’åŠ¨äº¤æµ� - TRAE å®˜æ–¹ä¸­æ–‡ç¤¾åŒº", "thumb": "", "images": [], "tags": ["AI 产品"], "seen": false, "new": true, "daily": true, "score": 44.86461202753472, "rank": 1}, {"guid": "0ef3f2758d737e9f855b138b05eb326c", "title": "本地部署最佳大模型？对比Qwen3.8-27B ，24G 内存实测，更快了！", "link": "https://www.woshipm.com/ai/6499020.html", "source": "人人都是产品经理", "category": "pm", "summary": "在 Apple M6 Mac mini 的 24 GB 内存里，Inkling 2 Mini 单路跑到 33.6 tok/s，四并发总吞吐 60.6 tok/s，比同机 Unsloth 快一半以上，综合能力与 Qwen 3.8 27B 打平。循环稀疏 MoE 是它没被带宽卡死的关键。 作为大模型本地部署爱好者，时常看下 Huggingface 开源模型排行榜是我的基操 本文我们一起看看正在霸榜的 Inkling-2-Mini 过去大半年", "ts": "2026-11-24T06:22:01+00:00", "published": "11-24", "starred": false, "importance": 4, "topic": "AI 编程", "one_line": "对比 Qwen3.8-27B 大模型在本地部署的性能", "why": "学习大模型本地部署的最佳实践，提升产品性能", "inline_text": "Inkling 2 Mini 在 24G 内存中表现优异，吞吐量比同机 Unsloth 快一半以上", "full_text": "在 Apple M6 Mac mini 的 24 GB 内存里，Inkling 2 Mini 单路跑到 33.6 tok/s，四并发总吞吐 60.6 tok/s，比同机 Unsloth 快一半以上，综合能力与 Qwen 3.8 27B 打平。循环稀疏 MoE 是它没被带宽卡死的关键。\n作为大模型本地部署爱好者，时常看下 Huggingface 开源模型排行榜是我的基操\n本文我们一起看看正在霸榜的 Inkling-2-Mini\n过去大半年，Qwen 3.8 27B 一直是本地部署党的心头好，至今在 HF Top 10 依然可以见到它的身影，比如上周末刚详细介绍了针对 Pi 这个 Harness 优化的 Qwen3.8-27B-pi-adapted：Agent 绝配版 Qwen3.8-27B，关掉思考，更稳更快！\nQwen 3.8 27B 能力稳，但全量稠密架构一进 24 GB 内存的 Mac 或单卡机器，吐字速度就被带宽死死卡住\nThinking Machines Lab 刚开源了\n循环稀疏 MoE\n新模型 Inkling 2 Mini，主打普通笔记本离线跑多智能体\n我第一时间在手头这台 Apple M6 Mac mini上，把 Strata 和 Unsloth 两套路线跑了一遍\n省流：\n综合实力和 Qwen 3.8 27B 基本平分秋色，写代码与调工具还更凌厉；本机 Strata 单路最高跑出 33.6 tok/s、四并发总吞吐干到 60.6 tok/s，比同机 Unsloth 快出一半以上\n为什么能跟 Qwen 3.8 27B 打平，速度还更快\nInkling 2 Mini 速度够快，最核心的还是 MoE 架构，外加\n原生低比特训推一体\n，前 20 层用 NVFP4、后 4 层用 MXFP8 从头训到尾，放出来的整包约 20 GB，几乎没有传统量化折损，同时\n自带视觉编码器和 1M 上下文\nInkling 2 Mini 循环稀疏 MoE 与 Qwen 3.8 27B 稠密架构核心对比\nInkling 2 Mini 与 Qwen3.8-27B：\n综合水平打成平手，但主场完全不同\nInkling 2 Mini 明显偏科向\n写代码、多步骤修 Bug、调用工具联网查资料、百万级长文检索和看图操作界面\n倾斜，斯坦福团队实测它的单位功耗智能效率也远超同体量稠密对手，官方甚至演示过一台离线 MacBook Pro (M5 Pro, 48GB) 同时驱动二十个自主活动的像素小镇角色\n也有网友测试出了与 Hy4 flash 掰手腕的场景\n反过来，Qwen 3.8 27B 的稠密大权重底子还在：\n日常中文办公、多轮复杂约束对话、不联网靠记忆答事实题的防幻觉能力\n，依然是它更稳当\n24 GB Mac mini 双引擎实测：Strata 快出超一半\n老章办公室这台测试主机 Mac mini（Apple M6 芯片，12 核，24 GB 统一内存），系统给单进程 Metal GPU 的推荐工作集上限约 18.6 GiB\n性能实测，我对比了两个部署方案，都是我们的老朋友了 Unsloth VS Strata：\nStrata 路线\n：升级到 0.2.19，使用原生 Metal 引擎 strata-inkling 跑 10.47 GB 的 SQ-10 打包版（32K 上下文全常驻）\nUnsloth 路线\n：使用官方适配循环层与 DSpark 的预编译版，跑 16.61 GB 的 Inkling-2-Mini-UD-Q4_K_M.gguf 与 384 MB 的 dspark-Inkling-2-Mini-Q8_0.gguf\n两套引擎的底层基准与代码、数学、中文三类真实 API 对话实测如下：\n测试方案与配置\n体积 / 内存占用\n预填充 (tok/s)\n单路生成 (tok/s)\n并发总吞吐 (tok/s)\nStrata 基准（SQ-10，32K）\n10.47 GB / 占 12.03 GiB\n564.4（512 词）/ 440.5（2K 词）\n32.8（fp16）/ 峰值 33.6（k8v4）\n2 并发 52.5 / 4 并发 60.6\nStrata 真实 API（SQ-10，32K）\n12.03 GiB（含 DSpark）\n短提示 111 ~ 150\n默认 27.6 ~ 27.8 / 贪婪 28.5\n4 路真实 API 总计 47.63\nUnsloth 基准（UD-Q4_K_M）\n16.61 GB（15.46 GiB）\n260.18（512 词）/ 236.93（2K 词）\n20.94（tg128）/ 21.77（tg256）\n—\nUnsloth 真实 API 常规（8K）\n紧贴 18.6 GiB 上限\n短提示 22 ~ 50\n代码 21.24 / 数学 21.76 / 中文 21.49\n—\nUnsloth + DSpark（4K）\n权重 + 草稿逼近上限\n短提示 25 ~ 55\nn=3 降至 15.00 / n=7 降至 12.08\n—\n同机同模型，Strata 靠内存映射 0.01 到 0.04 秒就能加载完毕，开满 32K 上下文只吃 12.03 GiB，预填充是 Unsloth 的 2.17 倍，单路峰值高出 54%，四并发总吞吐冲上 60.6 tok/s（6 并发才触碰 24 GB 内存上限）\n如果老铁们手头有高配显卡，上限还能翻倍飙升\n按 Strata 官方在二十台设备上的实测数据，Apple M5 Max 单路能到 100 ~ 114.5 tok/s，RTX 5070 12 GB 跑 93.9 ~ 101.4 tok/s，RTX 5070 Ti 16 GB 飙到 155.5 tok/s，RTX 5090 单路冲到 176.5 ~ 250.3 tok/s、64 并发总吞吐超 4,000 tok/s：\nStrata 官方在 20 款主流显卡与苹果芯片上的单路及预填充测速参考\n跑下来，分享两个部署的坑和三个模型短板吧\n部署第一个坑\n：默认参数在 24 GB Mac 跑 Unsloth 直接 OOM\nUD-Q4_K_M 权重占 15.46 GiB，离 Metal 上限只差 3 GiB，按 llama-server 默认多槽位加半精度缓存启动直接报内存不足，必须锁单槽位、压 8-bit 缓存并开 Flash Attention\n部署第二个坑\n：标准版 Apple M6 上开 DSpark 反而越猜越慢\n实测 Unsloth 挂上草稿模型后，采纳率只有 28% ~ 38%，可每次批量核验都要重跑 48 层循环，直接把代码速度从 21.24 tok/s 拖垮到 15.00 甚至 12.08 tok/s，中文更是掉到 8.66 tok/s；标准版 M 系列芯片关掉草稿更快，高带宽旗舰卡才吃得消这套加速\n模型本身的三个槽点：\n中文偏硬，思考爱飙英文\n：实测中文提问时，它的内部思考默认先走英文，最终回答虽准确但句式偏短，官方也承认中文场景偶发中英夹杂\n思考关不死，排错偶发死循环\n：即便把思考强度调到最低仍会轻度推理，复杂调试时偶尔反复自检，接本地 Agent 务必卡死最大输出和步数，并在沙盒运行\n离线问冷门事实不占优\n：循环", "thumb": "https://static.woshipm.com/tag/1101_1@2x.png ", "images": ["https://static.woshipm.com/tag/1101_1@2x.png ", "https://image.woshipm.com/2023/05/06/c97d24e0-ec00-11ed-96ae-00163e0b5ff3.jpg", "https://image.woshipm.com/wp-files/sha256/73/41/73412f7c10ed9d0e7c805501d566aaf574bc03161fb2079781e43506ea7a3ef7.png", "https://image.woshipm.com/wp-files/sha256/4c/23/4c23d67c454265b06bdd04c1038f4af023e20601d8d200d4a2216f92173c16f6.jpg", "https://image.woshipm.com/wp-files/sha256/ae/cc/aeccd4e47f75e299b545f325aaf271228f58a87a76a283483cdde1df30493159.png", "https://image.woshipm.com/wp-files/sha256/6e/b1/6eb1b9e8bfdb07f3c7e9ec24d0ee30ae49f695da913b05abf8a1a5263cb7cc4e.png"], "tags": ["AI 产品"], "seen": false, "new": true, "daily": true, "score": 43.8641953605382, "rank": 2}, {"guid": "0b884a367bf3beccaa5fae448875070b", "title": "腾讯 WorkBuddy + 上下文同步，直击多设备痛点，太夯了~【附实测+提示词】", "link": "https://www.woshipm.com/ai/6499017.html", "source": "人人都是产品经理", "category": "pm", "summary": "把老 MacBook Pro 里一百多条对话和工程文件整体迁到 RTX Spark，接着在同一个对话里用本地混元 3D 换掉简模、开光追重渲圆明园兽首。跨设备丢上下文的痛，靠一次迁移和一次接续讲清楚了。 前两天跟大家提过一嘴，最近新拿到了这台 RTX Spark 。机器能力确实猛，到手这几天我直接在本地部署了一整套模型，既能生图、生视频，还把 腾讯混元的 3D 建模模型 也跑通了；而且它是英伟达 N 卡架构，可以直接调 GPU 渲染、开", "ts": "2026-11-24T06:20:44+00:00", "published": "11-24", "starred": false, "importance": 4, "topic": "AI 产品", "one_line": "腾讯 WorkBuddy 的多设备上下文同步功能实测", "why": "了解 AI 助理产品的实际应用，为作品集提供案例", "inline_text": "跨设备迁移对话和文件，实现上下文同步，提升用户体验", "full_text": "把老 MacBook Pro 里一百多条对话和工程文件整体迁到 RTX Spark，接着在同一个对话里用本地混元 3D 换掉简模、开光追重渲圆明园兽首。跨设备丢上下文的痛，靠一次迁移和一次接续讲清楚了。\n前两天跟大家提过一嘴，最近新拿到了这台\nRTX Spark\n。机器能力确实猛，到手这几天我直接在本地部署了一整套模型，既能生图、生视频，还把\n腾讯混元的 3D 建模模型\n也跑通了；而且它是英伟达 N 卡架构，可以直接调 GPU 渲染、开光追，性能非常好。\n但是说实话，搞了那么多东西，有点拔剑四顾心茫然，新的机子一点项目都没有，只能从零开始造。。。这种痛相信用惯 WorkAgent 的朋友们都遇到过，比如家里和公司电脑的数据同步啊等等1\n正好看到\nWorkBuddy 更新了「跨电脑数据迁移」\n，我直接把老 MacBook Pro 里攒的一百多条对话和工程文件全迁到了 RTX Spark 上。\n我立马想起了之前测的两个 Blender 建模 Case：《飞行特斯拉》和《圆明园》。\n当时在 MacBook 上纯靠写 Blender 代码建模，渲染也大多靠 CPU 或普通模式跑，虽然整体建得非常好，但还是有些地方大模型不太拿手：比如特斯拉展台周围的围观群众，纯几何体拼出来呆呆的，看着有点 der；\n圆明园则是纯脚本生成的十二生肖兽首面数低、细节不够，蛇首干脆是一颗圆球顶在弹簧圈上，贼他么抽象。。\n这次\n借着 WorkBuddy 把完整上下文搬到 RTX Spark\n，刚好用本地混元 3D 替换高精模型，再调 N 卡 GPU 开光追重渲了一遍。\n01 用好 WorkAgent 最关键的一步：上下文！\n为什么不直接把 Blender 的 .blend 产物和脚本拷过去让 AI 接手？\n这招我也试过，最大的问题就是会丢掉大量\n上下文\n。\n浅举两个例子：\n1. 在圆明园建模里，前期喂了大量历史资料和文献（像 1786 年铜版画、2015 年考古报告），中期又定了很多决策判断，尤其是 AI 哪些地方做不到、容易出什么问题，都在对话里立好了规矩和约束；\n2. 飞行特斯拉那边，具体的镜头机位和底盘喷气效果也是一轮轮调出来的。\n如果只拷文件过去，这些上下文就没了。\n到了新机子上，等于要从零重新给模型喂知识：往轻了说，得从头再跟它讲一遍；要是严重点，之前明明已经教训过它的错，它转头又会再犯一遍。\n想不翻车，就得自己想办法把旧对话全导出来重新喂进去，非常麻烦。\n用\nWorkBuddy 的「跨电脑数据迁移」\n，主要就是能把\n对话上下文和本地产物结果一起导过来\n（本机如果还有 Claude Code、Cursor、ChatGPT 的记录，也能先从旁边的「导入其他应用数据」导进 WorkBuddy 再一起迁走）。\n而刚好我这两个 Blender 项目之前都是在 Claude Code 里跑的。\n这次操作很简单：先在老 MacBook 上把记录导进 WorkBuddy，再去 RTX Spark 的 WorkBuddy 上打开\n设置 → 数据导入 → 导入其他电脑数据，选中旧电脑点「全部导入」，\n挂着等它传完就行，前前后后一共导过来 100 多项记录：\n像任务本身、聊天记录、WorkBuddy 托管目录里的工程文件，还有建好的分组（含绑定的文件夹、记忆、本地 Skill）以及定时任务，都会一起带过来。\n导进来的文件会单独放在 ~/WorkBuddy/{设备名}/ 下面，和本机原有的文件分开存；\n定时任务迁过去默认是关着的\n，免得两台电脑同时跑：\n单个产物只要不超过 100M 都能正常传，断网或重复导入也会自动去重（\n实测遇到超过 100M 的大文件，可以先走「资料库」上传，到了新机直接从资料库里拉出来接着用\n）：\n01 / 02\n02 / 02\n不过有一点得提前留意：\nMCP、日志，以及平台全局下发的 Skill、专家和全局记忆\n目前不会跟着走，换完电脑需要重新配一遍。\nps. 如果你点进去没看到入口，或者刷不出旧电脑，可以先查一下这三处：\n1. 两台电脑的客户端都升到\n5.11.3\n以上，登录同一个账号；\n2. 旧电脑连着网，WorkBuddy 保持打开；\n3. 打开\n「允许移动设备远程连接」\n。如果旧电脑习惯锁屏，去「设置 – 通用」里把锁屏运行改成「熄屏后保持唤醒」就能继续传。\n02 接着原来的对话重跑：混元 3D 换高模 + GPU 开光追\n数据导完，在 RTX Spark 上点开原来的圆明园任务，我先让它复述了一下之前的进度，从早期建模、参考图包到中间返工的细节全记得清清楚楚；\n把主场景工程包补拖进去，就能直接在原对话底下接着往下跑了：\n最省心的一点是，之前定好的建筑朝向、石材比例和避坑要求全留在上下文里，不用再去翻半个月前的参考文档，直接把新需求往下接，它就能顺着原来的脚本命名继续改。\n换到这台 N 卡机器上跑 Blender，渲染直接走 GPU，\nGPU 利用率拉到了 95%\n，之前在笔记本上不敢开的光追这回也能正常开了。\n先看《飞行特斯拉》。\n原来调好的车身和飞行动作不用动，主要是换人和补光影。\n我先用本地部署的\n混元 3D\n生成了几个高精度、高面数的人物模型，替换掉展台围栏后面那排灰扑扑的代码小人（左下角那个像白胶囊一样的卡车头也顺手换了）；\n打开光追重渲之后，点火离地时车底映在地面上的冰蓝色漫反射和尾气层次比之前自然多了：\n再看《圆明园海晏堂》。\n因为原对话里已经保留了 1786 年铜版画参考和十二生肖的排布要求，接着改很舒心。\n它还顺手排查出旧工程脚本默认回退到了 CPU 渲染，切回硬件光追之后，从之前在 MacBook 上只能出一个 6 秒 960×540 小样，直接跑出了一条\n2 分钟的 1080p 完整成片\n，把海晏堂、谐奇趣、黄花阵和大水法全串了起来：\n同机位抽帧对比看得更清楚：\n不仅把旧版误涂成全铜色的雕像改回了「红铜兽首 + 汉白玉石袍」分色，开了光追、调高渲染之后，天上多了真实的体积云，水池里的波纹和倒影也写实了很多，岸边石阶与建筑倒映在水面上，把整个水面的质感很好地映衬了出来：\n大场景视频跑完，最后我还把\n十二生肖兽首\n这个坑给补上了。\n前几天在\nSeedance Agent\n那篇里，我是拿这套 Blender 白模当空间底图去跑 2D 视觉复原，当时 3D 工程里的兽首其实还是纯几何体拼的简模。\n这次顺着原对话接着往下做：有文物照片的鼠、牛、虎、兔、马、猴、猪 7 尊按实物参考走，缺实物的龙、蛇、羊、鸡、狗 5 尊结合铜版画先补齐三视图，再统一取右侧视角送进本地部署的\n混元 3D\n工作流转成高面数网格：\n混元 3D 工作流直接把原图变成 3D 模型\n01 / 03\n02 / 03\n03 / 03\n把这十二尊高模替换回海晏堂水池边，单独跑出来的静帧，细节总算能称得上是「复刻」了（时间关系兽首这版只出了静帧渲染图，没再重跑整条视频，因为哪怕用 Spark 跑一次这种精度的渲染都要 12 个小时。。。）：\n01 / 02\n02 / 02\n也是到拉近特写才发现个更搞笑的事，原来一开始建模时兽首嘴里那道喷水压根没跑流体，直接是一根建在模型里的实体管子 = =。\n03 100 多条记录不好找？直接", "thumb": "https://static.woshipm.com/tag/1101_1@2x.png ", "images": ["https://static.woshipm.com/tag/1101_1@2x.png ", "https://image.woshipm.com/2023/04/13/d3472592-d9e1-11ed-bd74-00163e0b5ff3.jpg", "https://image.woshipm.com/wp-files/sha256/f2/09/f2091f626d0b23eab92def29068febf77cb30881e2029b91da28bc89f779e472.webp", "https://image.woshipm.com/wp-files/sha256/e7/c7/e7c7adcdfed9597ff9d82c7e98b9c68b993435aa3fce2851d732a4f12a356a67.png", "https://image.woshipm.com/wp-files/sha256/f6/e8/f6e8d4e25ed53417c2168737b4a1c051cc12d9aaa8c7ae81a88b47399628dfde.jpg", "https://image.woshipm.com/wp-files/sha256/e0/c5/e0c509390eae7ea5800d28e0da9b621653487b6d00d1f2865cc1649fccaf8630.webp"], "tags": ["AI 产品"], "seen": false, "new": true, "daily": true, "score": 41.86285855467014, "rank": 3}, {"guid": "bfbbe80e8a92785df4ef5152ba244d8b", "title": "哥哥们我的积分快过期 7月12日更新：再次打开，使用 KOOFR 优惠码可享受优惠。 2026年5月26日更新：再次开启打", "ts": "2026-11-24T03:24:23+00:00", "published": "11-24", "starred": false, "importance": 3, "topic": "vibe coding", "one_line": "Koofr 云存储优惠活动，终身订阅 1TB 特价 129.9 美元", "why": "", "inline_text": "免费 10GB 空间，支持 WebDAV、Rclone，终身订阅 1TB 特价 129.9 美元", "full_text": "", "thumb": "", "images": [], "tags": ["AI 产品"], "seen": false, "new": true, "daily": false, "score": 31.679160635694444}, {"guid": "87d21e1bb7378b7e0e74df37969e2dac", "title": "释放AI与出海强预期，近1500人参与亿邦产业互联网年会暨首届产业智能体大会", "link": "https://www.qbitai.com/2026/11/512305.html", "source": "量子位", "category": "ai_product", "summary": "2026年11月20日，第八届亿邦产业互联网年会与首届产业智能体大会在北京国贸大酒店首次合体举行。", "ts": "2026-11-24T03:21:12+00:00", "published": "11-24", "starred": false, "importance": 3, "topic": "AI 产品", "one_line": "亿邦产业互联网年会暨首届产业智能体大会举行", "why": "", "inline_text": "近 1500 人参与，AI 与出海强预期，产业智能体大会举行", "full_text": "< img id=\"wx_img\" src=\"https://www.qbitai.com/wp-content/uploads/imgs/qbitai-logo-1.png\" width=\"400\" height=\"400\">\n释放AI与出海强预期，近1500人参与亿邦产业互联网年会暨首届产业智能体大会\n量子位的朋友们\n2026-11-24\n11:21:12\n来源：\n量子位\n2026年11月20日，第八届亿邦产业互联网年会与首届产业智能体大会在北京国贸大酒店首次合体举行。\n文丨亿邦智库\n2026年11月20日，第八届亿邦产业互联网年会与首届产业智能体大会在北京国贸大酒店首次合体举行。从2019年算起，亿邦产业互联网年会已经走到第八年，年度主题从“谁在重构产业链”到“解锁新周期”，随产业周期与年度命题持续迭代。本次大会强调AI与出海带来的“模态进化”，产业智能体引发业界普遍共鸣，热议产业互联网增长逻辑正在经历着一场什么样的模态切换。仅现场实况图片交互就达22594人次，亿邦视频号直播观看达63788人次。\n本次大会开幕演讲中，经济学家李稻葵从宏观层面为产业AI、产业智能体和产业出海，作出了一个时代背景的解释框架：中国AI发展比美国更具可持续性。产业AI和智能体不是孤立的技术竞赛，而要嵌入中国高储蓄率、低成本资金和完整产业体系所决定的产业升级与全球化进程之中；产品、企业、产业链供应链出海是必然方向，“抱团出海、带动全产业链布局”将成为常态。\n著名经济学家 李稻葵\n亿邦动力董事长、亿邦智库院长郑敏在发布\n《模态进化——2026产业互联网发展报告》\n时，给出了一个贯穿全场讨论的基调判断：产业互联网从来不是抢蛋糕的角色，而是做蛋糕的角色；AI与出海，是当前业界高共识的增长路径。围绕这条主线，大会设置产业智能体落地、AI供应链价值重构、数据要素与Token经济、AI打开产业服务新场景、产业出海新生态五大议题，数十位产业互联网企业决策人与行业专家在一天议程中，将“模态进化”拆解为可对照、可讨论的企业实践。\n按照这两条大会形成的确定性路径共识，我们来梳理一下参会菁英们的核心观点与企业动作，以飨读者。\nAI带来的模态进化：产业智能体怎么干\n“今年完全可以称之为产业智能体的元年。”郑敏在报告中将产业智能体的竞争力建设归纳为四个方向：数据、生态、质控，以及以Token为特征的收入。元年是启动，远未到成熟。郑敏还同时点出一个容易被热闹掩盖的事实：AI覆盖率达到90.6%，数据治理体系建成率78.4%，部署面已经铺开，但“数据不等于能力”——把决策系统做成可自主执行的制度，把组织经验转化成可调用的结构，这一步没有外部供给可以直接购买，只能靠企业自己走出来。\n震坤行副总裁苏钰称，可以将企业拥抱AI的路径分为三层：第一层是AI赋能提效，在原有业务边界内放大服务能力；第二层是AI重塑流程，依托产业链站位重构价值、开拓新业务；最高阶是生长出完全由AI驱动的原生业务。他把目光投向“物理AI”，认为数字世界的应用已经过载，真正能承载下一轮几何级Token增长的，是AI走向工厂、走向物理世界的原生场景。\n腾讯云行业生态总经理张林的判断与之呼应，但更偏向组织的视角。他认为：“Agent是组织能力放大器，企业不必等待万能智能体，而应先把最烦琐、最痛的业务流程提炼出来交给AI。”他观察到，AI的运行模式正在从“在预设流程内辅助提效”转向“给定目标后自行拆解任务、调动原子能力、同步正负反馈”，组织架构也随之从大部门模式向小团队乃至一人公司演化。\n乐观叙事之外，科力普科技集团CTO张少鹏给智能体的落地加了一道“可靠性”的约束性注脚。他算了一笔采购流程的账：从需求提报到结算售后大约8个环节，如果AI在每个环节都做到95分，8个95%相乘只剩约66%——“大约每三张采购单，就有一张会在某个地方出问题”。他的结论是，企业采购AI的核心目标不是简单的降本增效，而是“把复杂度降下去、把确定性提上去”；边界清晰、例外可纠、全程可追溯，AI才能从“能用”走到“可靠”。这与王煜的“卖确定性”形成呼应：前者谈的是流程可靠性，后者谈的是平台价值兑现方式。\n中铁工业有限公司总经理杨皓岚把采购行业的发展，作了一个直推到智能体门槛上的演进分析。他把采购行业划分为三个阶段：传统社会联系时代，线下采购高度依赖采购人员的谈判能力；自助阶段，以门户商城为入口实现采购全流程线上化；而当前正加速进入智能体阶段。不同于前两个阶段围绕“人怎么买”优化采购方式，智能体阶段的变化是采购决策主体的迁移——平台服务对象从采购人转向采购人配置的智能体，行业护城河也将从规模、流量转向数据与信用。他与张少鹏的“可靠性”判断形成互补：前者回答“能不能可靠地干”，后者回答“谁来决定让不让它干”。\n但是，数据基础底座的差距，在整个行业的转型升级中还是很明显的，在电子元器件行业则体现得更为具体。云汉芯城李鲲鹏提出AI落地要过“三道关”：产业数据的结构化与统一口径、模型答案有分级可验证的证据链、打通上下游完成交付闭环。\n产业互联网和人工智能落地专家  谢 海\n产业互联网和人工智能落地专家谢海的表述更为凝练：“AI的终点是产业现场。”单个智能体能力强，并不等于整个组织的效率提升，真正拉开差距的是场景挖掘、数据沉淀、智能体编排与运营治理。\nPureblueAI清蓝联合创始人王立新则从需求入口的另一侧提醒品牌方：AI应用用户规模已达31亿，AI单次回答通常只展示3至4个品牌，曝光是零和博弈，品牌的营销逻辑正从“被检索”向“被信任”跨越，必须在模型的隐空间中建立可被引用的认知印记，弥补自身的数据不足。\n陕煤物资商城公司董事长王菲在主持圆桌对话时，就把能源物资场景的难题摆得很具体：品类繁杂、大量非标设备配件，AI辅助物资选型、需求归集与风险预警时会遇到知识库建设难度大、人员接受度不一、上下游数字化水平参差不齐等问题。她的判断是，产业智能体绝不是通用的聊天机器人，其根基是深厚的行业知识与高质量数据库；它必须能切实解决复杂非标场景下的物资选型、需求归集与风险预警等问题，同时要在数据安全合规的前提下，通过分层治理实现产业链内外的数据闭环。她提出数据治理宜分三层：公开数据依规公开，脱敏数据用于定向交互，核心数据做好安全保留。王煜对此补充，国有企业原则上原始数据不能出域，但经过加工形成的数据产品可以对外输出，需要搭建可信数据空间，并与成熟专业机构合作打造数据产品，进而实现整体数据闭环。\n国联股份董事、高级副总裁潘勇则从大宗工业品的行业特性出发，给出智能体落地的优先级判断。他指出，工业大宗品交易规模大、毛利率低，每一个环节省下来的成本都会直接转化为利润，AI相比传统数字化工具最突出的优势，是能打破原有固定公式框架，开展更灵活的预测、计算与分析；其中最核心的环节是价格预测——过去依赖资深员工经验判断，在当前市场波动加剧背景下有效性不断下降，有效的价格预测模型将为全行业经营效率提升带来极大助力。\n西部证券投资银行总部董事总经理翟晓东从投行与资本视角补上了两个容易被忽略的维度。其一是数据价值：产业互联网平台在交易撮合、履约服务中产生大量价格、交易量与企业真实采购决策行为数据，其数据生成能力和规模与一般制造业企业相比存在十倍甚至", "thumb": "https://i.qbitai.com/wp-content/uploads 43771590656", "source": "掘金", "category": "tech", "summary": "网页与 JavaScript 注入基础 你在手机里看到一个小程序界面时，界面可能由 HTML、CSS 和 JavaScript 共同生成，也可能主要由游戏引擎画在 Canvas 上。鸿蒙容器里的 We", "ts": "2026-11-23T03:46:43+00:00", "published": "11-23", "starred": false, "importance": 3, "topic": "AI 编程", "one_line": "", "why": "", "inline_text": "网页与 JavaScript 注入\n小程序界面生成\n鸿蒙容器技术", "full_text": "", "thumb": "", "images": [], "tags": ["AI 编程"], "seen": false, "new": false, "daily": false, "score": 30.202424514131945}, {"guid": "c9847f85dc16bb2ddfd676bf8468bb3e", "title": "“你们先做，我们肯定用”—— 这句话害了多少定制项目", "link": "https://www.woshipm.com/zhichang/6498286.html", "source": "人人都是产品经理", "category": "pm", "summary": "两个月人力做完一套定制功能，验收一次通过，上线后客户只走了基础配置。问题不在执行，而在确认方案的方式：从头到尾都在讲给客户看，没让一线自己上手跑一遍。作者把验证挪到设计和研发启动之前，代价从两个月人力变成几天时间。 小蓝带团队花两个月给一个大客户做了一套定制功能，从调研到上线按标准流程走完，按时交付落地。 一个月后看数据： 客户只走了基础配置，核心链路那套规则基本没用起来，平台上的业务量和前六个月平均水平持平，没有增量。 这类坑在大客户", "ts": "2026-11-23T03:42:23+00:00", "published": "11-23", "starred": false, "importance": 4, "topic": "产品经理", "one_line": "定制项目失败案例分析", "why": "了解定制项目失败原因，可能对求职有帮助", "inline_text": "两个月人力完成定制功能\n验收通过后客户只使用基础配置\n验证挪到设计和研发启动之前", "full_text": "两个月人力做完一套定制功能，验收一次通过，上线后客户只走了基础配置。问题不在执行，而在确认方案的方式：从头到尾都在讲给客户看，没让一线自己上手跑一遍。作者把验证挪到设计和研发启动之前，代价从两个月人力变成几天时间。\n小蓝带团队花两个月给一个大客户做了一套定制功能，从调研到上线按标准流程走完，按时交付落地。\n一个月后看数据：\n客户只走了基础配置，核心链路那套规则基本没用起来，平台上的业务量和前六个月平均水平持平，没有增量。\n这类坑在大客户定制里太常见了。\n贵不在于做错，在于发现太晚\n：等上线才看出来，人力成本已经投进去了。\n下面就从小蓝这个项目拆开看：\n能不能在投入研发之前，就先知道它到底有没有用？\n一、案例：小蓝的定制项目，两个月做完，没人真正用起来\n1. 项目场景\n客户提了一套定制化改造需求，口头讲了业务痛点，最后撂下一句“你们先做，我们肯定用”。\n销售侧为了维护这个大客户，把这套需求标成了高优先级项目。整个调研只对接了客户对接人和内部销售，没走到一线操作岗位。\n团队按标准流程推进：\n需求调研后，产品输出原型，交付 UE 输出交互稿、UI 输出带跳转链接的高保真 Demo。\n之后由产品经理组织会议，对着这份高保真 Demo，给销售、内部业务、客户对接人讲解流程、演示页面跳转。\n大家听完讲解，看起来流程是通的，没有提出异议。随后输出 PRD、完成技术评审，研发投入两个月集中开发、测试，按节点顺利交付上线。\n结果是，\n功能按期上线，验收一次通过，没有缺陷。但这套东西上线之后，就\n没再打开过几次\n。两个月的人力全部沉没，换回来的只是合作关系没掉。\n2. 为什么上线后没用起来？\n深挖之后发现，问题出在前置方案确认环节。\n1）需求转述失真\n一线操作人员的真实诉求，经过客户对接人、内部销售两层转述之后，需求被加工放大。\n小蓝拿到的，并不是一线员工真实工作里的痛点，而是被包装后的“想要”。\n2）看演示 ≠ 自己跑通\n老流程产出的高保真 Demo，依赖产品经理口述讲解流程。客户、业务人员是跟着产品的思路“看演示”，而不是自己上手、在自己真实业务场景里操作一遍。\n很多操作别扭、和原有工作习惯冲突的问题，在被动听讲时很难被感知。\n注：这里说的跑通，指的是业务流程走得通、一线客户用起来顺，不是技术上能不能实现。\n3）优先级判断错位\n项目的紧急，来自销售端维护客户关系和业绩的压力，不是不做这个功能客户的业务就跑不通。属于“维稳型需求”，而非“刚需型需求”。\n客户那句“你们先做，我们肯定用”，不需要他花什么成本。做不做、做多久、上线后没人用、后续维护，全落在小蓝他们这边。一句承诺，最便宜的支持。\n客户拿友商支持作为谈判筹码，销售更着急了，心想：“再不紧跟节奏，大客户就要跑了，业绩要落空了”。\n4）验证拖到上线之后\n原型→交互→高保真，需要产品、UE、UI 多方依次投入人力产出物料；方案确认、启动研发之后，又沿着排期一路推进，中间没有验证节点。\n方案到底跑不跑得通，往往要等开发上线、客户在自己业务场景里走一遍才暴露，那时两个月研发和前面所有设计资源已经是沉没成本。\n而且，需求只对这一家客户成立，一旦为它动到所有客户共用的主线，后面就得一直维护，想改就得推倒重来。\n基于这些复盘结论，需要一套新的工作方式，把验证前置。下面就借鉴 FDE 的思路，重构这套大客户定制流程。\n二、解法：FDE 式的前置验证\n1. FDE 到底是个什么思路？\nFDE（Forward Deployed Engineer，前沿部署工程师）\n最早来自 Palantir（美国做政企数据平台的软件公司）：把工程师派到客户现场，在客户真实的业务数据和真实流程里把方案跑通。\n落到产品工作上，核心就一句：\n先把方案跑通，再投设计研发\n。\n做法：\n产品基于业务痛点，用低成本方式搭一个能操作的验证版，不用写生产代码，但接的是客户真实（或脱敏后）的数据，由客户自己把整条业务走一遍。\n目的：\n确认方案真能解决问题、客户愿意用，再启动交互设计师、视觉设计师与研发投入。\n注：听讲解、看页面、看演示，都不算验证。\n这套流程是从这次失败里倒推出来的。\n眼下的行情也在往同一个方向走：\nAI 产品在往 FDE 转，传统产品里做大客户定制的岗位，要求也是先去客户现场把方案跑通，再谈开发和交付。\n把这两条和小蓝这次的失败对了一遍，缺的正好是同一环：\n验证被放在了最后\n。\n判断一个项目要不要用新流程，看两个硬条件是否同时成立：\n关键变量在客户现场：\n效果好坏取决于它的数据、流程、权限和使用者习惯，通过多客户的调研也推不出来，只能让客户自己上手，在真实流程里跑一遍。\n前置验证的成本远低于做错的成本：\n前置验证的成本，是一个人不到一周就能跑一遍；\n做错的成本，是产品、设计、研发、测试一群人几个月的投入，还要在上线后长期维护，而且这些东西其他客户根本用不上。\n2. 老流程 vs 新流程\n1）老流程（踩坑流程）\n需求对齐 → 产品输出原型 → UE 输出交互稿 → UI 输出可跳转高保真 Demo → 产品组织讲解演示 → 各方确认 → 输出 PRD 文档 → 技术评审 → 研发开发 → 测试上线 → 客户验证使用。\n优势：\n分工明确，产出物规范，适合成熟稳定的通用功能迭代。\n劣势：\n环节多，产品、UE、UI 一个接一个排队上；验证靠“讲给人听、做给人看”，客户自己没动手走过一遍，藏在细节里的问题无法露出来；\n等发现需求传走样了、方案在客户现场根本用不起来，设计和研发已经投入成本，改不回来，只能整个流程重新走一遍。\n2）按 FDE 思路应该长成的新流程\n需求对齐 → 产品基于业务痛点快速搭建可实操 Demo → 内部业务自主走查试用 → 客户一线操作人员上手实测、自己把业务走通 → 确认需求真实、方案可行 → 再输出原型、交互、高保真与正式 PRD → 启动研发。\n优势：\n验证提前到设计、研发之前。产品自己搭一个能操作的版本，客户一线当场跑一遍，就不用再靠原型、交互、高保真物料加讲解去“猜”方案行不行。\n代价：\n产品得自己先把客户的业务吃透，还得多花几天把验证版搭出来。\n3. 新流程具体改了什么？\n新流程落到产品上就四件事。需求拆解、流程梳理这些基本功没变，变的是判断依据和判断时间节点。\n1）需求痛不痛，直接找一线聊\n需求别只找对接人和销售，直接找一线操作人员。需求真不真，在提需求这一步就核实清楚，不用等两层转述加工完再回头猜。\n2）使用顺不顺手，让客户自己上手跑\n不等 UE、UI 交出原型、交互、高保真，产品自己搭一个能操作的验证版，接真实（或脱敏）数据。\n先让内部业务自己走一遍，明显的问题别带到客户现场；再由客户一线按自己的习惯亲手跑。操作别扭在哪、顺不顺手，当场就露出来，不用靠讲解蒙过去。\n3）优先级高不高，看一线卡不卡\n从“客户催得急、销售压力大”，换成“一线业务是不是真被卡住”，再把账算清楚：能带来多少营收、能省多少人力。\n需求不真、账算不过来，后面两步（设计、研发）就不用走了，压力再大也停在这。\n4）研发要不要投，看跑没跑通\n验证从“上线之后由客户替我们发现”，变成“在设计和研发启动前就完成”，跑通了再投设计、研发资源。\n跑不通就当场改，改的只是细节；一旦发现是方向不对，说明这", "thumb": "https://static.woshipm.com/tag/1121_1@2x.png ", "images": ["https://static.woshipm.com/tag/1121_1@2x.png ", "https://image.woshipm.com/2025/08/19/edd47568-7caf-11f0-a249-00163e09d72f.png", "https://static.woshipm.com/tag/1601_1@2x.png ", "https://static.woshipm.com/tag/1121_1@2x.png ", "https://image.woshipm.com/2023/04/13/2f032c24-d9eb-11ed-9d7a-00163e0b5ff3.jpg!/both/120x80", "https://image.woshipm.com/wp-files/2023/03/U6PQXqfAJ5kaffcU5cTv.jpg!/both/120x80"], "tags": ["产品经理"], "seen": false, "new": false, "daily": false, "score": 40.19791062503472}, {"guid": "692887cdc6316d1aa40355d41541789e", "title": "系统未知错误，请稍后重试。 (600)是什么意思", "link": "https://forum.trae.cn/t/topic/605145", "source": "TRAE 官方社区", "category": "contest", "summary": "你的运行环境（版本号「点击帮助-关于-复制」）： 3.4.22 问题描述（你遇到了什么问题？）请勿使用AI模版，AI分析会导致关键信息覆盖： 系统未知错误，请稍后重试。 (600)是什么意思，怎么解决 复现步骤（如何才能重现这个 Bug/问题？）请勿使用AI模版，AI分析会导致关键信息覆盖： 1. 2. 3. 报错信息或截图（如有）请勿使用AI模版，AI分析会导致关键信息覆盖： 请在此处粘贴截图或日志代码 2 个帖子 - 2 位参与者 ", "ts": "2026-11-23T03:41:43+00:00", "published": "11-23", "starred": false, "importance": 2, "topic": "AI 编程", "one_line": "TRAE 官方社区帖子讨论", "why": "", "inline_text": "帖子讨论\n参与者信息\n阅读完整话题", "full_text": "", "thumb": "", "images": [], "tags": ["AI 编程"], "seen": false, "new": false, "daily": false}, {"guid": "e76ad4fbf172ec02c01c3af5c9020f50", "title": "Agent 都能自己查数据了，还要花钱建本体、知识图谱吗？", "link": "https://www.woshipm.com/ai/6498283.html", "source": "人人都是产品经理", "category": "pm", "summary": "本体建出来到底能干啥？作者把业务复杂度拆成工程复杂度加数据复杂度，对应业务运行模型和业务表达模型，再拿一个销售转化 Agent 项目走完全程。结论挺克制：复杂 AI 应用绕不开的是业务建模，本体只是其中一种形式化表达，而且挺贵的。 现在做 AI 项目存在一个很有意思的认知断层。 大家已经意识到，复杂 AI 应用最终需要一套业务模型来支撑，但 还没有真正理解 Ontology 究竟解决了什么问题，以及它在整个 AI 系统中承担什么职责 。", "ts": "2026-11-23T03:40:09+00:00", "published": "11-23", "starred": false, "importance": 4, "topic": "产品经理", "one_line": "Agent 自查数据与本体、知识图谱的关系", "why": "了解 Agent 自查数据与本体、知识图谱的关系，可能对作品集有启发", "inline_text": "业务复杂度与工程复杂度\n业务运行模型与业务表达模型\n销售转化 Agent 项目案例", "full_text": "本体建出来到底能干啥？作者把业务复杂度拆成工程复杂度加数据复杂度，对应业务运行模型和业务表达模型，再拿一个销售转化 Agent 项目走完全程。结论挺克制：复杂 AI 应用绕不开的是业务建模，本体只是其中一种形式化表达，而且挺贵的。\n现在做 AI 项目存在一个很有意思的认知断层。\n大家已经意识到，复杂 AI 应用最终需要一套业务模型来支撑，但\n还没有真正理解 Ontology 究竟解决了什么问题，以及它在整个 AI 系统中承担什么职责\n。\n这也是为什么很多人知道本体很重要，研究了本体论、知识图谱、业务语义、实体关系，却很难回答一个实际问题：\n我把 Ontology 建出来以后，到底能用它干啥？\n之前我们一遍一遍的说，AI 项目的核心是 SOP + 数据。\n一个 AI 项目可以按照 SOP 复杂度和数据复杂度分成 12 类，我们遇到的各种智能体项目，基本都可以在这个框架里找到对应的位置。\n那么，\n为什么复杂 AI 项目做到深处，经常会碰到本体和图谱？\n如果我们去问或者搜这个问题，通常会得到这样一个回答：AI 不只是需要数据，还需要理解数据背后的业务含义，以及数据之间的关系。\n这个回答没问题，但问题是，知道了这个结论以后，我们是不是依然不知道能用他来干啥？\n本质是业务复杂度\n做 AI 应用，本质上是在处理业务复杂度\n我们做企业 AI 应用，本质上是要将一部分真实业务交给机器处理。\n业务越复杂，我们需要对业务进行的理解、抽象和工程实现也就越复杂。\n这里我们可以建立一个简单的理解框架：\n业务复杂度 ≈ 工程复杂度 + 数据复杂度\n:\n当然，这不是一个严格的数学等式，而是一种拆解业务复杂度的思路。\n在将真实业务转化为 AI 应用的过程中，我们可以通过两套模型承载业务复杂度。\n1.1 业务运行模型：解决工程复杂度\n业务运行模型主要解决业务如何运行的问题。\n我们可以通过 SOP、业务规则、算法、Workflow、Agent 等方式的组合，实现业务的判断、决策和执行。例如：\nSOP 描述业务执行过程。\n业务规则描述业务判断逻辑。\n算法负责计算、预测和优化。\nWorkflow 组织相对确定的执行路径。\nAgent 处理动态理解、规划和不确定性任务。\n1.2 业务表达模型：解决数据复杂度\n业务表达模型主要解决业务信息如何被机器表达和使用的问题，这里实际上包含两部分：\n第一部分是如何构造数据。\n我们可以根据业务建模的结论，建立服务于数据组织和处理的数据模型，也可以通过 Ontology 等方式，建立服务于业务语义定义的模型。\n第二部分是如何使用数据。\n这就涉及数据工程，包括数据采集、存储、查询、关联、检索、上下文构建等工作，也涉及关系型数据库、图数据库、向量数据库等技术选型。\n最终，通过接口、Tools、数据服务等方式，\n让业务运行模型能够调用业务表达模型\n，共同构成一套可运行的 AI 业务系统。\n1.3 业务建模：决定如何高效地表达业务\n那么，这两套模型是怎么来的？这就涉及业务建模。\n业务建模的核心任务，是通过对真实业务进行分析和抽象，\n找到一种能够高效表达业务逻辑的方式\n。\n业务建模形成的抽象结论，一部分通过 SOP、规则和算法等方式进入业务运行模型，一部分通过数据模型、语义模型等方式进入业务表达模型。\n所以，面对同一个业务问题，不同的人可能会设计出完全不同的系统。\n有人通过大量 Workflow 分支解决问题，有人通过规则引擎解决问题，有人通过重新设计数据模型解决问题，还有人将大量业务信息交给 Agent 动态处理。\n这里需要考虑的是：\n我们应该如何分配和承载业务复杂度，才能获得更高的工程 ROI？\n大力出奇迹，还是按需建模？\n围绕这个问题，我们通常可以看到两种不同的思路。\n第一种：大力出奇迹\n原理很简单，既然 AI 需要理解业务世界，那我们就尽可能完整地对业务世界进行结构化描述。\n让机器知道：\n业务世界里有什么对象和概念。\n这些对象分别具有什么属性和状态。\n对象之间存在什么关系。\n这些概念、状态和关系有什么业务含义。\n业务中存在哪些知识和约束。\n在此基础上，通过 Ontology 等建模方式构建业务语义层，再通过数据工程提供查询和访问能力，让 Agent 能够自主获取和使用这些业务信息。\n为什么我叫它大力出奇迹？这条路线背后有一个很性感的假设：\n现在模型能力和 Harness 能力已经这么强了，未来还会继续增强。只要我提供足够丰富的业务上下文，并且给这些上下文构建足够完善的语义模型，Agent 就可以自己查数据、构建业务上下文、分析问题并调用工具完成任务。\n这样，我就不用去做无聊的 Workflow 穷举和各种基于 workflow 的工程化了。\n这似乎是一种解决企业有大量业务系统和复杂业务关系的情况下如何落地 AI 的捷径？\n但它的问题是，我们需要投入大量成本对业务世界进行建模，却\n不一定知道这些模型最终会被哪些业务场景使用，以及能产生多少业务价值\n。\n对，他没有回答我们前面的问题：我把 Ontology 建出来以后，到底能用它干啥？\n这有点像即时战略游戏里的一种玩法：只要我把科技树全部点满，我就是无敌的。\n这没错，但没什么实际指导意义，因为真实项目里的资源永远是有限的。\n第二种：拆解复杂度，按需建模\n另一种思路就比较传统了，我们从具体业务场景出发，先梳理业务 SOP，根据 SOP 中每个环节所需要的信息设计对应的数据结构，再通过程序、规则、算法和 Workflow 实现业务逻辑。\n如果业务比较简单，这套方式完全没有问题。\n随着业务复杂度增加，我们可能会发现，继续增加 SOP 分支和判断规则，工程实现成本越来越高。\n这时候，我们可以通过重新进行业务建模，找到一种更高效的业务表达方式，调整对应的业务逻辑和数据结构，\n将一部分原本固化在程序中的业务逻辑转化为由数据模型承载\n。\n这就是我们前面说的，通过业务建模，重新分配工程复杂度和数据复杂度，从而获得更高的工程 ROI。\n但到这里，本质上仍然是传统的软件开发逻辑。\n当业务进一步复杂，部分业务判断和执行路径难以提前确定时，我们可以引入 Agent，承担部分动态推理和决策工作。\n这时候就会出现一个新的问题：原本由开发人员理解、并且固化在程序中的业务语义，应该如何被 Agent 理解和使用？\n如果通过简单的数据说明和工具接口已经无法满足需求\n，我们就需要考虑将这些业务语义独立表达出来，构建业务语义层。\nOntology 就是构建这套语义层的一种方式\n。\n接下来，我们通过一个销售转化 AI 项目，具体看看这个过程。\n案例拆解：销转 Agent\n假设我们要做一个在线教育的销售转化 AI 应用，帮助销售人员将购买了低价体验课的用户转化为正价课用户。\n首先，我们需要梳理销售 SOP。一个简化的流程可能包括：\n获取客户信息。\n进行初步沟通，了解客户需求。\n跟进客户的体验课学习情况。\n介绍正价课产品。\n与客户沟通，推进购买决策\n记录销售结果。\n在此基础上，我们可以\n按照每个 SOP 节点的需要，设计相应的数据结构\n。例如客户信息表、课程信息表、沟通记录表、销售阶段表、话术库、订单信息表等。\n比如，我们可以收集销冠在不同销售阶段的历史沟通记录，提取其中的优秀问答，形成各个销售", "thumb": "https://static.woshipm.com/tag/1101_1@2x.png ", "images": ["https://static.woshipm.com/tag/1101_1@2x.png ", "https://image.woshipm.com/2023/04/14/0d78bf02-da8f-11ed-a86f-00163e0b5ff3.jpg", "https://image.woshipm.com/wp-files/sha256/5b/bd/5bbdbbd2212a98ab3cda4613e363654c32b3002940433d642fa44890de185f4d.webp", "https://image.woshipm.com/wp-files/sha256/dc/37/dc37985847ce011e0100fd0df9949cca9ea2c8f29b30235c4581e1136d5d2cac.webp", "https://image.woshipm.com/wp-files/sha256/24/3a/243a7a882cb750573d6de7c3c0681cc6b15b007bd39d486fa626520408ce0840.webp", "https://image.woshipm.com/wp-files/sha256/b9/04/b9040e0f767196ed447fe67cbc849ef616043574fc560eddf992e7e94f549c0a.webp"], "tags": ["产品经理"], ages": [], "tags": ["AI 产品"], "seen": false, "new": false, "daily": false}, {"guid": "81baa99d66a05b82145335ba63fae6ee", "title": "GoWind IM 场景：乙方怎么用一套 IM 平台交付多个客户——档位、租户与离线交付", "link": "https://juejin.cn/post/7710458315810603050", "source": "掘金", "category": "tech", "summary": "GoWind IM 场景：乙方怎么用一套 IM 平台交付多个客户——档位、租户与离线交付 一、乙方的真实账本 给客户做项目时，IM 相关需求几乎必然出现：站内信、审批通知、文件传输、客户沟通。三条传统", "ts": "2026-11-22T04:27:33+00:00", "published": "11-22", "starred": true, "importance": 3, "topic": "产品经理", "one_line": "探讨 IM 平台在乙方客户交付中的应用场景和模式", "why": "", "inline_text": "IM 平台\n乙方客户交付\n应用场景\n模式", "full_text": "", "thumb": "", "images": [], "tags": ["产品经理"], "seen": false, "new": false, "daily": false}, {"guid": "5bac14ff347830c8fc376fdfbe707d89", "title": "AI来了，人还剩什么：12条不完整关于工作、价值、品牌和商业思考", "link": "https://www.woshipm.com/share/6498018.html", "source": "人人都是产品经理", "category": "pm", "summary": "凯文·凯利说 AI 更像实习生而不是助理，成果要你做二次核验。作者把这些战略品牌大师的思考收成 12 条：速度变廉价后价值去哪、万物丰裕时什么才稀缺、注意力经济之后是意图经济。核心判断只有一句：AI 替代的不是人，是没想清楚自己要什么的人。 当你还在嫌AI不够聪明时，更应该庆幸：它还给了你被替代前的时间窗口。 ——徐晓辉 最近翻读了凯文·凯利和赛斯·戈丁、彼得·菲斯克、埃里希·阿希姆斯塔勒等几位战略品牌大师关于AI的新思考，在此收拢在一", "ts": "2026-11-22T04:17:09+00:00", "published": "11-22", "starred": true, "importance": 4, "topic": "AI 编程", "one_line": "凯文·凯利关于 AI 的思考，探讨 AI 对工作、价值和商业的影响", "why": "了解凯文·凯利关于 AI 的思考，有助于提升自己在 AI 产品设计和战略思考方面的能力", "inline_text": "凯文·凯利\nAI 思考\n工作\n价值\n商业", "full_text": "凯文·凯利说 AI 更像实习生而不是助理，成果要你做二次核验。作者把这些战略品牌大师的思考收成 12 条：速度变廉价后价值去哪、万物丰裕时什么才稀缺、注意力经济之后是意图经济。核心判断只有一句：AI 替代的不是人，是没想清楚自己要什么的人。\n当你还在嫌AI不够聪明时，更应该庆幸：它还给了你被替代前的时间窗口。\n——徐晓辉\n最近翻读了凯文·凯利和赛斯·戈丁、彼得·菲斯克、埃里希·阿希姆斯塔勒等几位战略品牌大师关于AI的新思考，在此收拢在一起，让我们共被启发。\n思考1、世界上不只有一种AI\n思考2、跳出服从惯性，迎接主动性时代\n思考3、当速度变得廉价，价值该去往何处？\n思考4、万物丰裕时，稀缺的到底是什么？\n思考5、人类不想被取代，也无法被AI取代\n思考6、新商业机会：细分赛道与人心转向\n思考7、AI企业的三代演进，终局是生态系统之战\n思考8、未来人才——超级连接者\n思考9、创业（一人公司）这件事，变得又简单又难\n思考10、看见需求空间，挣脱品类的局限\n思考11、注意力经济终局，意图经济登场\n思考12、三个笨办法，把AI用得更像人\n1、世界上不只有一种AI\n凯文·凯利告诉我们，首先需要明确的是，世界上不只有一种AI。\n不同的行业有很多不同的想法和认知，也就意味着会有非常多纷繁各异的AI，这就像世界上存在各种物种的动物一样。\n其次，他期望我们知道，你暂时不会被AI替代，但会被更擅长使用AI的人替代。\n他认为，比起助理，AI更像一个实习生，因为实习生不能独立完成任务，工作成果需要我们来做二次核验的。说到生成式AI与人之间的关系，KK把它称之为+1关系。\n希腊神话中的半人马，其实是有点像人和AI的协作关系。科学家们发现，现阶段只靠人或只靠人工智能都不行，它们要结合在一起。\n第三，当技术隐形的时候，才是最强大的。\n把AI类比成电力，你不能简单地认为把18世纪的公司通电，它就会成为完全不同的公司。但是如果这家企业在诞生之初就有电力的加持，那么这一家企业和18世纪的其他企业相比，一定有巨大的飞跃。\n我们一直谈AI，恰恰说明它尚未真正普及。如果我们已经无法意识到AI的存在，才算完成落地。\n2、跳出服从惯性，迎接主动性时代！\n我们大多是在一套\n“服从与灌输”\n的体系里长大的。\n读书的时候，后卫不能自主设计战术，演员不能随意改写台词，擅长数学的人，也无法自选想要证明的命题。这套训练，本质是教会我们依照指令完成任务。\n互联网长尾效应叠加AI强大的杠杆能力，让“服从”的价值持续贬值。\n互联网的长尾效应，再加上AI带来的巨大杠杆，让单纯服从的\n“服从”\n持续贬值。\n无论你靠什么谋生，手边都有一台随时待命的机器（电脑或手机）。主动权握在你手里，由你来定义指令；一旦停下思考，发号施令的就会变成你的上级或“生活”。\n照着固定剧本前行的路越来越走不通。世界迭代太快，等剧本送到手上，往往早已失效。 AI之所以快速兴起，一部分原因，是它总能给习惯等待指令的人，提供廉价又即时的答案。\n站在管理者的角度，AI也像是一批成本更低、永远听话的任务执行者。\n而那些习惯服从的人，很容易陷入焦虑。\n焦虑源于一种渴望——希望事情恢复正常，给他们一个重新服从的机会。\n但现实是，这就是新的常态。安稳的好工作”，再也不是靠循规蹈矩就能守住的避风港。\n这场转变来得很突然，临时应付远远不够，独自应对转型压力难如登天。我们还有一条出路：\n——找到同类，建立连接，结成彼此挑战、启发和鼓励的社群，在寻找出路的旅程上并肩前行。\n从前，我们花漫长时间训练自己，适配服从式的人生。而现在，摆在面前的新功课，是主动打磨能力，在主动性时代扎根生长。\n3、当速度变得廉价，价值该去往何处？\n快一点点，是一种市场优势，但速度上的阶跃式变化，则会彻底改写市场。京东只是把货送得更快，就做到增长和盈利；微信更进一步，它改写了人与人沟通的方式。\n放到AI 浪潮中，很多人还没有看清：\n我们正在经历一场由速度催生的质变。\nAI 生成的 Logo，或许缺少大师亲手创作的力量感，但产出效率高出千倍。这意味着，合格可用的视觉内容总量，会迎来指数级膨胀。\n当AI可以实时给出靠谱的诊断参考，我们和医疗体系打交道的方式也随之改变。\n再比如AI代写的文字，缺失手写下的温度、沉淀与记忆点。这些更快的替代方案，算不上 “更好”，只是另一种选择。可市场天然偏爱便利与速度。\n于是，“尚可、迅速、廉价” 的组合，已经成为现实。\n这带来两条出路：\n其一，实时洞察嵌入更多日常场景；\n其二，去做值得人们耐心等候、由人主导的创造。追求卓越，而非仅仅过得去。\n持续贬值的，永远是平庸的中间地带。\n4、万物丰裕时，稀缺的到底是什么？\n在物质被AI和自动化极大丰富的未来，稀缺的将不再是商品，而是下面这些“别的东西”。\n第一，是注意力。\n当信息像空气一样无处不在，你能专注地看一个视频、读一篇文章，就成了奢侈品。\n第二，是真实体验。未来一种高阶的消费，是寻找 “无AI空间”\n，就是花大价钱去一个没有算法推荐、没有智能设备打扰的地方，享受纯粹的真实世界和人际交流。\n第三，是你的数据化人格。\n你的数字分身或是AI管家，是否可靠、高效，能否帮你维系稳定可信的数字信用，这会是一笔很重要的资产。\n5 人类不想被取代，也无法被AI取代\n不妨想想《星际迷航》里柯克船长和史波克的区别。史波克作为瓦肯人，遵从纯粹逻辑、克制情绪；而柯克所代表的人类，\n拥有共情力，更快做出决定，更勇敢。\n凯文・凯利由此提出：\n人类既不愿被替代，也无法被 AI 替代。\n一个很有意思的现象：不少富足的人依然会聘用真人助手，助手会借助 AI 工具，但雇主本人更依赖人的服务。当我们拥有选择权时，往往更愿意和人打交道。\n或许未来，一部分人的核心工作，就是做好 “人” 这件事。\n顺着这个思路，我们可以进一步看清人类独有的价值。\n其一，我们出售的是“责任”和“信任”。\n未来，我们向雇主交付的，不再只是劳动时间，而是责任与信任。AI出现失误时，能够兜底、弥补疏漏的是人；需要共情、创造力的时候，出手解决问题的也是人。\n第二，我们在未来最重要的能力，“提出一个好问题”。\n与AI互动，首要原则是要时刻提醒自己，不要把它们想象成人。\nAI是极致的“表现”，而人类拥有的是不可复制的“存在”。\nAI可以源源不断输出现成答案，但只有人，会出于好奇、不甘或是一瞬间的触动，问出那个从前没人提过的问题。\n那些伟大的艺术、科学突破、深邃的哲思，很多都诞生在试错、留白、看似无用的探索之中。AI 擅长优化已经走通的路径，人类却有能力开辟机器想象不到的全新方向。\n第三，属于人的真实智慧：一份不完整清单\n史蒂夫・沃兹尼亚克（乔布斯的伙伴）提出了“\n真实智慧（Actual Intelligence）\n”这个概念。这些是我们与生俱来、可以持续打磨的能力，在当下格外珍贵，却很少在课堂里系统学习：\n做出艰难取舍；\n筛选信息、学会放弃；\n为成果署名、承担责任；\n拥有判断力，提出正确的问题，舍弃无关的问题。\n交付真正有用的成果；\n对审美的追求。\n耐心直面真正的难题，而不是躲去解决简单的伪问题；\n心怀善意，为特定对象创造，追求公平；\n给予他人尊严；\n懂得适可而止；\n投入深度共情，而非浮于表面的替代品。\n主动钻研，沉下心深耕；", "thumb": "https://static.woshipm.com/tag/1121_1@2x.png ", "images": ["https://static.woshipm.com/tag/1121_1@2x.png ", "https://image.woshipm.com/2023/04/13/2804a00e-d9de-11ed-8d63-00163e0b5ff3.jpg", "https://image.woshipm.com/wp-files/sha256/e0/10/e01018ba8f130baa483aee157039b21a9225a18ef30042b8c922400a82e8e1e3.jpg", "https://image.woshipm.com/wp-files/sha256/9e/e6/9ee65d20ddbee91e95579b0bf4fa6a80ae1adeb58e479063781d66d75b2a6a88.jpg", "https://image.woshipm.com/wp-files/sha256/da/8e/da8e6520a5f15ba3f4fdd71215950f03d9fb84bf31d502274c51b9d01867ae85.jpg", "https://image.woshipm.com/wp-files/sha256/64/e8/64e82a6f3f29ce0dbc053a1ecb3eb8319e04e2fff1afe0bdf583025e908a029d.jpg"], "tags": ["AI 产品"], "seen": false, "new": false, "daily": false}, {"guid": "6a0cb8b427dcc5bdb2fd4a2e53281661", "title": "Agent开发 03｜架构选型：不同模式怎么选？", "link": "https://juejin.cn/post/7710449704618262564", "source": "掘金", "category": "tech", "summary": "Agent开发 03｜架构选型：不同模式怎么选？ 《Agent开发》系列 · 第 03 篇 假设我们正在开发一个 AI 客服助手。用户提出： 系统需要查询订单支付状态、金币发放记录，必要时还要检查账户", "ts": "2026-11-22T04:05:55+00:00", "published": "11-22", "starred": false, "importance": 4, "topic": "AI 编程", "one_line": "探讨 Agent 开发的架构选型，为 AI 客服助手提供参考", "why": "了解 Agent 开发的架构选型，有助于提升自己在 AI 产品设计和开发方面的能力", "inline_text": "Agent 开发\n架构选型\nAI 客服助手\n参考", "full_text": "", "thumb": "", "images": [], "tags": ["AI 产品"], "seen": false, "new": false, "daily": false}, {"guid": "bbf338c81500853072fc899b1c0dc6f8", "title": "Toyota, Nissan, and Honda to Standardize Parts to Lower Costs", "link": "https://www.caranddriver.com/news/a74490092/toyota-nissan-honda-standardize-parts-lower-costs/", "source": "Hacker News", "category": "tech", "summary": "Article URL: https://www.caranddriver.com/news/a74490092/toyota-nissan-honda-standardize-parts-lower-costs/ Comments URL: https://news.ycombinator.com/item?id=50596133 Points: 72 # Comments: 32", "ts": "2026-11-22T04:04:56+00:00", "published": "11-22", "starred": false, "importance": 2, "topic": "技术", "one_line": "丰田、日产和本田标准化零部件以降低成本", "why": "", "inline_text": "丰田\n日产\n本田\n标准化零部件\n降低成本", "full_text": "", "thumb": "", "images": [], "tags": ["技术"], "seen": false, "new": false, "daily": false}, {"guid": "5ac5d16e519e3413aded6bacc55e584b", "title": "AI 硬件的牛市结束了", "link": "https://www.woshipm.com/ai/6497898.html", "source": "人人都是产品经理", "category": "pm", "summary": "从 10 月高点起，费城半导体指数跌去 27.8%，英伟达跌 36.1%、美光跌 43%。文章说这轮 AI 硬件回撤的本质，是定价逻辑从“看资本开支增长”换成了“看投资回报”，而债券市场已经先报警。 最强势的市场，也顶不住这轮AI回调了。 从10月的高点算起，涵盖AI硬件全链条的费城半导体指数跌去27.8%。其中，算力龙头英伟达跌去36.1%、存储龙头美光跌去43%，就连给他们供货的寡头台积电也跌去26.2%。看下来，逻辑最硬、订单最多", "ts": "2026-11-22T03:44:35+00:00", "published": "11-22", "starred": true, "importance": 4, "topic": "AI 编程", "one_line": "分析 AI 硬件市场的回撤，探讨定价逻辑和投资回报的变化", "why": "了解 AI 硬件市场的回撤，有助于提升自己在 AI 产品设计和市场分析方面的能力", "inline_text": "AI 硬件市场\n回撤\n定价逻辑\n投资回报", "full_text": "从 10 月高点起，费城半导体指数跌去 27.8%，英伟达跌 36.1%、美光跌 43%。文章说这轮 AI 硬件回撤的本质，是定价逻辑从“看资本开支增长”换成了“看投资回报”，而债券市场已经先报警。\n最强势的市场，也顶不住这轮AI回调了。\n从10月的高点算起，涵盖AI硬件全链条的费城半导体指数跌去27.8%。其中，算力龙头英伟达跌去36.1%、存储龙头美光跌去43%，就连给他们供货的寡头台积电也跌去26.2%。看下来，逻辑最硬、订单最多的AI硬件龙头，也没能躲过这轮回撤。\nAI硬件这波回撤，是投资逻辑变了：从跟踪大厂的资本开支增长，换成了跟踪投资回报，这些投资能创造多少收入、能不能撑住继续扩张。\n而对投资回报跟踪最准确的是债券市场。按大摩测算，过半的数据中心资本开支要外借。因此，一旦高收益债收益率开始飙升，就意味着债主开始重估AI公司的经营能力。\n这种重估正在发生，整个AI债收益率全面上升，CoreWeave债券收益率从9月下旬的11.6%一路飙到10月的15.15%。同期无风险利率基本没动，涨的全是信用利差，这说明债权人是在对“AI基建公司的偿债能力”重新定价。\n这种担忧也会反过来约束债权人的扩张，全球AI相关债券发行额，从6月的1130亿美元降到9月的230亿美元。\n屋漏偏逢连夜雨，AI央行缩表又进一步加大了AI产业融资扩张的压力。\n在黄仁勋主导下，英伟达扮演了AI央行的角色：通过投资、担保和算力采购承诺，把自身的资产负债表和经营现金流，转化为“弱融资能力公司”的信用，来支撑AI开支的扩张。\n三季度，英伟达表外或有负债合计5400亿美元，相当于今年亚马逊资本开支的近3倍。而这些表外负债，又能撬动更高量级的信贷资金投入AI基建。\n但遗憾的是，黄仁勋离职后，新任CEO Colette Kress上任。她此前做过的最出名的一件事，就是把2500亿美元的数据中心担保砍掉一半，被黄仁勋嘲讽“只会做财务”。权力交接后，华尔街给这轮变化的标题是：“AI央行”紧缩。\n账单的紧张、央行的缩表，都指向AI资本开支放缓；而供给端已经按最乐观的预期扩产。这轮硬科技周期中“需求无限大，供给跟不上”的信仰也有了松动。\n01 算力基建的账越来越紧了\n在这波回撤中，AI硬件龙头的业绩并不差。\n除了相对边缘的英特尔四季度指引不及预期，英伟达、美光、台积电、博通、AMD、Lumentum这些核心AI硬件股，业绩全部超出市场预期。\n业绩超预期，为什么股价还在大跌？\nAI硬件牛市最终依赖一条完整的资本循环假设，模型收入高速增长→下游相信未来回报→持续增加资本开支→采购更多芯片、存储、网络和电力设备→半导体利润继续增长\n。\n因此，AI硬件牛市的命门并不在半导体公司本身的业绩上，而在于OpenAI、Anthropic、云商等下游公司的收入增速，能否持续证明巨额资本开支是合理的。\n所以，当云商投进几万亿美金、耗干现金流之后，市场给AI硬件定价的标尺就换了：从跟踪大厂的资本开支增长，换成跟踪投资回报，这些投资能创造多少收入、能不能撑住继续扩张。\n目前来看，AI账单有点算不过来了。\n按Gartner测算，到2030年，AI数据中心要累计创造8.5万亿美元收入，才能覆盖已宣布的资本开支、融资成本，以及12%的投入资本回报率。但同期AI收入总额，预计最多不超过3.6万亿美元。\n机构测算或许有误差，结果也偏远期；相比之下，债券市场的回答更能反映眼下企业AI账单的真实情况，也会直接作用于下一步的资本投入。\n云商自身的现金流撑不住，AI资本开支的扩张就得靠借债。按大摩测算，2025到2028年全球数据中心资本开支约2.9万亿，超大规模云厂自己的现金流只能撑起约1.4万亿，剩下约1.5万亿得向外借。\n所以，看AI资本开支的拐点，最前瞻的信号是债券市场的利率。一旦高收益债收益率开始飙升，就意味着债主开始怀疑AI公司的经营能力，重新给主体的偿债能力定价。这种重估，正在发生。\n最先报警的是CoreWeave的无担保存量债，是为买GPU、租数据中心搭起来的一整套分层债务包，收益率从9月下旬的11.6%一路飙到10月的15.15%。紧接着，重定价从这一层向外扩散，整个AI债都在重新报价，连优质数据中心CMBS的固定AAA档，年内收益率也上行了60bp。\n考虑到，同期无风险利率几乎没有变动，飙升的收益率，说明债券市场开始给整个AI资产类别重新定价，本质上反映出市场对AI投资账单越来越紧的担忧；这种担忧又会约束债权人的扩张，全球AI相关债券发行额，从6月的1130亿美元降到9月的230亿美元。\nAI央行的缩表，又发挥了推波助澜的作用。\n02 “AI央行”在缩表\n老黄辞职后的首个交易日，英伟达只跌了4.34%，跌最多的是Neocloud，其中CoreWeave跌6.9%，Nebius跌16.8%。\n下游的Neocloud跌得比英伟达还多，反映的正是对“AI央行”缩表的担忧。\nNeocloud类似GPU专卖店，商业特征是杠杆化：借钱买英伟达GPU，搭高速集群，再租给OpenAI等下游模型公司。\n三季度CoreWeave营收虽然暴增168%至36.61亿美元，单季资本开支却干到145亿美元，是营收的4倍。投入比收入高出这么多，Neocloud想再借，银行未必敢贷。同样的融资问题也困扰着很多算力中心、电力基建项目，没有担保方，很难从银行获得足够的流动性。\n为整个AI行业提供流动性的，就是英伟达\n。\n它扮演AI央行的角色，通过投资、担保和算力采购承诺，把自身的资产负债表和经营现金流，转化为“接不到钱的公司”的信用，来支撑AI开支的扩张。具体路径有四条：\n一是融资担保。英伟达为下游的硬件、土地、电力、机房融资兜底、增信，用来撬动银行资金。三季度，这部分最大信用敞口1180亿美元。\n二是算力包销。银行担心算力卖不出去、客户没钱还，英伟达就对部分算力给出“最低收入保底”，银行据此才敢放贷。三季度，这部分算力包销规模320亿美元。\n三是采购承诺。英伟达用对上游的采购承诺，推动上游扩产。三季度，采购承诺3900亿美元。\n四是股权投资。直接用真金白银投资下游，目前账面价值990亿美元。\n算下来，不算已经投出去的股权投资，前三项构成的表外或有负债合计5400亿美元，相当于今年亚马逊资本开支的近3倍；这些表外负债，又能撬动更高量级的信贷资金投入AI基建。可以说，英伟达在AI产业链中的角色，是制造需求、推动需求。\n但英伟达的这种角色正在弱化，AI央行已经开始缩表\n。\n英伟达已经开始减少对下游的兜底：三季度，针对下游客户的承诺与兜底包销协议，环比减少40亿美元。黄仁勋一走，这种缩表趋势已经不可避免。\n黄仁勋离职后，临时CEO Colette Kress上任。她此前做过的最出名的一件事，就是把2500亿美元的数据中心担保砍掉一半，被黄仁勋嘲讽“只会做财务”。\n在这一波美国的AI基建狂潮里，黄仁勋是领袖：把英伟达的信用借给接不到钱的客户，联合资本方攒局扩张。没有他的前瞻视野、激进投入和作为老板的担当，AI的摊子不会铺得这么大，云厂商的资本开支也拉不到万亿美元的规模。\n对比下来，财务出身的Colette Kress想的是对报表负责，做的也是对报表负责；促进AI产业发展，并不是她关注的事。\n英伟", "thumb": "https://static.woshipm.com/tag/1101_1@2x.png ", "images": ["https://static.woshipm.com/tag/1101_1@2x.png ", "https://image.woshipm.com/2025/08/19/f7d457c4-7ccb-11f0-8b73-00163e09d72f.png", "https://static.woshipm.com/tag/1601_1@2x.png ", "https://static.woshipm.com/tag/1101_1@2x.png ", "https://image.woshipm.com/2023/04/13/d34ae8a8-d9e1-11ed-9d7a-00163e0b5ff3.jpg!/both/120x80", "https://image.woshipm.com/2023/04/13/b1b6c5ba-d9ee-11ed-a8b0-00163e0b5ff3.jpg!/both/120x80"], "tags": ["AI 产品"], "seen": false, "new": false, "daily": false}, {"guid": "158bb66436856b8573619cc3f6382137", "title": "Agent开发 02｜Agent Loop：任务如何持续执行？", "link": "https://juejin.cn/post/7710458315810373674", "source": "掘金", "category": "tech", "summary": "Agent开发 02｜Agent Loop：任务如何持续执行？ 《Agent开发》系列 · 第 02 篇 假设用户向 AI 客服提出： AI 助手需要核实业务数据。它可能先查询订单状态，再查询金币发放", "ts": "2026-11-22T03:35:24+00:00", "published": "11-22", "starred": false, "importance": 4, "topic": "AI 编程", "one_line": "探讨 Agent 开发的任务持续执行方法，为 AI 客服助手提供参考", "why": "了解 Agent 开发的任务持续执行方法，有助于提升自己在 AI 产品设计和开发方面的能力", "inline_text": "Agent 开发\n任务持续执行\nAI 客服助手\n参考", "full_text": "", "thumb": "", "images": [], "tags": ["AI 产品"], "seen": false, "new": false, "daily": false}, {"guid": "f40aeae0b65f914fc046fbd659892677", "title": "花1千多，6个场景极限横测完御三家最强模型，我沉默了…（附提示词）", "link": "https://www.woshipm.com/evaluating/6498002.html", "source": "人人都是产品经理", "category": "pm", "summary": "花了1000多块，从视频剪辑、写作、代码生视频、3D 网页、3A大作、网页复刻六个场景极限测试御三家目前最强模型的能力，到底选谁？什么场景谁更适合做？看完这篇，我相信你会得到答案。 最近国外御三家纷纷都出了新模型，而且都是各自史上最强模型。 先是Anthropic发布了 Fable5.2 ，然后OpenAI不甘示弱发布了 GPT-6.2 Astra ，前两天Google终于又发力了搬出了 Gemini 4 Neon 。该说不说，国外的模", "t "", "why": "", "inline_text": "", "full_text": "", "thumb": "", "images": [], "tags": [], "seen": false, "new": false, "daily": false}, {"guid": "5c6d17b88458e0649fa7aa7670efa3be", "title": "机器人的“冰与火”", "link": "https://www.woshipm.com/embodied/6497890.html", "source": "人人都是产品经理", "category": "pm", "summary": "王兴兴在 APEC 说技术突破接近临界点，英伟达的 Jim Fan 说机器人行业不是寒冬而是夏天，可行业里更流行的是泡沫与资本寒冬。同一赛道两种体感背后是估值超前兑付：31家独角兽中超过三分之一成立于2023年，平均1.75年就长成独角兽。 在2026年APEC工商领导人峰会上，王兴兴给机器人行业下了一个最新的判断：今年全球技术突破已接近临界点。 非常恰巧，就在几天之前，英伟达GEAR领导Jim Fan在CoRL 2026上也说了相似的", "ts": "2026-11-22T01:44:32+00:00", "published": "11-22", "starred": false, "importance": 4, "topic": "AI 产品", "one_line": "机器人行业分析，探讨技术突破与泡沫现象", "why": "了解机器人行业现状，对AI产品经理有参考价值", "inline_text": "王兴兴对机器人行业进行判断\n机器人行业估值超前兑付\n机器人行业存在泡沫与资本寒冬", "full_text": "", "thumb": "", "images": [], "tags": ["AI 产品"], "seen": false, "new": false, "daily": false}, {"guid": "2b97cfe95cbdaf7b0becccdd329f758b", "title": "Claude 的黎曼猜想证明获 Lean 官方认证，马斯克直呼惊人成就", "link": "https://www.ifanr.com/1690820?utm_source=rss&utm_medium=rss&utm_campaign=", "source": "爱范儿", "category": "ai_product", "summary": "AI 恐怖如斯 #欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "ts": "2026-11-22T01:35:14+00:00", "published": "11-22", "starred": false, "importance": 4, "topic": "AI 产品", "one_line": "Claude 的黎曼猜想证明获认证，马斯克称赞其惊人成就", "why": "关注AI领域的重大成就，对AI产品经理有启发意义", "inline_text": "Claude 的黎曼猜想证明获认证\n马斯克称赞其惊人成就\nAI在数学领域的应用", "full_text": "Claude 的黎曼猜想证明获 Lean 官方认证，马斯克直呼惊人成就\n困扰人类数学界 167 年的黎曼猜想，迎来最新进展。\n就在刚刚，Lean 和 Mathlib 社区发布联合声明，宣布正式认证 Anthropic 数学家 Levent Alpöge 提交的黎曼猜想形式化证明，并表示对其正确性具有充分信心。\n从数学家本人宣布成果，到形式化证明社区公开认证，整个过程仅仅过去一天。\n更引人关注的是，Alpöge 此前透露，这项研究由他与 AI 模型 Claude 合作完成。在证明接近终点时，Claude 展现出的数学推理能力，甚至超出了他的预期。\n11 月 20 日，Alpöge 在个人网站公布研究成果，宣称解决了著名的黎曼猜想（Riemann Hypothesis），同时取得了涉及广义黎曼猜想（Generalized Riemann Hypothesis）的结果。\n黎曼猜想由德国数学家伯恩哈德·黎曼于 1859 年提出，是克雷数学研究所公布的七大千禧年数学难题之一。\n它涉及黎曼 ζ 函数非平凡零点的分布，核心命题是所有非平凡零点的实部是否都等于 1/2。由于这一问题与素数分布密切相关，过去一个多世纪，无数数学家尝试攻克，却始终未能找到严格证明。\n马斯克也发文感叹，证明黎曼猜想能够让大量此前依赖该猜想成立的数学结论摆脱条件限制，成为无条件成立的定理，并称其为超级智能取得的又一项惊人成就。\n图｜Levent Alpöge\nAlpöge 此次采用了一种相当特殊的成果发布方式。\n他曾尝试让 Claude 将证明整理成人类能够阅读的文字版本，结果生成的草稿超过 25 万页，庞大到连他本人都认为难以阅读。如此惊人的篇幅，甚至被部分网友戏称为一场针对数学界的「DDoS 攻击」。\n最终，Alpöge 决定不公开这份文字草稿，而是发布了一份 4 页的说明文件，以及分成 14 个压缩包的 Lean 形式化证明代码，总规模达到约 1700 万行。\nLean 是一种交互式定理证明工具，可以将数学命题及其推理过程转化为计算机能够严格检查的形式。研究者需要把复杂的数学逻辑表达为机器可验证的代码，再由证明检查器判断推理是否符合形式逻辑规则。\n然而，面对如此庞大的代码，外界最关心的问题也随之出现。\n1700 万行代码究竟有没有真正证明黎曼猜想，还是仅仅让计算机完成了一次看似成功的运行？\n图｜🔗 https://leanprover-community.github.io/blog/posts/riemann-hypothesis/\n为回答这一问题，Lean 和 Mathlib 社区迅速组织了大规模验证工作，来自社区的众多成员共同参与检查。\n其中一个关键环节，是确认程序最终证明的数学命题与原始猜想完全一致。毕竟，即使代码能够正常运行，也可能因为定义存在细微差异，最终证明了另一个问题。\n社区为此采用 Mathlib 数学库中经过专家审查的黎曼猜想定义，并专门创建独立文件，使用 comparator 和 con-leche 两套工具进行比较，最终确认 Alpöge 证明的定理与 Mathlib 中的黎曼猜想定义完全一致。\n与此同时，数十名社区成员成功编译整套代码，并复现出相同的原始证明导出文件。\n麻省理工学院数学家 Andrew Sutherland 公布的验证记录显示，整套证明涉及 175187 个模块，全部成功编译，错误数量为零。\n不过，代码能够成功编译，并不意味着其中的数学推理必然正确。\n因此，社区进一步使用 Lean 官方内核，以及 con-leche、con-ron 等证明检查器，对导出的证明进行审查，同时引入由第三方开发、采用不同编程语言实现的独立检查器。\n其中，con-leche 和 con-ron 还具备相对于集合论基础的形式化可靠性证明，能够降低检查工具自身存在逻辑漏洞的风险。为了排除潜在的代码干扰，相关检查针对的是导出后的静态证明数据，避免源代码中的恶意程序影响结果。\n经过上述检查，Lean 和 Mathlib 社区认为此前提出的四项验证标准已经全部满足，并在联合声明中明确写道：\n「我们完全相信 Alpöge 对黎曼猜想的证明是正确的，并祝贺他取得这一成就。」\n值得注意的是，MIT 公布的验证记录还涉及五项主要定理，涵盖经典黎曼猜想，以及针对狄利克雷 L 函数的广义结果。不过，这并不意味着所有类型 L 函数对应的广义问题都已得到解决。\n相比技术验证的结果，另一个受到广泛关注的问题，是 Claude 究竟在此次研究中扮演了什么角色。\nAlpöge 在最初的声明中透露，黎曼猜想一直是他从学生时代就希望解决的问题。为了攻克这一难题，他长期积累相关理论知识，甚至做好了投入数十年研究的准备。\n但 AI 的加入改变了研究进程。\n按照他的描述，研究初期主要由自己确定方向，将两种不同的数学思想结合起来，并引导 Claude 探索适合推广的数学情境。\n随着工作逐渐深入，双方的分工也发生了变化。Alpöge 表示，在研究接近终点时，Claude 的推导速度远远超过了自己，部分数学思路甚至令他感到惊讶。\n他还分享了一个具体例子。在尝试推广 Stepanov 方法时，研究遇到了如何在整数环境中模拟某种重数结构的问题，Claude 提出可以将 theta lifts 的链长度设定为 √X。\nAlpöge 认为，这一建议成为推动研究取得进展的重要思路之一。\n从研究者的描述来看，Claude 已经超越了文献检索、代码补全等传统辅助工作，开始直接参与前沿数学问题的探索与推导。\nMIT 的验证记录还显示，独立检查工作也使用了 Claude Code。不过，目前尚无法准确量化人类研究者与 AI 在最终证明中的贡献比例，相关数学创新仍有待进一步梳理。\n对于数学界而言，形式化证明获得认证，无疑是一次重大进展，但它也带来了一个此前很少有人需要面对的难题。\n计算机可以严格检查数千万行代码中的逻辑关系，却无法直接向人类解释，其中究竟隐藏着怎样的新数学思想。\nAlpöge 本人也承认，目前的证明规模过于庞大，而且极其难以阅读。他希望未来能够大幅简化推理过程，将其整理成适合数学家理解、讨论和传播的传统论文。\n菲尔兹奖得主邓煜也表示，「至少拿出 500 页版本前看都不看」，足以说明如此庞大的证明给人类阅读带来的压力。\n当 AI 生产知识的速度远超人类理解知识的能力，数学家可能逐渐沦为 AI 的审稿人，耗费大量时间消化机器生成的成果。科学进步的速度与人类认知能力之间，或许也将出现一道新的鸿沟。", "thumb": "https://s3.ifanr.com/wp-content/uploads/2026/11/lark2pad-1795311159024-2.jpg!720", "images": ["https://s3.ifanr.com/wp-content/uploads/2026/11/lark2pad-1795311159024-2.jpg!720", "https://s3.ifanr.com/wp-content/uploads/2026/11/lark2pad-1795311155066-1.jpg!720", "https://s3.ifanr.com/wp-content/uploads/2026/11/lark2pad-1795311159024-2.jpg!720", "https://s3.ifanr.com/wp-content/uploads/2026/11/lark2pad-1795311161295-3.jpg!720", "https://s3.ifanr.com/wp-content/uploads/2026/11/lark2pad-1795311163221-4.jpg!720", "https://s3.ifanr.com/wp-content/uploads/2026/11/lark2pad-1795311165064-5.jpg!720"], "tags": ["AI 产品"], "seen": false, "new": false, "daily": false}, {"guid": "3c866057f2f72797ccf8f848a140d412", "title": "伟大的 GTA 6，「不好玩」的 GTA 6", "link": "https://www.ifanr.com/1690801?utm_source=rss&utm_medium=rss&utm_campaign=", "source": "爱范儿", "category": "ai_product", "summary": "我都遵纪守法了，还能叫 GTA 吗？ #欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "ts": "2026-11-22T01:34:09+00:00", "published": "11-22", "starred": false, "importance": 2, "topic": "AI 产品", "one_line": "GTA 6 游戏讨论，探讨游戏内容与评价", "why": "", "inline_text": "GTA 6 游戏讨论\n游戏内容与评价\n游戏行业动态", "full_text": "", "thumb": "", "images": [], "tags": ["AI 产品"], "seen": false, "new": false, "daily": false}, {"guid": "9aee1a27b62e4121f00cc15fd0adc8c3", "title": "Pi Agent 绝配版 Qwen3.8-27B，关掉思考，更稳更快！", "link": "https://www.woshipm.com/ai/6497995.html", "source": "人人都是产品经理", "category": "pm", "summary": "给 Pi Agent 外挂 319 MB 的 LoRA，不改 27B 基座，关掉思考反而更强：SWE-bench Pro 最难 51 题通过率从 39.2% 提到 64.7%，Token 少约 4.5 倍。官方数据、训练逻辑和 4 套部署方案一次讲完，从 Mac 到内网 GPU 都有覆盖。 平时折腾 Coding Agent，我一直偏爱极简可扩展的 Pi Agent （之前写过 被Harness圈捧成圣的 Pi Agent，接上 Dee", "ts": "2026-11-22T01:26:55+00:00", "published": "11-22", "starred": false, "importance": 4, "topic": "AI 产品", "one_line": "Pi Agent 绝配版 Qwen3.8-27B，提升性能与效率", "why": "了解AI模型优化方法，对AI产品开发有帮助", "inline_text": "Pi Agent 外挂 LoRA\n性能提升\nToken减少约 4.5 倍", "full_text": "", "thumb": "", "images": [], "tags": ["AI 产品"], "seen": false, "new": false, "daily": false}, {"guid": "5aa20e1ee229d5e0700d36a4cbce5e3d", "title": "从深圳到上海，少数派的共创故事还在继续", "link": "https://sspai.com/post/119318", "source": "少数派", "category": "vibe", "summary": "11月20日，2026虹桥国际科技周在上海举行。作为聚焦科技创新、产业协作与未来趋势的交流平台，本届科技周汇聚了来自不同领域的创新者、创业者与行业观察者。少数派也在现场带来了主题论坛分享，与参与者一起 ... 查看全文", "ts": "2026-11-22T01:05:44+00:00", "published": "11-22", "starred": false, "importance": 3, "topic": "vibe coding", "one_line": "少数派共创故事，分享科技创新与产业协作", "why": "", "inline_text": "虹桥国际科技周\n科技创新\n产业协作", "full_text": "11 月 20 日，2026 虹桥国际科技周在上海举行。作为聚焦科技创新、产业协作与未来趋势的交流平台，本届科技周汇聚了来自不同领域的创新者、创业者与行业观察者。\n少数派也在现场带来了主题论坛分享，与参与者一起探讨 AI 时代的创造与创业。在这场论坛中，老麦、张浩宇、王乐与原博从各自的实践出发，讨论了 AI 如何改变产品创造，以及创业团队如何连接用户、市场与资本。\n老麦：AI 时代，科技共创的新趋势\n从煮机网到少数派，老麦一直在做连接人与产品的事。作为少数派创始人，他也经历了社区参与方式的变化：大家最初交流工具与使用经验，后来开始一起定义、打磨产品。\n这段经历构成了本次主题分享的讨论起点。AI 编程普及之后，越来越多没有开发背景的人开始动手创造，社区积累的需求、经验与审美，也有了转化为产品的新机会。\n活动中，老麦列举了书法老师、大学生等不同背景的创造者案例。当开发不再完全依赖专业编程能力，熟悉某个领域、长期观察某类问题的人，就有了亲手验证想法的机会。\n变化也贯穿产品形成的过程。从定位、市场分析、原型开发，到内容生产与营销转化，AI 都能参与其中。对个人与小团队来说，尝试一个想法所需的时间和资源正在减少。但做得更快之后，仍然需要判断：这个问题是否值得解决？产品应该呈现怎样的形态？用户为什么愿意使用？\n老麦将共创社区的核心价值归纳为灵感碰撞、需求洞察、经验与资源共享，以及感性的判断。工具帮助实现，社区则让不同背景的人有机会补足彼此的经验。\n创造门槛降低，让行业经验与审美判断有了新的用处。\n对工作流程的熟悉、对生活细节的观察，都可能成为小产品的起点。原本分散在不同人身上的知识，也有机会通过共创，转化为具体的产品。\n少数派共创平台\n，正是为这样的产品探索而设。平台连接有想法的创作者、提供反馈的共创者与关注品质的用户，从需求梳理、方案打磨到产品测试，共同推动一个想法逐步落地。\n> 查看更多少数派共创产品案例\n王乐：谁来定义下一代 AI 硬件？\n2023 年，王乐和团队尝试给毛绒玩具装上一块能对话的电路板。作为 FoloToy 创始人、CEO，他带领团队探索对话式 AI 玩具，也逐渐发现：硬件到了用户手里，往往会出现产品团队没有想到的用途。\n在本次分享中，他用 FoloToy 的实践，讲述了用户如何从体验产品，走向创造玩法。\n最初的电路板，被用户装进了收音机、纸壳机器人、地球仪和老电话。这条共创路径后来延续到「AI 世界通行证」：按照演讲资料，社区已经积累了超过 2000 种玩法，从 PPT 控制、吉他调音，到班级管理与猫咪呼叫器，许多都来自团队产品规划之外。\n这些案例让一个观点变得具体：最了解场景的人，往往就是使用者。厂商提供基础能力，用户则通过安装、修改和分享玩法，不断拓展硬件的用途。\nFoloToy 的产品也为不同程度的参与提供了入口。\nAI Passport：开放式随身 AI 硬件，支持安装社区玩法与借助 AI Agent 创作应用，让同一台设备持续获得新用途。\nAI 毛绒玩具：对话式毛绒玩具与桌面伙伴，支持连续对话、故事儿歌、角色配置、提醒与主动问候，将 AI 交互融入日常。\nMagicBox：DIY AI 玩具模块，支持为喜欢的外形加入对话能力，并进一步设计专属角色。\n从现成产品到开放创作，这些入口回应了王乐分享中的「先玩，再做，一起玩」：先找到感兴趣的用途，再把自己的想法做出来，分享给下一位使用者。\n> 了解 FoloToy 更多产品与玩法\n张浩宇：从内容出发，走向 AI 产业的下一程\n在主理自媒体频道《AI校长说》及深度对话播客《AI 相对论》的过程中，张浩宇持续与一线 AI 创始人、CEO 和投资人交流。九年智能电动汽车行业经历，以及创办赛思开源、担任 CEO 的实践，让他既关注技术如何发展，也关心一家创业公司如何找到客户、获得收入。\n讨论从模型能力延伸到数据来源、场景验证与客户付费意愿，让技术叙事、场景验证与融资沟通彼此对应。除了具身智能的商业化挑战，分享还涉及人形机器人之外的机会，包括 3D 世界模型、垂直场景数据与 AI 应用层。\n评估产品进展，除了看功能增加了什么，也要看哪些需求得到了验证。\n对早期团队来说，这些验证既关系到下一步做什么，也关系到如何向客户与投资人解释自己的价值。\n赛思开源自身也是一个实践样本：通过自研 Agent 工作流，将选题研究、转写剪辑、内容制作与分发串联起来，让 AI 进入公司的日常运营。\n原博：多视角之下的资本路径规划与 A2A 创业机会\n原博看待创业与资本的关系，有着几个不同的位置：她管理过基金，自己创过业、经历过并购退出，也曾担任 xTool COO。如今，作为预见资本创始合伙人，她继续参与企业的投资、并购、融资与战略规划。\n本次分享，她从公司不同阶段的实际需求出发，讨论创业者如何选择资本伙伴，以及智能体协作正在带来哪些新的业务机会。\n早期团队需要验证技术与想法，随后需要证明产品与市场的匹配，再往后则要面对规模增长与经营效率。不同阶段，需要的资金与资源也不同。\n财务资本关注回报与退出，产业资本重视业务协同，长期资本也有自身的战略要求与决策流程。对创业者来说，融资金额和估值只是选择的一部分，还需要理解合作将带来哪些资源、约束与责任。\n因此，股权结构、控制权、条款成本与退出安排，都应提前进入经营规划。引入资本的时点，需要与公司能够证明的业务进展相配合。\n分享的另一部分转向 A2A，即智能体之间的协作。随着 Agent 参与企业工作，专业场景、企业知识，以及身份、授权、审计和支付等协作环节，都可能出现新的需求。\n原博讨论了垂直专业 Agent、企业智能体改造、按结果付费的基础设施等方向。对这些机会的判断，最终落在对业务的深入理解上：通用能力越来越容易获得，团队仍需证明自己理解哪一类问题，并且能够持续解决它。\n让一个想法，经得起使用\n这次论坛连接起了产品创造的几个环节：老麦谈更多人成为创造者的可能，王乐展示用户参与如何带来新的产品用途，张浩宇关注商业价值的验证，原博则将讨论延伸到公司的长期经营。\n感谢四位嘉宾的分享，也感谢来到现场的朋友，我们下次见。", "thumb": "https://cdnfile.sspai.com/2026/11/20/775568b3fdf19761f521b22911f1119b.jpg?imageView2/2/w/1120/q/90/interlace/1/ignore-error/1/format/webp", "images": ["https://cdnfile.sspai.com/2026/11/20/775568b3fdf19761f521b22911f1119b.jpg?imageView2/2/w/1120/q/90/interlace/1/ignore-error/1/format/webp", "https://cdnfile.sspai.com/2026/11/20/caf5176918a108763b234d9bc1d0deb4.jpg?imageView2/2/w/1120/q/90/interlace/1/ignore-error/1/format/webp", "https://cdnfile.sspai.com/2026/11/20/f03ed0319550af56627acd19a8034a86.jpg?imageView2/2/w/1120/q/90/interlace/1/ignore-error/1/format/webp", "https://cdnfile.sspai.com/2026/11/20/c53b1b4b62dd55c365cf4d6f049c8ff8.jpg?imageView2/2/w/1120/q/9 icle URL: https://github.com/sebaandrada-cell/PcapAnalyzer Comments URL: https://news.ycombinator.com/item?id=50594132 Points: 87 # Comments: 9", "ts": "2026-11-21T22:09:58+00:00", "published": "11-22", "starred": false, "importance": 2, "topic": "技术动态", "one_line": "PcapAnalyzer – 自托管pcap分析器，包含27个问题检测器", "why": "", "inline_text": "PcapAnalyzer\n自托管pcap分析器\n27个问题检测器", "full_text": "", "thumb": "", "images": [], "tags": ["tech"], "seen": false, "new": false, "daily": false}, {"guid": "4f37a0a2fb58333effac06468d01123a", "title": "Advice for the next 100 Rust GUIs", "link": "https://linebender.org/blog/next-100-guis/", "source": "Hacker News", "category": "tech", "summary": "Article URL: https://linebender.org/blog/next-100-guis/ Comments URL: https://news.ycombinator.com/item?id=50593737 Points: 118 # Comments: 28", "ts": "2026-11-21T21:17:53+00:00", "published": "11-22", "starred": false, "importance": 2, "topic": "技术动态", "one_line": "", "why": "", "inline_text": "Rust GUI开发\nAdvice for the next 100 Rust GUIs\nHacker News", "full_text": "", "thumb": "", "images": [], "tags": ["tech"], "seen": false, "new": false, "daily": false}, {"guid": "d3816d5f41dced461ea90a2484881681", "title": "Tasklet (YC P26) Is Hiring Product and Agent Infra Engineers", "link": "https://tasklet.ai/careers", "source": "Hacker News", "category": "tech", "summary": "Article URL: https://tasklet.ai/careers Comments URL: https://news.ycombinator.com/item?id=50593679 Points: 0 # Comments: 0", "ts": "2026-11-21T21:11:08+00:00", "published": "11-22", "starred": false, "importance": 4, "topic": "技术动态", "one_line": "Tasklet 招聘产品与代理基础设施工程师", "why": "了解招聘信息，对求职有帮助", "inline_text": "Tasklet 招聘产品与代理基础设施工程师\nHacker News\n招聘信息", "full_text": "About Tasklet\nBetter models are only the beginning.\nWe believe every company will have AI employees. Not another chatbot to prompt or a workflow to babysit, but teammates with real responsibilities: closing the books, keeping a sales pipeline moving, helping customers, and following through on the work between messages. Tasklet is building the product that makes those employees possible.\nOur vision is a team of virtual teammates that learn your business, collaborate with your people, and follow through around the clock. Customers already build custom agents, connect their business tools, and work with them in Tasklet, Slack, email, and text. We’re making it easier for an entire company to work with those agents—and for the people responsible to understand and control what they do.\nThe hard part is everything between a capable model and a colleague you can depend on. We combine models from multiple labs, swarms of parallel workers, cloud computers, and connections to business systems in one agent harness. Then we make that power understandable: what an agent owns, what it did, when it needs help, and what it is allowed to do next.\nThe AI labs are racing to build better models. We’re racing to turn that intelligence into a workforce businesses can actually rely on. We can use the best technology from any lab and focus our entire company on that problem. This is a chance to help define a new category of software—not add one more feature to the old one.\nA small team with a proven track record.\nOur team of 14 is based in San Francisco and is led by founders\nAndrew Lee\n(formerly founded Firebase & sold it to Google) and\nJonny Dimond\nand includes\nWill Chambers\n,\nHiranya Jayathilaka\n,\nMichael Lehenbauer\n,\nMichael Latman\n,\nParker Chun\n,\nChristiana Stubblefield\n,\nTyler Rockwood\n,\nMark Robinson\n,\nGeoff Hamilton\n,\nAustin Haag\n,\nBrennan Murphy\n, and\nDan Sundberg\n.\nWe’ve built the kinds of systems this moment demands: agent systems, cloud infrastructure, and productivity tools. That experience comes from building\nShortwave\n,\nFirebase\n, and critical infrastructure at Google, Amazon, OpenAI, Salesforce, and elsewhere. Here, you’ll work directly with the people who built them—and own a meaningful piece of what comes next.\nWe run the company on our own AI employees. They handle real work in recruiting, support, and operations, and engineers direct parallel agents every day. If work can be delegated to an agent, we delegate it.\nCulture\nA high-performance, results-focused culture.\nTasklet is a fast-paced, engineering-driven, results-oriented company. We aim to build a truly world-class team & an amazing work environment. These are the values we aspire to:\nUnderstand our users & solve their A+ problems\nYou focus on the problems that really matter — not the ones you already know how to solve. You take responsibility for delivering experiences that our users love — end-to-end. This requires a deep understanding of our users, their workflows, and how AI agents can trans", "thumb": "", "images": [], "tags": ["AI 产品"], "seen": false, "new": false, "daily": false}, {"guid": "a6c4255afce1d1f679b1ef81e75d4ab5", "title": "Pandex – Official European Law for AI Agents, over MCP", "link": "https://www.pandex.io", "source": "Hacker News", "category": "tech", "summary": "Article URL: https://www.pandex.io Comments URL: https://news.ycombinator.com/item?id=50593481 Points: 52 # Comments: 10", "ts": "2026-11-21T20:47:41+00:00", "published": "11-22", "starred": false, "importance": 4, "topic": "技术动态", "one_line": "Pandex – 欧洲官方AI代理法律，超过MCP", "why": "了解AI代理法律，对AI产品经理有参考价值", "inline_text": "Pandex\n欧洲官方AI代理法律\n超过MCP\nAI代理法律", "full_text": "Europe's law, in one API\nLegislation and highest-court decisions of the EU and seven European countries, straight from the institutions that publish them, ready for search and AI agents.\nSee the product\n2.8M\nofficial documents\n33 of 41\ninstitutions held complete\n37M\ncitations linked to their text\n8 more next\nWorks with the AI tools you already use.\nClaude\nCursor\nGitHub Copilot\nWindsurf\nZed\nGemini\nBuilt for software\nthat has to get the law right.\nOne API and one MCP server for every jurisdiction we hold.\nREST API\nMCP server\nMarkdown or JSON\nAsk in plain language.\nKeyword, semantic or hybrid search in any language. Ask in English, find the French ruling and the passage that answers it.\nIs a bike courier working for a delivery app an employee?\nFrance\nCase law\n28 Nov 2018\nCour de cassation, chambre sociale, 28 novembre 2018, n° 17-20.079\n… le\nlien de subordination\nest caractérisé par l'exécution d'un travail sous l'autorité d'un employeur qui a le pouvoir de donner des ordres et des directives …\nBuilt for teams\nthat work with the law.\nHow long does a German employer have to dismiss without notice?\nTwo weeks from learning of the facts that justify it.\n§ 626 Abs. 2 BGB\nLegal AI and agents\nGround every answer in real law, with citations. Connect over MCP or the API.\nRegulation (EU) No 575/2013\nNew version\nCode du travail\nArticle amended\nCompanies Act 2006\nNew version\nCompliance and monitoring\nFollow every change to the law across jurisdictions: each article with its past versions and the date each one took effect.\nText\nDates\nIssuer\nCitations\nIdentifiers\nLegal research products\nOne API and one schema across countries, instead of a scraper for every court.\nCoverage you can check,\nstraight from the source.\nNational legislation with its past versions and the decisions of the highest courts, institution by institution. We publish what we hold of each one, and what we do not.\nCourt decisions\n2.4M\nActs and codes\n421K\nSearchable passages\n112M\nLinked citations\n37M\nInstitutions complete\n33/41\nEuropean Union\n101,974 documents\nPublications Office of the EU\ncomplete\nCourt of Justice of the EU\ncomplete\nFrance\n907,232 documents\nParlement\ncomplete\nGouvernement\ncomplete\nCour de cassation\npartial\nThe decisions the court publishes only through Judilibre since 2020 (not in the DILA dumps) need a registered account there; the dumps run about two months behind.\nConseil d'État\ncomplete\nTribunal des conflits\ncomplete\nConseil constitutionnel\ncomplete\nGermany\n177,101 documents\nBundesamt für Justiz\ncomplete\nBundesverfassungsgericht\npartial\nChamber decisions of 1998 to 2009 are only on the court's site, which refuses clients that are not a browser.\nBundesgerichtshof\ncomplete\nBundesverwaltungsgericht\npartial\nStill loading: 2,270 of about 20,321 documents held so far.\nBundesfinanzhof\ncomplete\nBundesarbeitsgericht\ncomplete\nBundessozialgericht\ncomplete\nGemeinsamer Senat der obersten Gerichtshöfe des Bundes\ncomplete\nNetherlands\n335,852 documents\nKOOP, Basiswettenbestand\ncomplete\nHoge R", "thumb": "https://www.pandex.io/_next/image?url=%2F_next%2Fstatic%2Fimmutable%2Fmedia%2Fpediment.0211o9opw1ydw.jpg&w=3840&q=75", "images": ["https://www.pandex.io/_next/image?url=%2F_next%2Fstatic%2Fimmutable%2Fmedia%2Fpediment.0211o9opw1ydw.jpg&w=3840&q=75", "https://www.pandex.io/_next/image?url=%2F_next%2Fstatic%2Fimmutable%2Fmedia%2Ftable.0fr38-j-0-vy-.jpg&w=3840&q=75", "https://www.pandex.io/_next/image?url=%2F_next%2Fstatic%2Fimmutable%2Fmedia%2Fjustice-scales.3t4mqpmtpc6ui.jpg&w=3840&q=75", "https://www.pandex.io/_next/image?url=%2F_next%2Fstatic%2Fimmutable%2Fmedia%2Fwriting.1h-qe6gnqzkil.jpg&w=3840&q=75", "https://www.pandex.io/_next/image?url=%2F_next%2Fstatic%2Fimmutable%2Fmedia%2Fgavel.1bfz2m-t_vabn.jpg&w=3840&q=75"], "tags": ["AI 产品"], "seen": false, "new": false, "daily": false}, {"guid": "8b49a56e8e70819fc1ef3723d874ffe4", "title": "oovi", "link": "https://www.producthunt.com/products/oovi", "source": "Product Hunt", "category": "ai_product", "summary": "Your own team of AI on your desktop Discussion | Link", "ts": "2026-11-21T20:02:03+00:00", "published": "11-22", "starred": false, "importance": 2, "topic": "AI 产品动态", "one_line": "", "why": "", "inline_text": "", "full_text": "", "thumb": "", "images": [], "tags": [], "seen": false, "new": false, "daily": false}, {"guid": "b484e42c41cdead2c1655dc07a5dbbb9", "title": "Upload2Shell (CVE-2026-125396)", "link": "https://pwn.ai/upload2shell", "source": "H umb": "", "images": [], "tags": ["AI 产品"], "seen": false, "new": false, "daily": false}, {"guid": "6f6160ee337ec899e51222ee4b9fabc1", "title": "从美国看中国换房：信任住宿的崛起与跨越周期", "link": "https://www.woshipm.com/it/6497601.html", "source": "人人都是产品经理", "category": "pm", "summary": "民宿行业在经历供给过剩与需求放缓的双重挤压后，正从传统的体验逻辑转向更轻量的换房旅游模式。本文梳理了民宿周期的演变，并对比HomeExchange、Kindred等海外平台的积分换住机制，探讨国内换房旅游能否成为住宿市场的新解法。 2006年，一部叫《恋爱假期》的电影上映，成为此后无数人心中的经典爱情喜剧片。 这部豆瓣评分7.8分的电影在当年获得了2.05亿美元的全球票房，伴随恋爱假期走红的，还有电影中故事线里的换房旅游。 也让home", "ts": "2026-11-21T04:24:12+00:00", "published": "11-21", "starred": true, "importance": 3, "topic": "产品经理", "one_line": "民宿行业换房旅游模式探讨", "why": "", "inline_text": "民宿行业换房旅游模式\n对比海外平台\n探讨国内市场潜力", "full_text": "", "thumb": "", "images": [], "tags": ["产品经理"], "seen": false, "new": false, "daily": false}, {"guid": "3745104a1f40a300e45d2859eab6443e", "title": "洗衣房的午后斜光：用 Awaking 把光和影分开", "link": "https://juejin.cn/post/7710148044738527268", "source": "掘金", "category": "tech", "summary": "午后洗衣房的亮处和阴影原本都偏暖。用 Awaking 的钨灯戏剧，让地砖冷影衬出窗光，保留红椅和机门轮廓，再用暗部细节判断滤镜强度。", "ts": "2026-11-21T04:10:11+00:00", "published": "11-21", "starred": false, "importance": 2, "topic": "AI 编程", "one_line": "Awaking 工具分离光和影，提升视觉效果", "why": "", "inline_text": "Awaking 工具介绍\n分离光和影\n提升视觉效果", "full_text": "", "thumb": "", "images": [], "tags": ["AI 产品"], "seen": false, "new": false, "daily": false}, {"guid": "e8a5f5ff02ebd961a98c57043de84e51", "title": "这群在鸿蒙写应用的年轻人，只想做点「用得上」的", "link": "https://sspai.com/post/119291", "source": "少数派", "category": "vibe", "summary": "上周末，今年正式被列入「全国普通高校学科竞赛排行榜」的2026鸿蒙高校创新赛在南京大学迎来全国总决赛颁奖典礼。华为董事、终端BGCEO何刚出席现场致辞并为获奖选手颁奖。他在现场表示，HarmonyOS ... 查看全文", "ts": "2026-11-21T04:00:00+00:00", "published": "11-21", "starred": false, "importance": 3, "topic": "vibe coding", "one_line": "鸿蒙高校创新赛，年轻人开发鸿蒙应用", "why": "了解鸿蒙应用开发，为作品集提供灵感", "inline_text": "鸿蒙高校创新赛\n年轻人开发鸿蒙应用\n为作品集提供灵感", "full_text": "上周末，今年正式被列入「全国普通高校学科竞赛排行榜」的 2026 鸿蒙高校创新赛在南京大学迎来全国总决赛颁奖典礼。华为董事、终端 BG CEO 何刚出席现场致辞并为获奖选手颁奖。\n他在现场表示，HarmonyOS 终端设备数即将突破一亿，鸿蒙生态里藏着广阔的创新空间和海量的发展机会，欢迎同学们把优秀作品上架到华为应用市场；华为会持续开放开发工具、技术文档与各类孵化资源，让优秀的创意走进更多人的真实生活。与此同时，何刚在大赛现场正式发布了「鸿蒙高校创新孵化计划」，对赛事获奖、成功上架华为应用市场的学生作品，提供技术支持、上架辅导与流量扶持等多项激励措施，助力高校学生的「创新原型」打磨孵化为市场上好用、易用的精品应用。\n而华为对「高校创新」的关怀也远不止此次赛事，在过去几年里，华为联合全国 650 多所高校持续推进产教融合，开设了 800 多门鸿蒙相关课程，吸引超过 46 万名学生开发者参与其中。当操作系统的底层能力与 AI 工具铺进不同专业的日常课堂，我们也不禁好奇：这群在产教融合土壤里成长起来的大学生，真正动手做产品时，会把目光投向哪里？\n将 AI 带出手机屏幕，在被忽略的角落里寻找真问题\n当大多数人还习惯把 AI 当作屏幕里的「聊天框」与问答工具时，大学校园里的一群年轻人，已经开始试着带它走出屏幕、接入真实世界了。随着 AI Agent 在高校铺开，亲手写代码、做开发不再是计算机系学生的专利，越来越多不同专业背景的创作者都在尝试用技术解决身边的具体问题。只不过，在电脑上跑通一个概念 Demo 很容易，要做出一款在真实场景里接得住需求、用得稳的可用产品，光靠书本理论或调用现成的模型接口远远不够——当校园里的创造力被全面点燃，日常课堂也必须接上真正成熟的产业技术底座。\n所以今年被列入「全国普通高校学科竞赛排行榜」的鸿蒙高校创新赛，恰好提供了一次近距离观察的机会。在前往南京大学决赛现场前，我们提前了解了决赛作品的信息。让人意外的是，比起商业路演里常见的功能宣传，这群二十岁出头的大学生在文档里写下了大量「不允许系统做什么」的克制规则——做养老院卧床护理系统的北京工业大学团队写着「未采集数据保留缺测状态，绝不显示为正常」；做视障出行辅具的山东大学团队写着「避免将空白点阵误解为周围没有障碍」；做独居长辈关怀应用的华中科技大学团队则强调「不把模型生成的一句话直接当作动作已完成」。\n参赛者们在国赛市集展示并介绍自己的作品\n等到在决赛现场和这些年轻人聊起各自的作品，我们才有机会沿着文档里的细节，了解它们最初是怎么被想到、又怎么被做出来的。本届鸿蒙高校创新赛吸引了全国 800 多所高校、近 5000 支队伍、近万名学子参与，共有 2800 多份有效作品提交，而在赛程 10 余场线上线下技术辅导的陪伴下，许多团队都把目光投向了平时很少出现在大学宿舍里的话题——比如养老院护工交接班时怎么核对翻身与给药记录、连续的语音导航为什么反而会干扰视障人士听取马路上的车流声、独居老人面对手机菜单时为什么迟迟不敢下手点击等。\n在主流软件都习惯围绕视力良好、手指灵活、反应敏捷的「标准用户」打转的当下，一旦有人偏离了这个标准，人与数字世界之间就会出现一道失语的断层；于是这群来自产品设计、物理、统计与计算机等不同专业的大学生，就试图借助 HarmonyOS 的全场景协同与智能体能力，去把这些被忽略的日常断层一点点接上。\n当单一感官受阻，用跨端协同为身体延伸出新的触角\n山东大学团队设计视障出行辅具《灵触随行》，是因为注意到视障人士出门时，传统白手杖只能探到地面近处，探不到悬空的树枝或路牌；而市面上常见的语音辅具习惯不间断地播报路况，反而堵住了视障者用来听取周围车流声与脚步声的耳朵。怎样在不占用听觉的前提下帮视障者感知空间？爱玩《文明 6》的队员从游戏地图的色块分布找到灵感——把空间障碍翻译成指尖能直接摸出来的「俯视触觉地图」，听觉就能重新留给环境。\n为此，三位学生搭建了「智能眼镜 + 鸿蒙手机 + 90 点触觉手柄」的三端协同方案：眼镜端完成前方的深度估计与物体识别后，即时将轻量化结果无线传给手机，再由手机端侧模型生成点阵帧，通过低功耗蓝牙实时驱动盲杖手柄上的 10×9 触点阵列呈现环境样貌。\n于是日常步行时，手柄以 40cm 网格呈现前方 1 至 3.4 米的全局障碍，拇指一摸便知左右远近；走到室内说一句「找椅子」时，鸿蒙端 Agent 就会切换为 5cm 网格放大局部轮廓精细化映射。而在步行导航时，触觉与听觉则能形成默契分工：平时语音只作温和指引，一旦识别到来车等突发危险，端侧 Agent 就会立刻打断普通导航并优先预警，待危险解除后再恢复指路。\n如果说《灵触随行》延伸的是街头行走时的空间触觉，那么北京工业大学三名大二学生开发的《卧安智护》，则把感知的触角铺到了养老院的病床上。团队从智能床垫广告联想到长期卧床的失能老人：他们无法自主翻身，也说不出哪块皮肤受压过久，护工仅凭肉眼巡视很难拿捏翻身时机；但在病房安装摄像头监测睡姿，又会侵犯老人的隐私。\n于是他们将四块柔性压阻薄膜拼接成 32×32 的压力感知阵列，由此识别仰卧、左侧卧与右侧卧三种睡姿并生成受压热力图。在此基础上，他们用鸿蒙原生的 ArkTS 与 ArkUI 框架优先适配了护工巡房常用的平板电脑，将沉默的床面压力与日常照护事项整合进同一块大屏工作台，让老人的身体受压状态有了直观且体面的表达方式。\n走出单向的机器陪聊，把技术做成人与人之间的缓冲器\n当传感器帮特殊群体接通了物理世界的信号，紧接着摆在年轻开发者面前的第二个问题是：进入 AI Agent 时代，智能体在家庭与照护关系里到底扮演什么角色？\n过去一两年里，不少适老软件试图用聊天机器人代替子女陪老人说话。但在华中科技大学与华南师范大学跨校团队看来，独居老人真正渴望的依然是与亲人联系，只是两代人在工具习惯上隔着一道墙：长辈面对多层菜单和密集按钮总怕点错，异地子女在工作间隙收到几句零散语音，也很难拼凑出父母近几天的真实状态。\n《银龄心语》基于使用者身份设计了不同的界面\n带着「AI 不替代家人陪伴，只帮两代人把关心说出口」的想法，团队在《银龄心语》同一个鸿蒙应用里拆分出「长辈」与「家人」两类角色。长辈端输入邀请码即可免密登录，界面是大字号语音入口；通过 Core Speech Kit 完成语音识别后，针对老人常因网络延迟怀疑没点上而反复误触的习惯，团队将「等待、失败、完成」三个状态分开提示，发送超时绝不在后台自动重发，且所有操作须确认目标后才执行。而在家人端，界面把「近 7 天心情趋势」「未读摘要」与「一键润色回复」放在显眼位置，让子女在忙碌间隙点开就能看懂父母近况并顺畅回应。\n这种克制同样贯穿在《卧安智护》的交接班流程里。团队研读民政部等部门的养老服务规范文件后意识到，护工交接班最核心的痛点是说清三件事：「当前谁需要先处理？某项操作完成到哪一步？下一班还需要跟进什么？」\n为此，他们在鸿蒙平板工作台里写下了严密的规则：给药流程严格区分「记录已给药」与「确认已服用」，未全部确认前任务绝不自动关闭。到了最耗精力的交接班汇总环节，应用通过鸿蒙 Agent 与意图框架调用小艺生成交班摘要，但传给模型的信息均经过脱敏，任务数量与优先", "thumb": "https://cdnfile.sspai.com/article/620926da-cd5f-5853-7961-de06067f507f.jpeg?imageMogr2/auto-orient/thumbnail/!72x72r/gravity/center/crop/72x72/format/webp/ignore-error/1", "images": ["https://cdnfile.sspai.com/article/620926da-cd5f-5853-7961-de06067f507f.jpeg?imageMogr2/auto-orient/thumbnail/!72x72r/gravity/center/crop/72x72/format/webp/ignore-error/1", "https://cdnfile.sspai.com/article/620926da-cd5f-5853-7961-de06067f507f.jpeg?imageMogr2/auto-orient/thumbnail/!72x72r/gravity/center/crop/72x72/format/webp/ignore-error/1", "https://cdnfile.sspai.com/2026/11/19/article/17c192e5-99f8-1c1d-dd4a-699c2d1d9e00.jpeg?imageMogr2/auto-orient/thumbnail/!1374x/gravity/center/crop/1374x/format/webp/ignore-error/1", "https://cdnfile.sspai.com/2026/11/19/d0d732023ca63d59ae4926b4649f52cd.JPG?imageView2/2/w/1120/q/90/interlace/1/ignore-error/1/format/webp", "https://cdnfile.sspai.com/2026/11/19/6d5ef6e2273033d8459f5b77db235531.JPG?imageView2/2/w/1120/q/90/interlace/1/ignore-error/1/format/webp", "https://cdnfile.sspai.com/2026/11/19/f74ce7c929560098fbbd38ee77e7581e.jpg?imageView2/2 r），更多精彩内容第一时间为您奉上。", "ts": "2026-11-20T09:17:05+00:00", "published": "11-20", "starred": false, "importance": 4, "topic": "AI 产品", "one_line": "", "why": "了解最新的AI手机产品，可能对求职和作品集有所启发", "inline_text": "鸿蒙 AI 手机，华为，全新子品牌 OSTA 星芒，增援未来计划，AI 平行宇宙", "full_text": "现在请你张开左手，略微用力仔细抚摸小指头第二节的内侧，大概率会摸到一个凹槽，这是我们长时间使用手机时用小指头当做支撑点留下的印记。\n这种可触摸的印记要比手机对我们大脑留下的改变更为直观，亦是人在使用手机，手机反过来塑造人的小小例证。\n类似的，在《人类简史》里，作者提了一个有点反常识的观点：看起来是人类驯化了小麦这种植物，让它从野生的杂草变成了产量高，种植面积广的农业作物，进而成为中西方最主要的主食来源之一。但实际上，为了种植小麦，万年前会定期迁徙的人类开始在水源地附近定居，日常奔跑狩猎，爬树采集的活动也被重复单一的农业劳动代替。\n小麦从野外零星分布的植物，跃升为植物界最兴盛的物种之一，拿到了生物学意义上的大结果。而我们人类获得的是面条，包子和面包，以及腰椎疾病。\n我们也在手机上的一个个应用里投入名为时间和注意力的养料，种植出了一个个庞大的不可或缺的互联网服务，以及俨然巨物的互联网大厂。\n华为和我们，都需要一束新的光\n2026 年 11 月 20 日，华为全新子品牌OSTA星芒正式推出，距离荣耀品牌脱离华为体系独立已经过去 6 年有余，对于消费电子行业来说，6 年时间就是沧海桑田，加之存储成本高企，单以市场格局而论，看上去市面上并不需要一个新品牌。\n但华为OSTA星芒并不是仅面向当下市场，为华为增加一些出货量的品牌，也不是与华为错开定价区间和线下渠道，主打性价比和线上的品牌，那么它的出现，对于华为的意义到底是什么呢？\n华为OSTA星芒，是华为的「增援未来计划」。消费电子的历史会记住 2026 年，因为在这一年，诸多头部手机品牌需要思考自身的存续问题，一方面是因为碍于硬件成本飙升带来的整个行业出货量大幅下滑，二是 AI 开始重构一切，包括使用手机的方式，一部分用户开始希望在手机上以全新的交互方式去拥抱 AI。\n图｜OSTA O1 Pro 与 Pura X View\n过去十几年的时间里，华为终端产品累计了数亿用户，尤其是 Mate 系列手机成为商务人士的主流选择，也是中国手机品牌里进行高端化突破的成功样本。与此同时，Pura 系列在原来 P 系列的基础上，吸引了更多具有锐意向前精神的用户，而 nova 系列的核心用户本就是年轻的时尚的活力的。\n如果这群人里面，还有更个性的，更先锋的，更爱探索，更离不开 AI 的用户，那么他们就是华为OSTA星芒的典型用户，因为OSTA星芒的定位就是「面向先锋者的鸿蒙 AI 全场景科技品牌」。\n与 Mate，Pura 和 nova 这些以单词命名的机型系列不同，全大写的 OSTA 是 Original（原创）、Smart（智能）、Technology（科技）和 Accessible（触手可及）四个单词的首字母缩写，代表华为OSTA星芒坚持坚持原创探索，拥抱智慧科技，以突破创新，让 AI 科技触手可及，让智能体验无处不在的品牌理念。\n以先锋者姿态出发的前提，是有一个科技普惠的愿景。\n在主品牌华为和子品牌华为OSTA星芒的体系里，华为品牌继续深耕中高端市场，以技术创新、品质体验和成熟生态建立品牌认知；华为OSTA星芒则承担了探索先锋科技、全新产品形态与 AI 交互方式的角色。两个品牌共享麒麟芯片、鸿蒙操作系统等核心技术底座及品质标准，甚至价格区间也会有所交叉，更多的不同是消费人群、产品理念和品牌表达。\n图｜OSTA O1 Pro 与 Pura X View\n因而我们就可以看到华为长期积累的软硬件协同能力，密集出现在了华为OSTA星芒品牌的第一款新品 OSTA O1 Pro 上，OSTA O1 Pro 搭载的麒麟 9030S 芯片，为多模态感知、AI 推理与高频任务处理提供端侧算力支持；系统软件层面，HarmonyOS 7 AI 先锋版将 AI 能力进一步融入操作系统底层，使其能够参与系统感知、任务规划与应用调度。\n其中，鸿蒙系统向小艺开放了 300 多项系统数据，具备 2100 多项系统技能，让小艺能够根据用户意图，协同调用系统能力与第三方生态服务。\n这套技术架构也改变了传统语音助手的工作方式。\n小艺的四层渐进式全域记忆架构与 Dreaming 梦境记忆整理能力可以长期沉淀用户的兴趣、习惯与个人目标，结合实时场景感知，AI 能够进一步判断用户当前需求，在合适的时机提供提醒、建议或执行服务。\n这就改变了此前手机语音助手被动式响应单次任务的工作模式，变成了有记忆，能处理长线任务的助理，相当于从实习生，升级成了资深秘书。\n与此同时，HPIC 鸿蒙个人智能计算系统将隐私与安全机制融入感知、记忆和执行链路，强调本地优先、数据最小化和用户可控。\n这部为 AI 而生的鸿蒙手机 OSTA O1 Pro 有着麒麟芯片、鸿蒙操作系统软硬两个技术底座，在此之上，依靠系统级能力，系统级个人 AI 伙伴小艺，把原本分散的手机能力组织成一个能够理解意图、持续记忆、主动提供服务的 AI 手机体系。\n很多人的印象中，华为在品牌气质上是偏成熟和理性的，但事实上呢，在新形态新技术和新交互的探索上，华为反而是所有消费电子品牌里更激进更体系化的\n，比如单单在「阔」这个形态上就有阔折叠和阔直板两种，而在「折叠」上就有手机和电脑两个品类，大折叠，阔折叠和三折叠等多种形态……\n类似的，在鸿蒙系统积累了上亿用户、生态覆盖手机、平板、电脑等多品类终端之后，\n这个面向未来的操作系统也是时候进行一次分叉，把 AI 放在最核心的位置，让交互和功能都围绕 AI 创建。\n这就是华为OSTA星芒品牌，以及 OSTA O1 Pro 这款手机的任务，\n华为OSTA星芒品牌是面向 AI 战场的先遣军，而 OSTA O1 Pro 则是一支侦察连。\n对于华为来说，对于被当下 app 推荐算法和注意力机制所重塑的我们，都需要这样的一个 AI Native 设备，来把华为的技术体系与 AI 联系起来，把当下最重要的设备形态与未来可能的 AI 交互与功能统一起来，把先锋用户与华为OSTA品牌动员起来。\n当 AI 开始接管手机的第一屏\n华为 Pura X View 成为 2026 年中国智能手机市场黑马选手证明了市场对于新形态设备具有比想象中更大的热情，因而 OSTA O1 Pro 沿用阔直板的形态，叠加鸿蒙 7 AI 先锋版，恰好兑现前面说的「面向先锋者的鸿蒙 AI 全场景科技品牌」。\n一切都不同以往。\n可以这么说，在 Pura X View 热销，阔直板形态成为了一种「社交货币」的时候，让 OSTA O1 Pro 承袭阔直板形态本身就是一种投入。\n更宽的显示区域，可以为漫画、视频、游戏以及部分信息展示场景提供更好的观感，对于需要同时观察多个界面元素的用户，额外的横向空间也具有潜在价值。\n华为的「技术货架」里有一些硬通货，比如昆仑玻璃，以及背后的那块 120Hz 刷新率、2160Hz 高频 PWM 调光和 6500nits 局部峰值亮度屏幕；双环式增益天线、Wi-Fi 7、星闪连接、eSIM 组成的通信能力；2 亿像素主摄、5000 万像素潜望式长焦和第二代红枫原色摄像头组成的影像模组，都被放在了 OSTA O1 Pro 这款设备上，这意味着即便不考虑这款设备在 AI 交互和功能的先锋性尝试，它也可以是一款具备优秀硬件素质的高端手机。\n服务保", "thumb": "https://s3.ifanr.com/wp-content/uploads/2026/11/1280X1280.jpeg!720", "images": ["https://s3.ifanr.com/wp-content/uploads/2026/11/1280X1280.jpeg!720", "https://s3.ifanr.com/wp-content/uploads/2026/11/lark2pad-1795165986154-1.jpg!720", "https://s3.ifanr.com/wp-content/uploads/2026/11/lark2pad-1795165993149-2.jpg!720", "https://s3.ifanr.com/wp-content/uploads/2026/11/lark2pad-1795165999598-3.jpg!720", "https://s3.ifanr.com/wp-content/uploads/2026/11/lark2pad-1795166011984-4.jpg!720", "https://s3.ifanr.com/wp-content/uploads/2026/11/lark2pad-1795166028460-5.jpg!720"], "tags": ["AI 产品"], "seen": false, "new": false, "daily": false}, {"guid": "c03cc01d016c18a3c391a328d908d047", "title": "麦肯锡年度报告：32%的企业不买软件了？", "link": "https://www.woshipm.com/chuangye/6497541.html", "source": "人人都是产品经理", "category": "pm", "summary": "麦肯锡最新调研显示，32% 的受访企业已经因为能用 AI 编程自己实现功能，放弃采购至少一款软件；另一边，一家 8.3 万人的房产经纪公司用 Lovable 自建系统，省下约 100 万美元许可费。开发变便宜之后，哪些软件会被替代，哪些能力反而更值钱？ 今天分享下我今天看的一个麦肯锡的报告，这个报告其实8月底就发布了《The state of AI in 2026: On the road to ROI》。 因为我本职工作是 2B 的解", "ts": "2026-11-20T09:07:40+00:00", "published": "11-20", "starred": false, "importance": 4, "topic": "产品经理", "one_line": "", "why": "了解企业对软件的需求变化，对求职和作品集有参考价值", "inline_text": "麦肯锡，企业，AI 编程，软件采购，Lovable 自建系统，开发变便宜，软件替代，能力值钱", "full_text": "麦肯锡最新调研显示，32% 的受访企业已经因为能用 AI 编程自己实现功能，放弃采购至少一款软件；另一边，一家 8.3 万人的房产经纪公司用 Lovable 自建系统，省下约 100 万美元许可费。开发变便宜之后，哪些软件会被替代，哪些能力反而更值钱？\n今天分享下我今天看的一个麦肯锡的报告，这个报告其实8月底就发布了《The state of AI in 2026: On the road to ROI》。\n因为我本职工作是 2B 的解决方案顾问，所以找了个我个人比较感兴趣的角度和大家分享这个报告，原文我也放在文末的“阅读全文”里。\n开始正文。\n如果你是一家公司的老板，每年花几十万甚至上百万元购买各种企业软件，突然有一天，员工告诉你：\n“这个系统我们可以自己做，而且可能比买的更好用。”\n你会怎么选？\n麦肯锡这一篇《2026年 AI 发展状况报告》其实也是个调研报告，调研发现\n32%的受访者表示，所在企业已经因为能够利用 AI 编程工具自行实现某些功能，而决定不再购买至少一款软件产品或功能。\n过去几年，AI 行业一直讨论的是 AI 会不会取代程序员。现在，一个更直接的商业问题出现了：\n如果企业可以自己开发软件，谁还需要软件公司？\n01 一家8万人的公司，开始取消软件订阅了\n今年1月，AI 编程平台 Lovable 分享了一个客户案例。\n这家公司叫\neXp Realty\n，是美国一家大型房地产经纪公司，旗下有超过 8.3万名房地产经纪人，业务覆盖多个国家。\n和很多大型企业一样，eXp Realty 每年需要采购大量软件：\n内部沟通平台、房产展示网站、客户管理工具、AI 助手等等。\n这些软件单独看可能并不贵，但企业规模一大，就是一笔不小的费用。\n比如，它原来使用的房产网站服务，按照每名经纪人每月11美元收费。\n而且，公司每进入一个新市场，都需要考虑系统配置、数据对接以及供应商的开发进度。\n后来，eXp Realty 开始尝试用 Lovable 自己开发。\n他们建立了一套覆盖26个国家的房产网站平台，能够连接20多套 CRM 系统。\n按照公司披露的数据，新平台让相关支持工单减少了85%。\n他们还开发了一个叫 The Hub 的内部沟通平台，替代原本为经纪人购买的软件服务，\n每年节省约 100万美元的许可费用。\n另一个基于 OpenAI API 开发的 AI 助手及内部工具，也替代了此前采购的部分企业 AI 服务，\n同样节省了约 100万美元。\neXp Realty 这个案例中，变化的还不只是省钱。\n以前企业想要一个新功能，需要向软件供应商提出需求、沟通方案、等待开发。如果是个标准产品本来就没有的功能，还可能要额外支付定制费用。\n现在，业务团队可以尝试自己完成一部分开发工作。\n对于那些需求相对简单、使用范围有限、又需要频繁修改的内部工具，自建与采购之间的成本差距，确实可能越来越小。\n02 最先受到冲击的，反而不是那些最贵的软件\n与此同时，另一家企业软件公司 Retool 也发布了一份《Build vs. Buy》报告，\n专门研究企业是自己开发软件，还是购买现成产品。\n这份调查覆盖了 817名 Retool 客户和软件开发相关从业者。\n结果发现，35% 的受访者表示，团队已经用自行开发的工具替代了至少一款 SaaS 产品的功能；78% 预计今年会开发更多内部工具。\n答案并不意外。\n工作流自动化、内部管理工具、BI 报表、表单、项目管理，这些都是比较常见的自建目标。\n原因也很容易理解。\n比如，一家公司采购了一套项目管理软件，可能只需要其中 20%的功能，但仍然需要为所有使用者购买账号。\n而业务部门真正想要的报表、审批规则、数据字段，标准软件未必都有。\n过去大家觉得不完美也只能接受，因为自己开发更麻烦。\n现在，一个熟悉业务的员工，可能通过 AI 开发工具在几天内做出基本可用的内部系统。即使后续还需要工程师完善，门槛也和过去不一样了。\n当然，软件公司并没有立刻失去客户，但客户多了一个选择。\n这就会改变供应商和客户之间原来的关系。\n以前一家软件公司可能靠某个非常具体的功能，服务几百家企业，每年稳定收取订阅费。\n但如果这些功能已经能够借助 AI 以较低成本重新实现，\n那么它原来的收费依据就会受到挑战。\n这里需要区分两种情况。\n第一种是功能相对简单的工具，\n比如内部报表、表单、轻量审批、信息管理和一些工作流自动化。\n这些工具通常面向有限的使用者，出现问题的影响范围相对可控，比较适合评估自建。\n第二种则是涉及财务、核心交易、供应链、医疗数据等业务系统。\n这些软件不只是提供几个页面和功能，还需要长期保证数据准确、权限安全、业务连续性，以及不同系统之间的协同。\n后一类软件当然也可能受到 AI 影响，但企业未必会因为可以快速生成代码，就愿意替换已经稳定运行多年的核心系统。\n因此我不太认同一种流行的说法：\nAI 编程成熟后，SaaS 公司都会被淘汰。\n真正受到冲击的，可能是那些除了功能本身之外，没有太多其他价值的软件。\n03 软件巨头的收入却还在增长\n如果 32%的企业已经开始考虑不买软件，是不是意味着整个 SaaS 行业马上要进入衰退？\n事情并没有这么简单。\n10月底，企业软件巨头\nServiceNow\n刚公布了第三季度财报。\n它的季度订阅收入达到 39.88亿美元，同比增长 21%。公司还把 2026年 AI 产品的年度合同价值目标上调到了 17亿美元。\n也就是说，一边是企业开始用 AI 替换外部软件，另一边却有大型软件公司仍然保持不错的增长。\n这两件事为什么可以同时发生？\n我觉得关键在于，\n我们经常把“开发一套软件”和“长期运营一套企业系统”混为一谈。\n举个例子。\n假设一家公司销售部需要一个客户拜访管理系统，记录客户名称、拜访时间、商机进度，生成简单的业务报表。\n这样的系统，现在完全有机会用 AI 辅助开发出来。\n但如果你要把它作为一家大型企业的正式系统，问题就多了。\n销售人员离职之后，谁来接管他的客户？不同部门能看到哪些信息？数据怎么与 ERP 和财务系统同步？如果同一客户在几个系统里有不同编码怎么办？系统出现错误后，谁负责恢复和追溯？\n这些事情并不会因为 AI 能写代码，就自动得到解决。\n尤其对于大型企业，软件开发往往不是最昂贵的部分。\n系统集成、业务规则梳理、数据治理、长期维护，以及由此带来的组织协调成本，可能更加复杂。\nRetool 的调查也发现一个值得警惕的现象：60%的受访开发者曾经在没有 IT 部门监督的情况下自行开发工具。\n这意味着 AI 可能一边帮助企业减少外部软件采购，\n一边制造出大量新的内部系统。\n也就是说，十年前常说的的“烟囱”式架构，又回来了。\n过去公司的 IT 部门头疼的是，各部门各自采购了太多软件，数据不互通，系统难管理。\n未来还有可能出现另一个问题：\n各部门自己开发了太多软件，没人知道到底有多少套、谁在维护、哪些数据被调用。\n开发门槛降低之后，系统数量可能越来越多，但企业的整体管理复杂度未必随之下降。\n这也是为什么 ServiceNow 这类公司的商业价值，不能只用它提供了多少软件功能来衡量。\n它还提供跨部门的业务流程、数据管理、权限、审计、系统集成和持续运营能力。\nAI 让“把一个", "thumb": "https://static.woshipm.com/tag/1101_1@2x.png ", "images": ["https://static.woshipm.com/tag/1101_1@2x.png ", "https://image.woshipm.com/wp-files/sha256/04/9b/049bf0182659f3836d85a684aeb9f087519142fe2597f3657050492a338e7727.png", "https://image.woshipm.com/wp-files/sha256/28/a0/28a09dcb3d71021412cfecbd1c449ca
