OpenAI手机项目订单，将参与整机组装。\n富士康是苹果iPhone的主要组装商之一。这次，它的旗下企业又出现在OpenAI的手机供应链中。\n一边是iPhone，一边是OpenAI。过去，用户是在手机上使用ChatGPT；现在，OpenAI也准备自己造手机了。\n这背后，可能是一场手机行业新竞争的开始。\n苹果AI，慢了半拍\nOpenAI准备造手机，最值得关注的对手之一就是苹果。\n过去十多年，苹果几乎定义了智能手机的交互方式。App、触屏、操作系统，整个行业都在围绕这套模式发展。\n但到了AI时代，苹果的表现却有些尴尬。\n2024年，苹果高调推出Apple Intelligence，展示了一个更懂用户、更能理解个人信息的新版Siri。\n结果，最受期待的个性化Siri和跨应用操作功能一再延期。原定2025年推出的功能，被推迟到2026年。\n与此同时，苹果AI团队也经历了调整。\n2025年12月，苹果宣布AI负责人John Giannandrea退任，由曾在Google和微软任职的Amar Subramanya接手AI业务。\n2026年1月，苹果又宣布与Google达成多年合作，下一代Apple Foundation Models将基于Gemini模型和云技术开发。\n曾经高调强调自研的苹果，如今也需要借助外部大模型补课。\n当然，苹果并没有放弃自研。9月，苹果已经开始推出新一代Siri AI测试版，支持个人信息理解、屏幕感知和更多跨应用操作。\n但这套能力目前仍在分阶段开放，中国市场暂时无法使用。\n苹果的AI追赶之路，显然还有不少工作要做。\n这里还有个瓜：曾经帮苹果定义硬件设计的人，现在也参与了OpenAI的硬件布局。\n前苹果首席设计官Jony Ive与OpenAI合作，其创办的io Products团队也已并入OpenAI。\n2026年，苹果又将OpenAI及两名前苹果员工告上法庭，指控其涉及商业机密问题。OpenAI否认有意使用其他公司的商业机密。\n从2024年苹果主动把ChatGPT引入iPhone，到如今双方因为硬件人才和商业机密对簿公堂，关系已经发生了明显变化。\n供应链上也出现了变化：富士康旗下富智康被曝拿下OpenAI手机组装订单。富士康长期为苹果组装iPhone，而OpenAI曾是苹果的AI合作伙伴。如今，OpenAI开始筹备自己的手机，双方的关系也从功能合作延伸到了硬件入口的潜在竞争。\n豆包撞墙，App集体关门\n不过，造出一部AI手机，真正的难题可能才刚刚开始。\n此前，豆包手机助手就已经尝试过一条路：让AI直接操作手机，替用户完成各种任务。\n比如，用户只需要说一句话，AI就可以帮忙搜索商品、整理信息、安排出行，甚至跨应用完成操作。\n听起来很方便。\n但很快，问题就来了。\n微信、淘宝、支付宝、美团等大量应用，开始拒绝豆包手机助手的屏幕自动化操作。\n10月14日，豆包公布的拒绝操作名单有155款应用；10月21日，官网清单已经增加到166款。\n11月11日的更新又新增百度、网易等应用生态，并补充了多款腾讯、阿里系应用。\n由于部分条目以企业生态及关联App的形式列出，实际涉及范围还在扩大，已经不能简单用最初的155款来概括。\n需要注意，这里拒绝的是智能体的自动化操作权限，并不代表这些App的所有功能都无法使用。\n为什么这些应用不愿意开放？\n原因并不难理解。\n过去，用户打开淘宝购物，流量、广告、交易都留在淘宝自己的生态里。\n现在，如果AI直接替用户完成搜索、比价、下单，用户甚至可能不再打开淘宝。\n对于App来说，AI可能绕过自己的入口，直接拿走用户和交易。\n更重要的是，AI自动操作涉及用户隐私、账户权限、支付安全和数据责任。出了问题，究竟应该由谁承担？\n豆包手机遇到的阻力，已经把这个问题摆到了台面上。\n11月6日，工信部又发布了《关于加强智能体终端设备进网管理的通知》。\n其中明确提出，应用开发者需要声明是否允许智能体调用，未经声明同意，智能体不得强制调用应用。\n这意味着，AI手机未来的发展，还需要解决应用授权、安全和监管等问题。\nAI可以理解用户的需求，但要真正替用户办事，还得获得整个应用生态的配合。\n手机厂商，谁也不肯让步\n豆包遇到的问题，OpenAI未来同样绕不开。\n而且，OpenAI面对的竞争对手，远不止苹果。\nGoogle已经开始让Gemini在Android手机上执行多步骤任务。\n今年2月，Google公布了Gemini在Android上的任务自动化测试，可以帮助用户完成叫车、重新订购餐食等操作。\n目前，这项能力先在Pixel 10和三星Galaxy S26系列部分机型上开放，支持的应用和场景仍然有限。\nGoogle还有一个天然优势：它同时掌握Gemini和Android。\n这意味着，Google不仅拥有AI模型，还能通过Android把模型能力接入操作系统和应用生态，让Gemini有机会直接调用手机功能，而不只是停留在聊天窗口里。\n华为也在推进类似布局。\nHarmonyOS 7升级了鸿蒙智能体框架，小艺可以调用2100多项系统能力，连接500多个合作伙伴Skills和2000多个鸿蒙智能体。\n小米也没闲着。\n澎湃OS 4推出超级小爱2.0，接入小米MiMo大模型，加强跨应用、跨设备任务编排。\n这类系统级AI瞄准的，就是跨应用任务。\n比如，用户在微信聊天窗口收到一个地址，AI可以提取地址并调用地图导航；用户在电商App里浏览商品，AI也可以协助比价或搜索同款。\n几家手机厂商都在做同一件事：让AI深入操作系统，尽可能减少用户手动打开App的步骤。\n这恰恰是OpenAI需要面对的现实。\n苹果、Google、华为、小米，都拥有自己的手机和操作系统。\n它们可以从系统底层开放权限，让AI调用设备能力。\nOpenAI虽然拥有ChatGPT和强大的模型能力，却还没有自己的成熟手机操作系统和应用生态。\n即使拿到了组装订单，未来如何获得系统权限、打通第三方应用，仍然是绕不开的问题。\n手机的下一场战争，才刚刚开始\n过去，手机厂商比拼的是芯片、屏幕、摄像头和续航。\n到了AI时代，竞争的重点可能正在发生变化。\n用户希望手机听得懂自己的话，记得住自己的习惯，还能跨应用完成复杂任务。\n谁能让AI真正替用户办事，谁就有机会掌握下一代手机入口。\n苹果想守住自己的生态，Google希望让Gemini成为Android的智能中枢，华为和小米也在加速推进系统级AI。\nOpenAI则准备通过自己的手机项目加入这场竞争。\n不过，富智康拿到订单，只能说明项目向前迈出了一步。距离产品正式面市、真正改变手机交互，还有很长的路。\n手机行业的下一场战争，争夺的可能已经不只是用户买哪部手机。\n而是用户以后还需不需要自己打开那些App。", "thumb": "https://static.woshipm.com/tag/1125_1@2x.png ", "images": ["https://static.woshipm.com/tag/1125_1@2x.png ", "https://image.woshipm.com/2023/04/14/718fde40-da8e-11ed-b69c-00163e0b5ff3.jpg", "https://image.woshipm.com/wp-files/2026/11/NFGViamrSl9POAklpKDN.jpeg", "https://image.woshipm.com/wp-files/2026/11/N26JdIfbsxWIhYDPInX7.jpeg", "https://image.woshipm.com/wp-files/2026/11/J1nLDFP9EMXswlppdSbp.jpeg", "https://image.woshipm.com/wp-files/2026/11/1TZJekiHFrWRP7lPHPVM.jpeg"], "tags": ["产品经理"], "seen": false, "new": false, "daily": false}, {"guid": "e7d945bb9c148d84b7759892a5bd2d7a", "title": "AI与硬件结合的碰撞——1个框架破局组织变革的困境", "link": "https://www.woshipm.com/ai/6497413.html", "source": "人人都是产品经理", "category": "pm", "summary": "当AI放大个人能力，组织权责结构却成为软硬结合的最大瓶颈。本文犀利指出招聘大牛并非解药，并提出“大统筹+小硬件”的最小组织单元，通过权责解耦、渐进扩展与决策透明化三大机制，破解软件基因公司跨界硬件的组织迁移难题。 在前两篇文章中，我们说了面对AI和机器人两个软硬件层面的高峰，对于企业要做软硬结合的产品：不论是智能硬件、AI硬件、具身智能等。不得不面对的3把达摩克利斯之剑： 软硬底层逻辑的对立、组织成功的路径依赖、AI伦理与监管的未落地。", "ts": "2026-11-20T09:04:43+00:00", "published": "11-20", "starred": false, "importance": 4, "topic": "产品经理", "one_line": "", "why": "了解AI与硬件结合的组织变革，对求职和作品集有参考价值", "inlin elease_9.1", "source": "Hacker News", "category": "tech", "summary": "Article URL: https://ffmpeg.org/download.html#release_9.1 Comments URL: https://news.ycombinator.com/item?id=50569998 Points: 8 # Comments: 3", "ts": "2026-11-20T04:02:39+00:00", "published": "11-20", "starred": false, "importance": 3, "topic": "技术", "one_line": "FFmpeg 9.1 版本发布，包含新功能", "why": "", "inline_text": "FFmpeg 9.1 版本发布，包含新功能，可下载使用", "full_text": "If you find FFmpeg useful, you are welcome to contribute\n by\ndonating\n.\nMore downloading options\nGet packages & executable files\nFFmpeg only provides source code. Below are some links that provide it already compiled and ready to go.\nGet the Sources\nYou can retrieve the source code through\nGit\nby using the command:\ngit clone https://git.ffmpeg.org/ffmpeg.git ffmpeg\nSnapshot\nBrowse\nCannot access Git or wish to speed up the cloning and reduce the bandwidth usage?\nFFmpeg has always been a very experimental and developer-driven project. It\n is a key component in many multimedia projects and has new features added\n constantly.\n Development branch snapshots work really well 99% of the\n time so people are not afraid to use them.\nGit Repositories\nGit Repositories\nSince FFmpeg is developed with\nGit\n,\n multiple repositories from developers and groups of developers are available.\nRelease Verification\nAll FFmpeg releases are cryptographically signed with\nour public PGP key\nand should be verified for\n authenticity.\npub rsa2048 2011-04-26 [SC]\n FCF986EA15E6E293A5644F10B4322F04D67658D8\nuid [ full ] FFmpeg release signing key <ffmpeg-devel@ffmpeg.org>\nsub rsa2048 2011-04-26 [E]\nTo verify a release:\nImport our public key into your local keyring:\n$ curl https://ffmpeg.org/ffmpeg-devel.asc | gpg --import\nDownload a release tarball and its corresponding signature.\nVerify the signature:\n$ gpg --verify ffmpeg-4.3.2.tar.xz.asc ffmpeg-4.3.2.tar.xz\ngpg: Signature made Sun 21 Feb 2021 06:35:15 AEST\ngpg: using RSA key FCF986EA15E6 与 GPT-6.2 Sol 官方基准评测\n第一，超长上下文检索断层领先，编程成本砍半。\n256K 到 1M 检索测试 GraphWalks 中，Neon 跑出\n95.2%\n，远超 Opus 5.5 的\n66.8%\n；博主 JAZII 同题开最高档实测，Neon 花 $3.5（20 分钟），Opus 5.5 花 $7.2（18 分钟）。\nJAZII 同题实测的成本与耗时对比\n谷歌官方演示：Neon 纯靠 50 多万条函数公式将静态照片渲染成 10 万格 3D 打光表格\n第二，幻觉率极低，原生全模态无代餐。\nAA-Omniscience 评测中 Carbon 幻觉率仅\n4%\n、Hydrogen 仅\n8%\n，而 Claude Sonnet 5.5 高达\n43%\n。\nAA-Omniscience 幻觉率评测：Gemini 4 全系处于最低区间\nClaude 无原生听觉，Gemini 却能盲听认出《英雄联盟》冷门皮肤音效、分辨 AI 翻唱混音瑕疵，还能凭 5 张无序照片复原 Opus 5.5 没看懂的二阶魔方\n原生听觉实测：Gemini 盲听识别《英雄联盟》卡莎冷门皮肤音效并按秒拆解（图源：差评 X.PIN）\n空间推理对比：随手拍 5 张无序二阶魔方照片，Gemini 直接算出复原路径而 Opus 5.5 未看懂（图源：差评 X.PIN）\n第三，中文表达自然，没有 GPT 的恶心套话。\n但客观讲，大多数场景仍是 Opus 5.5 更稳；且Gemini 4 直出前端爱堆高饱和色块，还有说话盲目自信、不主动跑测试的问题。\n放以前狗都不用，但狗不用我用！\n因为用Claude太烧心了！！\n加上，CLI 已连更 22 版，本周官方刚把上下文从 256K 翻倍至 512K（压缩降\n3.5 倍\n）、Carbon 首字提速\n1.5 倍\n，外加会员\n7 倍\n等效额度与独立 Claude 池。\n跟着饼干哥哥做好下面三步能把Claude拉爆！！！（开开玩笑）\n02 第一步：每月280 元走苹果土区拿7 倍额度\nAntigravity 缓存命中率超\n94%\n，美区 $99.99/月 的 Ultra 5x 每周共享约 $600 Hydrogen 或 $200 Carbon/Neon 用量（约月费\n7 倍\n），支持多机同登、切号不清本地索引，网页版额度还分开算。\nGoogle AI Ultra\n7 倍\n额度核算公式与双机高强度实测\nGenie 4 向符合条件的 Google AI Ultra 用户开放，支持原生音频与实时编辑\n直接走苹果土区（App Store）内购。订阅列表认准网盘容量：20 TB = Ultra 5x、30 TB = Ultra 20x\n强烈不建议去薅羊毛，例如这周有免费领一个月的，但很多人的号后来被退回甚至封了。\n话说现在谷歌越来越严格了。。\n03 第二步：分清多个版本，CLI 与图形界面配置互不相通\n1\nAntigravity CLI\n：轻量终端工具，适合远程 SSH，其实大部分人都是基于Cli来用的，尤其是可以基于 Pi 搭建自己的 Agent工作台\n2\nAntigravity IDE\n：基于 VS Code，强在 Tab 补全与 Diff 审查，跟Cursor有点像，我已经不怎么用了\n3\nAntigravity App\n：就是Claude、Codex这样的会话Agent为主，建议安装\n04 第三步：用这12个提示词配置满血反重力\n如果还有更多玩法，求评论区分享啊喂！！\n1. 跨目录读资料写草稿不再步步弹窗，划清工作区与沙箱白名单\n调用 /agy-customizations 帮我配好权限：开启终端沙箱并设为沙箱内自动放行（禁止越界静默改写外部文件），把常用 MCP 工具和系统临时目录加入白名单，并引导我把关联业务目录挂载进当前工作区。\nAntigravity 权限底层模型：Project、Workspace 与系统级 Sandbox 的三层边界关系（图源：计算艺术的构造与解释）\n2. 治好 Gemini 4 爱说场面话、交活不自检的毛病，强制先跑通验证再汇报\n写入全局常驻规则：沟通首句直给结论或行动，禁用套话与「100%」「零副作用」等绝对词；任何代码或方案交付前必须先实际运行验证，并如实注明哪些已实测通过、哪些仅靠推断。\n3. 告别干转二十分钟一片空白，自动折叠刷屏命令、每几步用大白话报进度\n把我的输出繁琐度（verbosity）设为 low 自动折叠刷屏命令，并写入全局规则：执行多步任务时，每连续调用 4 到 5 次工具就在同一轮用一行 40 字以内的中文同步当前查到了哪、下一步做什么。\n4. 解决看大项 ": false, "new": false, "daily": false}, {"guid": "7cf91f8a829550f2a4a1cc87cf082bf3", "title": "DeepSeek限额：免费用户成了AGI的“拦路虎”？", "link": "https://www.woshipm.com/ai/6497117.html", "source": "人人都是产品经理", "category": "pm", "summary": "当DeepSeek主动给免费用户限额，一个反直觉的信号浮出水面：在算力经济时代，海量C端免费用户不再是护城河，而是持续失血的伤口。本文从成本结构、商业重心迁移与算力约束三重维度，拆解AI企业为何集体转向付费API与生产力场景，重新定义AGI竞赛的胜负手。 “去别的地方玩，不要耽误AGI训练。” 这句针对DeepSeek的调侃，如今正变成现实。 近日，DeepSeek收紧了网页版和App免费用户的使用额度，超过7天不活跃的长对话无法继续使", "ts": "2026-11-20T03:20:04+00:00", "published": "11-20", "starred": false, "importance": 4, "topic": "AI 产品", "one_line": "", "why": "了解AI产品行业动态，可能影响产品决策", "inline_text": "DeepSeek主动给免费用户限额，AI企业为何集体转向付费API与生产力场景", "full_text": "当DeepSeek主动给免费用户限额，一个反直觉的信号浮出水面：在算力经济时代，海量C端免费用户不再是护城河，而是持续失血的伤口。本文从成本结构、商业重心迁移与算力约束三重维度，拆解AI企业为何集体转向付费API与生产力场景，重新定义AGI竞赛的胜负手。\n“去别的地方玩，不要耽误AGI训练。” 这句针对DeepSeek的调侃，如今正变成现实。\n近日，DeepSeek收紧了网页版和App免费用户的使用额度，超过7天不活跃的长对话无法继续使用，新对话单次输入的文字上限被压缩到4万字左右，连续使用约两小时，会触发“服务器繁忙，使用额度已达上限”提示。\n一直以来，互联网产品的核心战略诉求就是事无巨细地满足用户的需求，借此俘获更多流量。DeepSeek的限额策略，背离了上述趋势，昭示出AI产品面临截然不同的挑战。\n据《南方都市报》报道，2026年7月，在投资人闭门会上，DeepSeek创始人梁文锋曾表示，“我们没有在C端上花很多力气，甚至一度我们都不想维护那些用户了，但是用户赶都赶不走。”近期的限额策略，延续了DeepSeek面对免费用户的冷淡态度。\n当一家坐拥过亿月活的明星AI公司开始主动给C端用户限额，一个极具反差感的问题浮出水面——在AI逐渐普及的2026年，曾被奉为圭臬的海量C端免费用户，为何会成为大模型公司奔向AGI路上率先舍弃的包袱？\n规模效应失灵，免费用户越多亏得越惨\n移动互联网时代，社交、游戏、娱乐等产品的功能虽然有所区别，但底层战略导向高度趋同，均致力于通过免费策略俘获更多流量，实现赢家通吃。\n究其原因，移动互联网产品极易实现规模效应，用户量增多后，研发与运营成本可以被摊薄。并且更高的流量规模也可以反过来构筑数据飞轮与多边市场效应，建立更强的竞争壁垒。\n图源：腾讯\n沿袭移动互联网时代的经验，AI时代来临后，一众互联网巨头纷纷祭出大手笔营销策略，面向普通用户推广自家免费的AI产品。比如，2026年春节，腾讯元宝发放10亿元现金红包、阿里千问推出30亿元“春节请客计划”、百度文心上线5亿元春节红包活动。\n巨额补贴之下，诸多AI产品确实俘获海量用户，问题在于，互联网巨头并未借此博取亮眼的业绩，用户规模领先的豆包就是一例。\n图源：QuestMobile\nQuestMobile披露的数据显示，2026年6月，豆包月活3.82亿，同比增长172.1%，位列AI原生App第一。然而，《晚点LatePost》结合火山引擎公开API价格测算，2026年5月，豆包每天消耗的算力成本达数千万元，上半年，该产品平均单日收入不足百万元，主要来自电商佣金。\n互联网行业的规模效应之所以在AI时代失灵，主要是因为AI产品的推理成本随Token调用量线性甚至超线性增长。用户量越多、需求越大、上下文越长，企业背负的算力账单就越沉重。\n对此，2026年3月，360集团创始人周鸿祎表示，AI时代互联网产品的商业模式会迎来质变。“互联网流量是信息搬运，边际成本趋近于零，能做免费；但Token是智力产出，靠算力、芯片、电力支撑，用户越多、消耗越大、成本越高，边际成本递增，免费模式根本走不通。”\n由此来看，DeepSeek对免费用户限额有很强的必然性。与传统互联网公司不同，DeepSeek对掌握用户入口并无执念，其长期目标是实现AGI，自然需要压缩非核心投入。\nAI商业重心迁徙，押注生产力付费\n给免费用户限额后，DeepSeek并未彻底封死用户的对话框，而是发布了全家桶应用API。开发者在原有API中开启对应参数，并进行付费，即可获得深度思考搜索、文件输入等对话功能，甚至可以1:1复刻DeepSeek App。\n图源：DeepSeek\n此前，DeepSeek已推出模型付费API。无论是全家桶应用API，还是模型API，都遵循同一套逻辑：按调用量计费，用多少付多少。\n需要注意的是，虽然在收紧免费入口的同时，放开了付费通道，但DeepSeek并未“逼氪”C端用户。因为付费API面向的并非在对话框里闲聊的普通用户，而是愿意为调用量买单的开发者或企业客户。\n事实上，不只DeepSeek，今年以来，全球头部AI企业的重心正发生转移，从依靠免费策略吸引C端流量，转向深耕Agent与B端API，争夺生产力场景的高净值客户。\n典型如Anthropic，已凭借在编程与企业级市场的优势捷足先登，交出亮眼的业绩成绩单。\n招股书显示，2026年前三季度，Anthropic营收332.42亿美元，同比增长1206%。其中消费及按使用量计费收入263.06亿美元，占总营收的79.1%。\n截至2026年9月末，Anthropic过去12个月贡献收入达10万美元及以上的客户约1.19万家，一年前仅950余家。前三季度，这批客户贡献收入约245亿美元，占总营收约74%。\nOpenAI也在收紧补贴。10月末，OpenAI宣布ChatGPT与Codex额度互通、统一按Token计量。与此同时，因频频按下重置按钮而被称为“赛博义父”的Codex负责人“Tibo”已被调离岗位，Codex的额度重置频率随之骤降。\n在中国市场，字节跳动的“双面账本”更具反差感。前文提到，2026年上半年，豆包单日收入不足百万元。而据《晚点LatePost》披露，同期字节跳动旗下云服务平台火山引擎的MaaS业务收入达48亿元，毛利率超55%，远优于C端业务。\nAnthropic、OpenAI、字节跳动等企业布局AI业务虽然有不同的侧重，但都看到了一个趋势，在AI时代，真正可以覆盖算力成本的，并非用户规模，而是客户是否愿意为每一次调用付费。\n当免费对话与付费调用争夺同一批算力，企业自然需要把资源投向后者。\n算力约束下的取舍，先保付费与模型迭代\n与海外同行相比，中国AI企业不光需要解决商业化难题，受地缘政治博弈影响，还需面对高端算力供给紧张的挑战。\n图源：DeepSeek\n算力消耗更高的Agent逐渐普及，正显著放大这一缺口。以DeepSeek旗下的AI智能体平台DeepSeek Harness为例，官方数据显示，以使用官方API的用户为统计范围，平台日活从9月30日当周的日均27.1万增长至11月4日的154万，日消耗Token从约24万亿增长至约92万亿。\n随着API调用量激增，DeepSeek愈发难以保证服务稳定性。据不完全统计，2026年10月以来，DeepSeek已发生8起服务中断，涉及免费对话服务以及付费API。其中10月15日持续故障近五个小时。事后，DeepSeek针对API用户推出赠金补偿方案，并表示“坚决杜绝同类问题再次发生”。\n推理端算力捉襟见肘，训练端同样如此。梁文锋在前述闭门会上表示，今天AI最大的问题是算力。“很多时候，我们知道方向，也知道应该怎么训练。真正限制我们的，就是资源，尤其是算力资源。很多技术路线是因为资源才暂时放下。”\n作为创业公司，DeepSeek的算力储备不及腾讯、阿里巴巴、字节跳动等行业巨头，却要同时应对免费对话、付费API调用以及下一代模型训练三类需求。第一类是成本包袱，后两者分别对应当期收入与长期竞争力。\n目前没有明确的证据显示，DeepSeek是因为故障频发才限制C端用户的使用额度。但在算力总量有限的前提下，取舍昭然若揭，付费服务的稳定性要", "thumb": "https://static.woshipm.com/tag/1101_1@2x.png ", "images": ["https://static.woshipm.com/tag/1101_1@2x.png ", "https://image.woshipm.com/2024/07/24/41acd216-499e-11ef-a43d-00163e142b65.png", "https://image.woshipm.com/wp-files/2026/11/kaIPKYkNdkPAl2ja2cVY.png", "https://i , "thumb": "", "images": [], "tags": ["AI 编程"], "seen": false, "new": false, "daily": false}, {"guid": "bd3ab60eca7929571b00f9ad7753f58f", "title": "一条视频，复盘抖音和美团6年竞争", "link": "https://www.woshipm.com/share/6497091.html", "source": "人人都是产品经理", "category": "pm", "summary": "11月17日，抖音生活服务负责人换人，浦燕子转任顾问，莫少君接任。回看这六年，从6000亿目标到美特斯邦威7天卖出3200万团购券，抖音始终没能在到店业务上追上美团。 11月17日，抖音生活服务负责人再次调整，浦燕子转任公司顾问，原红果短剧负责人莫少君接任。 22 年～24年，抖音与美团在本地生活交锋，抖音不断调整组织架构，持续冲击美团到店业务。 23 年双方交锋最激烈的一年，对于抖音来说，双线目标，到家到店业务想从美团口中扯下一块肉。", "ts": "2026-11-20T02:49:23+00:00", "published": "11-20", "starred": true, "importance": 4, "topic": "竞争分析", "one_line": "", "why": "了解抖音和美团竞争的复盘分析", "inline_text": "抖音生活服务负责人调整，回顾六年竞争历程，抖音在到店业务上未追上美团", "full_text": "", "thumb": "", "images": [], "tags": ["产品经理"], "seen": false, "new": false, "daily": false}, {"guid": "57d440d7082ea24f7983b6642e6abaa6", "title": "从AI助手到AI管钱，金融Agent有几个关键信号！", "link": "https://www.woshipm.com/ai/6497089.html", "source": "人人都是产品经理", "category": "pm", "summary": "42%的金融科技公司自称准备好部署Agentic AI，真正上生产的只有11%。Airwallex在新加坡金融科技节发布白皮书，同时推出内置AI金融伙伴Kai的智能全球企业账户，把这道差距落到产品上。 最近，在新加坡金融科技节（Singapore FinTech Festival）上。 Airwallex空中云汇联合Kapronasia、新加坡金融科技协会（SFA），发布了一份白皮书 《AI发展的关键转折点：重塑金融科技》 《The A", "ts": "2026-11-20T02:48:55+00:00", "published": "11-20", "starred": false, "importance": 4, "topic": "AI 产品", "one_line": "金融 Agent 的发展关键信号", "why": "了解金融 Agent 的发展趋势和关键信号", "inline_text": "42% 金融科技公司准备部署 Agentic AI，Airwallex 推出内置 AI 金融伙伴 Kai", "full_text": "", "thumb": "", "images": [], "tags": ["AI 产品"], "seen": false, "new": false, "daily": false}, {"guid": "d5660d538450b697568a0433add6bd4c", "title": "AI的发展，有人喜有人忧", "link": "https://www.woshipm.com/ai/6497085.html", "source": "人人都是产品经理", "category": "pm", "summary": "一家代账公司上AI后，一人可代账从两三百家提到七百家；一个电商客服中心从十来个人减到两个。产能和利润确实都上去了，被减掉的岗位却没人接住，这道题靠单个企业解不了。 在今天一场AI闭门分享会上，讲了两个已经跑起来的AI应用案例。一个是代账公司，一个在电商平台的客服中心。 先说代账公司，当过去一人可代账两百到三百家，今年下半年上了AI后，提升到6~700家。 虽然代账的活比较简单，收票据，对银行流水，做凭证，出报表，按月报税，按月循环。小微", "ts": "2026-11-20T02:48:26+00:00", "published": "11-20", "starred": false, "importance": 3, "topic": "AI 影响", "one_line": "AI 发展带来的喜与忧", "why": "", "inline_text": "AI 提高产能和利润，但减少岗位，单个企业难以解决", "full_text": "", "thumb": "", "images": [], "tags": ["AI 产品"], "seen": false, "new": false, "daily": false}, {"guid": "62cfc066bec308d5b97b8c1d6fab4956", "title": "浮屏：截图即可「上岛」，还能帮你记录生活", "link": "https://sspai.com/post/118879", "source": "少数派", "category": "vibe", "summary": "浮屏是我一个人开发的应用。它最初只是为了解决一杯柠檬水的取餐码问题，后来慢慢长成了一个记录生活小片段的工具。 查看全文", "ts": "2026-11-20T02:47:52+00:00", "published": "11-20", "starred": false, "importance": 3, "topic": "vibe coding", "one_line": "浮屏应用开发过程分享", "why": "", "inline_text": "个人开发记录生活小片段的工具，解决取餐码问题", "full_text": "Matrix 首页推荐\nMatrix 是少数派的写作社区，我们主张分享真实的产品体验，有实用价值的经验与思考。我们会不定期挑选 Matrix 最优质的文章，展示来自用户的最真实的体验和观点。\n文章代表作者个人观点，少数派仅对标题和排版略作修改。\n浮屏（Floato）是一款 iOS 应用，它用 AI 分析你的截图，再把截图整理成对应场景的精美卡片，显示在锁屏、灵动岛和桌面小组件上。取餐码、取件码、电影票、火车票、登机牌、团购兑换券、App 订阅……这些平时散落在各个小程序和 app 里的信息，截一张图，就能在需要的时候出现在手边。\n为什么要做浮屏\n今年夏天我经常夜跑。跑完给自己买一杯蜜雪冰城的柠檬水，算是一个小小的奖励。但买这杯柠檬水的过程并不轻松：先在小程序里找到门店下单，等餐的时候又要一遍遍切回小程序看取餐码。人在路上、手里拿着手机，这种反复切换很烦人。\n作为一个 iOS 用户，我很自然地想到，这正是灵动岛和实时活动（Live Activities）最擅长的场景：一个需要持续关注、但不值得一直打开 app 的临时信息。于是我开始了浮屏的探索。\n在做浮屏之前我也试过不少办法。最常见的是用快捷指令把取件码存进提醒事项，或者干脆截图之后在相册里翻。一些 app 也开始逐步支持自己的实时活动，但每家只管自己那一种订单，这些方案各自都能用，问题在于它们是分散的：取件码一套流程，电影票一套流程，火车票又是另一套。\n我想要的是一个统一的入口：不管截图来自哪个小程序、哪个 app，都用同一个动作交给浮屏，剩下的识别、分类和排版都由它完成。\n识别：截一张图就够了\n浮屏不需要你手动填写任何表单。你只需要把截图交给它，AI 会识别出场景类型和关键信息，比如取件码、座位号、车次、检票口、有效期等，并生成一张对应风格的卡片。\n导入截图有三种方式：\n在浮屏里直接选择截图；\n在任意 app 的分享菜单中选择浮屏；\n通过快捷指令自动处理，适合想把流程做得更「无感」的用户。\napp 内识别（录屏中的交互提审中，和正式版可能有些不同）\n在 AI 识别上我也碰过壁。一开始我选用的模型不稳定，它的识别时间存在很大的不确定性，快的时候只需要六七秒，慢的时候需要 30 秒甚至更久，导致超时。中途我尝试过很多的解决办法：\n优化提示词，提升缓存的命中率\n做更多的路由拆分，而不是把所有的场景都放在一个大的 prompt 下面\n尝试集成流式解析的方式，让用户在查看时不会只能看到一个 loading，而是可以渐进式地一点一点看到卡片的解析过程\n决策模型，先让小而快的决策模型来判断应该走哪个分类\n好在最终在识别速度和识别正确率中找到了一个不错的平衡。就我自己的使用体验来说，大部分场景的识别准确度都很高。\n更多场景\n取餐码只是一个起点。有了识别能力之后，增加新的类型其实并不难，真正花时间的是想清楚这类卡片最该突出哪些信息，以及它在锁屏上应该长成什么样子。\n浮屏现在也支持取件码、团购券、App 订阅、火车票、飞机票和电影票。下面是一些实际使用里的截图。\n订阅和前面这些一次性的凭证不太一样。它会按月或按年回来。把扣款记录交给浮屏，它会按周期记下金额，再推算出每项服务一共付了多少，整理成一张清单。\n一个简单的订阅管理\n两个核心页面\n浮屏的结构很简单，前台主要是两个页面。第一个是卡片列表，所有识别好的卡片都会收在这里，正在使用的卡片可以显示在锁屏和灵动岛上，用完之后标记为「完成」即可。\n第二个是「回顾」页面。它以日历的形式展示你过去完成的卡片：哪天喝了什么、看了哪部电影、坐了哪趟车去了哪里。原本用完即弃的截图，在这里变成了一份自动生成的生活记录。这也是我自己最常打开的页面。\n回顾页并不是一开始就计划好的。用了一段时间以后，我发现标记为「完成」的卡片其实很有意思：翻一翻就能看到自己哪天看了什么电影、喝了什么、去了哪里。这些截图原本会被删掉或者淹没在相册里，但整理成卡片以后，它们自然就成了一份不需要刻意去写的生活记录。\n刚好我最近在出差，不能在家做饭，通过这种方式我可以记录我每餐吃了什么、点了什么，最终回味起来也还挺不错的。这也让我意识到，光是这周就吃了 3 次麦当劳。\n后来我发现，身边不少朋友其实有一个更朴素的需求：收藏。有人会把每一张电影票根夹进本子，有人会留着每一趟车票、每一次看展的门票，还有人喜欢记下自己喝过的每一杯奶茶。只是现在大部分票都变成了电子的，想留也无从留起，最后都散落在相册和各个 app 的订单页里。\n浮屏刚好适合做这件事。每一张标记为「完成」的卡片都会留在回顾页里，取件码、火车票、电影票、团购券都在同一本日历上，品牌、时间和地点也都整理好了。用的场景越多，这份收藏就越完整。我自己现在会特意把看过的电影和去过的展都丢进浮屏，就算当时不需要提醒，也想让它们在回顾页里留一页。\n关于隐私与价格\n浮屏依赖 AI 识别截图，所以你的截图会被上传给模型服务商处理。如果你对隐私非常在意，浮屏可能不是最适合你的工具。同样，因为 AI 还是存在延迟，如果你对速度要求很高，目前的 app 的体验也还需要优化。\n浮屏尽力保证图片解析可以在 10 秒内完成。换个角度看，不依赖离线模型也有好处：识别效果可以随时优化，不必等 app 发布新版本。\n浮屏目前已在美区等 App Store 上架，国区正在备案中，预计一周内过审。所有新用户都会获得免费的十个识别点数。而会员可以获得合理范围内不受限制的识别，价格为：\n月度会员 1.99 美元（合人民币约 14 元）；\n季度会员 3.99 美元（合人民币约 27 元）；\n年度会员 7.99 美元（合人民币约 54 元）。\n写在最后\n浮屏是我一个人开发的应用。它最初只是为了解决一杯柠檬水的取餐码问题，后来慢慢长成了一个记录生活小片段的工具。\n如果你也常常在小程序之间来回切换找取件码，或者希望给日常留下一点痕迹，欢迎试试浮屏，也欢迎在评论区告诉我你希望它还能识别什么场景。最后感谢你读到这里，我为少数派读者准备了两个兑换码，有效期至 2026 年 11 月 30 日。\n兑换码\nSSPAI\n：免费体验一个月会员；\n兑换码\nSSPAIYEAR\n：首年以 5.99 美元（约合人民币 40 元）开通年度会员，次年起按原价续费。\n兑换方式：在 app 的购买页面输入兑换码，或直接打开兑换链接（\nSSPAI\n、\nSSPAIYEAR\n）。兑换码仅限新用户和已过期的订阅用户使用，且需要使用非中国大陆地区的 Apple ID。\n> 关注\n少数派小红书\n，感受精彩数字生活 🍃\n> 实用、好用的\n正版软件\n，少数派为你呈现 🚀", "thumb": "https://cdnfile.sspai.com/2026/11/19/c3ab76874f5615e04b1ab77d291ce66c.png?imageMogr2/auto-orient/thumbnail/!1374x/gravity/center/crop/1374x/format/webp/ignore-error/1", "images": ["https://cdnfile.sspai.com/2026/11/19/c3ab76874f5615e04b1ab77d291ce66c.png?imageMogr2/auto-orient/thumbnail/!1374x/gravity/center/crop/1374x/format/webp/ignore-error/1", "https://cdnfile.sspai.com/2026/11/10/e91ebdd92dae346537a06005d552c825.jpg?imageView2/2/w/1120/q/90/interlace/1/ignore-error/1/format/web /* 刷新相关 */
const REPO = 'litosukalami-ux/pm-radar';
const CURRENT_UPDATED = '2026-11-24 16:32';
const refreshBtn = document.getElementById('refreshBtn');
let checkTimer = null, checking = false;

refreshBtn.addEventListener('click', () => {
  if (checking) { stopCheck(); return; }
  // 打开 GitHub Actions 页面让用户点绿色 Run workflow 按钮
  const url = `https://github.com/${REPO}/actions/workflows/daily.yml`;
  window.open(url, '_blank', 'noopener');
  startCheck();
});

function startCheck() {
  checking = true;
  refreshBtn.classList.add('busy');
  refreshBtn.querySelectorAll('span')[1].textContent = '检查中…';
  checkOnce();
  checkTimer = setInterval(checkOnce, 20000);  // 20s 一次
}
function stopCheck() {
  checking = false; clearInterval(checkTimer); checkTimer = null;
  refreshBtn.classList.remove('busy');
  refreshBtn.querySelectorAll('span')[1].textContent = '手动刷新';
}
async function checkOnce() {
  try {
    const resp = await fetch(window.location.pathname + '?t=' + Date.now(),
      { cache: 'no-store' });
    if (!resp.ok) return;
    const text = await resp.text();
    const m = text.match(/更新于\s*(\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2})/);
    if (m && m[1] !== CURRENT_UPDATED) {
      stopCheck();
      refreshBtn.classList.add('done', 'pulse');
      refreshBtn.querySelectorAll('span')[1].textContent = '有新数据 · 点此刷新';
      refreshBtn.onclick = () => window.location.reload();
    }
  } catch (e) {}
}

/* 页面打开时，每 60s 自动检查一次，不打扰用户 */
setInterval(() => { if (!checking) checkOnce(); }, 60000);

const FAV_KEY = 'radar.favs.v2';
const READ_KEY = 'radar.read.v2';

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
function load(key, def) {
  try { return JSON.parse(localStorage.getItem(key)) || def; } catch (e) { return def; }
}
function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
}

let favs = load(FAV_KEY, []);      // [{title,link,...}]
let reads = load(READ_KEY, []);    // [link]
const favSet = new Set(favs.map(f => f.link));
const readSet = new Set(reads);

function snapshot(it) {
  return { title: it.title, link: it.link, source: it.source, category: it.category,
           published: it.published, one_line: it.one_line, why: it.why,
           topic: it.topic, tags: it.tags, importance: it.importance };
}

/* 收藏过的标签 = 兴趣信号，用来给新条目标注「为你」 */
function interest() {
  const count = {};
  favs.forEach(f => {
    (f.tags || []).concat(f.topic ? [f.topic] : []).forEach(t => {
      count[t] = (count[t] || 0) + 1;
    });
  });
  return count;
}
let INTEREST = interest();
function matched(it) {
  return (it.tags || []).concat(it.topic ? [it.topic] : [])
    .some(t => (INTEREST[t] || 0) > 0);
}

function starBar(n) {
  n = n || 0;
  if (!n) return '';
  return '★'.repeat(n) + '☆'.repeat(5 - n);
}

    }
    let fullText = '';
    if (it.full_text) {
      fullText = `<div class="body-text">${esc(it.full_text)}</div>`;
    }
    let imgs = '';
    if (it.images && it.images.length) {
      imgs = `<div class="imgs">${it.images.slice(0, 6).map(u =>
        `<img src="${esc(u)}" alt="" loading="lazy" onerror="this.style.display='none'">`).join('')}</div>`;
    }
    let expandBtn = it.full_text
      ? `<button class="expand-btn" type="button"><span>展开全文</span> ↓</button>` : '';

    bodyHTML = `
      ${thumb}
      ${bullets}
      ${expandBtn}
      <div class="full-body">
        ${fullText}
        ${imgs}
        <div style="margin-top:14px">
          <a href="${esc(it.link)}" target="_blank" rel="noopener"
             style="color:var(--muted);font-size:12.5px">查看原文 →</a>
        </div>
      </div>`;
  }

  return `<article class="${cls.join(' ')}" data-link="${esc(it.link)}">
    <div class="row">
      <span class="chip" style="color:${meta[1]};background:${meta[2]}">${esc(meta[0])}</span>
      <span>${esc(it.source)}</span>
      <span>${esc(it.published)}</span>
      ${it.new ? '<span class="new">新</span>' : ''}
      ${matched(it) && !it.daily ? '<span class="for-you">为你</span>' : ''}
      <span class="stars">${starBar(it.importance)}</span>
    </div>
    <h3><a href="${esc(it.link)}" target="_blank" rel="noopener" data-link="${esc(it.link)}">${esc(it.title)}</a></h3>
    ${it.one_line ? `<p class="line">${esc(it.one_line)}</p>` : ''}
    ${it.why ? `<p class="why">${esc(it.why)}</p>` : ''}
    ${!it.one_line && it.summary ? `<p class="raw">${esc(it.summary)}</p>` : ''}
    ${bodyHTML}
    ${(it.tags && it.tags.length) ? `<div class="tags">${it.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
    <button class="fav ${hasFav ? 'on' : ''}" data-link="${esc(it.link)}">${hasFav ? '已收藏' : '收藏'}</button>
  </article>`;
}

function renderContests() {
  const box = document.getElementById('contests');
  if (!CONTESTS.length) { box.innerHTML = '<div class="empty">暂无</div>'; return; }
  box.innerHTML = CONTESTS.map(c => {
    const label = c.expected_start ? '预计 ' + c.expected_start : '待公布';
    return `<div class="contest">
      <div class="top"><div class="name">${esc(c.name)}</div><span class="badge">${esc(label)}</span></div>
      <div class="org">${esc(c.org || '')}</div>
      <div class="note">${esc(c.note || '')}</div>
    </div>`;
  }).join('');
}

let cur = 'daily';
let kw = '';
let sortBy = 'importance';

function currentList() {
  if (cur === 'fav') {
    return favs.slice().reverse().map(f => ({ ...f, daily: false }));
  }
  if (cur === 'daily') return ITEMS.filter(i => i.daily);
  if (cur === 'all') return ITEMS.slice();
  return ITEMS.filter(i => i.category === cur);
}

function render() {
  const list = document.getElementById('list');
  let items = currentList();

  if (kw) {
    items = items.filter(it =>
      (it.title + ' ' + (it.summary || '') + ' ' + (it.one_line || '') + ' ' +
       (it.topic || '') + ' ' + (it.tags || []).join(' ') + ' ' + it.source)
        .toLowerCase().includes(kw));
  }

  if (sortBy === 'time') {
    items.sort((a, b) => (b.ts || b.published || '').localeCompare(a.ts || a.published || ''));
  } else if (cur !== 'daily') {
    items.sort((a, b) => (b.importance || 0) - (a.importance || 0) ||
      (b.ts || '').localeCompare(a.ts || ''));
  }

  if (!items.length) {
    list.innerHTML = `<div class="empty">${cur === 'fav' ? '还没收藏。看到有用的点右下角「收藏」，以后会优先推给你。' : '没有匹配的条目'}</div>`;
    return;
  }

  list.innerHTML = items.map((it, i) =>
    cardHTML(it, cur === 'daily' && i < 3)).join('');
}

function renderTabs() {
  const tabs = document.getElementById('tabs');
  const defs = [['daily', '今日必看'], ['all', '全部']]
    .concat(ORDER.map(k => [k, (CATS[k] || [k])[0]]))
    .concat([['fav', '我的收藏']]);
  tabs.innerHTML = defs.map(([k, n]) =>
    `<button class="tab ${k === cur ? 'on' : ''}" data-k="${k}">${n}</button>`).join('');
  tabs.querySelectorAll('.tab').forEach(b => {
    b.onclick = () => { cur = b.dataset.k; renderTabs(); render(); };
  });
}

document.getElementById('q').addEventListener('input', e => {
  kw = e.target.value.trim().toLowerCase();
  render();
});

document.getElementById('sort').addEventListener('click', e => {
  sortBy = sortBy === 'importance' ? 'time' : 'importance';
  e.target.textContent = sortBy === 'importance' ? '按重要度' : '按时间';
  render();
});

document.getElementById('list').addEventListener('click', e => {
  const expand = e.target.closest('.expand-btn');
  if (expand) {
    const card = expand.closest('.card');
    card.classList.toggle('body-open');
    // 展开即算已读
    const link = card.dataset.link;
    if (link && !readSet.has(link)) {
      readSet.add(link); reads.push(link);
      save(READ_KEY, reads);
      card.classList.add('read');
    }
    return;
  }
  const fav = e.target.closest('.fav');
  if (fav) {
    const link = fav.dataset.link;
    const hit = ITEMS.find(i => i.link === link) || favs.find(f => f.link === link);
    if (favSet.has(link)) {
      favSet.delete(link);
      favs = favs.filter(f => f.link !== link);
    } else if (hit) {
      favSet.add(link);
      favs.push(snapshot(hit));
    }
    save(FAV_KEY, favs);
    INTEREST = interest();
    renderTabs(); render();
    return;
  }
  const a = e.target.closest('h3 a');
  if (a) {
    const link = a.dataset.link;
    if (!readSet.has(link)) {
      readSet.add(link);
      reads.push(link);
      save(READ_KEY, reads);
      const el = a.closest('.card');
      if (el) el.classList.add('read');
    }
  }
});

renderContests();
renderTabs();
render();
</script>
</body>
</html>
