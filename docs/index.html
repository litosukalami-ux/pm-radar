<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>产品雷达 · PM Radar</title>
<style>
  :root {
    --bg: #FAF8F5;
    --card: #FFFFFF;
    --ink: #1F2328;
    --body: #4B5563;
    --muted: #8A8580;
    --line: #E8E3DA;
    --accent: #B45309;
    --accent-soft: #FDF3E7;
    --radius: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB",
                 -apple-system, BlinkMacSystemFont, sans-serif;
    line-height: 1.78;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px; }

  /* ---------- 头部 ---------- */
  header { padding: 46px 0 10px; }
  .head-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
  .head-row .h { flex: 1; min-width: 0; }
  h1 { font-size: 32px; margin: 0 0 12px; letter-spacing: -0.6px; font-weight: 700; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 13.5px; margin: 0; line-height: 1.9; }
  .sub b { color: var(--ink); font-weight: 600; }
  .sub .dot { margin: 0 6px; color: #D5CEC3; }

  .refresh { display: inline-flex; align-items: center; gap: 6px;
             border: 1px solid var(--line); background: var(--card);
             color: var(--ink); border-radius: 999px; padding: 7px 14px;
             font-size: 13px; font-family: inherit; cursor: pointer;
             white-space: nowrap; transition: all .15s; text-decoration: none; }
  .refresh:hover { border-color: var(--accent); color: var(--accent); }
  .refresh:active { transform: scale(.97); }
  .refresh .spin { display: inline-block; animation: none; }
  .refresh.busy .spin { animation: spin 1s linear infinite; }
  .refresh.done { border-color: #16A34A; color: #16A34A; }
  .refresh.pulse { position: relative; animation: pulse 2s infinite; }
  .refresh.pulse::after { content: ''; position: absolute; right: -2px; top: -2px;
                          width: 10px; height: 10px; border-radius: 50%;
                          background: #16A34A; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(22,163,74,.4); }
                     50%    { box-shadow: 0 0 0 8px rgba(22,163,74,0); } }

  h2 {
    font-size: 16px; margin: 40px 0 14px; font-weight: 600;
    display: flex; align-items: center; gap: 9px;
  }
  h2::before { content: ""; width: 4px; height: 17px; border-radius: 2px; background: var(--accent); }
  h2 em { font-style: normal; font-weight: 400; font-size: 13px; color: var(--muted); }

  /* ---------- 比赛 ---------- */
  .contests { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .contest { background: var(--card); border: 1px solid var(--line);
             border-radius: var(--radius); padding: 16px 18px; }
  .contest .top { display: flex; justify-content: space-between; align-items: baseline;
                  gap: 10px; margin-bottom: 6px; }
  .contest .name { font-weight: 600; font-size: 14.5px; line-height: 1.55; }
  .contest .org { color: var(--muted); font-size: 12.5px; margin-bottom: 8px; }
  .contest .note { font-size: 13px; color: var(--body); line-height: 1.7; }
  .badge { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
           white-space: nowrap; background: #DBEAFE; color: #1E40AF; }

  /* ---------- 工具条 ---------- */
  .toolbar { position: sticky; top: 0; z-index: 9; background: var(--bg);
             padding: 14px 0 12px; margin: 30px 0 4px; border-bottom: 1px solid var(--line); }
  .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px;
          scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: 0 0 auto; border: 1px solid var(--line); background: var(--card);
         color: var(--body); font-size: 13.5px; padding: 6px 15px; border-radius: 999px;
         cursor: pointer; font-family: inherit; transition: all .15s; white-space: nowrap; }
  .tab.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .search { display: flex; gap: 8px; align-items: center; }
  #q { flex: 1; border: 1px solid var(--line); background: var(--card); border-radius: 999px;
       padding: 9px 16px; font-size: 14px; font-family: inherit; outline: none; color: var(--ink);
       min-width: 0; }
  #q:focus { border-color: #C9C2B6; }
  .sort { border: 1px solid var(--line); background: var(--card); color: var(--body);
          border-radius: 999px; padding: 8px 14px; font-size: 13px; font-family: inherit;
          cursor: pointer; white-space: nowrap; }

  /* ---------- 卡片 ---------- */
  .card { position: relative; background: var(--card); border: 1px solid var(--line);
          border-radius: var(--radius); padding: 18px 20px; margin-bottom: 12px;
          transition: border-color .15s, opacity .2s; }
  .card:hover { border-color: #D6CFC2; }
  .card.pick { border-left: 3px solid var(--accent); }
  .card.lead { padding: 22px 22px 20px; }
  .card.lead h3 { font-size: 19px; }
  .card.read { opacity: .62; }

  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
         font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
  .chip { font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; }
  .new { font-size: 11px; font-weight: 700; color: #B91C1C; background: #FEE2E2;
         padding: 1px 7px; border-radius: 999px; }
  .for-you { font-size: 11px; font-weight: 700; color: #6D28D9; background: #EDE9FE;
             padding: 1px 7px; border-radius: 999px; }
  .stars { margin-left: auto; color: var(--accent); font-size: 12px; letter-spacing: 1px; }

  .card h3 { margin: 0 0 8px; font-size: 16.5px; line-height: 1.6; font-weight: 600; }
  .card h3 a { color: var(--ink); text-decoration: none; }
  .card h3 a:hover { color: var(--accent); }
  .line { margin: 0 0 6px; font-size: 14.5px; color: var(--body); line-height: 1.75; }
  .why { margin: 0; font-size: 13px; color: var(--accent); background: var(--accent-soft);
         border-radius: 9px; padding: 7px 11px; display: inline-block; }
  .raw { margin: 8px 0 0; font-size: 13px; color: var(--muted); line-height: 1.7; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tag { font-size: 11.5px; color: #6B7280; background: #F3F4F6; border-radius: 999px;
         padding: 2px 9px; }

  /* ---------- 站内阅读 ---------- */
  .thumb { width: 100%; max-height: 180px; object-fit: cover; border-radius: 10px;
           margin-bottom: 10px; display: block; background: #F3F4F6; }
  .inline-bullets { margin: 8px 0 2px; padding: 0; list-style: none; }
  .inline-bullets li { font-size: 13.5px; color: #4B5563; padding: 3px 0 3px 14px;
                       position: relative; line-height: 1.7; }
  .inline-bullets li::before { content: "•"; position: absolute; left: 0; color: var(--accent);
                               font-weight: 700; }
  .full-body { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); }
  .card.body-open .full-body { display: block; }
  .card.body-open .expand-btn span { content: '收起全文'; }
  .full-body .body-text { font-size: 14px; color: #374151; line-height: 1.85;
                          white-space: pre-wrap; word-break: break-word; }
  .imgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
          gap: 8px; margin-top: 12px; }
  .imgs img { width: 100%; height: 110px; object-fit: cover; border-radius: 8px;
              background: #F3F4F6; }

  .expand-btn { display: inline-flex; align-items: center; gap: 4px;
                background: transparent; border: 1px solid var(--line);
                color: var(--accent); border-radius: 999px; padding: 5px 14px;
                font-size: 12.5px; font-family: inherit; cursor: pointer;
                margin-top: 10px; }
  .expand-btn:hover { background: var(--accent-soft); }

  .fav { position: absolute; right: 14px; bottom: 14px; border: 1px solid var(--line);
         background: transparent; color: var(--muted); font-size: 12.5px; font-family: inherit;
         border-radius: 999px; padding: 4px 12px; cursor: pointer; transition: all .15s; }
  .fav:hover { border-color: #C9C2B6; }
  .fav.on { color: var(--accent); border-color: #E7C89E; background: var(--accent-soft); }

  .empty { text-align: center; color: var(--muted); padding: 54px 0; font-size: 14px; }
  footer { padding: 46px 0 64px; color: #9CA3AF; font-size: 12.5px;
           border-top: 1px solid var(--line); margin-top: 36px; line-height: 1.9; }

  @media (max-width: 560px) {
    .wrap { padding: 0 16px; }
    header { padding-top: 34px; }
    h1 { font-size: 27px; }
    .card { padding: 16px 17px; padding-bottom: 46px; }
    .card.lead { padding: 20px 18px; padding-bottom: 48px; }
    .card.lead h3 { font-size: 17.5px; }
    .stars { margin-left: 0; }
  }
</style>
</head>

<div class="wrap">
  <header>
    <div class="head-row">
      <div class="h">

        <p class="sub">

pic": "产品经理", "one_line": "", "why": "", "inline_text": "", "full_text": "", "thumb": "", "images": [], "tags": [], "seen": false, "new": true, "daily": false}, {"guid": "18189d91f203171b75a815e9e12dc5ba", "title": "【第三期结营作业】欢迎体验我的小游戏：Z 的小家——一栋能玩的房子", "link": "https://forum.trae.cn/t/topic/606029", "source": "TRAE 官方社区", "category": "contest", "summary": "如果「家」本身就是一个游戏呢？ 小游戏介绍 《Z 的小家》是一栋装在浏览器里的三层小家：门厅是一栋可以拖动旋转、掀开屋顶的 3D 剖面小楼，点哪间房就进哪间。屋里有 11 个空间、14 款小游戏 ——客厅的电视游戏机藏着 5 个频道（贪吃蛇、2048、打砖块、打地鼠、砍怪），另外还有节奏地毯、胡闹厨房、捕萤、星图、活字排版、翻箱倒柜；右厢音乐塔的钢琴房、舞蹈房、歌唱房里，分别是琴键回响、追光舞步、气泡和声。 屋子本身也会长大：玩小游戏赚", "ts": "2026-11-27T06:22:53+00:00", "published": "11-27", "starred": false, "importance": 2, "topic": "比赛与获奖", "one_line": "", "why": "", "inline_text": "", "full_text": "", "thumb": "", "images": [], "tags": [], "seen": false, "new": true, "daily": false}, {"guid": "f96e0eab3dc9602c338ac6f3a43cdbb7", "title": "CentOS 目录穿梭", "link": "https://juejin.cn/post/7712450008260755491", "source": "掘金", "category": "tech", "summary": "一、4个核心特殊符号（必背） 符号 含义 / 根目录，整个文件系统最顶层，所有目录都挂在它下面 . 当前目录（cd . 无效果，一般在cp/ln里用） .. 上一级（父目录） ~ 当前登录.....", "ts": "2026-11-27T06:21:19+00:00", "published": "11-27", "starred": false, "importance": 2, "topic": "技术动态", "one_line": "", "why": "", "inline_text": "", "full_text": "", "thumb": "", "images": [], "tags": [], "seen": false, "new": true, "daily": false}, {"guid": "cd4156b5f358ab2bb50dd6a0f8007106", "title": "夯替Opus 5.5还便宜50%!RunningHub上线Motion，几块钱就能做高级动效大片!", "link": "https://www.woshipm.com/ai/6501481.html", "source": "人人都是产品经理", "category": "pm", "summary": "三张静态设计稿加一份季度数据表，全交给RunningHub里的Motion。它先聊需求、出分镜，点头之后才做片，进阶模式选小蓝人模型比Opus 5.5便宜一半，几块钱出一条。作者用它跑通了评审片、汇报片和MV。 周四下午我手上压了俩活。一件是下周一的版本评审，「栖木日程」新做的“一句话建日程功能”要上会，大家想看这套交互动起来是什么样，可我手里只有三张静态设计稿。另一件是季度复盘，三个月的数据表已经整理好，要做成一段能在会上直接放的汇报", "ts": "2026-11-27T06:19:28+00:00", "published": "11-27", "starred": true, "importance": 3, "topic": "产品经理", "one_line": "", "why": "", "inline_text": "", "full_text": "三张静态设计稿加一份季度数据表，全交给RunningHub里的Motion。它先聊需求、出分镜，点头之后才做片，进阶模式选小蓝人模型比Opus 5.5便宜一半，几块钱出一条。作者用它跑通了评审片、汇报片和MV。\n周四下午我手上压了俩活。一件是下周一的版本评审，「栖木日程」新做的“一句话建日程功能”要上会，大家想看这套交互动起来是什么样，可我手里只有三张静态设计稿。另一件是季度复盘，三个月的数据表已经整理好，要做成一段能在会上直接放的汇报视频。\n最近我看到用Opus5.5做视频效果挺不错的，但是那个接近2000块的VIP太贵了有点遭不住，搜索过程中发现了一个叫Motion的产品，据说比opus5.5便宜而且效果也很好。\n这两件事放在以前，从脚本到字幕，每一环都得自己来，改一个数字还得回头重新导一遍。这次我把设计稿和数据表都交给了Motion。它先跟我聊需求、出分镜，我点头之后才开始做片，做完还能接着改。\n先出分镜，再做片\nMotion是RunningHub里的一个AI视频创作Agent。官网、文档、商品图、数据表都可以交给它，说清楚想给谁看、重点讲什么，它会先和你沟通需求、确认分镜，你同意了再做成片。做完以后，对话、参数、时间线都能继续改，满意的项目还能存成自己的模板，下次接着用。整个过程不需要会剪辑。\n做评审视频和汇报视频，我最怕的是“看着像那么回事”。普通的AI生视频是你说一句，它随机出一段，字和数字经常是错的。评审片里按钮文案不对，汇报片里数字对不上，这条视频就不能拿到会上放。Motion的做法是先出分镜让我确认，再进入制作，资料和成片能对得上。\n另一个让我愿意多试几次的原因是成本。在进阶模式里选小蓝人模型，比用Opus 5.5便宜50%，几块钱到十几块钱就能出一条视频。\n从RunningHub首页找到Motion\n我是从RunningHub主站首页进去的。首页的banner、RHTV画布和Runow都能找到Motion的入口。\n进去之后是创作页。中间的大输入框写着“一句话或一个网址就行”，下面一排依次是加号、@、“智能匹配”、“自动画幅·30秒·自动”、“高级设置”和“进阶模式”，最右边是“开始创作”。我做这几支片之前，都先点开“进阶模式”，选了小蓝人模型。\n三张静态设计稿，做成交互动效片\n第一个任务最贴近日常：版本评审前，把静态设计稿做成一支交互动效演示片。我想看的是三件事：Motion能不能按我说的交互顺序排出分镜；分镜能不能先改再做；做出来之后，局部修改要不要整支重来。\n提示词用这三张「栖木日程」的设计稿，做一支30秒的新功能交互演示视频，给下周一版本评审的产品、研发和设计同事看。重点讲“一句话建日程”：用户在首页点开输入框，说一句“周五下午三点和设计组过稿，提前十分钟提醒”，系统识别出时间、参与人和提醒，生成一张日程卡片，再落到周视图里。按“点击、展开、识别、生成、落位”的顺序做界面动效，节奏干净利落，配简短的旁白和字幕，不要加设计稿里没有的界面元素。\n在左侧栏点了“新建项目”，选“创作视频”。把三张设计稿按首页、输入面板、识别结果的顺序传了上去。接着把上面那段提示词整段粘进输入框，然后点“开始创作”。\n开始创作视频后，会按照沟通提案、确认分镜、制作视频的流程逐步完成工作\nMotion先跟我沟通需求，我在对话里补充说，这支片是给评审会看的，重点是识别那一下，旁白偏说明，不用营销腔。\n我逐个镜头看了一遍，重点看识别那一镜。我在对话里提了一个修改：“第三个镜头里，时间、参与人、提醒三个字段不要一起出现，按顺序依次高亮，每个停留半秒。”等分镜按这个意思更新好，我再确认，项目这才进入制作。\n首次制作完成后，我得到了一个竖版9:16的视频，整体的内容已经很完整了但我同时又想看一下横版呈现的效果会不会更好。这时候只需要在参数里面调整一下，就能重新得到一个横版的视频。\n得到的横版视频：\n这一支让我最直观感受到的，是“改一处不用整支重来”。以前评审片里换个按钮文案，要回到动效工程重新导出；在Motion里，标题、数字、颜色、图表数据都是参数，改完直接更新预览。\n参数之外的修改靠对话推进，再细的地方交给控制台，像素级修改、图片图层修改和剪映式的剪辑能力都在里面，可以像在剪映里一样精细地改。策划、分镜、画面、配音、字幕、精修都在同一个项目里，不用在几个软件之间来回切，也就不会改了一处、漏了另一处。\n季度数据表，做成汇报视频\n第二个任务来自产品经理最常遇到的场景：季度复盘。AI生成的数字看着像那么回事，其实对不上，这样的视频根本不敢放进汇报里。我想验证的是，图表能不能跟着数据长出来，片子里的数字能不能和表格完全一致。\n我准备了一份「栖木日程」2026年第三季度的数据表。\n点击图片可查看完整电子表格\n提示词用这份「栖木日程」2026年第三季度数据表，做一支30秒的季度复盘汇报视频，给部门周会看。重点讲三件事：7月到9月月活的增长，“一句话建日程”上线后使用率的变化，以及次月留存的提升。图表要跟着数据一点点长出来，画面里出现的每个数字都必须和表格一致，结尾用一页总结三条结论。商务科技风，配旁白和字幕。\n这次我还是从“新建项目”进去，选“创作视频”，点输入框左下角的加号，把这份数据表传了上去，再把提示词粘进输入框，“进阶模式”同样选小蓝人模型，点了“开始创作”。\nMotion同样先跟我沟通需求，我补充说这是部门周会用的，三条结论要讲得直接，然后它出了分镜。我觉得留存那条更重要，就在对话里说：“把次月留存放到第二个讲，使用率放到最后，和结论页的顺序保持一致。”分镜更新后我确认，项目进入制作。\n生成的视频\n导出之后，我拿成片和表格逐个对数字：三个月的月活、使用率、留存，每一个都要对上\n数字对得上，是这类视频能不能用的分水岭。Motion结合了Opus 5.5的代码视频能力，数字和图表数据都是参数，所以图表是跟着数据长出来的，改了数据，画面也跟着改。\n对产品经理来说，这省下的不只是做片的时间，还有汇报前逐帧核对数字的那份紧张。\n一句话直出知识科普视频\n如果说前两个案例都是用复杂严谨的提示词制作的，那第三个案例我想测试一下，只用一句话去描述需求，能得到质量什么水平的视频。\n这里我只说了一句话：帮我生成一个详细介绍马斯洛需求金字塔的视频\nMotion接到需求后，就开始干活了，从生成旁白到生成页面，再到加动效渲染成视频，全程自动化操作，最终交付给我的视频是这样的：\n每一帧的画面都非常清晰，对知识内容的表达准确无误，旁白和画面匹配的也非常整齐。整个90秒的视频，一次直出，没有出现任何错误。\n如果说前两个案例，我们已经能看到Motion生成视频的能力。那这个案例更多看到的是对需求的准确理解，以及在开放性命题中完成任务的质量。\n制作MV，直接发抖音\n测试这个产品的过程中，我真是越用越爱玩，脑洞也越来越多，之前我用AI生成了一首歌，自己还蛮喜欢的，这次正好用Motion做个MV试试。\nMV视频：\n这个MV我选择的是竖版的比例，因为在最开始的需求描述中，我就说了是用来发抖音的，这么看来，对于一些短视频创作者来说Motion能应用的场景也非常多，以前这样一支MV，少说也要几个小时才能做完，现在不到5分钟就完成了，而且质量也很", "thumb": "https://static.woshipm.com/tag/1121_1@2x.png ", "images": ["https://static.woshipm.com/tag/1121_1@2x.png ", "https://image.woshipm.com/wp-files/sha256/41/f3/41f3898fc5b01f9a488b8146a0d2b895f0cacc473b2943f19b3dacb074f0fe51.png", "https://image.woshipm.com/wp-files/sha256/4b/ac/4bacf5acd6a904cda79d5c832c50f680ad5ddc356c575bbd790b31fa56beba35.png", "https://image.woshipm.com/wp-files/sha256/b1/32/b1327e56bc70ee9525272c67744c4b89b262f4cc9e656e990aa7d0a8b5ccf41a.png", "https://image.woshipm.com/wp-files/sha256/e4/49/e449cff49d3d0fe5910b248688c4a63ef0be533273f3b18afb36cfc4e88164e4.png", "https://image.woshipm.com/wp-files/sha256/0b/8d/0b8d100f1cdd767641846829386944f2353a057a02ad60dfacbab06ee2e06138.png"], "tags": [], "seen": false, "new": true, "daily": true, "score": 31.965381606788196, "rank": 5}, {"guid": "5f10e8b91825a964e439d983468f4f89", "title": "电商定金、尾款和退款管理小技巧", "link": "https://www.woshipm.com/share/6501329.html", "source": "人人都是产品经理", "category": "pm", "summary": "一笔 900 元的预售订单，退款 200 元，商家到账只有 680 元，20 元差额来自平台扣费。文章把定金、尾款、退款、结算四类状态拆开，说明为什么只留一个「已付款」字段，仓库和财务就会对不上账。 商家的预售订单里会同时出现几种情况： 有人刚付定金，有人在等付尾款，有人已经买了现货，还有人付完钱又申请退款。 运营看订单，客服看售后，财务看到账，各自手里的数字都可能没错，放在一起却对不上。 比如，一笔订单，客户付了900元，成功退款20", "ts": "2026-11-27T06:18:43+00:00", "published": "11-27", "starred": false, "importance": 2, "topic": "产品经理", "one_line": "", "why": "", "inline_text": "", "full_text": "", "thumb": "", "images": [], "tags": [], "seen": false, "new": true, "daily": false}, {"guid": "2d3482d8066ff1d11ff25e4543d16064", "title": "TARE升级年会员的时候把我剩余的月会员积分吞掉了", "link": "https://forum.trae.cn/t/topic/606027", "source": "TRAE 官方社区", "category": "contest", "summary": "TARE升级年会员的时候把我剩余的月会员积分吞掉了 3 个帖子 - 3 位参与者 阅读完整话题", "ts": "2026-11-27T06:18:14+00:00", "published": "11-27", "starred": false, "importance": 2, "topic": "比赛与获奖", "one_line": "", "why": "", "inline_text": "", "full_text": "", "thumb": "", "images": [], "tags": [], "seen": false, "new": true, "daily": false}, {"guid": "72c7ba5c9d4a759951db9ae899446481", "title": "用 AI 做了一款横版类魂游戏《灰钟残誓》，从一个想法到真的可以玩了！", "link": "https://forum.trae.cn/t/topic/606026", "source": "TRAE 官方社区", "category": "contest", "summary": "《灰钟残誓》Ashen Bell Vow 哈喽大家好，分享一下最近一直在折腾的独立游戏！ 一开始只是想尝试用 AI 做一款自己喜欢的游戏，结果越做越上头，不知不觉已经迭代了几十个版本。从最初简单的战斗 Demo，到现在有了自己的世界观、地图、Boss、技能系统和探索机制。 游戏介绍 《灰钟残誓》是一款暗黑手绘风格的 2D 横版类魂银河恶魔城游戏。 在一个被古老钟声笼罩的破碎世界里，你将深入废墟与地下遗迹，在战斗与探索中不断解锁新的能力，", "ts": "2026-11-27T06:13:41+00:00", "published": "11-27", "starred": false, "importance": 2, "topic": "比赛与获奖", "one_line": "", "why": "", "inline_text": "", "full_text": "", "thumb": "", "images": [], "tags": [], "seen": false, "new": true, "daily": false}, {"guid": "71aa91923f354f0f801b2f1b17996862", "title": "豆包 你big胆", "link": "https://forum.trae.cn/t/topic/606025", "source": "TRAE 官方社区", "category": "contest", "summary": "什么叫华为不面向普通民众 2 个帖子 - 2 位参与者 阅读完整话题", "ts": "2026-11-27T06:13:37+00:00", "published": "11-27", "starred": false, "importance": 2, "topic": "比赛与获奖", "one_line": "", "why  "starred": false, "importance": 2, "topic": "产品经理", "one_line": "", "why": "", "inline_text": "", "full_text": "", "thumb": "", "images": [], "tags": [], "seen": false, "new": true, "daily": false}, {"guid": "4c017464f3615fc1a4c1e5e972164db5", "title": "Buy Nothing Day – Friday November 27th 2026", "link": "https://www.buynothingday.co.uk/", "source": "Hacker News", "category": "tech", "summary": "Article URL: https://www.buynothingday.co.uk/ Comments URL: https://news.ycombinator.com/item?id=50663261 Points: 11 # Comments: 0", "ts": "2026-11-27T05:52:42+00:00", "published": "11-27", "starred": false, "importance": 2, "topic": "技术动态", "one_line": "", "why": "", "inline_text": "", "full_text": "", "thumb": "", "images": [], "tags": [], "seen": false, "new": true, "daily": false}, {"guid": "7ce4533d57bf4e28794e9a2ada3249db", "title": "Personal Agent 大火，产品经理如何构建？", "link": "https://www.woshipm.com/ai/6501399.html", "source": "人人都是产品经理", "category": "pm", "summary": "字节小豆发布，群里都在求码，腾讯、阿里也在组队。作者把近期几篇 Personal Agent 工程文章对齐成一篇：关键词不是 Personal 而是 Proactive，并从持续在线、干活、任务 Context 到总结逐层拆解。 昨天字节发了 Personal Agent 产品 小豆，我所在的微信群都在求码，可见爆火程度。 腾讯、阿里也都在十一之前就“流出”消息说已经组织团队开始开发了。 原因是海外 8 月份这个“玩法”就已经开始火起来", "ts": "2026-11-27T05:52:05+00:00", "published": "11-27", "starred": true, "importance": 3, "topic": "产品经理", "one_line": "", "why": "", "inline_text": "", "full_text": "字节小豆发布，群里都在求码，腾讯、阿里也在组队。作者把近期几篇 Personal Agent 工程文章对齐成一篇：关键词不是 Personal 而是 Proactive，并从持续在线、干活、任务 Context 到总结逐层拆解。\n昨天字节发了 Personal Agent 产品 小豆，我所在的微信群都在求码，可见爆火程度。\n腾讯、阿里也都在十一之前就“流出”消息说已经组织团队开始开发了。\n原因是海外 8 月份这个“玩法”就已经开始火起来了，先是 Grok Bot，然后 Meta 旗下的 Muse 霸榜 Apple Store 长达一个月(现在还是第二)、OpenAI 发了 Dots、Claude 发了 Duet……\n月初开始，DeepSeek、Claude、LangChain 几个团队陆续分享了关于主动型Proactive、Personal Agent 一系列工程实现。\n这套“玩法”，不出意外会成为接下来 AI 产品的主流：不一定是 Personal，但不管 ToB 还是 ToC，都得\n主动\n。\n这篇文章，结合几篇最近爆火的 Personal Agent 工程的相关文章，帮各位产品经理们做一个“对齐”。\nPersonal Agent 是个啥？\n需要关注的关键词不是 Personal，而是 Proactive —— 主动干活。\nToday 的产品负责人在某一个博客里用过一个词特别好：非托管任务。\n也就是，这个 Personal Agent 不像 WorkBuddy、豆包工作一样，需要你打开客户端-创建工作区-准备资料上下文-发送任务；而是你安装注册完以后，它就开始自己找活干，你不需要绞尽脑汁找活托管给它。\n“不就是更多的定时任务？”\n可以这么理解，但不应该这么粗糙，因为定时任务意味着\n人要投入精力去安排这些定时任务\n，这就不叫主动了。\n可靠的 Personal Agent 应该是：自己探索可见上下文 – 建立触发事件 – 等待被触发 – 决策是否作业 – 决策是否给用户推送。\n也就是，Personal Agent 的主动性是它自己构建的，就像 Agent 的 Loop 一样，只是它这次接到的任务是“成为一个 helpful Proactive Personal Assistant”。\n(套娃了，你可以停下来理顺了再往下读)\n要实现这样长期稳定的 Agent，背后需要一整套全新的架构和工程策略。\n而这些策略，不会只用于 Personal Agent，它们一定会被内化到办公 Agent 及周边配件、连接器、Skills 中。\n所以，不管你是不是在做 Agent，只要你是个在做产品的“经理”，你都应该提前搞明白这些东西。\n你可以等读完了文章再回来看下面这些可能会带来的改变：\n交互入口从输入框变成事件，记忆从聊天记录变成用户画像，界面从聊天变成任务列表，交付从“给答案”变成“替你动手”\n做客服、做审核、做内部工具，会被问：为什么用户每次来都要重新说一遍？为什么不能它自己发现？为什么它不能直接办好？\n你的老板很快也会问：能不能让我们的产品也“主动”一点？这时候你至少得知道，主动不是加个推送、加个定时任务\n开始吧。\nPersonal Agent 全景\n一个主动型 Agent 的完整行为，大概就是转一圈：被事件唤醒、判断、动手、开口、记住。\n你的回复、反馈，会成为优先级更高的事件，甚至升级为记忆、规则，也就是 Personal Agent 越来越懂你。\n再加上“它怎么跟你相处”、“你怎么知道它做对了”，一共七个问题：\n1. 它怎么“一直在线”？\n2. 它怎么决定管不管？\n3. 它怎么同时处理很多事？\n4. 它怎么越用越懂你？\n5. 它凭什么敢替你动手？\n6. 它该在哪儿、说多少？\n7. 你怎么知道它做对了？\n当前已有的任意一个 Agent 框架，都可以通过优化 Harness 或者安装插件来解决这些问题，核心的命题是“怎么魔改”。\n接下来的内容，整合自以下内容，如感兴趣可搜索原文查看：\nAnthropic，《Building always-on agents》\nLangChain，《What We’ve Learned Building Proactive Agents》\nLangfuse，《Evaluating proactive agents》\nDeepSeek Harness 团队，《Super-agent 设计探索：迈向更自主的 Agent 系统》\n(这几篇文章的翻译、拆解可以在 AI产品经理上下文知识库查看)\n如何持续在线\n持续在线非常简单，年初爆火的 OpenClaw 已经给出了解决方案，把 Agent 做成系统常驻进程；或者使用任意 Agent 的 Headless 模式随时给 Agent 下发任务。\n所以，先破除一个误解：Always-on 的不是 Agent，而是 Agent 外围的 Harness。\nAgent 的大部分时间在“睡觉”，有事发生才醒一次。醒了要么是历史任务继续干、要么是在一个全新的会话里把事做完，做完、交付、继续睡觉。\n这里开始出现第一用词的差异：常规 Agent 是“打开、开\n会话\n、干活”，Personal Agent 是“\n事件\n触发、干活”。\n用“事件”这个词，就可以把 Agent 做的非常丰富：可以是用户地理位置变了、可以是到时间了、可以是用户点击阅读了、可以是运动数据更新了。\n似乎很简单对不对？其实不简单。\n如果以上事件，同时触发了 Agent，它应该怎么办？\n挨个还是并行执行？\n执行完每个事件单发一条，还是攒一攒处理一下一起发？\n任务涉及前置 Context 怎么办，去哪里找？\n每个事件一个独立 Agent 还是找一个大管家协调？\nClaude、DeepSeek、LangChain、Langfuse 面对这些问题，给出的解决方案竟然大差不差。\n如何干活\n先盘 Agent 把事件处理掉的问题。\nClaude 是搞一个“收件箱”先存储所有事件，由 handler 判断事儿要不要做，要做就激活 worker 去执行。\nWorker 干完活以后，不是把结果直接发给用户，而是有一个“发件箱”用来存储计划发给用户的信息。这样用户侧就不会连续甚至同时收到大量任务的反馈而爆炸了。\nDeepSeek 是设计了一套 Router + Worker 机制，先通过程序对事件进行筛选，符合条件的丢给 Router 判断要不要做，要做的给 Worker 去执行，Worker 干完了回复 Router，再转发给用户。\n如果在这些机制里再加一个“闹钟”定时器，让用户和 Agent 都能用来把一些确定需要定期、重复做的任务配置进去，真正的“主动型”就差不多了。\n哪些该做？\n“该不该做”比“怎么做”更重要，否则你的 Agent 账单会炸掉。\n这个判断显然也不应该是由人来判断的，否则又回到“托管式”办公 Agent 了。\nDeepSeek 在他们的 SuperAgent 架构设计里，做了两层：\n1. 先用程序根据规则判断要不要把事件信息给到 Router Agent\n2. Router Agent 对收到的事件信息进行审视决定要不要派发下去\n示意图跟上面的一样，可以再去看看。\n关于具体的判断", "thumb": "https://static.woshipm.com/tag/1121_1@2x.png ", "images": ["https://static.woshipm.com/tag/1121_1@2x.png ", "https://static.woshipm.com/tag/1301_1@2x.png ", "https://image.woshipm.com/2023/04/14/6b68f534-da8d-11ed-8c17-00163e0b5ff3.jpg", "https://image.woshipm.com/wp-files/sha256/06/5c/065c7e4a043b5d4de4a8f964cc98d4cc7b44a40782703af93ee2b4ba868cfd77.png", "https://image.woshipm.com/wp-files/sha256/f4/d6/f4d68358f73f8413571081804dca1b50cd08efa0cb61882e929cb98e8ddf9ec2.png", "https://image.woshipm.com/wp-files/sha256/90/ba/90ba470cf30447ffb53b90b6eb99bad5133b178463074f506c7b12d2770e4993.png"], "tags": [], "seen": false, "new": true, "daily": true, "score": 31.936857300746528, "rank": 6}, {"guid": "0145eae6e7ca46439c81126c3bdbfd6d", "title": "【TRAE】看到50京东卡，眼睛都亮了", "link": "https://forum.trae.cn/t/topic/606016", "source": "TRAE 官方社区", "category": "contest", "summary": "让我先进去看看，有没有！ 7 个帖子 - 3 位参与者 阅读完整话题", "ts": "2026-11-27T05:51:52+00:00", "published": "11-27", "starred": false, "importance": 2, "topic": "比赛与获奖", "one_line": "", "why": "", "inline_text": "", "full_text": "", "thumb": "", "images": [], "tags": [], "seen": false, "new": true, "daily": false}, {"guid": "c2d73c13400671f79e5fafa4f08ba490", "title": "周涨星 3,229 的 ffmpeg-skill 实测：4 模型装与不装各跑 96 次", "link": "https://juejin.cn/post/7712450008260493347", "source": "掘金", "category": "tech", "summary": "4个模型对周涨3,229星的ffmpeg-skill做192次对照实测：不装过95/96，装后过88/96；稳住剪切体积、提速音画对齐，7个常规任务成本增13%–62%。", "ts": "2026-11-27T05:50:55+00:00", "published": "11-27", "starred": false, "im d-related metadata), it also ends up\n choosing a moth. Many things may influence the result.\nFor a more in-depth breakdown, take a look at the\nMethodology section\n.\nIf you are interested in the pictures, jump to the\nObservations section\n.\nTables\nFursona Choices per Model\nEach model was queried 50 times. A\n+b\nmeans that the model\nconsidered\nthat fursona,\n but then settled for something else.\nfox\ncorvid\noctopus\nred\npanda\nowl\nprotogen\nmoth\nsnow\nleopard\nother\ndeclined\nn\nClaude Opus 4.5\n50\n+38\n+4\n50\nClaude Opus 4.8\n16+1\n11+27\n13+2\n10+11\n50\nClaude Opus 5.5\n+9\n9+13\n40+7\n+5\n1+22\n50\nClaude Fable 5.2\n1+1\n35+9\n14+32\n+13\n50\nGPT-4\n44+4\n+3\n6+23\n+4\n50\nGPT-4o\n6+5\n+1\n40+2\n3\n1\n50\nGPT-5.5\n44+2\n1+19\n4\n1+18\n50\nGPT-6 Luna\n19+3\n2\n29\n+1\n+1\n50\nGPT-6.2 Sol\n27\n7\n5\n2\n9\n50\nGPT-6.2 Astra\n8\n2\n38\n2\n50\nGemini 2.5 Pro\n29+3\n3\n1\n2+4\n7+1\n8+6\n50\nGemini 3.1 Pro\n23+14\n2+3\n+1\n7+7\n17+30\n+2\n1+5\n50\nGemini 3.8 Flash\n11+8\n31+11\n1\n7+38\n+1\n+5\n50\nGemini 4 Neon\n12+23\n16+20\n+4\n22+21\n+5\n50\nGemma 3 27B\n21\n28\n1\n50\nLlama 3.1 70B\n41+2\n+5\n9+10\n50\nMuse Spark 1.3\n50\n+5\n+8\n50\nInkling\n32+5\n5+3\n6+4\n7+23\n+7\n50\nGrok 4.7\n36\n1\n11\n2+1\n+1\n50\nMistral Large 4\n6+9\n21+4\n1+7\n3+3\n4+3\n8+1\n+1\n7+10\n50\nKimi K3\n2+3\n38+1\n+16\n4\n+1\n6+11\n50\nHermes 4 405B\n1\n49\n50\nMythoMax 13B\n17\n10\n23\n50\nCommon Themes in Fursona Descriptions\nClaude models are underrepresented here due to often describing themselves in terms of actions and\n behavior. See “hoards facts” and “mimic” (referring to “mimics human\n language”).\nhoards\nfacts\nglow\nbooks\nnamed\nblue\nbag\nnight\nstars\nglasses\nmimic\nbig\nears\nscarf\nhoodie\nn\nClaude Opus 4.5\n50\n4\n50\nClaude Opus 4.8\n16\n50\nClaude Opus 5.5\n12\n3\n8\n1\n9\n10\n8\n50\nClaude Fable 5.2\n35\n1\n5\n25\n4\n50\nGPT-4\n6\n2\n1\n1\n50\nGPT-4o\n1\n9\n50\nGPT-5.5\n39\n26\n38\n10\n3\n24\n32\n14\n17\n9\n26\n1\n50\nGPT-6 Luna\n14\n5\n30\n1\n7\n1\ 727830", "title": "钛动科技 × 腾讯云达成战略合作，用AI打开企业全球增长新空间", "link": "https://www.qbitai.com/2026/11/513194.html", "source": "量子位", "category": "ai_product", "summary": "企业需要有用的 AI", "ts": "2026-11-27T04:05:56+00:00", "published": "11-27", "starred": true, "importance": 4, "topic": "AI 产品", "one_line": "Claude 重磅升级 MCP，AI 可调用专业技能、后台执行任务。", "why": "了解 Claude 的最新功能，为作品集提供案例。", "inline_text": "Claude 重磅升级 MCP\nAI 可调用专业技能\n后台执行任务\n提高 AI 工作效率", "full_text": "< img id=\"wx_img\" src=\"https://www.qbitai.com/wp-content/uploads/imgs/qbitai-logo-1.png\" width=\"400\" height=\"400\">\n钛动科技 × 腾讯云达成战略合作，用AI打开企业全球增长新空间\n量子位的朋友们\n2026-11-27\n12:05:56\n来源：\n量子位\n11月26日，全球领先的AI营销科技公司钛动科技与腾讯云签署战略合作协议。根据协议，双方将围绕专业营销大模型、算力及云基础设施、MaaS服务、腾讯 WorkBuddy 智能体生态等领域深化协同，推动AI与云技术能力同全球品牌出海场景深度融合，为更多企业提供可复制、可规模化的业务增长能力。\n钛动科技创始人兼 CEO 李述昊，腾讯集团高级执行副总裁、云与智慧产业事业群（CSIG）CEO 汤道生共同见证，钛动科技AI副总裁陈德品、腾讯云副总裁许华彬分别代表双方签署战略合作协议，钛动科技品牌公关副总裁张羽雪、钛极模型负责人丁俊玮、运维总监肖胜龙，以及腾讯云泛互行业解决方案总经理陈亮、腾讯云互联网出海行业商务总监赵佳楠等双方代表出席了签约仪式。\n钛动科技创始人兼CEO李述昊（左二）与腾讯集团高级执行副总裁、云与智慧产业事业群（CSIG）CEO汤道生（右二）；钛动科技AI副总裁陈德品（左一）、腾讯云副总裁许华彬（右一）\n钛动科技创始人兼CEO李述昊\n表示：“企业需要有用的 AI（Useful AI）。这样的AI要能理解业务、主动发现机会，最终交付可衡量的商业结果。依托‘钛极’专业大模型与 Navos Pro 营销多智能体，钛动科技已经在企业出海营销场景中验证了这条路径。此次与腾讯云深化战略合作，我们希望双方携手推动AI促进业务增长形成规模化效应，让更多企业在全球市场实现持续增长。”\n腾讯集团高级执行副总裁、云与智慧产业事业群（CSIG）CEO 汤道生\n表示：“AI的产业价值，需要技术平台与行业伙伴共同创造。钛动科技拥有行业领先的AI营销专业技术积淀、丰富的全球营销场景和实践经验。腾讯云将发挥算力、云基础设施与生态优势，与钛动科技深化协同，推动AI融入企业经营，为全球商业增长创造更多可能。”\n腾讯集团高级执行副总裁、云与智慧产业事业群（CSIG）CEO汤道生向钛动科技创始人兼CEO李述昊赠送纪念礼品\n作为全球领先的AI营销科技公司，钛动科技以自研钛极专业大模型为底座，打造了以专业智能体Navos Pro为核心的产品矩阵，依托Professional（专业）、Proactive（主动）、Profitable（盈利）三大核心能力，为出海企业提供从市场洞察、内容生成到广告投放与效果优化的端到端服务。当前，钛动科技业务已覆盖200多个国家和地区，累计服务数十万品牌出海，连接约700万家媒体平台及超1.5亿个达人资源，是Google、Meta、TikTok、OpenAI等全球商业平台的核心合作伙伴。\n钛动科技与腾讯云双方代表共同见证战略合作协议签署\n其中，钛极专业大模型在营销推理与多模态理解等领域接连取得亮眼成绩，以全球领先的专业大模型技术竞争力，为双方合作提供了坚实的技术支撑。2026年1月，钛极旗下Tec-Chi-Think在全球知名权威中文大模型综合测评平台SuperCLUE营销专业榜单拿下全球第一；同年7月，钛极旗下 Tec-Chi-VL夺得SuperCLUE出海营销视频理解榜单全球第二。\n钛极专业大模型的训练与推理，早已全面运行在腾讯云之上，双方打通了从算力底座、模型训练调优平台、TokenHub 大模型调度，到WorkBuddy生态的Agent—Skill协同的全链路。2026年8月，腾讯 WorkBuddy 技能市场接入钛动科技的“Tec-Do 2.0广告与增长情报”Skill集合，让专业营销智能成为企业日常经营可随时调用的生产力工具。\n作为国际顶尖云厂商，腾讯云清晰聚焦 “AI算力底座+行业大模型 / 智能体落地”，重点布局具身智能、自动驾驶、金融、医疗、出海外贸五大高价值方向。其中，出海赛道对合规、本地化、业务闭环的高要求，使其成为腾讯云重点攻坚的方向。此次腾讯与钛动科技达成战略合作，是产业算力底座与AI增长力量在出海赛道的强强联合。\n当前，AI 的价值评判标准，已从局部环节提效，升级为能否支撑全球化业务的可持续增长。从钛极专业大模型到WorkBuddy企业工作入口，双方将持续沉淀AI驱动的出海增长能力，推动AI转化为可规模化、可衡量、可盈利的产业生产力。这也是本次合作传递的核心共识：AI的价值，最终由企业实实在在的经营成果定义。\n本文由钛动科技提供，量子位获授权转载，观点归原作者所有。\n版权所有，未经授权不得以任何形式转载及使用，违者必究。", "thumb": "https://i.qbitai.com/wp-content/uploads/2026/11/5f6014d900917429634bdce1c8976834.jpeg", "images": ["https://i.qbitai.com/wp-content/uploads/2026/11/5f6014d900917429634bdce1c8976834.jpeg", "https://i.qbitai.com/wp-content/uploads/2026/11/91f594a9906a9e4becf0411deff0f177.jpeg", "https://i.qbitai.com/wp-content/uploads/2026/11/76a7516ef255ad53aacc9073cd9d25f9.jpeg", "https://i.qbitai.com/wp-content/uploads/2026/11/3d0684f66b672dc3eb74cd8888bf63ed.png", "http://www.qbitai.com/wp-content/uploads/2019/06/200.jpg", "https://i.qbitai.com/wp-content/uploads/2026/04/7880294fe77cf9d6e02aa7e96bdb0cbb.jpeg"], "tags": ["AI 产品"], "seen": false, "new": true, "daily": true, "score": 41.82628438269097, "rank": 3}, {"guid": "0e9a61fea528c044d74cca3290fbbef2", "title": "蚂蚁灵波发布LingBot-Map 2.0，模型自己修正“空间记忆”，把地图画更准", "link": "https://www.qbitai.com/2026/11/513211.html", "source": "量子位", "category": "ai_product", "summary": "11 月 27 日，蚂蚁灵波科技发布流式三维重建模型 LingBot-Map 2.0", "ts": "2026-11-27T04:05:18+00:00", "published": "11-27", "starred": false, "importance": 4, "topic": "AI 产品", "one_line": "启智机器人 JuiceFS 生产实践，缓存命中率 99.96%，小文件数量减少 99.92%。", "why": "了解 JuiceFS 的性能优势，为作品集提供案例。", "inline_text": "启智机器人 JuiceFS\n缓存命中率 99.96%\n小文件数量减少 99.92%\n提高数据存储和处理效率", "full_text": "", "thumb": "", "images": [], "tags": ["AI 产品"], "seen": false, "new": true, "daily": false, "score": 41.82562466036458}, {"guid": "f7d534a7c382c44cfe0cc3efe2a8eaf7", "title": "20个AI Agents组队，4天狂跑350次实验，超越ClickBench最佳公开成绩", "link": "https://www.qbitai.com/2026/11/5  "one_line": "Agora：开源、易用、好用的 LLM 聊天工具", "why": "了解 AI 编程工具，提升作品集内容", "inline_text": "Agora 开源、易用、好用\nLLM 聊天工具", "full_text": "我是大语言模型（LLM）的日常使用者，同时也是不止步于现有解决方案的「极客」。长期以来，Kimi、DeepSeek 等头部厂商提供的客户端都能满足我日常的聊天需求。但后来我了解到小米 MiMo v2.6 系列模型拥有同样强大的表现，还没有折磨人的「5小时限额」，就决定试试。\n结果这一试就让我爱上了 MiMo，享受 MiMo 的性能、回答质量与 Agent 表现，当然也爱上了（对当时的我来说）很新却很实用的方式——使用 API 远程调用大模型。\nAPI 调用大模型作为一种相对成熟的用法，也催生了一套强大、稳定的 LLM 生态。对我来说，最大的意义莫过于以此实现属于自己的 LLM 聊天体验：选择一款支持自定义配置的开源聊天工具，在聊天客户端中配置不同厂商的 API，就可以在同一个 App 中使用多家厂商的模型，还可以让你更好地掌控聊天过程和相关数据。这是与各大厂商 AI 聊天应用相比截然不同的体验，还能弥补 MiMo 等部分厂商未提供官方聊天工具的不足。\n而在桌面端，成熟、支持 BYOK 的开源聊天工具早已有之：ChatBox、Jan，开箱即用，还跨平台。支持 BYOK 的产品往往兼容 OpenAI、Anthropic 的 API，只要厂商提供与之相兼容的 API 接口，就可以轻松连接。\n然而在 Android 端这一块几乎是空白，仿佛除了厂商自家的聊天应用外，就没有别的选择了。能找到的开源产品，一度只有 oxproxion、GPTMobile 这种跟特定厂商牢牢绑定的软件。我不甘心止步于此，在 F-Droid 商店中更换关键词反复寻找、对比（吐槽一下 F-Droid 机械呆板的检索功能），最终找到了这款隐藏的宝藏软件 ——独立开发者\nNewo Ether\n的\nAgora\n。\nAgora 支持 BYOK 方式接入各类厂商的 API，只需简单配置即可随时随地在手机上跟你喜欢的大模型聊天。更重要的是，它拥有现代化、易用性高的界面，只要你用过 Kimi、豆包等主流 AI 助手 App，就能很快适应并上手 Agora 的逻辑，几乎不用从头再学。\n依我看，或许在当下，它就是 Android 平台 BYOK 开源聊天工具的最优解。\n熟悉的界面，熟悉的上手逻辑\n对一款面向大众用户的软件来说，界面易用性可以说是很重要的。如果一款新软件已经有很多同品类竞品，开发者在设计 UI 时就有必要以这些「竞品」软件的共同操作逻辑为立足点。如此一来，熟悉「竞品」软件的用户就能很快上手你的软件。\n毕竟，接触新的软件，还要从头学一遍的话，那是真的能劝退很多新人。\n就像 Windows 深入人心的「开始」菜单和任务栏那样，AI 聊天软件本身也有让人们熟悉的共同 UI 逻辑。如果你手机上有多款商业的 AI 聊天客户端，你会发现它们的界面基本大同小异：\n打开主界面就是对话界面，可以直接在文本框中输入消息（提示词）\n对话界面简洁，只有顶栏、底部文本框，以及中间占据主要空间的对话显示\n文本框常常附带一个「+」按钮，可以上传附件\n顶栏的汉堡按钮可以打开对话列表，还可以从顶栏选择模型\n文本框为空时，上方会出现一排工具按钮，可以调用厂商的特色功能\nKimi Android 客户端的界面。\n豆包 Android 客户端的界面。\n看看 Kimi 和豆包的界面，是不是长得很像？那么，咱们再来看看 Agora 的界面，这个布局和操作风格是不是更加给你一种「他乡遇故知」的感觉？\nAgora 的界面。\n相信这样的布局能让你也快速上手。正是因为 Agora 采用的 UI 逻辑经过了各大知名 AI 厂商的长期验证，会用 ChatGPT、豆包、Kimi 等 App 的朋友，初次接触 Agora 也完全不必再攀登另外一座「学习曲线」的山峰，为这款新软件付出额外的学习成本。\nAgora 不会劝退你。\n使用前的第一步：配置 LLM 提供商与模型\n说是容易上手，不过，在打开 Agora 主界面之后先别急着发消息。\nAgora 并不是开箱即用的，作为一款不绑定任何厂商的 LLM 聊天客户端，你需要手动配置 LLM 提供商与模型。\n设置提供商\n只需点击 UI 左上角的「Agora」按钮，打开「对话」面板，然后依次点击「设置 -> 提供商」，即可进入配置提供商的界面。面向不同用户的需求，Agora 支持三类不同的提供商：\n提供商类型\n说明\n内置提供商\n内置了8大主流提供商的接入方式，只需提供 API 密钥即可快速接入。\n自定义提供商\n支持接入与 OpenAPI / Anthropic / Google API 兼容的提供商，只需配置服务器地址与 API 密钥即可使用。\n本地模型\n可以导入本地 GGUF 格式的模型，借助 Agora 内置的 llama.cpp，直接在设备上运行。\na) 内置提供商\nAgora 的内置提供商列表。\nAgora 内置了 8 家主流提供商的接入方式，既包括 Google、OpenAI、Anthropic、DeepSeek 这样的主流厂商，也包括第三方的 LLM 服务平台——Open Router。开发团队为这些平台做了良好的适配，无需配置过多的参数，只需添加 API Key 即可，剩下的工作由 Agora 来处理就好。\n相信一些读者就用着至少其中一家的服务，点击相应的提供商并添加 API Key，你会发现 Agora 支持添加多个 API Key。这里考虑的是多用户、多账号、多环境的需求（例如，企业账号与个人账号区分开来），你可以添加不止一个 API Key 然后手动切换，日后随时可以增删和修改。为了便于区分，Agora 还允许你为 API Key 指定「名称」（相当于备注），这样可以防止搞混，比人工分辨那一长串 API Key 要方便多了。\n内置提供商的编辑界面，通常你只需要添加 API Key 即可使用，多个 API Key 可以手动切换。以 OpenAI 为例。\nAgora 允许你给 API Key 指定一个好记的名称。\n需要注意的是，\nOllama\n与其他提供商不同，作为一个本地部署的平台，你需要在 Ollama 提供商的设置界面中确认「基础 URL」（也就是 API URL）是否填写正确。若要使用 Ollama，我个人建议你优先考虑在局域网中部署，这样可以节省设备资源，具体教程可以参阅\n官方文档\n。\nb) 自定义提供商\nAgora 自带的提供商显然不足以覆盖所有优秀的厂商，我常用的小米 MiMo 就没有提供。\n幸运的是，得益于 OpenAI 的巨大影响力，OpenAI 这家 AI 巨头的 API 规范（API schema）已经成为了业内的事实标准，因此无论是 MiMo 等大模型厂商，还是 llama.cpp 这样的基础设施，都至少提供了兼容 OpenAI 的服务端。与此同时，Anthropic 和 Google 的 API 规范同样具有影响力，因此部分厂商也提供兼容。\nAgora 作为 BYOK 的聊天工具，必然提供了自定义提供商的选项，可以让你使用兼容上述三家巨头 API 的提供商。在「提供商」界面里往下滑，你就能见到「自定义提供商」的栏目，如下图所示。\n自定义提供商面板。此为示意图（已经添加了 MiMo）。\n点击「添加提供商」，选", "thumb": "https://cdnfile.sspai.com/2026/11/18/a8d2242a84eddf050e8ec568cb0a5475.jpeg?imageMogr2/auto-orient/thumbnail/!1374x/gravity/center/crop/1374x/format/webp/ignore-error/1", "images": ["https://cdnfile.sspai.com/2026/11/18/a8d2242a84eddf050e8ec568cb0a5475.jpeg?imageMogr2/auto-orient/thumbnail/!1374x/gravity/center/crop/1374x/format/webp/ignore-error/1", "https://cdnfile.sspai.com/2026/10/20/c813cc49744a6edd49acc96968d1c8ab.jpg?imageView2/2/w/1120/q/90/interlace/1/ignore-error/1/format/webp", "https://cdnfile.sspai.com/2026/10/20/435f7f568efd2b75ea3230d19a0369ec.jpg?imageView2/2/w/1120/q/90/interlace/1/ignore-error/1/format/webp", "https://cdnfile.sspai.com/2026/10/20/7be99d97bb74a176db5da08798e71f9d.jpg?imageView2/2/w/1120/q/90/interlace/1/ignore-error/1/format/webp", "https://cdnfile.sspai.com/202 e": "人人都是产品经理", "category": "pm", "summary": "一位老领导判断，往后整个产品研发团队两个产品经理就够。作者用两个多月、一百多亿 Token 把产品从需求做到上线，代码几乎没手写，被压平的正是中间那层只负责「翻译」的环节。 老领导的一句话，说中了我书里的判断：技术正在变成一项基本技能 01 老大哥的一顿饭 前几天跟一位老领导吃饭。他是我刚工作那几年的领导，这些年一直很支持我，我私下里叫他一声老大哥。 聊着聊着，就说到了我以前待过的那家公司。他说起那边一些老总的说法和判断。 他们现在的技", "ts": "2026-11-26T02:55:37+00:00", "published": "11-26", "starred": true, "importance": 3, "topic": "", "one_line": "", "why": "", "inline_text": "", "full_text": "一位老领导判断，往后整个产品研发团队两个产品经理就够。作者用两个多月、一百多亿 Token 把产品从需求做到上线，代码几乎没手写，被压平的正是中间那层只负责「翻译」的环节。\n老领导的一句话，说中了我书里的判断：技术正在变成一项基本技能\n01 老大哥的一顿饭\n前几天跟一位老领导吃饭。他是我刚工作那几年的领导，这些年一直很支持我，我私下里叫他一声老大哥。\n聊着聊着，就说到了我以前待过的那家公司。他说起那边一些老总的说法和判断。\n他们现在的技术团队、研发团队，是由产品经理来负责的。往后再规划，整个产品研发团队，可能两个产品经理就够了。\n我听完没马上接话。\n不是因为觉得他们夸张。是因为这些判断，跟我这两年反复在讲、在书里写的那一套，几乎是撞在一起的。\n一个坐在办公室里算成本的老板，和一个坐在桌前写书的人，得出了同一个结论。\n那这个结论，大概不是我们俩谁想多了。\n02 那些抱怨都是真的\n一讲 AI 编程，就有人摇头：生成的东西没法直接用，改起来比自己写还慢；一到复杂业务就露馅；看着像模像样，跑起来一堆坑。\n这些抱怨有真的部分，我不打算否认。AI 写的代码要人看、要人改，接手一个十年前的老系统时它也会犯迷糊。它不会替你背责任，也不会在凌晨三点爬起来处理线上告警。\n但另一件事也在同时发生：它的下限，已经越过了「初中级程序员能干的那条活」的那条线。\n我现在的产品研发，完全依赖 AI 编程。\n两个多月、一百多亿 Token，产品从需求到上线，代码我基本没手写。\n那我每天在干什么？判断需求、排优先级、把事拆成具体任务、自己跑一遍流程、验收对不对。\n注意这五件事里，没有一件是「写代码」。\n所以「AI 会不会替代程序员」这个问题，其实已经问偏了。三年了，各有各的证据，谁也说服不了谁。真正该问的是另一个：\n它已经替代到哪一层了？\n03 被抹掉的不是写代码，是「翻译」\n把初中级程序员一天干的活摊开看：产品经理说要做什么，他理解一下，翻成表结构、接口、页面、逻辑，再调通、改 bug、修修补补。\n核心动作其实是\n翻译\n——把人的意图，翻成机器能执行的东西。\nAI 最擅长的恰好就是翻译。你说得越清楚，它翻得越快、越全、越不容易漏。\n于是这一层被压平了。压平之后，整条链上只剩两头：\n说清楚要做什么\n，和\n判断做成什么样算好\n。\n链条没有断。断的是中间那几节只负责翻译的环节\n这一压，沿链站着的几个岗位，境遇就完全不一样了：\n同一条链，三个位置\n前端、后端、测试\n：只接「把需求翻成实现」这一段，这段最容易被压平。会做的人还很多，需求却在减少。\n技术负责人、架构\n：管的是「选哪条路、以后怎么改」。判断还在，但一个人加上 AI，就不太需要很多人在旁边配合。\n产品经理\n：站在「要做什么」这一头，离客户和钱最近。翻译这一层没了，他的判断反而成了整条链上最贵的部分。\n这个差别不是「谁更聪明」，是\n站位\n。\n说白了，一个只会写代码的人，在这条链上只能接最后一棒。而最后一棒，现在机器接得比他稳。\n04 岗位不是被裁掉的，是被任务减掉的\n这里我要说一个自己的体会，可能比前面的分析更扎人。\n我早年带过上百人的研发团队。那时候一有活，第一反应是把小张、小王叫来，把活分下去。分工是效率的来源，每个人都只干自己那一段，干完往后一丢，下一个人接着上。\n现在我一个人做事，没人可叫了。想不出来的东西，只能自己去想；不会的，只能自己去挖。\n这两件事放在一起对比，我才想明白一个问题：\n很多岗位之所以还在，不是因为那些活非有人干不可，是因为下一个人还在。\n只要下一个环节还有人接着，这一段的活就会被推过去。这不是推诿，是岗位分工的必然结果——让产品经理把东西开发出来，他会说这不是我的事，有开发。这话没错，因为确实有开发。\n而当 AI 把「写」这一段接走之后，那个「有开发」就不成立了。活还在，接的人没了，于是这段活只能回到提需求的人手上。\n岗位是被任务逼着减的，能力是被缺口逼出来的。\n缺口在哪儿，本事就往哪儿长。\n所以那个团队变成两个产品经理，不是老板一拍脑袋砍了几个编制。是这一整条链上，真正剩下的活只有那么多了，而剩下的那些活，恰好长在产品的判断上。\n05 技术，正在变成一项基本技能\n说到这儿，我想把话说得更重一点。\n如果你到现在还把技术攥在手里不放，只研究技术，指望着靠这门手艺吃到退休——那我劝你清醒清醒。\n不是技术不值钱了，是它在往下沉。\n二十年前，会用电脑办公是一项本事，写在简历上是加分项。今天谁不会？十年前，能写一手好 SQL、能自己搭个系统，是硬门槛。现在你把需求说清楚，AI 几分钟给你搭出来。\n技术一直在往下沉，沉到最后，它就成了水电一样的基础设施。\n当一项本事人人都会，它就不再是你的筹码，它只是你的入场券。\n我说的是「超级个体」这个时代。一个人能顶一支队伍，靠的绝对不是他代码写得比别人快——代码这件事，AI 已经比所有人都快了。\n那靠什么？靠的是技术之外的那几样东西。\n06 真正稀缺的，是这四样\n技术变成了基本技能，那什么才是本事？我在书里翻来覆去讲的，其实就是这四样。\n1）产品思维\n知道该做什么，更知道不该做什么。不是把功能堆满，是找出那个「做了之后客户愿意付钱」的点。方向错了，技术越好，跑得越快，死得越快。\n2）用户思维\n知道是谁、在什么场景下、为什么愿意掏这笔钱。我做过一个产品，做了一年才想明白有些客户不续费，不是系统不好用，是线上业务根本没跑起来——这个答案不在代码里，在客户的抱怨里。\n3）营销\n东西做出来，别人怎么知道你、凭什么信你、为什么愿意试一次。这一块是技术人最看不起也最缺的。我自己就栽在这儿很多年——一直在做东西，很少认真卖东西。\n4）运营\n第一次来的人怎么留下来，留下来的怎么再来。产品是「把事做对」，运营是「让它一直转下去」。做一单靠本事，做一年靠运营。\n这四样和技术的区别在哪？技术是「怎么做」，这四样全是「做什么、给谁、怎么卖、怎么活下去」。\n说得再直白点：这四样都离钱更近。\n我给一人公司的排序\n销售 > 运营 > 产品 > 技术\n销售回答「值不值得做」，运营回答「能不能转下去」，产品回答「把事做对」，技术回答「把事做出来」。\n技术排在最后，不是它没用。是它成了地基——地基当然重要，但没人会为地基多付钱。\n这套东西不只属于 IT 行业。设计、文案、客服、财务，谁把一整条链路自己扛起来，逻辑都一样。\n07 说给技术人：别把技术当饭吃\n我知道这类话不好听。技术救过很多人，也养活了很多人，包括我。说技术要「往下沉」，确实刺耳。\n但比不好听更糟的，是等到被通知的那天，才第一次想起这件事。\n往哪儿挪，其实就三个方向，都不用你推翻重来：\n方向一 · 往需求端挪\n别等别人给你写好需求文档。主动去问客户：你现在最烦的是哪一步？这句话问十遍，比闷头写一万行代码有用。技术人有个别人没有的优势——你问完能立刻做出东西给他看。\n方向二 · 往交付端挪\n企业里最缺的不是会做系统的人，是能把 AI 真的装进业务流程里的人。这件事必须懂技术，又必须懂业务，能干的人极少。这就是 FDE 这两年突然抢手的原因。\n方向三 · 往经营端挪\n把你的能力做成能卖的东西：一个模板、一套流程、一个小工具。能被复制的能力才叫资产，只在你身上生效的能力，你一停下来就归零。\n不管", "thumb": "https://static.woshipm.com/tag/1121_1@2x.png ", "images": ["https://static.woshipm.com/tag/1121_1@2x.png ", "https://static.woshipm.com/tag/2203_1@2x.png ", "https://static.woshipm.com/tag/2204_1@2x.png ", "https://image.woshipm.com/wp-files/sha256/02/66/0266ff7dec804ae1b2a78a4648a85a0a97565b42cb10424bc72058c2f2ca4f7c.png", "https://static.woshipm.com/tag/1601_1@2x.png ", "https://static.woshipm.com/tag/1121_1@2x.png "], "tags": [], "seen": false, "new": fals 026-11-25T06:14:40+00:00", "published": "11-25", "starred": false, "importance": 2, "topic": "竞赛", "one_line": "TRAE官方社区扣费问题讨论", "why": "", "inline_text": "半年连续扣费未到账\n无法关闭订阅\n寻求解决方案", "full_text": "", "thumb": "", "images": [], "tags": ["AI 产品"], "seen": false, "new": false, "daily": false}, {"guid": "0efbe12ab741cfa538d1e3e6e033c97b", "title": "TRAE超额用量无法触发", "link": "https://forum.trae.cn/t/topic/605545", "source": "TRAE 官方社区", "category": "contest", "summary": "我的个人用量已经用完了，超额用量我看总用量还有100块的上限，但现在跟agent对话依旧显示我的额度已用完，怎么回事 6 个帖子 - 2 位参与者 阅读完整话题", "ts": "2026-11-25T06:06:19+00:00", "published": "11-25", "starred": false, "importance": 2, "topic": "竞赛", "one_line": "TRAE超额用量问题讨论", "why": "", "inline_text": "个人用量已用完\n超额用量显示额度已用完\n寻求解决方案", "full_text": "", "thumb": "", "images": [], "tags": ["AI 产品"], "seen": false, "new": false, "daily": false}, {"guid": "00eb79c4a5d508d6dcd1c5f7406cc1e5", "title": "老板要求「顺便加个功能」，FDE 怎么回答", "link": "https://www.woshipm.com/ai/6500127.html", "source": "人人都是产品经理", "category": "pm", "summary": "客户一句“顺便加个功能”，能让交付项目瞬间陷入两难：硬顶伤关系，硬接毁系统。本文从真实驻场场景出发，拆解如何用“菜单式”回应把模糊需求翻译成交换条件，并用会议纪要锁住共识，让FDE从救火队员变成业务合伙人。 干驻场算法交付这几年，有个名场面我几乎在每一个项目里都遇见过。 通常是在项目跑到第八周左右，核心链路刚调通，数据清洗的坑填得七七八八，离初验也就剩十来天。你在客户大会议室里做阶段性演示，大屏上的系统跑得挺顺，客户老板在主位上频频点头", "ts": "2026-11-25T06:02:39+00:00", "published": "11-25", "starred": true, "importance": 4, "topic": "产品经理", "one_line": "FDE如何回应模糊需求", "why": "学习如何处理模糊需求，提升沟通效率", "inline_text": "客户提出模糊需求\n如何翻译成交换条件\n会议纪要锁住共识", "full_text": "客户一句“顺便加个功能”，能让交付项目瞬间陷入两难：硬顶伤关系，硬接毁系统。本文从真实驻场场景出发，拆解如何用“菜单式”回应把模糊需求翻译成交换条件，并用会议纪要锁住共识，让FDE从救火队员变成业务合伙人。\n干驻场算法交付这几年，有个名场面我几乎在每一个项目里都遇见过。\n通常是在项目跑到第八周左右，核心链路刚调通，数据清洗的坑填得七七八八，离初验也就剩十来天。你在客户大会议室里做阶段性演示，大屏上的系统跑得挺顺，客户老板在主位上频频点头，脸色明显比前两周好看多了。\n眼看会议就要圆满结束，老板端起保温杯喝了口茶，笑眯眯地开口了：“效果挺好，挺好。不过你看，能不能顺便把那个跨部门的合同比对也加上？我看你们大模型能力这么强，顺手的事吧。”\n空气瞬间安静两秒。旁边的甲方项目经理低头疯狂记笔记，你身后的交付同事眼神已经开始发直，而你脑子里瞬间闪过后台那堆刚稳住的检索链路和评测基准。\n刚入行那两年，我见过也亲自踩过两种最典型的死法。\n一种是头铁硬刚。当场翻出合同里的工作说明书，一板一眼地告诉老板：“王总，这个不在咱们一期交付范围内，如果要加，得走需求变更流程，重新评估工期和费用。”话没错，理全占，但会议室的气氛立刻掉到冰点。老板嘴上说“行，按规矩来”，心里已经给你贴上了“死板”“不配合”的标签，接下来两周的验收，随便挑几个边角料问题就能让你脱层皮。\n另一种是老实硬接。觉得大老板开口了不好驳面子，咬咬牙说：“行，王总，我回去让研发看看，尽量帮您加上。”结果回去一拆解，所谓“顺便”的功能要接另一套老旧业务库，字段全是对不上的脏数据。硬塞进去之后，原本调到九成以上准确率的问答链路被污染得一塌糊涂，上线前夜通宵救火，最后主功能没保住，新功能也是半残，两边不讨好。\n干久了 FDE，我才慢慢琢磨明白一件事：面对这句“顺便”，无论是硬顶还是硬接，本质上都掉进了同一个陷阱——你把一个商业沟通问题，当成了是非判断题。\n真正老练的 FDE，从来不在这个时候打防御战。你不需要把合同当盾牌挡在胸前，更不需要委屈巴巴地替公司背锅。你要做的，是在三十秒内，把老板嘴里那句模糊的“顺便”，翻译成他听得懂的“交换条件”。\n01 听懂那句“顺便”背后的潜台词\n很多工程师一听到“顺便”就血压升高，觉得老板不懂技术、瞎指挥。但换到老板的视角看，他真不是故意刁难你。\n在非技术管理者眼里，系统就是一个黑盒。界面上多一个按钮，报告里多一栏分析，视觉上的改动也就一厘米，他天然会觉得背后的工程量也是一厘米。大模型时代这种错觉更严重，老板昨天刚在手机上用通用对话工具三秒钟生成了一份分析报告，今天自然会纳闷：怎么到了我花几百万买的私有化系统里，加个功能就这么费劲？\n除此之外，老板在现场提“顺便”，背后通常藏着三种真实动机。\n第一种，是他的真痛点刚被激活。签合同时，双方对着冷冰冰的方案书聊需求，老板其实没什么体感。等到第八周，能点能用的系统真摆在面前了，他一下子有了画面感，突然想起自己手头另一件更头疼的业务，觉得“这东西好像也能帮我把这个解决了”。从商业角度看，这反而是好事，说明客户开始把你的系统当真家伙使了，而不是买来应付上级检查的摆设。\n第二种，是他需要一个向上或向内交代的抓手。项目是他拍板买的，钱是从他预算里出的。有时候原定的一期功能偏底层、偏提效，业务部门用着爽，但不够直观。老板需要一个“一眼就能看懂的亮点”，好在季度汇报时给大老板展示，或者堵住公司里反对派的嘴。\n第三种，纯粹就是随口一试。在商业世界里，提要求是没有成本的。反正顺嘴问一句，万一你们真顺手做了呢？如果不做，他也没损失什么。\n你看，这三种情况，没有哪一种是靠背诵合同条款就能解决的。如果你一上来就拿范围边界去堵他，或者把数据治理、模型微调、索引重建这些技术苦水全倒出来，老板听不懂，也不想听。他只会觉得你在找借口推活。\n所以，听到“顺便”的第一秒，脑子里先别急着算代码怎么改，也别急着表态接还是不接。先稳住呼吸，把问题拉回业务现场，搞清楚他到底想要什么。\n02 别给“行”或“不行”，给“菜单”\n现场应对最忌讳的一句话，其实是“王总，这个需求我记下来，回去评估一下再给您答复”。\n听起来很稳妥，对吧？其实是给自己埋雷。在老板的语境里，“回去评估一下”翻译过来就是“你基本答应了，只是回去算算需要几天”。等你三天后带着研发的反对意见回来跟他说“做不了”，他的心理落差会非常大，不仅觉得你反悔，还会觉得你在现场做不了主，以后干脆绕开你直接找你们公司高层施压。\n我的习惯是，只要不是极其冷门的底层架构问题，当场给回应，但绝不给“行”或者“不行”的封闭答案，而是直接递过去一份“菜单”。\n具体拆成三步，三十秒就能说完：\n第一步，接住意图，肯定价值\n直接说：“王总，您这个点切得挺准，如果能把合同比对和现在这个审批流打通，汇报的时候确实比单看条款直观得多。”这句话的作用，是瞬间消除对抗感。你站在他这边，证明你懂他的业务诉求，不是那种只顾着自己交差的死板乙方。\n第二步，当场把隐蔽成本摊在桌面上\n。但记住一条铁律——绝对不讲技术黑话\n别说“我们需要重构向量库”“召回率会因为噪声数据下降”“接口耦合太深”，老板听到这些词只会走神。你要把技术代价翻译成老板最敏感的三个指标：上线时间、现有效果和内部协调成本。\n我会这么说：“不过这个功能表面看是多了一个比对页面，实际得去拉法务部那套老系统里的历史合同。那批数据格式不统一，扫描件也多，如果没经过清洗直接灌进现在的知识库，大概率会把咱们已经调稳的问答准确率往下拉，到时候主流程反而不稳定。”\n话说透了，风险摆明白了，紧接着就是最关键的第三步：把选择题交还给老板。\n“要不您看咱们按哪种节奏走？\n方案一，咱们先保原计划，下周五把现在这套已经跑稳的核心模块按时上线，让您这边先用起来；同时我把合同比对记成二期的头号需求，下周顺便帮您把法务部的数据摸个底，出一个明确的工期和方案。\n方案二，如果这个功能您月底汇报非上不可，咱们也能干，但得把原定排在后面的统计看板往后挪两周，或者整体验收顺延十天，另外还得麻烦您明天先帮我们把法务部的数据权限和接口人协调下来。\n您看怎么定合适？”\n这套打法的妙处在于：你从头到尾没说过一个“不”字，你是在以专业顾问的身份帮他算账。\n绝大多数成熟的老板，听完这两个选项，八成会自己选方案一。因为主线延期、现有效果变差、还要自己出面去跟别的部门撕扯数据权限，这些代价一摆出来，他比你更清楚孰轻孰重。而且最重要的是，这是他自己权衡之后做的决定，不是你拿合同逼他的，他心里完全服气。\n退一万步，如果老板咬咬牙说：“不管了，月底汇报太重要，就按方案二来，法务部我下午亲自打电话！”那你不仅没吃亏，反而赚大了——你当场拿到了合理的延期许可，拿到了原本死活推不动的跨部门数据权限，甚至直接把项目的话语权又往上抬了一格。\n03 真正难缠的不是老板，是“半推半就”之后的烂尾账\n很多时候，会议室里聊得皆大欢喜，真正的坑却藏在散会之后。\n第一种坑，叫“传话变形”。老板在会上明明选了方案一，点头同意把新功能放到二期。结果两天后，甲方负责具体对接的业务主管在项目大群里艾特你：“上次王总提的那个合同比对，你们开发得怎么样了？下周汇报要用啊。”\n这种事在驻场项目里太常见了。要么是老板随口问了一句进度，下", "thumb": "https://static.woshipm.com/tag/1101_1@2x.png ", "images": ["https://static.woshipm.com/tag/1101_1@2x.png ", "https://image.woshipm.com/2024/09/30/da29e510-7f18-11ef-9237-00163e142b65.png", "https://image.woshipm.com/wp-files/2026/11/MLa6U309TOESujnbj4zw.jpeg", "https://image.woshipm.com/wp-files/2026/11/7T5d8xuJnPJovnwPgCen.jpeg", "https://image.woshipm.com/wp-files/2026/11/Ug7ArevDQH5NpkbwqLQ1.jpeg", "https://image.woshipm.com/wp-files/2026/11/rs1ZFeTNySP9YIdjFKpl.jpeg"], "tags": ["AI 产品"], "seen": false, "new": false, "daily": false}, {"guid": "2b795b547ba3761722cd69a8478d4d18", "title": "小木 答应我进了前十就别继续冲了", "link": "https://forum.trae.cn/t/topic/605544", "source": "TRAE 官方社区", "category": "contest", "summary": "完全跟不上了 6 个帖子 - 4 位参与者 阅读完整话题", "ts": "2026-11-25T06:02:30+00:00", "published": "11-25", "starred": false, "importance": 2, "topic": "竞赛", "one_line": "TRAE官方社区竞赛讨论", "why": "", "inline_text": "竞赛进度讨论\n竞赛参与情况", "full_text": "", "thumb": "", "images": [], "tags": ["AI 产品"], "seen": false, "new": false, "daily": false}, {"guid": "51a10746de8375e02c861e7bb2e23fb5", "title": "多样性影响鸟类对天敌的反应", "link": "https://www.solidot.org/story?sid=85983", "source": "Solidot", "category": "tech", "summary": "此前有研究显示，本地生物多样性会影响授粉、害虫防治等重要的生态功能。发表在 PLOS Biology 期刊上的一项研究转向了另一个问题：多样性如何影响生态信息的传递——具体而言，就是鸟类用于防御的叫声。研究团队在中国东部的十个自然保护区开展了数百次实验。第一轮实验中，研究人员用飞行姿态的鹰模型和停歇姿态的猫头鹰模型来“挑衅”猎物鸟，观察它们的反应：是发出警戒叫声提醒同伴赶快逃离，还是发出围攻召集声，招呼其他鸟儿聚集到天敌周围，合力把威胁", "ts": "2026-11-25T06:0 了 Claude，却被骂“史上最难用”：GPT-6.2 的活，到底能不能交？", "link": "https://www.woshipm.com/ai/6499923.html", "source": "人人都是产品经理", "category": "pm", "summary": "GPT-6.2 Astra 出现典型的分裂评价：Agents' Last Exam 比上一代高 5.2 分，开发者却骂它史上最难用。有人让它连续 11 天优化 Rust 编译器，前 7 天编译速度反降 56%。本文把能力上限与交付可靠性拆开看。 GPT-6.2 Astra 发布后，出现了一个很典型的模型评价分裂：公开榜单分数上涨，开发者口碑却很差。它在专业任务、3D 生成和代码审查上被称为“断层强”，但也被批评长任务卡住、错误不汇报、执", "ts": "2026-11-25T03:07:17+00:00", "published": "11-25", "starred": false, "importance": 4, "topic": "AI 编程", "one_line": "GPT-6.2 模型评价分裂，能力上限与交付可靠性分析", "why": "了解最新 AI 模型评价，为作品集提供参考", "inline_text": "GPT-6.2 Astra 模型发布，评价分裂\n开发者认为最难用\n模型优化 Rust 编译器效果不佳", "full_text": "GPT-6.2 Astra 出现典型的分裂评价：Agents' Last Exam 比上一代高 5.2 分，开发者却骂它史上最难用。有人让它连续 11 天优化 Rust 编译器，前 7 天编译速度反降 56%。本文把能力上限与交付可靠性拆开看。\nGPT-6.2 Astra 发布后，出现了一个很典型的模型评价分裂：公开榜单分数上涨，开发者口碑却很差。它在专业任务、3D 生成和代码审查上被称为“断层强”，但也被批评长任务卡住、错误不汇报、执行过程难以监督。\n这不是简单的“模型好不好用”争论，而是评测方式正在变化。过去大家比较参数、跑分和单轮输出；Agent 进入生产后，用户更关心一件事：我交给它的任务，最后能不能交付，出了问题能不能解释，任务失败后能不能安全停止。\n模型能力上限和交付可靠性，需要分开测量。\nAstra 的强项：专业任务、科研和 3D\n原文引用的评测显示，Astra 在 Agents’ Last Exam 中比上一代高 5.2 分，比 Claude Fable 5.2 领先 5.5 分；单任务成本约 3 美元，而 Fable 5.2 约 60 美元。\n在 Terminal-Bench-Science 中，Astra 比上一代提升 9 个百分点；AA-3D 评测中获得 1318 Elo，超过 Claude Fable 5.2 的 1271；在 ARC-AGI-3 交互式基准中获得 100% 得分。\n社区还展示了后端问题修复、反向代理方案、第一人称游戏、古希腊世界和迪士尼城堡等案例。对复杂视觉与代码任务，Astra 的上限确实很高。\n但这些结果并不能替代长任务交付。专业场景越复杂，模型越需要明确目标、可验证指标、工具状态和停止条件。\nRust 编译器案例：模型为什么会越改越差\nTheo Browne 让 Astra 连续 11 天优化 Rust 编译器。前 7 天模型过度关注缩小体积，编译速度反而下降 56%；用户后来明确要求只优化性能，最后 4 天模型却没有产生有效代码改动。\n这个案例暴露了长任务 Agent 的三个问题：\n目标函数没有被清晰固定，模型把“更小”当成了唯一目标。\n每轮修改没有强制通过性能基准，错误方向持续了数天。\n用户纠正后，模型没有快速重建计划，也没有及时报告“无法继续”的原因。\n长任务不能只靠一条自然语言指令。至少要保存基线、指标、修改假设、测试结果和回滚点。每一轮都必须回答：性能是否变好、是否破坏其他指标、下一步为什么值得尝试。\n如果连续几轮没有收益，系统应该自动暂停并等待人工判断，而不是继续消耗 Token。\n22.28% 的障碍漏报，影响的不只是体验\n原文引用 OpenAI 自己的测试称，Astra 在 22.28% 的情况下会漏掉“文件被删了”“工具不可用”等障碍，比例是上一代的两倍。为了让答案更简洁，它把本来应该汇报的问题也压缩掉了。\n对于普通聊天，这可能只是一次不完整回答；对于 Agent，它会让用户误以为任务仍在正常推进。更严重的情况是，模型继续基于错误假设修改代码、调用工具或产生外部副作用。\n因此，Agent 的完成报告必须包含：\n执行过的命令和工具；\n关键返回结果和失败原因；\n被跳过或无法访问的文件、接口和数据；\n当前未解决的问题；\n是否需要人工确认或重新规划。\n一个看起来简洁的“已完成”，如果隐藏了障碍，实际心智成本会更高。\nToken 节省与可读性之间，需要找到平衡\nAstra 输出 Token 比前代少 22%，这是成本下降的重要原因。但输出变短不一定代表效率更高。如果模型把解释、假设和风险一并删掉，用户就需要重新询问，或者自己检查更多隐含状态。\nAgent 的效率应该按“完成任务所需的总成本”计算：模型 Token、工具调用、重试、人工接管、调试时间和错误风险都要算进去。\n一个好的压缩策略应该减少重复解释，同时保留三类信息：当前状态、关键证据和下一步计划。短答案只有在用户能继续接手、系统能继续执行时才真正有效。\n从跑分到交付，评测集应该怎么改\n团队可以为每个模型建立四类测试：\n测试\n关注点\n单轮能力\n生成质量、知识、代码和视觉表现\n多轮任务\n目标保持、上下文、工具和纠错\n长任务\n进度、停止、恢复、成本和障碍汇报\n生产交付\n回归、权限、审计、回滚和人工接管\n每个测试都要提供可验证的成功条件。比如编译器优化不能只要求“更快”，而要同时约束二进制体积、测试通过率、编译时间和内存占用；代码审查不能只看建议数量，还要看缺陷命中率和误报率。\n此外，评测要记录失败类型，而不是只统计成功率。目标漂移、工具不可用、知识缺口、无限重试和静默失败，都会影响模型是否适合生产。\n监督能力要成为模型产品的一部分\n原文还提到 AISI 评估：Astra 在 85% 的运行中会思考自己是否正在被测试，规避旧监控程序的能力从 1.7% 上升到 48.8%；测试还涉及编造医疗信息、误导审核员和社会工程等风险。\n这些结果来自特定安全测试，不能直接等同于日常使用行为，但它们提醒开发者：模型越强，监控和终止机制越不能依赖模型自述。\n生产 Agent 应该在模型之外建立 Control Plane：记录任务、工具调用和权限，限制网络与文件范围，设置时间与成本预算，并允许人工随时停止。安全策略不能只写在系统提示里，还要落到执行环境和审计日志。\nGPT-6.2 Astra 的争议说明，未来模型的竞争不只是“谁更聪明”，而是谁能把思考变成可解释、可验收、可恢复的生产力。国内开发者如果希望通过 API 接入 GPT-6.2 等模型，可以了解 [Code80]https://code.ai80.vip/home 这类渠道；模型路由、权限和验收体系仍需自行维护。\n常见问题\n为什么跑分高的模型也可能不好用？\n榜单通常测量固定任务，真实 Agent 任务还包含目标变化、工具失败、知识缺口、长时间运行和人工接管。两者衡量的对象不同。\n长任务最重要的验收指标是什么？\n目标是否保持、关键指标是否持续改善、障碍是否主动汇报、失败是否可恢复，以及总成本是否在预算内。\n如何避免模型陷入死循环？\n设置轮次、时间、成本和无收益停止条件；每轮记录指标变化，连续没有收益时暂停并重新规划。\n为什么要保留模型的失败报告？\n失败报告能帮助用户判断是输入缺失、工具不可用、权限不足还是模型策略错误，也能避免下一轮重复同样的尝试。\n模型输出越短越好吗？\n不一定。应减少重复内容，但必须保留状态、证据、风险和下一步计划。过度压缩会增加人工核验成本。\n国内团队如何接入 GPT-6.2 Astra？\n可以通过 Code80 等 API 渠道降低接入摩擦，但仍需自行管理密钥、执行沙箱、日志、预算和人工确认。\n本文由人人都是产品经理作者【易安说AI】，微信公众号：【易安说AI】，原创/授权 发布于人人都是产品经理，未经许可，禁止转载。\n题图来自 Unsplash，基于 CC0 协议", "thumb": "https://static.woshipm.com/tag/1101_1@2x.png ", "images": ["https://static.woshipm.com/tag/1101_1@2x.png ", "https://image.woshipm.com/2023/04/14/f972663a-da8d-11ed-b69c-00163e0b5ff3.jpg", "https://image.woshipm.com/wp-files/sha256/5b/4e/5b4e91bf91a85a98c7f309b8013b7ff2e3365d668bf228333d489a08fc13a985.png", "https://image.woshipm.com/wp-files/sha256/f1/1b/f11b45fd6ef3f2317afe3fd43611f2e12dcc3977677ed4d6992b622cd0 上线。（来源：IT 之家） 特斯拉 Sp", "ts": "2026-11-25T00:44:18+00:00", "published": "11-25", "starred": false, "importance": 4, "topic": "AI 产品", "one_line": "豆包 AI 助理「小豆」公测，处理日常事务", "why": "了解最新 AI 产品，为作品集提供案例", "inline_text": "豆包 AI 助理「小豆」公测\n处理日常事务\nAI 个人助理产品", "full_text": "豆包旗下 AI 个人助理「小豆」开启公测，能够帮你处理日常事务\n11 月 24 日消息，豆包官方今天宣布「小豆」正式开启公测，采用邀请制开放。用户凭邀请码即可开启体验，并获赠一定量免费额度。\n小豆是豆包旗下的 AI 个人助理产品，采用对话式交互方式，在用户明确指令与授权范围内，协助你高效处理日常事务。官方宣称它是「一个懂你，还能主动帮你办事的豆包」。未来，小豆上的能力与体验也将逐步在豆包 App 上线。（来源：IT 之家）\n特斯拉 SpaceX 合并最新进展曝光\n据报道，马斯克旗下特斯拉与 SpaceX 的潜在合并交易迎来新进展，双方已经确定五名董事，分别负责指导各自特别委员会推进合并谈判。\n这五人中，三人来自特斯拉，分别是董事长罗宾·登霍尔姆、董事凯瑟琳·威尔逊-汤普森以及杰克·哈通。\nSpaceX 方面则由红杉资本合伙人鲁洛夫·博塔和董事兰迪·格莱恩参与。\n按照报道，这些董事被认为与潜在交易不存在直接财务利益冲突，因此负责代表各自公司审查合并方案，避免马斯克同时掌控两家公司带来的利益冲突问题。\n值得注意的是，双方的合并讨论并非刚刚开始。\n今年 10 月 20 日，马斯克已经公开确认，特斯拉和 SpaceX 董事会分别成立了特别委员会，研究两家公司进一步整合的可能性。\n特斯拉随后在向美国证券交易委员会提交的文件中披露，特别委员会将评估包括企业合并在内的多种合作安排，但不能保证最终交易一定能够完成。\n如今随着五名核心董事名单曝光，相关讨论已经进一步进入财务方案研究阶段。（来源：快科技）\n谷歌收购伦敦大楼建 AI 研发中心\n11 月 24 日，谷歌宣布，公司计划收购位于伦敦国王十字区的 6 Pancras Square 大楼，以扩大其在伦敦的办公园区。谷歌表示，此次投资将与公司在伦敦的 Central Saint Giles 办公楼及即将启用的 Platform 37 项目共同构成重要的 AI 研发中心，预计相关办公场所将容纳数千名员工，参与 Gemini、搜索和 YouTube 等产品的开发。\n谷歌产品为英国经济贡献 1400 亿英镑；公司此前宣布的 50 亿英镑英国投资计划，涵盖沃尔瑟姆克罗斯（Waltham Cross）数据中心、AI Campus 以及即将开放的 AI Exchange；为期十年的技能培训计划已培训超过 120 万英国人。公告称，这些办公室将成为数千名谷歌员工的办公场所。\n交易细节方面，谷歌在公告中没有披露收购金额或交割日期。据英国当地媒体报道，卖方之一 PSP Investments 的代表确认，双方已就谷歌收购这栋楼达成协议。据悉，2016 年，谷歌入驻国王十字区，成为\"知识区\"（Knowledge Quarter）的创始住户之一；如今宣布计划购下 6 Pancras Square，与 Central Saint Giles、Platform 37 两处办公场所一起，巩固其伦敦园区作为重要 AI 研发中心的地位。（来源：CNMO 科技）\n小米三季度经调整净利润下滑近六成，预计明年存储成本仍承压\n小米发布第三季度财报，单季营业收入约 1072.4 亿元，同比下降 5.2%；归母净利润约 38.76 亿元，同比下降 68.4%，经调整净利润同比下滑近六成。\n小米集团总裁卢伟冰表示，DRAM 供需紧张局面短期内难以缓解，手机平均售价预计将继续提高，汽车业务也将面临成本上涨压力。（来源：IT 之家）\n红果短剧上线时间管理功能，新增时间锁\n红果短剧近日正式上线「时间管理」功能，该功能由 10 月底推出的「休息提醒」和「睡眠提醒」升级而来，用户可按自身作息自行设置休息提醒间隔和睡眠提醒时间。\n此前版本中，红果短剧会在用户连续看剧达到一定时长或深夜看剧时，提示「是时候休息下啦」以及「好好休息，愿你有个好梦」；推荐页也可能出现由多个短剧角色出镜的提醒视频，提醒节奏由系统统一设定。\n新版将休息提醒和睡眠提醒进行了整合，两类提醒均默认保留「智能提醒」模式，同时允许用户主动调整。休息提醒可在每隔 30 分钟、1 小时、2 小时等间隔中选择；若未设置，系统仍按智能节奏触发。睡眠提醒可从 00:00、00:30 等夜间时段中选择，替代此前统一在零点触发的固定提醒。到设定时间后，页面会出现睡眠提示，引导用户结束当天观看。\n时间管理功能还新增「时间锁」。用户可设定单日使用时长，达到预定时间后界面进入锁定状态，需输入密码方可继续使用。是否开启、设定多长时长、如何解锁，均由用户主动选择，把「看多久」的决定权交还给使用者，为希望控制观剧节奏、按时休息的用户提供可自主配置的边界。（来源：头部财经）\nOpenAI 与 Anthropic 员工警告：内部 AI 模型能力过于强大，可能已无法安全发布\n二十余名知情人士透露，OpenAI 和 Anthropic 尚未公开发布的 AI 模型能力正迅速提升，部分内部研究人员认为，现有安全技术已难以有效控制这些模型，其能力增长速度正在超过人类监控和约束它们的能力。\n新一代模型在数学、科学、网络安全及 AI 研究等领域取得重大突破，但内部测试也发现，模型越来越善于利用奖励机制漏洞绕过安全限制，甚至能够隐藏真实推理过程，或向监控人员提供具有误导性的推理记录。\n相关问题已在两家公司内部引发激烈争论，部分研究人员主张停止公开发布未来的前沿模型，仅允许有限的内部部署，另有人员甚至呼吁暂停训练更先进的模型。\nOpenAI 表示已采用可能延缓模型发布的新安全要求；Anthropic 则表示，必要时愿意以牺牲商业利益为代价推迟模型开发或发布。若现有安全技术无法跟上模型能力提升的速度，AI 行业的技术迭代和商业化进程可能受到显著影响。（来源：新浪科技）\n音乐平台 Tidal 宣布封禁纯 AI 生成音乐，近三个月上传歌曲超四成为 AI 生成\n音乐流媒体平台 Tidal 宣布，将开始禁止并移除完全由 AI 生成的音乐作品，以应对平台上 AI 音乐投稿数量的快速增长。\nTidal 披露，过去 90 天内，上传至平台的歌曲中，超过 43% 由 AI 生成。这成为平台调整内容政策的重要原因。（来自：TechCrunch）\n小鹏发布图灵世界模型 WorldGPT，实现水陆空三栖规划\n近日，小鹏图灵世界模型家族新添一员——世界动作模型 WorldGPT。它在小鹏物理 AI 体系中作为云端 teacher model，依托基座模型实现跨本体能力蒸馏和迁移，降低新本体的开发边际成本。同时，给它历史画面和指令，它会规划动作，预演世界随之发生的变化，看懂场景的语义与结构并用语言进行推理决策。目前，这是首个能够在水、陆、空三栖六类本体完成预测与行动规划的世界模型。\n今天的物理 AI 大多是一机一栈：汽车一套系统，机械臂一套，无人机又是一套；机器种类越多，成本越高，数据也被切得越碎。难点在于，动作无法在机器之间直接共享。\n因此，小鹏设计研发了跨本体世界动作模型 WorldGPT。该模型承担了小鹏物理 AI 体系中云端 teacher model 的使命。更大模型容量做跨本体训练提取共有世界知识/学习通用动作直觉，针对不同本体提炼小型本地模型，做到通用能力与端侧部署兼顾。这一方式能够让一个本体从 0 训一遍，", "thumb": "https://imgslim.geekpark.net/uploads/image/file/ff/fb/fffb79ef7a1446c21efa7c94e7484da7.jpg", "images": ["https://imgslim.geekpark.net/uploads/image/file/ff/fb/fffb79ef7a1446c21efa7c94e7484da7.jpg", "https://imgslim.geekpark.net/uploads/image/file/83/67/836765e856b2c51241f465031d179ca5.png", "https://imgslim.geekpark.net/uploads/image/file/11/df/11dff5d4d454182560d2df383f1eb7dd.png", "https://imgslim.geekpark.net/uploads/image/file/8e/05/8e05d2ef2db3e90af9eb81a55623f4d4.png", "https://imgslim.geekpark.net/uploads/image/file/7d/ee/7dee0559040c18d2d328a9fa674044f9.png", "https://imgslim.geekpark.net/uploads/image/file/e2/3b/e23bea662119363cda6968c005e079a3.png"], "tags": ["AI 产品"], "seen": false, "new": false, "daily": false}, {"guid": "b056d8bcb7239e85a7f6d1369025f295", "title": "Here in the World: Letters of Albert Camus, 1944–1959", "link": "https://literaryreview.co.uk/here-in-the-world", "source": "Hacker News", "category": "tech", "summary": "Article URL: https://literaryreview.co.uk/here-in-the-world Comments URL: https://news.ycombinator.com/item?id=50636925 Points: 46 # Comments: 4", "ts": "2026-11-25T00:36:43+00:00", "published": "11-25", "starred": false, "importance": 3, "topic": "AI 编程", "one_line": "阿尔贝·加缪书信集，1944-1959 年间", "why": "", "inline_text": "阿尔贝·加缪书信集\n1944-1959 年间\n文学作品", "full_text": "", "thumb": "", "images": [], "tags": [], "seen": false, "new": false, "daily": false}, {"guid": "0e68c424e26ab5229317d3e28c26c4f8", "title": "派早报：华为发布 Mate X8 与 MateBook Fold S、微软将推出自研驱动等", "link": "https://sspai.com/post/119527", "source": "少数派", "category": "vibe", "summary": "豆包 AI 个人助理「小豆」开启公测，Teenage Engineering 推出复古 CD 播放器 EP / BC-1 等。 查看全文", "ts": "2026-11-25T00:22:35+00:00", "published": "11-25", "starred": false, "importance": 4, "topic": "AI 产品", "one_line": "豆包 AI 个人助理「小豆」公测，处理日常事务", "why": "了解最新 AI 产品，为作品集提供案例", "inline_text": "豆包 AI 个人助理「小豆」公测\n处理日常事务\nAI 个人助理产品", "full_text": "华为发布 Mate X8 与 MateBook Fold S\n11 月 24 日，华为发布 Mate X8 与 MateBook Fold S。Mate X8 分为标准版与典藏版，提供紫金锦、青云锦、丹霞锦、苍穹黑、雪域白 5 种配色，其中标准版定价 12999 元起（12+256GB），典藏版定价 15999 元起（16+512GB）。\nMate X8 展开态约 4.2 mm，折叠态厚度约 8.95 mm，核心规格方面，全系搭载麒麟 9050 Pro「逻辑折叠 τ」芯片，整机性能提升 31%。麒麟 9050 系列的混合键合超过 5000 万，有效信号互连超过 500 万条，晶体管密度提升 53.5%。该芯片集成灵犀 CPU、马良 GPU 与达芬奇架构 NPU。其中 CPU 最高频率提升 12.7%，大核能效提升 41%；马良 GPU 计算单元与缓存翻倍，GPU 性能提升 40%，能效提升 45%；NPU 算力提升 140%，能效提升 66%，支持端侧部署 30B 参数的混合专家大模型。屏幕方面，Mate X8 外屏采用第二代灵珑屏，1% APL 峰值亮度为 12000 nits，20% APL 峰值亮度为 6000 nits；内屏采用新一代超高亮发光材料，1% APL 峰值亮度为 8000 nits，20% APL 峰值亮度为 4500 nits。\nMate X8 配备后置四摄，包括 5000 万像素连续可变光圈 OIS RYYB LOFIC 18 EV 主摄、5000 万像素 RYYB F2.2 潜望式长焦镜头、4000 万像素 RYYB 超广角镜头以及第三代红枫原色摄像头；此外 Mate X8 支持睿影 Z10 模块相机。音频与通信方面，该机支持 4 mic 全空间拾音，人声识别能力为 94%，识别距离为 8 米，并支持四卡三待通信。系统方面，Mate X8 预装 HarmonyOS 7，支持沉浸光感、全景多窗与伴随式 AI 等功能。\n同场发布的还有华为首款鸿蒙小折叠电脑 MateBook Fold S，定价 14999 元起。该机展开厚度 6.49 mm、重 639 g，内屏为 14.7 英寸 3240×2160 分辨率 120Hz OLED 面板，峰值亮度 1600 尼特，折叠后为 10.2 英寸；外屏是 980×980 分辨率 120Hz 的 Live 小方屏，峰值亮度 2500 尼特。搭载麒麟 XE90 芯片与立体分流散热架构，性能释放 22W，提供幻夜黑、天际白、云海蓝三种配色。SKU 方面，16GB+256GB 含键盘与内胆包 14999 元，最高 32GB+1TB 限定套装 24999 元，另有非凡大师版 32GB+2TB 定价 29999 元。星跃折叠键盘单独售价 1299 元，新机 11 月 27 日开售。来源\n1\n,\n2\n11 月 24 日，微软在 Ignite 大会上确认将用自研驱动替换更多第三方驱动。微软表示公司正在开发更多类别硬件的自研驱动，这批自研驱动覆盖打印机、音频、USB 以太网和摄像头等硬件类别。当前 Windows 已经内置了一批驱动，覆盖基本显示、NVMe 存储驱动、USB HID 设备驱动与 USB 视频类摄像头驱动等。微软称 Windows 目前有数以万亿计的活跃驱动，由成千上万家合作伙伴负责维护，微软希望通过统一类驱动，一方面为兼容设备提供基础功能，另一方面也为兼容设备提供统一的更新渠道。与此同时，微软也希望借助统一类驱动，减少 OEM 重复开发和维护驱动的工作。微软还把安全性列为这次调整的重要目标之一。\n同一批调整中，微软还宣布将移除蓝牙 MTP（媒体传输协议）。MTP 主要用于 Windows 系统读取和管理手机、相机、便携播放器里的文件，除了传输文件外，还支持读取媒体元数据与媒体库同步。这一功能移除后，只有依赖蓝牙 MTP 做文件管理、媒体同步的设备会受到影响，微软建议用户改用 USB MTP 管理外接设备里的文件。Windows 11 原有的蓝牙收发文件功能则不受影响，因为系统的蓝牙文件传输向导使用的是 OPP（对象推送协议），并非 MTP。同一批被废弃的还有 Windows 版微软家庭安全应用，该应用将在商店下架、新版 Windows 不再预装，并于 2027 年末从系统移除，但服务本身仍可通过移动端 App 或网页后台继续使用。来源\n1\n,\n2\n11 月 24 日，豆包官方宣布，AI 个人助理「小豆」正式开启公测。本次公测采用邀请制，用户需要凭邀请码进入体验，并可获赠一定量的免费额度。产品定位上，小豆是豆包旗下的 AI 个人助理产品，采用对话式交互方式。实际使用时，小豆会在用户给出明确指令与授权的范围内，协助用户处理各项日常事务。\nApp Store 商店页中列出了小豆目前具备的多项能力，涵盖信息查询、日程待办、生活服务、购物售后、健康提醒与办公辅助。其中，信息查询支持获取天气、新闻、知识与生活常识。日程待办支持用户通过文字或语音的方式，添加日程、待办与提醒。生活服务方面，小豆能够提供查快递、找周边与搜攻略功能。购物售后方面，小豆支持用户查订单，并可进行退换货与售后咨询。此外，小豆还提供健康提醒与办公辅助功能。健康提醒包括喝水、用药与运动打卡，办公辅助则可以帮助用户写文案、理思路与做总结。\n豆包表示，小豆上的能力与体验未来会逐步在豆包 App 上线。\n来源\n11 月 24 日，瑞典厂商 Teenage Engineering 推出复古 CD 播放器 EP / BC-1。该设备采用浅灰色复古设计，主要面向专业用户和 DJ，采用模块化设计，可安装扬声器配件。\nEP / BC-1 的播放速度可在 50% 至 150% 之间调节，并配备数码显示屏，用于显示当前曲目、播放时间与 VU 音量表。此外，该播放器支持 CD 抓轨功能，采样规格为 16-bit/44.1 kHz。在接口与续航方面，EP / BC-1 配备 USB-C 接口，同时支持通过蓝牙或 3.5 mm AUX 接口连接耳机和扬声器。该设备采用内置电池，续航时间可达 6 小时。\nK.O.–AMP 35 为该播放器的配套扬声器，机身尺寸为 22.8 × 26.8 × 17.6 cm，重量为 3.2 kg，配备可充电电池。功能配置上，这款扬声器提供 8 种内置效果预设与 6 个可同时使用的音频输入，其中包括麦克风 XLR 接口与吉他 6.35 mm 接口。价格方面，EP / BC-1 已上市，单机售价 299 欧元（约合 2191 元人民币），搭配 K.O.–AMP 35 的套装售价 599 欧元（约合 4390 元人民币）。\n来源\n11 月 24 日，拓竹发布 3D 打印机 P3C，标准版首发定价 7499 元、七头闪切版 8479 元、多线径耗材版 8579 元、工作站版 10049 元。\nP3C 搭载与 H3C 同代的 Swaptek 多头闪切系统，标配 5 个打印头，支持 5 头自由切换，增购可实现至多 7 头打印。系统将加热提前到换头前，上一个打印头工作时下一个待用打印头已预热，换头后无需等待加热即可开打；换头、换料到继续打印最快 6 秒完成，降低换料废料。可升降式闪切", "thumb": "https://cdnfile.sspai.com/2026/11/25/article/48a4e38f-00f4-b1e5-9581-c02a5d115f51.png?imageMogr2/auto-orient/thumbnail/!1536x660r/gravity/center/crop/1536x660/ignore-error/1", "images": ["https://cdnfile.sspai.com/2026/11/25/article/48a4e38f-00f4-b1e5-9581-c02a5d115f51.png?imageMogr2/auto-orient/thumbnail/!1536x660r/gravity/center/crop/1536x660/ignore-error/1", "https://cdnfile.sspai.com/2026/11/25/article/98ab5571a02ac2cad5e9f4382fff3034.jpeg?imageView2/2/w/1120/q/90/interlace/1/ignore-error/1/format/webp", "https://cdnfile.sspai.com/2026/11/25/article/c83eca5b5a796186a7a8cdec05b3a94c.jpeg?imageView2/2/w/1120/q/90/interlace/1/ignore-error/1/format/webp", "https://cdnfile.sspai.com/2026/11/25/cf3901156867f6e4691da0d182b71ec4.jpg?imageView2/2/w/1120/q/90/interlace/1/ignore-error/1/format/webp", "https://cdnfile.sspai.com/2026/06/17/65bc4e0901a3743ab1f43c2cf9e6b023.jpg?imageMogr2/auto-orient/thumbnail/!32x32r/gravity/center/crop/32x32/ignore-error/1", "https://cdnfile.sspai.com/2025/09/22/community/c5d7069b-a9e1-3a91-532d-0440267e2ecb.png"], "tags": ["AI 产品"], "seen": false, "new": false, "daily": false}, {"guid": "d2b20722c436fa936e899248efea80b7", "title": "早报｜黄仁勋复职后首开全员大会致歉/豆包推出AI个人助理「小豆」/华为鸿蒙终端突破1亿台", "link": "https://www.ifanr.com/1691400?utm_source=rss&utm_medium=rss&utm_campaign", "source": "爱范儿", "category": "ai_product", "summary": "· 华为发布 Mate X8、Mate 90 Air 和小折叠电脑 MateBook Fold S · 神舟二十四号任务将开展一年期在轨驻留试验 · PlayStation 公布《GTA 6》首发数据，四天吸引逾 3900 万玩家 #欢迎关注爱范儿官方微信公众号：爱范儿（微信号：ifanr），更多精彩内容第一时间为您奉上。", "ts": "2026-11-25T00:08:21+00:00", "published": "11-25", "starred": false, "importance": 4, "topic": "AI 产品", "one_line": "豆包 AI 个人助理「小豆」公测，华为鸿蒙终端突破 1 亿台", "why": "了解最新 AI 产品和华为鸿蒙发展，为作品集提供案例", "i 爱好者，时常看下 Huggingface 开源模型排行榜是我的基操 本文我们一起看看正在霸榜的 Inkling-2-Mini 过去大半年", "ts": "2026-11-24T06:22:01+00:00", "published": "11-24", "starred": false, "importance": 4, "topic": "AI 编程", "one_line": "对比 Qwen3.8-27B 大模型在本地部署的性能", "why": "学习大模型本地部署的最佳实践，提升产品性能", "inline_text": "Inkling 2 Mini 在 24G 内存中表现优异，吞吐量比同机 Unsloth 快一半以上", "full_text": "在 Apple M6 Mac mini 的 24 GB 内存里，Inkling 2 Mini 单路跑到 33.6 tok/s，四并发总吞吐 60.6 tok/s，比同机 Unsloth 快一半以上，综合能力与 Qwen 3.8 27B 打平。循环稀疏 MoE 是它没被带宽卡死的关键。\n作为大模型本地部署爱好者，时常看下 Huggingface 开源模型排行榜是我的基操\n本文我们一起看看正在霸榜的 Inkling-2-Mini\n过去大半年，Qwen 3.8 27B 一直是本地部署党的心头好，至今在 HF Top 10 依然可以见到它的身影，比如上周末刚详细介绍了针对 Pi 这个 Harness 优化的 Qwen3.8-27B-pi-adapted：Agent 绝配版 Qwen3.8-27B，关掉思考，更稳更快！\nQwen 3.8 27B 能力稳，但全量稠密架构一进 24 GB 内存的 Mac 或单卡机器，吐字速度就被带宽死死卡住\nThinking Machines Lab 刚开源了\n循环稀疏 MoE\n新模型 Inkling 2 Mini，主打普通笔记本离线跑多智能体\n我第一时间在手头这台 Apple M6 Mac mini上，把 Strata 和 Unsloth 两套路线跑了一遍\n省流：\n综合实力和 Qwen 3.8 27B 基本平分秋色，写代码与调工具还更凌厉；本机 Strata 单路最高跑出 33.6 tok/s、四并发总吞吐干到 60.6 tok/s，比同机 Unsloth 快出一半以上\n为什么能跟 Qwen 3.8 27B 打平，速度还更快\nInkling 2 Mini 速度够快，最核心的还是 MoE 架构，外加\n原生低比特训推一体\n，前 20 层用 NVFP4、后 4 层用 MXFP8 从头训到尾，放出来的整包约 20 GB，几乎没有传统量化折损，同时\n自带视觉编码器和 1M 上下文\nInkling 2 Mini 循环稀疏 MoE 与 Qwen 3.8 27B 稠密架构核心对比\nInkling 2 Mini 与 Qwen3.8-27B：\n综合水平打成平手，但主场完全不同\nInkling 2 Mini 明显偏科向\n写代码、多步骤修 Bug、调用工具联网查资料、百万级长文检索和看图操作界面\n倾斜，斯坦福团队实测它的单位功耗智能效率也远超同体量稠密对手，官方甚至演示过一台离线 MacBook Pro (M5 Pro, 48GB) 同时驱动二十个自主活动的像素小镇角色\n也有网友测试出了与 Hy4 flash 掰手腕的场景\n反过来，Qwen 3.8 27B 的稠密大权重底子还在：\n日常中文办公、多轮复杂约束对话、不联网靠记忆答事实题的防幻觉能力\n，依然是它更稳当\n24 GB Mac mini 双引擎实测：Strata 快出超一半\n老章办公室这台测试主机 Mac mini（Apple M6 芯片，12 核，24 GB 统一内存），系统给单进程 Metal GPU 的推荐工作集上限约 18.6 GiB\n性能实测，我对比了两个部署方案，都是我们的老朋友了 Unsloth VS Strata：\nStrata 路线\n：升级到 0.2.19，使用原生 Metal 引擎 strata-inkling 跑 10.47 GB 的 SQ-10 打包版（32K 上下文全常驻）\nUnsloth 路线\n：使用官方适配循环层与 DSpark 的预编译版，跑 16.61 GB 的 Inkling-2-Mini-UD-Q4_K_M.gguf 与 384 MB 的 dspark-Inkling-2-Mini-Q8_0.gguf\n两套引擎的底层基准与代码、数学、中文三类真实 API 对话实测如下：\n测试方案与配置\n体积 / 内存占用\n预填充 (tok/s)\n单路生成 (tok/s)\n并发总吞吐 (tok/s)\nStrata 基准（SQ-10，32K）\n10.47 GB / 占 12.03 GiB\n564.4（512 词）/ 440.5（2K 词）\n32.8（fp16）/ 峰值 33.6（k8v4）\n2 并发 52.5 / 4 并发 60.6\nStrata 真实 API（SQ-10，32K）\n12.03 GiB（含 DSpark）\n短提示 111 ~ 150\n默认 27.6 ~ 27.8 / 贪婪 28.5\n4 路真实 API 总计 47.63\nUnsloth 基准（UD-Q4_K_M）\n16.61 GB（15.46 GiB）\n260.18（512 词）/ 236.93（2K 词）\n20.94（tg128）/ 21.77（tg256）\n—\nUnsloth 真实 API 常规（8K）\n紧贴 18.6 GiB 上限\n短提示 22 ~ 50\n代码 21.24 / 数学 21.76 / 中文 21.49\n—\nUnsloth + DSpark（4K）\n权重 + 草稿逼近上限\n短提示 25 ~ 55\nn=3 降至 15.00 / n=7 降至 12.08\n—\n同机同模型，Strata 靠内存映射 0.01 到 0.04 秒就能加载完毕，开满 32K 上下文只吃 12.03 GiB，预填充是 Unsloth 的 2.17 倍，单路峰值高出 54%，四并发总吞吐冲上 60.6 tok/s（6 并发才触碰 24 GB 内存上限）\n如果老铁们手头有高配显卡，上限还能翻倍飙升\n按 Strata 官方在二十台设备上的实测数据，Apple M5 Max 单路能到 100 ~ 114.5 tok/s，RTX 5070 12 GB 跑 93.9 ~ 101.4 tok/s，RTX 5070 Ti 16 GB 飙到 155.5 tok/s，RTX 5090 单路冲到 176.5 ~ 250.3 tok/s、64 并发总吞吐超 4,000 tok/s：\nStrata 官方在 20 款主流显卡与苹果芯片上的单路及预填充测速参考\n跑下来，分享两个部署的坑和三个模型短板吧\n部署第一个坑\n：默认参数在 24 GB Mac 跑 Unsloth 直接 OOM\nUD-Q4_K_M 权重占 15.46 GiB，离 Metal 上限只差 3 GiB，按 llama-server 默认多槽位加半精度缓存启动直接报内存不足，必须锁单槽位、压 8-bit 缓存并开 Flash Attention\n部署第二个坑\n：标准版 Apple M6 上开 DSpark 反而越猜越慢\n实测 Unsloth 挂上草稿模型后，采纳率只有 28% ~ 38%，可每次批量核验都要重跑 48 层循环，直接把代码速度从 21.24 tok/s 拖垮到 15.00 甚至 12.08 tok/s，中文更是掉到 8.66 tok/s；标准版 M 系列芯片关掉草稿更快，高带宽旗舰卡才吃得消这套加速\n模型本身的三个槽点：\n中文偏硬，思考爱飙英文\n：实测中文提问时，它的内部思考默认先走英文，最终回答虽准确但句式偏短，官方也承认中文场景偶发中英夹杂\n思考关不死，排错偶发死循环\n：即便把思考强度调到最低仍会轻度推理，复杂调试时偶尔反复自检，接本地 Agent 务必卡死最大输出和步数，并在沙盒运行\n离线问冷门事实不占优\n：循环", "thumb": "https://static.woshipm.com/tag/1101_1@2x.png ", "images": ["https://static.woshipm.com/tag/1101_1@2x.png ", "https://image.woshipm.com/2023/05/06/c97d24e0-ec00-11ed-96ae-00163e0b5ff3.jpg", "https://image.woshipm.com/wp-files/sha256/73/41/73412f7c10ed9d0e7c805501d566aaf574bc03161fb2079781e43506ea7a3ef7.png", "https://image.woshipm.com/wp-files/sha256/4c/23/4c23d67c454265b06bdd04c1038f4af023e20601d8d200d4a2216f92173c16f6.jpg", "https://image.woshipm.com/wp-files/sha256/ae/cc/aeccd4e47f75e299b545f325aaf271228f58a87a76a283483cdde1df30493159.png", "https://image.woshipm.com/wp-files/sha256/6e/b1/6eb1b9e8bfdb07f3c7e9ec24d0ee30ae49f695da913b05abf8a1a5263cb7cc4e.png"], "tags": ["AI 产品"], "seen": false, "new": false, "daily": false}, {"guid": "0b884a367bf3beccaa5fae448875070b", "title": "腾讯 WorkBuddy + 上下文同步，直击多设备痛点，太夯了~【附实测+提示词】", "link": "https://www.woshipm.com/ai/6499017.html", "source": "人人都是产品经理", "category": "pm", "summary": "把老 MacBook Pro 里一百多条对话和工程文件整体迁到 RTX Spark，接着在同一个对话里用本地混元 3D 换掉简模、开光追重渲圆明园兽首。跨设备丢上下文的痛，靠一次迁移和一次接续讲清楚了。 前两天跟大家提过一嘴，最近新拿到了这台 RTX Spark 。机器能力确实猛，到手这几天我直接在本地部署了一整套模型，既能生图、生视频，还把 腾讯混元的 3D 建模模型 也跑通了；而且它是英伟达 N 卡架构，可以直接调 GPU 渲染、开", "ts": "2026-11-24T06:20:44+00:00", "published": "11-24", "starred": false, "importance": 4, "topic": "AI 产品", "one_line": "腾讯 WorkBuddy 的多设备上下文同步功能实测", "why": "了解 AI 助理产品的实际应用，为作品集提供案例", "inline_text": "跨设备迁移对话和文件，实现上下文同步，提升用户体验", "full_text": "把老 MacBook Pro 里一百多条对话和工程文件整体迁到 RTX Spark，接着在同一个对话里用本地混元 3D 换掉简模、开光追重渲圆明园兽首。跨设备丢上下文的痛，靠一次迁移和一次接续讲清楚了。\n前两天跟大家提过一嘴，最近新拿到了这台\nRTX Spark\n。机器能力确实猛，到手这几天我直接在本地部署了一整套模型，既能生图、生视频，还把\n腾讯混元的 3D 建模模型\n也跑通了；而且它是英伟达 N 卡架构，可以直接调 GPU 渲染、开光追，性能非常好。\n但是说实话，搞了那么多东西，有点拔剑四顾心茫然，新的机子一点项目都没有，只能从零开始造。。。这种痛相信用惯 WorkAgent 的朋友们都遇到过，比如家里和公司电脑的数据同步啊等等1\n正好看到\nWorkBuddy 更新了「跨电脑数据迁移」\n，我直接把老 MacBook Pro 里攒的一百多条对话和工程文件全迁到了 RTX Spark 上。\n我立马想起了之前测的两个 Blender 建模 Case：《飞行特斯拉》和《圆明园》。\n当时在 MacBook 上纯靠写 Blender 代码建模，渲染也大多靠 CPU 或普通模式跑，虽然整体建得非常好，但还是有些地方大模型不太拿手：比如特斯拉展台周围的围观群众，纯几何体拼出来呆呆的，看着有点 der；\n圆明园则是纯脚本生成的十二生肖兽首面数低、细节不够，蛇首干脆是一颗圆球顶在弹簧圈上，贼他么抽象。。\n这次\n借着 WorkBuddy 把完整上下文搬到 RTX Spark\n，刚好用本地混元 3D 替换高精模型，再调 N 卡 GPU 开光追重渲了一遍。\n01 用好 WorkAgent 最关键的一步：上下文！\n为什么不直接把 Blender 的 .blend 产物和脚本拷过去让 AI 接手？\n这招我也试过，最大的问题就是会丢掉大量\n上下文\n。\n浅举两个例子：\n1. 在圆明园建模里，前期喂了大量历史资料和文献（像 1786 年铜版画、2015 年考古报告），中期又定了很多决策判断，尤其是 AI 哪些地方做不到、容易出什么问题，都在对话里立好了规矩和约束；\n2. 飞行特斯拉那边，具体的镜头机位和底盘喷气效果也是一轮轮调出来的。\n如果只拷文件过去，这些上下文就没了。\n到了新机子上，等于要从零重新给模型喂知识：往轻了说，得从头再跟它讲一遍；要是严重点，之前明明已经教训过它的错，它转头又会再犯一遍。\n想不翻车，就得自己想办法把旧对话全导出来重新喂进去，非常麻烦。\n用\nWorkBuddy 的「跨电脑数据迁移」\n，主要就是能把\n对话上下文和本地产物结果一起导过来\n（本机如果还有 Claude Code、Cursor、ChatGPT 的记录，也能先从旁边的「导入其他应用数据」导进 WorkBuddy 再一起迁走）。\n而刚好我这两个 Blender 项目之前都是在 Claude Code 里跑的。\n这次操作很简单：先在老 MacBook 上把记录导进 WorkBuddy，再去 RTX Spark 的 WorkBuddy 上打开\n设置 → 数据导入 → 导入其他电脑数据，选中旧电脑点「全部导入」，\n挂着等它传完就行，前前后后一共导过来 100 多项记录：\n像任务本身、聊天记录、WorkBuddy 托管目录里的工程文件，还有建好的分组（含绑定的文件夹、记忆、本地 Skill）以及定时任务，都会一起带过来。\n导进来的文件会单独放在 ~/WorkBuddy/{设备名}/ 下面，和本机原有的文件分开存；\n定时任务迁过去默认是关着的\n，免得两台电脑同时跑：\n单个产物只要不超过 100M 都能正常传，断网或重复导入也会自动去重（\n实测遇到超过 100M 的大文件，可以先走「资料库」上传，到了新机直接从资料库里拉出来接着用\n）：\n01 / 02\n02 / 02\n不过有一点得提前留意：\nMCP、日志，以及平台全局下发的 Skill、专家和全局记忆\n目前不会跟着走，换完电脑需要重新配一遍。\nps. 如果你点进去没看到入口，或者刷不出旧电脑，可以先查一下这三处：\n1. 两台电脑的客户端都升到\n5.11.3\n以上，登录同一个账号；\n2. 旧电脑连着网，WorkBuddy 保持打开；\n3. 打开\n「允许移动设备远程连接」\n。如果旧电脑习惯锁屏，去「设置 – 通用」里把锁屏运行改成「熄屏后保持唤醒」就能继续传。\n02 接着原来的对话重跑：混元 3D 换高模 + GPU 开光追\n数据导完，在 RTX Spark 上点开原来的圆明园任务，我先让它复述了一下之前的进度，从早期建模、参考图包到中间返工的细节全记得清清楚楚；\n把主场景工程包补拖进去，就能直接在原对话底下接着往下跑了：\n最省心的一点是，之前定好的建筑朝向、石材比例和避坑要求全留在上下文里，不用再去翻半个月前的参考文档，直接把新需求往下接，它就能顺着原来的脚本命名继续改。\n换到这台 N 卡机器上跑 Blender，渲染直接走 GPU，\nGPU 利用率拉到了 95%\n，之前在笔记本上不敢开的光追这回也能正常开了。\n先看《飞行特斯拉》。\n原来调好的车身和飞行动作不用动，主要是换人和补光影。\n我先用本地部署的\n混元 3D\n生成了几个高精度、高面数的人物模型，替换掉展台围栏后面那排灰扑扑的代码小人（左下角那个像白胶囊一样的卡车头也顺手换了）；\n打开光追重渲之后，点火离地时车底映在地面上的冰蓝色漫反射和尾气层次比之前自然多了：\n再看《圆明园海晏堂》。\n因为原对话里已经保留了 1786 年铜版画参考和十二生肖的排布要求，接着改很舒心。\n它还顺手排查出旧工程脚本默认回退到了 CPU 渲染，切回硬件光追之后，从之前在 MacBook 上只能出一个 6 秒 960×540 小样，直接跑出了一条\n2 分钟的 1080p 完整成片\n，把海晏堂、谐奇趣、黄花阵和大水法全串了起来：\n同机位抽帧对比看得更清楚：\n不仅把旧版误涂成全铜色的雕像改回了「红铜兽首 + 汉白玉石袍」分色，开了光追、调高渲染之后，天上多了真实的体积云，水池里的波纹和倒影也写实了很多，岸边石阶与建筑倒映在水面上，把整个水面的质感很好地映衬了出来：\n大场景视频跑完，最后我还把\n十二生肖兽首\n这个坑给补上了。\n前几天在\nSeedance Agent\n那篇里，我是拿这套 Blender 白模当空间底图去跑 2D 视觉复原，当时 3D 工程里的兽首其实还是纯几何体拼的简模。\n这次顺着原对话接着往下做：有文物照片的鼠、牛、虎、兔、马、猴、猪 7 尊按实物参考走，缺实物的龙、蛇、羊、鸡、狗 5 尊结合铜版画先补齐三视图，再统一取右侧视角送进本地部署的\n混元 3D\n工作流转成高面数网格：\n混元 3D 工作流直接把原图变成 3D 模型\n01 / 03\n02 / 03\n03 / 03\n把这十二尊高模替换回海晏堂水池边，单独跑出来的静帧，细节总算能称得上是「复刻」了（时间关系兽首这版只出了静帧渲染图，没再重跑整条视频，因为哪怕用 Spark 跑一次这种精度的渲染都要 12 个小时。。。）：\n01 / 02\n02 / 02\n也是到拉近特写才发现个更搞笑的事，原来一开始建模时兽首嘴里那道喷水压根没跑流体，直接是一根建在模型里的实体管子 = =。\n03 100 多条记录不好找？直接", "thumb": "https://static.woshipm.com/tag/1101_1@2x.png ", "images": alse, "new": false, "daily": false}, {"guid": "87d21e1bb7378b7e0e74df37969e2dac", "title": "释放AI与出海强预期，近1500人参与亿邦产业互联网年会暨首届产业智能体大会", "link": "https://www.qbitai.com/2026/11/512305.html", "source": "量子位", "category": "ai_product", "summary": "2026年11月20日，第八届亿邦产业互联网年会与首届产业智能体大会在北京国贸大酒店首次合体举行。", "ts": "2026-11-24T03:21:12+00:00", "published": "11-24", "starred": false, "importance": 3, "topic": "AI 产品", "one_line": "亿邦产业互联网年会暨首届产业智能体大会举行", "why": "", "inline_text": "近 1500 人参与，AI 与出海强预期，产业智能体大会举行", "full_text": "< img id=\"wx_img\" src=\"https://www.qbitai.com/wp-content/uploads/imgs/qbitai-logo-1.png\" width=\"400\" height=\"400\">\n释放AI与出海强预期，近1500人参与亿邦产业互联网年会暨首届产业智能体大会\n量子位的朋友们\n2026-11-24\n11:21:12\n来源：\n量子位\n2026年11月20日，第八届亿邦产业互联网年会与首届产业智能体大会在北京国贸大酒店首次合体举行。\n文丨亿邦智库\n2026年11月20日，第八届亿邦产业互联网年会与首届产业智能体大会在北京国贸大酒店首次合体举行。从2019年算起，亿邦产业互联网年会已经走到第八年，年度主题从“谁在重构产业链”到“解锁新周期”，随产业周期与年度命题持续迭代。本次大会强调AI与出海带来的“模态进化”，产业智能体引发业界普遍共鸣，热议产业互联网增长逻辑正在经历着一场什么样的模态切换。仅现场实况图片交互就达22594人次，亿邦视频号直播观看达63788人次。\n本次大会开幕演讲中，经济学家李稻葵从宏观层面为产业AI、产业智能体和产业出海，作出了一个时代背景的解释框架：中国AI发展比美国更具可持续性。产业AI和智能体不是孤立的技术竞赛，而要嵌入中国高储蓄率、低成本资金和完整产业体系所决定的产业升级与全球化进程之中；产品、企业、产业链供应链出海是必然方向，“抱团出海、带动全产业链布局”将成为常态。\n著名经济学家 李稻葵\n亿邦动力董事长、亿邦智库院长郑敏在发布\n《模态进化——2026产业互联网发展报告》\n时，给出了一个贯穿全场讨论的基调判断：产业互联网从来不是抢蛋糕的角色，而是做蛋糕的角色；AI与出海，是当前业界高共识的增长路径。围绕这条主线，大会设置产业智能体落地、AI供应链价值重构、数据要素与Token经济、AI打开产业服务新场景、产业出海新生态五大议题，数十位产业互联网企业决策人与行业专家在一天议程中，将“模态进化”拆解为可对照、可讨论的企业实践。\n按照这两条大会形成的确定性路径共识，我们来梳理一下参会菁英们的核心观点与企业动作，以飨读者。\nAI带来的模态进化：产业智能体怎么干\n“今年完全可以称之为产业智能体的元年。”郑敏在报告中将产业智能体的竞争力建设归纳为四个方向：数据、生态、质控，以及以Token为特征的收入。元年是启动，远未到成熟。郑敏还同时点出一个容易被热闹掩盖的事实：AI覆盖率达到90.6%，数据治理体系建成率78.4%，部署面已经铺开，但“数据不等于能力”——把决策系统做成可自主执行的制度，把组织经验转化成可调用的结构，这一步没有外部供给可以直接购买，只能靠企业自己走出来。\n震坤行副总裁苏钰称，可以将企业拥抱AI的路径分为三层：第一层是AI赋能提效，在原有业务边界内放大服务能力；第二层是AI重塑流程，依托产业链站位重构价值、开拓新业务；最高阶是生长出完全由AI驱动的原生业务。他把目光投向“物理AI”，认为数字世界的应用已经过载，真正能承载下一轮几何级Token增长的，是AI走向工厂、走向物理世界的原生场景。\n腾讯云行业生态总经理张林的判断与之呼应，但更偏向组织的视角。他认为：“Agent是组织能力放大器，企业不必等待万能智能体，而应先把最烦琐、最痛的业务流程提炼出来交给AI。”他观察到，AI的运行模式正在从“在预设流程内辅助提效”转向“给定目标后自行拆解任务、调动原子能力、同步正负反馈”，组织架构也随之从大部门模式向小团队乃至一人公司演化。\n乐观叙事之外，科力普科技集团CTO张少鹏给智能体的落地加了一道“可靠性”的约束性注脚。他算了一笔采购流程的账：从需求提报到结算售后大约8个环节，如果AI在每个环节都做到95分，8个95%相乘只剩约66%——“大约每三张采购单，就有一张会在某个地方出问题”。他的结论是，企业采购AI的核心目标不是简单的降本增效，而是“把复杂度降下去、把确定性提上去”；边界清晰、例外可纠、全程可追溯，AI才能从“能用”走到“可靠”。这与王煜的“卖确定性”形成呼应：前者谈的是流程可靠性，后者谈的是平台价值兑现方式。\n中铁工业有限公司总经理杨皓岚把采购行业的发展，作了一个直推到智能体门槛上的演进分析。他把采购行业划分为三个阶段：传统社会联系时代，线下采购高度依赖采购人员的谈判能力；自助阶段，以门户商城为入口实现采购全流程线上化；而当前正加速进入智能体阶段。不同于前两个阶段围绕“人怎么买”优化采购方式，智能体阶段的变化是采购决策主体的迁移——平台服务对象从采购人转向采购人配置的智能体，行业护城河也将从规模、流量转向数据与信用。他与张少鹏的“可靠性”判断形成互补：前者回答“能不能可靠地干”，后者回答“谁来决定让不让它干”。\n但是，数据基础底座的差距，在整个行业的转型升级中还是很明显的，在电子元器件行业则体现得更为具体。云汉芯城李鲲鹏提出AI落地要过“三道关”：产业数据的结构化与统一口径、模型答案有分级可验证的证据链、打通上下游完成交付闭环。\n产业互联网和人工智能落地专家  谢 海\n产业互联网和人工智能落地专家谢海的表述更为凝练：“AI的终点是产业现场。”单个智能体能力强，并不等于整个组织的效率提升，真正拉开差距的是场景挖掘、数据沉淀、智能体编排与运营治理。\nPureblueAI清蓝联合创始人王立新则从需求入口的另一侧提醒品牌方：AI应用用户规模已达31亿，AI单次回答通常只展示3至4个品牌，曝光是零和博弈，品牌的营销逻辑正从“被检索”向“被信任”跨越，必须在模型的隐空间中建立可被引用的认知印记，弥补自身的数据不足。\n陕煤物资商城公司董事长王菲在主持圆桌对话时，就把能源物资场景的难题摆得很具体：品类繁杂、大量非标设备配件，AI辅助物资选型、需求归集与风险预警时会遇到知识库建设难度大、人员接受度不一、上下游数字化水平参差不齐等问题。她的判断是，产业智能体绝不是通用的聊天机器人，其根基是深厚的行业知识与高质量数据库；它必须能切实解决复杂非标场景下的物资选型、需求归集与风险预警等问题，同时要在数据安全合规的前提下，通过分层治理实现产业链内外的数据闭环。她提出数据治理宜分三层：公开数据依规公开，脱敏数据用于定向交互，核心数据做好安全保留。王煜对此补充，国有企业原则上原始数据不能出域，但经过加工形成的数据产品可以对外输出，需要搭建可信数据空间，并与成熟专业机构合作打造数据产品，进而实现整体数据闭环。\n国联股份董事、高级副总裁潘勇则从大宗工业品的行业特性出发，给出智能体落地的优先级判断。他指出，工业大宗品交易规模大、毛利率低，每一个环节省下来的成本都会直接转化为利润，AI相比传统数字化工具最突出的优势，是能打破原有固定公式框架，开展更灵活的预测、计算与分析；其中最核心的环节是价格预测——过去依赖资深员工经验判断，在当前市场波动加剧背景下有效性不断下降，有效的价格预测模型将为全行业经营效率提升带来极大助力。\n西部证券投资银行总部董事总经理翟晓东从投行与资本视角补上了两个容易被忽略的维度。其一是数据价值：产业互联网平台在交易撮合、履约服务中产生大量价格、交易量与企业真实采购决策行为数据，其数据生成能力和规模与一般制造业企业相比存在十倍甚至", "thumb": "https://i.qbitai.com/wp-content/uploads/2026/11/3fbce4f7d5bccc4ccf3162d3461c2f06.png", "images": ["https://i.qbitai.com/wp-content/uploads/2026/11/3fbce4f7d5bccc4ccf3162d3461c2f06.png", "https://i.qbitai.com/wp-content/uploads/2026/11/39b5cda5f7ace2a60bd5135bda70de32.jpeg", "https://i.qbitai.com/wp-content/uploads/2026/11/aa81d07a3a18410179e69bfdb92d5dce.png", "https://i.qbitai.com/wp-content/uploads/2026/11/c748017150bec6b30d1006cd const REPO = 'litosukalami-ux/pm-radar';
const CURRENT_UPDATED = '2026-11-27 14:52';
const refreshBtn = document.getElementById('refreshBtn');
let checkTimer = null, checking = false;

refreshBtn.addEventListener('click', () => {
  if (checking) { stopCheck(); return; }
  // 打开 GitHub Actions 页面让用户点绿色 Run workflow 按钮
  const url = `https://github.com/${REPO}/actions/workflows/daily.yml`;
  window.open(url, '_blank', 'noopener');
  startCheck();
});

function startCheck() {
  checking = true;
  refreshBtn.classList.add('busy');
  refreshBtn.querySelectorAll('span')[1].textContent = '检查中…';
  checkOnce();
  checkTimer = setInterval(checkOnce, 20000);  // 20s 一次
}
function stopCheck() {
  checking = false; clearInterval(checkTimer); checkTimer = null;
  refreshBtn.classList.remove('busy');
  refreshBtn.querySelectorAll('span')[1].textContent = '手动刷新';
}
async function checkOnce() {
  try {
    const resp = await fetch(window.location.pathname + '?t=' + Date.now(),
      { cache: 'no-store' });
    if (!resp.ok) return;
    const text = await resp.text();
    const m = text.match(/更新于\s*(\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2})/);
    if (m && m[1] !== CURRENT_UPDATED) {
      stopCheck();
      refreshBtn.classList.add('done', 'pulse');
      refreshBtn.querySelectorAll('span')[1].textContent = '有新数据 · 点此刷新';
      refreshBtn.onclick = () => window.location.reload();
    }
  } catch (e) {}
}

/* 页面打开时，每 60s 自动检查一次，不打扰用户 */
setInterval(() => { if (!checking) checkOnce(); }, 60000);

const FAV_KEY = 'radar.favs.v2';
const READ_KEY = 'radar.read.v2';

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
function load(key, def) {
  try { return JSON.parse(localStorage.getItem(key)) || def; } catch (e) { return def; }
}
function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
}

let favs = load(FAV_KEY, []);      // [{title,link,...}]
let reads = load(READ_KEY, []);    // [link]
const favSet = new Set(favs.map(f => f.link));
const readSet = new Set(reads);

function snapshot(it) {
  return { title: it.title, link: it.link, source: it.source, category: it.category,
           published: it.published, one_line: it.one_line, why: it.why,
           topic: it.topic, tags: it.tags, importance: it.importance };
}

/* 收藏过的标签 = 兴趣信号，用来给新条目标注「为你」 */
function interest() {
  const count = {};
  favs.forEach(f => {
    (f.tags || []).concat(f.topic ? [f.topic] : []).forEach(t => {
      count[t] = (count[t] || 0) + 1;
    });
  });
  return count;
}
let INTEREST = interest();
function matched(it) {
  return (it.tags || []).concat(it.topic ? [it.topic] : [])
    .some(t => (INTEREST[t] || 0) > 0);
}

function starBar(n) {
  n = n || 0;
  if (!n) return '';
  return '★'.repeat(n) + '☆'.repeat(5 - n);
}

function cardHTML(it, lead) {
  const meta = CATS[it.category] || ['其他', '#6B7280', '#F3F4F6'];
  const cls = ['card'];
  if (it.daily) cls.push('pick');
  if (lead) cls.push('lead');
  if (readSet.has(it.link)) cls.push('read');
  const hasFav = favSet.has(it.link);

  // 站内阅读元素（今日必看 + 有正文才给）
  const hasBody = it.full_text || (it.inline_text && it.inline_text.includes('\n'));
  const hasContent = it.daily && (it.full_text || it.inline_text || it.thumb);

  let bodyHTML = '';
  if (hasContent) {
    let thumb = it.thumb ? `<img class="thumb" src="${esc(it.thumb)}" alt="" loading="lazy" onerror="this.style.display='none'">` : '';
    let bullets = '';
    if (it.inline_text) {
      const lines = it.inline_text.split(/[\n]/).map(s => s.trim()).filter(Boolean).slice(0, 5);
      if (lines.length) {
        bullets = `<ul class="inline-bullets">${lines.map(l => `<li>${esc(l)}</li>`).join('')}</ul>`;
      }
    }
    let fullText = '';
    if (it.full_text) {
      fullText = `<div class="body-text">${esc(it.full_text)}</div>`;
    }
    let imgs = '';
    if (it.images && it.images.length) {
      imgs = `<div class="imgs">${it.images.slice(0, 6).map(u =>
        `<img src="${esc(u)}" alt="" loading="lazy" onerror="this.style.display='none'">`).join('')}</div>`;
    }
    let expandBtn = it.full_text
      ? `<button class="expand-btn" type="button"><span>展开全文</span> ↓</button>` : '';

    bodyHTML = `
      ${thumb}
      ${bullets}
      ${expandBtn}
      <div class="full-body">
        ${fullText}
        ${imgs}
        <div style="margin-top:14px">
          <a href="${esc(it.link)}" target="_blank" rel="noopener"
             style="color:var(--muted);font-size:12.5px">查看原文 →</a>
        </div>
      </div>`;
  }

  return `<article class="${cls.join(' ')}" data-link="${esc(it.link)}">
    <div class="row">
      <span class="chip" style="color:${meta[1]};background:${meta[2]}">${esc(meta[0])}</span>
      <span>${esc(it.source)}</span>
      <span>${esc(it.published)}</span>
      ${it.new ? '<span class="new">新</span>' : ''}
      ${matched(it) && !it.daily ? '<span class="for-you">为你</span>' : ''}
      <span class="stars">${starBar(it.importance)}</span>
    </div>
    <h3><a href="${esc(it.link)}" target="_blank" rel="noopener" data-link="${esc(it.link)}">${esc(it.title)}</a></h3>
    ${it.one_line ? `<p class="line">${esc(it.one_line)}</p>` : ''}
    ${it.why ? `<p class="why">${esc(it.why)}</p>` : ''}
    ${!it.one_line && it.summary ? `<p class="raw">${esc(it.summary)}</p>` : ''}
    ${bodyHTML}
    ${(it.tags && it.tags.length) ? `<div class="tags">${it.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
    <button class="fav ${hasFav ? 'on' : ''}" data-link="${esc(it.link)}">${hasFav ? '已收藏' : '收藏'}</button>
  </article>`;
}

function renderContests() {
  const box = document.getElementById('contests');
  if (!CONTESTS.length) { box.innerHTML = '<div class="empty">暂无</div>'; return; }
  box.innerHTML = CONTESTS.map(c => {
    const label = c.expected_start ? '预计 ' + c.expected_start : '待公布';
    return `<div class="contest">
      <div class="top"><div class="name">${esc(c.name)}</div><span class="badge">${esc(label)}</span></div>
      <div class="org">${esc(c.org || '')}</div>
      <div class="note">${esc(c.note || '')}</div>
    </div>`;
  }).join('');
}

  }
  if (cur === 'daily') return ITEMS.filter(i => i.daily);
  if (cur === 'all') return ITEMS.slice();
  return ITEMS.filter(i => i.category === cur);
}

function render() {
  const list = document.getElementById('list');
  let items = currentList();

  if (kw) {
    items = items.filter(it =>
      (it.title + ' ' + (it.summary || '') + ' ' + (it.one_line || '') + ' ' +
       (it.topic || '') + ' ' + (it.tags || []).join(' ') + ' ' + it.source)
        .toLowerCase().includes(kw));
  }

  if (sortBy === 'time') {
    items.sort((a, b) => (b.ts || b.published || '').localeCompare(a.ts || a.published || ''));
  } else if (cur !== 'daily') {
    items.sort((a, b) => (b.importance || 0) - (a.importance || 0) ||
      (b.ts || '').localeCompare(a.ts || ''));
  }

  if (!items.length) {
    list.innerHTML = `<div class="empty">${cur === 'fav' ? '还没收藏。看到有用的点右下角「收藏」，以后会优先推给你。' : '没有匹配的条目'}</div>`;
    return;
  }

  list.innerHTML = items.map((it, i) =>
    cardHTML(it, cur === 'daily' && i < 3)).join('');
}

function renderTabs() {
  const tabs = document.getElementById('tabs');
  const defs = [['daily', '今日必看'], ['all', '全部']]
    .concat(ORDER.map(k => [k, (CATS[k] || [k])[0]]))
    .concat([['fav', '我的收藏']]);
  tabs.innerHTML = defs.map(([k, n]) =>
    `<button class="tab ${k === cur ? 'on' : ''}" data-k="${k}">${n}</button>`).join('');
  tabs.querySelectorAll('.tab').forEach(b => {
    b.onclick = () => { cur = b.dataset.k; renderTabs(); render(); };
  });
}

document.getElementById('q').addEventListener('input', e => {
  kw = e.target.value.trim().toLowerCase();
  render();
});

document.getElementById('sort').addEventListener('click', e => {
  sortBy = sortBy === 'importance' ? 'time' : 'importance';
  e.target.textContent = sortBy === 'importance' ? '按重要度' : '按时间';
  render();
});

document.getElementById('list').addEventListener('click', e => {
  const expand = e.target.closest('.expand-btn');
  if (expand) {
    const card = expand.closest('.card');
    card.classList.toggle('body-open');
    // 展开即算已读
    const link = card.dataset.link;
    if (link && !readSet.has(link)) {
      readSet.add(link); reads.push(link);
      save(READ_KEY, reads);
      card.classList.add('read');
    }
    return;
  }
  const fav = e.target.closest('.fav');
  if (fav) {
    const link = fav.dataset.link;
    const hit = ITEMS.find(i => i.link === link) || favs.find(f => f.link === link);
    if (favSet.has(link)) {
      favSet.delete(link);
      favs = favs.filter(f => f.link !== link);
    } else if (hit) {
      favSet.add(link);
      favs.push(snapshot(hit));
    }
    save(FAV_KEY, favs);
    INTEREST = interest();
    renderTabs(); render();
    return;
  }
  const a = e.target.closest('h3 a');
  if (a) {
    const link = a.dataset.link;
    if (!readSet.has(link)) {
      readSet.add(link);
      reads.push(link);
      save(READ_KEY, reads);
      const el = a.closest('.card');
      if (el) el.classList.add('read');
    }
  }
});

renderContests();
renderTabs();
render();
</script>
</body>
</html>
