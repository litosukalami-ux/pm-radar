name: daily-radar

on:
  schedule:
    # GitHub 用 UTC，00:00 UTC = 北京时间 08:00
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Fetch + AI + build
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: python radar.py

      - name: Commit updated board
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add docs data/radar.db
          git diff --staged --quiet || git commit -m "chore: daily radar update"
          git push
